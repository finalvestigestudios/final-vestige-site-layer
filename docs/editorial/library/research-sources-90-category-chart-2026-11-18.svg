<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Ninety research sources grouped by editorial family</title><desc id="desc">Five horizontal bars show 12 declassified sources, 24 accountability sources, 21 engineering sources, 25 archives sources, and 8 navigation sources. These are catalog counts and not measures of source quality, availability, or rights clearance.</desc><rect width="960" height="480" fill="#172029"/><text x="48" y="60" font-size="33" fill="#f4ead8" font-family="Georgia,serif">Ninety doors, five research families</text><text x="48" y="92" font-size="15" fill="#b6c6c6" font-family="Arial">Existing Library records · Inventory checked 18 Nov 2026 · Not a reliability score</text><text x="48" y="158" fill="#ebeadf" font-family="Arial" font-size="18">Declassified & decisions</text><rect x="336" y="137" width="228" height="28" rx="3" fill="#c9a86c"/><text x="584" y="157" font-family="Arial" font-size="19" font-weight="bold" fill="#f4ead8">12</text><text x="48" y="217" fill="#ebeadf" font-family="Arial" font-size="18">Accountability & data</text><rect x="336" y="196" width="456" height="28" rx="3" fill="#8cadac"/><text x="812" y="216" font-family="Arial" font-size="19" font-weight="bold" fill="#f4ead8">24</text><text x="48" y="276" fill="#ebeadf" font-family="Arial" font-size="18">Engineering & failures</text><rect x="336" y="255" width="399" height="28" rx="3" fill="#c9a86c"/><text x="755" y="275" font-family="Arial" font-size="19" font-weight="bold" fill="#f4ead8">21</text><text x="48" y="335" fill="#ebeadf" font-family="Arial" font-size="18">Archives & research</text><rect x="336" y="314" width="475" height="28" rx="3" fill="#8cadac"/><text x="831" y="334" font-family="Arial" font-size="19" font-weight="bold" fill="#f4ead8">25</text><text x="48" y="394" fill="#ebeadf" font-family="Arial" font-size="18">Navigation & maps</text><rect x="336" y="373" width="152" height="28" rx="3" fill="#c9a86c"/><text x="508" y="393" font-family="Arial" font-size="19" font-weight="bold" fill="#f4ead8">8</text><text x="48" y="461" font-size="15" fill="#b6c6c6" font-family="Arial">Final Vestige Studios · Original explanatory chart · No archival images reproduced</text></svg>
<title id="ttl">Research Sources: 90 URLs attempted</title><desc id="des">Out of ninety directory entries, sixty-four institutional landing pages responded, three yielded only an application shell, eighteen were restricted to automated retrieval, two timed out, and three had other unresolved response limitations. These are retrieval outcomes, not judgments that links are broken.</desc>

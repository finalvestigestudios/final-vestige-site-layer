<path d="M52 448h976" stroke="#526068"/>
<text x="52" y="485" fill="#d4cbbb" font-size="17">Checked 18 Nov 2026 · Existing 90-card Library directory · No archival media copied</text>
<text x="52" y="515" fill="#adb4b2" font-size="15">Rights, working downloads, item identity and ordinary-browser behavior require separate checks.</text>

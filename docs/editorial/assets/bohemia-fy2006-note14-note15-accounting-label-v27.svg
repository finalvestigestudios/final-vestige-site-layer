<text x="69" y="786" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#344652">NOTE 15 · P. 50 · DESIGNATED</text>
<text x="69" y="851" font-family="Georgia,serif" font-size="53" font-weight="700" fill="#112332">$391,566</text>
<text x="69" y="893" font-family="Arial,sans-serif" font-size="22" fill="#273d4a">$16,971 equipment · $18,239 air conditioning</text>
<text x="69" y="922" font-family="Arial,sans-serif" font-size="22" fill="#273d4a">$100,000 storm recovery · $100,000 workers' comp</text>
<text x="69" y="951" font-family="Arial,sans-serif" font-size="22" fill="#273d4a">$156,356 capital assets</text>
<text x="47" y="1023" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#e5b868">An internal label inconsistency, not a missing $52,159.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1110" role="img" aria-labelledby="title desc">
<title id="title">Two figures, two categories in the Orleans Levee District's 2006 financial report</title>
<desc id="desc">The management discussion on page 10 inconsistently associates 391,566 dollars with the Bohemia litigation reserve. Detailed Note 14 on page 49 records 339,407 dollars as the Bohemia escrow reserve. Note 15 on page 50 identifies 391,566 dollars as five separate general-fund designations for equipment, air conditioning, hurricane cleanup, workers' compensation, and capital assets. These records do not establish a missing payment.</desc>
<rect width="780" height="1110" fill="#101820"/>
<rect x="0" y="0" width="780" height="9" fill="#e5b868"/>
<text x="48" y="63" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e5b868" letter-spacing="3">FINAL VESTIGE · EVIDENCE GRAPHIC</text>
<text x="48" y="116" font-family="Georgia,serif" font-size="44" fill="#f7f4ed">The same number</text>
<text x="48" y="172" font-family="Georgia,serif" font-size="44" fill="#f7f4ed">in two places</text>
<text x="48" y="210" font-family="Arial,sans-serif" font-size="22" fill="#b8c4ce">Orleans Levee District · year ended June 30, 2006</text>
<rect x="44" y="244" rx="16" width="692" height="186" fill="#23313a" stroke="#61717b" stroke-width="2"/>
<text x="69" y="285" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e5b868">MANAGEMENT DISCUSSION · P. 10</text>
<text x="69" y="348" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#fffaf0">$391,566</text>
<text x="69" y="385" font-family="Arial,sans-serif" font-size="22" fill="#e5e9ee">Printed as both future spending and Bohemia</text>
<text x="69" y="412" font-family="Arial,sans-serif" font-size="22" fill="#e5e9ee">litigation reserve. The detailed notes disagree.</text>

<rect x="44" y="490" rx="16" width="692" height="196" fill="#f7f4ed"/>
<text x="69" y="534" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#344652">NOTE 14 · P. 49 · RESERVED</text>
<text x="69" y="605" font-family="Georgia,serif" font-size="59" font-weight="700" fill="#112332">$339,407</text>
<text x="69" y="645" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263845">Bohemia Spillway Escrow</text>

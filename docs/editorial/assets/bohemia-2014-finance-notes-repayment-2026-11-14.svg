<text x="35" y="84" fill="#f6efe3" font-family="Georgia,serif" font-size="24" font-weight="bold">A source of funds</text>
<text x="35" y="112" fill="#f6efe3" font-family="Georgia,serif" font-size="24" font-weight="bold">is not a payment.</text>
<text x="35" y="136" fill="#b9beb6" font-family="Arial,sans-serif" font-size="12">July 10 · Flood authority Finance Committee</text>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc">
<title id="title">The mineral money had other institutional uses under discussion in 2014</title>
<desc id="desc">In July 2014 officials discussed 2006 state development notes, the absence of excess non-flood asset operating revenue, some Bohemia mineral receipts, and an unresolved Haspel and Davis judgment described as roughly twenty million dollars plus interest. The committee did not document a transfer, legal payment priority or claimant disbursement.</desc>

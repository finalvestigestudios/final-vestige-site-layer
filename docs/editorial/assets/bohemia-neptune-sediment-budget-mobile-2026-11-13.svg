<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d">
<title id="t">Neptune Pass sediment budget, mobile edition</title>
<desc id="d">The peer-reviewed sediment budget estimates 6.1 million cubic meters scoured from Neptune Pass and 11 million cubic meters deposited in Quarantine Bay, about 4.8 million cubic meters net deposition. Estimates, not permanent dry land. Source: Kolker and colleagues, PLOS ONE 2025.</desc>
<rect width="600" height="900" fill="#111A1E"/>
<rect x="20" y="20" width="560" height="860" rx="14" fill="#172429" stroke="#3D5255"/>
<text x="42" y="70" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#BCAD7B">FINAL VESTIGE / EVIDENCE</text>
<text x="42" y="123" font-family="DejaVu Serif,Georgia,serif" font-size="32" font-weight="700" fill="#F1EAD6">A delta that gained</text>
<text x="42" y="163" font-family="DejaVu Serif,Georgia,serif" font-size="32" font-weight="700" fill="#F1EAD6">more than it scoured</text>
<text x="42" y="208" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#C9D0CE">Neptune Pass / Quarantine Bay</text>
<line x1="42" y1="240" x2="558" y2="240" stroke="#44585A"/>
<text x="42" y="285" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#F1EAD6">CHANNEL SCOUR, ESTIMATED</text>
<rect x="42" y="307" width="516" height="62" rx="7" fill="#293A3E"/>
<rect x="42" y="307" width="286" height="62" rx="7" fill="#79979B"/>
<text x="42" y="419" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#F1EAD6">6.1 million m³</text>
<text x="42" y="476" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#F1EAD6">BAY DEPOSITION, ESTIMATED</text>
<rect x="42" y="498" width="516" height="62" rx="7" fill="#D6B672"/>
<text x="42" y="611" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#F1EAD6">11.0 million m³</text>
<text x="42" y="654" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#D6B672">≈4.8 million m³ net added</text>
<line x1="42" y1="696" x2="558" y2="696" stroke="#44585A"/>
<text x="42" y="734" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#C9D0CE">2016–22 channel; 2011–22 bay survey</text>
<text x="42" y="761" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#C9D0CE">baselines and model assumptions.</text>
<text x="42" y="801" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#BCAD7B">Kolker et al. · PLOS ONE (2025)</text>
<text x="42" y="827" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#B8C5C4">Original: Final Vestige Studios</text>
<text x="42" y="852" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#B8C5C4">Not a claim of permanent dry land.</text>
</svg>
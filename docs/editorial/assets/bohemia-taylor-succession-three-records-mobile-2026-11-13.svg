<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" role="img" aria-labelledby="title desc">
<title id="title">Taylor succession: deed, judgment and appeal, 1990–2005</title>
<desc id="desc">Three distinct historical legal milestones. A December 1990 conveyance was stipulated, a roughly 166843 dollar royalty principal judgment followed in 2003, and in 2005 an appellate court affirmed interest but reversed attorneys fees. None proves payment.</desc>
<rect width="390" height="760" fill="#171918"/>
<path d="M18 16 H372" stroke="#786a55" stroke-width="1.5"/>
<text x="18" y="39" fill="#d5ad6b" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.8">FINAL VESTIGE / CASE RECORD</text>
<text x="18" y="73" fill="#f1ece3" font-family="Georgia, serif" font-weight="700" font-size="25">A deed was not a payment</text>
<text x="18" y="96" fill="#aeb2ac" font-family="Arial, sans-serif" font-size="13">The Taylor succession • Three legal milestones</text>
<rect x="18" y="118" width="354" height="150" rx="8" fill="#262a28" stroke="#484943"/>
<text x="33" y="145" fill="#d5ad6b" font-family="Arial, sans-serif" font-weight="700" font-size="14">1990 / TITLE</text>
<text x="33" y="175" fill="#f1ece3" font-family="Georgia, serif" font-weight="700" font-size="20">December 3: conveyance</text>
<text x="33" y="200" fill="#d2d4cf" font-family="Arial, sans-serif" font-size="13">Both sides later acknowledged the transfer.</text>
<text x="33" y="224" fill="#aeb2ac" font-family="Arial, sans-serif" font-size="12.5">Original parish deed not independently seen.</text>
<rect x="18" y="281" width="354" height="153" rx="8" fill="#262a28" stroke="#484943"/>
<text x="33" y="308" fill="#d5ad6b" font-family="Arial, sans-serif" font-weight="700" font-size="14">2003 / PRINCIPAL</text>
<text x="33" y="338" fill="#f1ece3" font-family="Georgia, serif" font-weight="700" font-size="20">Approximately $166,843</text>
<text x="33" y="365" fill="#d2d4cf" font-family="Arial, sans-serif" font-size="13">Royalty liability and trial judgment.</text>
<text x="33" y="390" fill="#aeb2ac" font-family="Arial, sans-serif" font-size="12.5">The opinion differs by three cents.</text>
<rect x="18" y="447" width="354" height="158" rx="8" fill="#262a28" stroke="#484943"/>
<text x="33" y="474" fill="#d5ad6b" font-family="Arial, sans-serif" font-weight="700" font-size="14">2005 / APPEAL</text>
<text x="33" y="504" fill="#f1ece3" font-family="Georgia, serif" font-weight="700" font-size="19">Interest affirmed; fees reversed</text>
<text x="33" y="529" fill="#d2d4cf" font-family="Arial, sans-serif" font-size="13">No additional interest back to 1984.</text>
<text x="33" y="555" fill="#aeb2ac" font-family="Arial, sans-serif" font-size="12.5">The opinion does not verify payment.</text>
<rect x="18" y="622" width="354" height="64" rx="8" fill="#393128" stroke="#b99255"/>
<text x="33" y="648" fill="#f2d3a5" font-family="Arial, sans-serif" font-weight="700" font-size="14">THE DISTINCTION</text>
<text x="33" y="671" fill="#f1ece3" font-family="Arial, sans-serif" font-size="13">Conveyance ≠ judgment ≠ payment record.</text>
<text x="18" y="712" fill="#c0c2bd" font-family="Arial, sans-serif" font-size="11">Source: La. Fourth Circuit, Frank (April 6, 2005).</text>
<text x="18" y="734" fill="#92958f" font-family="Arial, sans-serif" font-size="10.5">© Final Vestige Studios, 2026. Original evidence diagram.</text>
</svg>
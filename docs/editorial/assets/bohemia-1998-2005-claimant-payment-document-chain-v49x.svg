<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1330" viewBox="0 0 800 1330" role="img" aria-labelledby="title desc"><title id="title">The missing receipt is not the missing law</title><desc id="desc">Four dated boxes show the December 1998 court exhibit referred to in later legislation, July 1999 legislative payment command, December 2000 class settlement judgment, and June 2005 statutory deletion. Documentary trail is not proof that beneficiaries received money.</desc><metadata>Creator: Final Vestige Studios; date 2026-11-17; © 2026 Final Vestige Studios. Original vector evidence diagram, not a facsimile or AI historical reconstruction. Sources: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=65096 ; https://www.legis.la.gov/Legis/ViewDocument.aspx?d=611696 ; https://www.legis.la.gov/Legis/ViewDocument.aspx?d=317802 ; https://www.legis.la.gov/Legis/ViewDocument.aspx?d=616306 . 1998 Exhibit A and 2000 original consent judgment not independently obtained. Alt: A chronological documentary diagram distinguishing a 1998 referenced exhibit, a 1999 payment command, a 2000 class judgment, and the 2005 repeal of the specific statutory provision; none alone proves beneficiary cash distribution. Caption: The missing receipt is not the missing law.</metadata><rect width="800" height="1330" fill="#101c25"/><text x="52" y="73" fill="#e1b96f" font-size="27" font-weight="700" font-family="Arial,sans-serif" letter-spacing="2">FINAL VESTIGE / EVIDENCE CHAIN</text><text x="52" y="130" fill="#ffffff" font-size="44" font-weight="700" font-family="Arial,sans-serif">THE MISSING RECEIPT</text><text x="52" y="182" fill="#ffffff" font-size="44" font-weight="700" font-family="Arial,sans-serif">IS NOT THE MISSING LAW</text><text x="52" y="226" fill="#b8c6cd" font-size="27" font-family="Arial,sans-serif">Four records. Different legal functions.</text><rect x="46" y="266" rx="14" width="708" height="219" fill="#20323f" stroke="#4c6672" stroke-width="2"/><rect x="66" y="284" width="190" height="41" rx="6" fill="#304b5a"/><text x="81" y="313" fill="#f4cd83" font-size="26" font-weight="700" font-family="Arial,sans-serif">08 DEC 1998</text><text x="281" y="315" fill="#ffffff" font-size="29" font-weight="700" font-family="Arial,sans-serif">Court filing referenced</text><text x="75" y="358" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Motion and Order For Leave to Pay</text><text x="75" y="389" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Claims, docket 31-357, Exhibit A</text><text x="75" y="420" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Named sums not independently seen</text><text x="75" y="462" fill="#f5d08a" font-size="24" font-family="Arial,sans-serif">Underlying exhibit NOT obtained</text><rect x="46" y="503" rx="14" width="708" height="219" fill="#20323f" stroke="#4c6672" stroke-width="2"/><rect x="66" y="521" width="190" height="41" rx="6" fill="#304b5a"/><text x="81" y="550" fill="#f4cd83" font-size="26" font-weight="700" font-family="Arial,sans-serif">12 JUL 1999</text><text x="281" y="552" fill="#ffffff" font-size="29" font-weight="700" font-family="Arial,sans-serif">Legislative payment order</text><text x="75" y="595" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Act 1378 links payment to</text><text x="75" y="626" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">listed claimants and identification</text><text x="75" y="657" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Enacted provision, not a receipt</text><text x="75" y="699" fill="#f5d08a" font-size="24" font-family="Arial,sans-serif">Legislated requirement</text><rect x="46" y="740" rx="14" width="708" height="219" fill="#20323f" stroke="#4c6672" stroke-width="2"/><rect x="66" y="758" width="190" height="41" rx="6" fill="#304b5a"/><text x="81" y="787" fill="#f4cd83" font-size="26" font-weight="700" font-family="Arial,sans-serif">11 DEC 2000</text><text x="281" y="789" fill="#ffffff" font-size="29" font-weight="700" font-family="Arial,sans-serif">Class settlement judgment</text><text x="75" y="832" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Date cited in the 2005 act</text><text x="75" y="863" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Partial payments later acknowledged</text><text x="75" y="894" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Original judgment still needed</text><text x="75" y="936" fill="#f5d08a" font-size="24" font-family="Arial,sans-serif">Judgment and payments differ</text><rect x="46" y="977" rx="14" width="708" height="219" fill="#20323f" stroke="#4c6672" stroke-width="2"/><rect x="66" y="995" width="190" height="41" rx="6" fill="#304b5a"/><text x="81" y="1024" fill="#f4cd83" font-size="26" font-weight="700" font-family="Arial,sans-serif">22 JUN 2005</text><text x="281" y="1026" fill="#ffffff" font-size="29" font-weight="700" font-family="Arial,sans-serif">Specific subsection deleted</text><text x="75" y="1069" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Act 130 strikes former order</text><text x="75" y="1100" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Other court obligations not resolved</text><text x="75" y="1131" fill="#e0e8ea" font-size="27" font-family="Arial,sans-serif">Distributions remain unverified</text><text x="75" y="1173" fill="#f5d08a" font-size="24" font-family="Arial,sans-serif">Deletion ≠ discharge of judgment</text><text x="52" y="1262" fill="#ffffff" font-size="27" font-weight="700" font-family="Arial,sans-serif">Required next: exhibit, judgment, and payment trail.</text><text x="52" y="1300" fill="#b2c4cc" font-size="22" font-family="Arial,sans-serif">Original FV diagram • 17 Nov 2026 • © Final Vestige Studios</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title description">
<title id="title">Orleans Levee District litigation at June 30, 2000</title>
<desc id="description">Louisiana's fiscal 2000 financial report says the Orleans Levee District was defendant or co-defendant in 73 lawsuits, including 26 Bohemia Spillway cases and 47 other cases. It separately reported 2,429,293 dollars in liabilities for district claims and litigation collectively, not Bohemia alone. This graphic does not establish any beneficiary payment.</desc>
<rect width="760" height="920" fill="#101b26"/>
<rect x="40" y="42" width="6" height="84" fill="#d0a56a"/>
<text x="66" y="70" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1.5" fill="#d0a56a">FINAL VESTIGE / RECORD CHECK</text>
<text x="66" y="116" font-family="Georgia, Times New Roman, serif" font-size="35" fill="#f4f1e9">One district.</text>
<text x="66" y="158" font-family="Georgia, Times New Roman, serif" font-size="35" fill="#f4f1e9">Seventy-three lawsuits.</text>
<text x="50" y="210" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b4c1c8">Fiscal year ended June 30, 2000</text>
<text x="50" y="296" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#f4f1e9">26 Bohemia-related</text>
<text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b4c1c8">47 other lawsuits involving the district</text>
<rect x="50" y="360" width="660" height="65" rx="6" fill="#435360"/>
<path d="M56 360 H285 V425 H56 Q50 425 50 419 V366 Q50 360 56 360Z" fill="#d0a56a"/>
<text x="168" y="404" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="31" font-weight="bold" fill="#101b26">26 of 73</text>
<text x="50" y="472" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b4c1c8">Cases, not claimants, tracts or payments.</text>
<line x1="50" y1="524" x2="710" y2="524" stroke="#586470" stroke-width="2"/>
<text x="50" y="594" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="bold" fill="#f4f1e9">$2,429,293</text>
<text x="50" y="636" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d0a56a">Reported litigation liabilities</text>
<text x="50" y="670" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d0a56a">for ALL the district's claims.</text>
<text x="50" y="716" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f4f1e9">Not a Bohemia-only balance.</text>
<text x="50" y="748" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f4f1e9">Not evidence of payment.</text>
<line x1="50" y1="791" x2="710" y2="791" stroke="#586470" stroke-width="2"/>
<text x="50" y="835" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#adb9bf">SOURCE: Louisiana FY2000 CAFR,</text>
<text x="50" y="859" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#adb9bf">Note 16, printed p. 67.</text>
<text x="50" y="894" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#adb9bf">© FV Studios 2026 · Original evidence diagram</text>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="980" viewBox="0 0 780 980" role="img" aria-labelledby="ttl dsc">
<title id="ttl">One meeting, two Bohemia records: March 15, 2012</title>
<desc id="dsc">Original source-derived diagram comparing a scientific presentation about Mardi Gras Pass with a separate legal settlement ratification in the same flood authority meeting. One documented field observation describes a channel 32 feet wide and five feet deep on March 10, 2012; a separate March 15 resolution ratified a September 2011 agreement covering nine civil actions, by a vote of eight to zero. Neither is a claimant distribution record.</desc>
<rect width="780" height="980" fill="#151a1b"/>
<rect x="0" y="0" width="14" height="980" fill="#bf985d"/>
<text x="48" y="65" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#bf985d" letter-spacing="2">FINAL VESTIGE · EVIDENCE REGISTER</text>
<text x="48" y="125" font-family="Georgia,serif" font-weight="700" font-size="51" fill="#f6f1e9">One meeting.</text>
<text x="48" y="182" font-family="Georgia,serif" font-weight="700" font-size="51" fill="#f6f1e9">Two records.</text>
<text x="48" y="231" font-family="Arial,sans-serif" font-size="28" fill="#ddd4c6">March 15, 2012 · Flood Authority–East</text>
<rect x="48" y="267" width="684" height="270" rx="17" fill="#243033" stroke="#61797b" stroke-width="2"/>
<text x="75" y="312" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#abd9dc" letter-spacing="1">PHYSICAL RECORD</text>
<text x="75" y="371" font-family="Georgia,serif" font-size="41" font-weight="700" fill="#f6f1e9">32 ft wide · 5 ft deep</text>
<text x="75" y="412" font-family="Arial,sans-serif" font-size="26" fill="#f0e7d8">Mardi Gras Pass, observed March 10</text>
<text x="75" y="462" font-family="Arial,sans-serif" font-size="25" fill="#ced7d5">Board heard a presentation on the breach,</text>
<text x="75" y="496" font-family="Arial,sans-serif" font-size="25" fill="#ced7d5">road repair and a possible causeway.</text>
<rect x="48" y="564" width="684" height="270" rx="17" fill="#302b24" stroke="#ae976f" stroke-width="2"/>
<text x="75" y="610" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#e0ba7b" letter-spacing="1">LEGAL RECORD</text>
<text x="75" y="670" font-family="Georgia,serif" font-size="44" font-weight="700" fill="#f6f1e9">8–0 ratification</text>
<text x="75" y="711" font-family="Arial,sans-serif" font-size="26" fill="#f0e7d8">Resolution 03-15-12-11</text>
<text x="75" y="760" font-family="Arial,sans-serif" font-size="25" fill="#ded1bf">2011 agreement spanning nine listed suits;</text>
<text x="75" y="794" font-family="Arial,sans-serif" font-size="25" fill="#ded1bf">financial terms kept confidential.</text>
<line x1="48" y1="869" x2="732" y2="869" stroke="#85796b" stroke-width="2"/>
<text x="48" y="905" font-family="Arial,sans-serif" font-size="22" fill="#e3ded3">Source: March 15, 2012 board minutes, pp. 5–7, 23–24.</text>
<text x="48" y="936" font-family="Arial,sans-serif" font-size="20" fill="#bbb5aa">Meeting record ≠ signed contract or individual payment.</text>

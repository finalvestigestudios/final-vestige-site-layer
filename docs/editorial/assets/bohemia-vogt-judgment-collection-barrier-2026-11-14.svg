<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1330" viewBox="0 0 900 1330" role="img" aria-labelledby="title desc">
<title id="title">The judgment and the barrier: Bohemia royalty litigation, 1998 to 2002</title>
<desc id="desc">Four sourced procedural checkpoints. A 1998 state royalty judgment of 2.853 million dollars. In 2000 a court-recorded accountant's testimony cited 2.7 million dollars earmarked for Bohemia litigation within 57 million of investments, not proof of available cash or payment. In March 2002 Louisiana judges rejected compelled seizure and appropriation. In June 2002 federal judges allowed a takings claim to proceed, without deciding final recovery.</desc>
<rect width="900" height="1330" fill="#101820"/><rect x="27" y="26" width="846" height="1278" fill="none" stroke="#977854" stroke-width="2"/>
<text x="65" y="86" font-family="Georgia,serif" font-size="24" fill="#c8a874" letter-spacing="3">FINAL VESTIGE / EVIDENCE FIGURE</text>
<text x="65" y="153" font-family="Georgia,serif" font-size="54" fill="#f5efe2">A judgment is not</text>
<text x="65" y="211" font-family="Georgia,serif" font-size="54" fill="#f5efe2">a cleared payment.</text>
<text x="65" y="260" font-family="Arial,sans-serif" font-size="24" fill="#abbcc8">The Vogt collection dispute, 1998–2002</text>
<rect x="60" y="300" width="780" height="195" rx="12" fill="#182631" stroke="#354754" stroke-width="1"/>
<rect x="60" y="300" width="8" height="195" rx="4" fill="#bf9559"/>
<text x="91" y="341" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d9b47d">1998</text>
<text x="91" y="382" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f1ecdf">A COURT RECOGNIZES THE CLAIM</text>
<text x="91" y="421" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">July 24: the Louisiana state judgment recorded</text>
<text x="91" y="453" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">$2,853,358.44 in disputed mineral revenues,</text>
<text x="91" y="485" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">with interest. Not a beneficiary payment ledger.</text>
<rect x="60" y="518" width="780" height="218" rx="12" fill="#182631" stroke="#354754" stroke-width="1"/>
<rect x="60" y="518" width="8" height="218" rx="4" fill="#bf9559"/>
<text x="91" y="559" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d9b47d">2000</text>
<text x="91" y="600" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f1ecdf">AN ACCOUNTANT DESCRIBES THE FUNDS</text>
<text x="91" y="639" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">Witness testimony reported $57m in investments,</text>
<text x="91" y="671" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">including $9m money-market funds; $2.7m</text>
<text x="91" y="703" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">was earmarked for Bohemia litigation.</text>
<text x="91" y="735" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">These are nested figures, not additive totals.</text>
<rect x="60" y="762" width="780" height="195" rx="12" fill="#182631" stroke="#354754" stroke-width="1"/>
<rect x="60" y="762" width="8" height="195" rx="4" fill="#bf9559"/>
<text x="91" y="803" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d9b47d">MAR 2002</text>
<text x="91" y="844" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f1ecdf">STATE ENFORCEMENT IS DENIED</text>
<text x="91" y="883" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">The appeals court upheld denial of seizure and</text>
<text x="91" y="915" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">mandamus: public funds could not be seized and</text>
<text x="91" y="947" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">an appropriation could not be compelled.</text>
<rect x="60" y="988" width="780" height="195" rx="12" fill="#182631" stroke="#354754" stroke-width="1"/>
<rect x="60" y="988" width="8" height="195" rx="4" fill="#bf9559"/>
<text x="91" y="1029" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d9b47d">JUN 2002</text>
<text x="91" y="1070" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f1ecdf">FEDERAL CLAIM IS REINSTATED</text>
<text x="91" y="1109" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">The Fifth Circuit reversed dismissal and</text>
<text x="91" y="1141" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">remanded a pleaded takings claim. It did not</text>
<text x="91" y="1173" font-family="Arial,sans-serif" font-size="23" fill="#d2dee5">order or verify a final distribution.</text>
<text x="65" y="1232" font-family="Arial,sans-serif" font-size="20" fill="#e5cfad">Sources: La. Fourth Circuit (27 Mar 2002), 814 So.2d 648;</text>
<text x="65" y="1261" font-family="Arial,sans-serif" font-size="20" fill="#e5cfad">U.S. Fifth Circuit (14 Jun 2002), 294 F.3d 684.</text>

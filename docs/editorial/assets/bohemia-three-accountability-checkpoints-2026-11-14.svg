<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 728" width="390" height="728" role="img" aria-labelledby="title desc">
<title id="title">The Bohemia accounting trail: 1984, 1996, 2009</title>
<desc id="desc">Three distinct legal checkpoints. In 1984 Act 233 section 3 required an accounting of revenues available to applicants. In 1996 the Riley appeal recognized applicants' access claim and remanded, without documenting production. In 2009 proposed Senate Bill 350 sought a broader audit, but never became law. Original Final Vestige Studios infographic based on published judicial opinions and Louisiana legislative history.</desc>
<rect width="390" height="728" fill="#10171a"/>
<rect x="0" y="0" width="390" height="5" fill="#bfa875"/>
<text x="24" y="33" fill="#baa779" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.6">FINAL VESTIGE  /  INVESTIGATIONS</text>
<text x="24" y="68" fill="#f3efe7" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="bold">The accounting trail</text>
<text x="24" y="88" fill="#bfc5c3" font-family="Arial,Helvetica,sans-serif" font-size="12">Three different official acts. Three different tests.</text>
<line x1="38" y1="120" x2="38" y2="574" stroke="#8a7958" stroke-width="2" opacity="0.65"/>
<rect x="24" y="115" width="342" height="144" rx="9" fill="#1b2729" stroke="#4b5756"/>
<circle cx="38" cy="140" r="6" fill="#d7ba7c"/>
<text x="55" y="145" fill="#d8bd85" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold">1984  /  LAW ENACTED</text>
<text x="38" y="177" fill="#faf7ef" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="bold">An accounting required</text>
<text x="38" y="199" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">Act 233 §3 directed the levee board to give</text>
<text x="38" y="217" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">DNR a revenue accounting accessible to</text>
<text x="38" y="235" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">qualifying applicants.</text>
<rect x="24" y="270" width="342" height="157" rx="9" fill="#1b2729" stroke="#4b5756"/>
<circle cx="38" cy="295" r="6" fill="#d7ba7c"/>
<text x="55" y="300" fill="#d8bd85" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold">1996  /  APPEAL DECIDED</text>
<text x="38" y="331" fill="#faf7ef" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="bold">Access claim recognized</text>
<text x="38" y="353" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">In Riley v. Riley, the court reversed a</text>
<text x="38" y="371" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">procedural dismissal and remanded.</text>
<text x="38" y="393" fill="#b8c0c0" font-family="Arial,Helvetica,sans-serif" font-size="11.5">It did not certify that records were produced.</text>
<rect x="24" y="438" width="342" height="144" rx="9" fill="#1b2729" stroke="#4b5756"/>
<circle cx="38" cy="463" r="6" fill="#d7ba7c"/>
<text x="55" y="468" fill="#d8bd85" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold">2009  /  BILL NOT ENACTED</text>
<text x="38" y="500" fill="#faf7ef" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="bold">A broader audit proposed</text>
<text x="38" y="522" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">SB350 contemplated independent review of</text>
<text x="38" y="540" fill="#e0e2dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5">deeds, judgments and claimant payments.</text>
<text x="38" y="558" fill="#b8c0c0" font-family="Arial,Helvetica,sans-serif" font-size="11.5">The conference proposal did not become law.</text>
<rect x="24" y="596" width="342" height="64" rx="7" fill="#2a2b25" stroke="#7c724f"/>
<text x="36" y="620" fill="#ead5a5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold">The evidence boundary</text>
<text x="36" y="640" fill="#f0ece2" font-family="Arial,Helvetica,sans-serif" font-size="11.3">A duty is not a receipt; an appeal is not a ledger.</text>
<text x="24" y="684" fill="#bfc5c3" font-family="Arial,Helvetica,sans-serif" font-size="9.5">Sources: La. Supreme Court (1986); Riley (1996); SB350 (2009)</text>
<text x="24" y="705" fill="#9ca3a2" font-family="Arial,Helvetica,sans-serif" font-size="9">Original FV evidence diagram  •  14 Nov 2026  •  Not archival imagery</text>
</svg>

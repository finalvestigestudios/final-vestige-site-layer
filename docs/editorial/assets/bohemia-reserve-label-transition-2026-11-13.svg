<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1060" viewBox="0 0 780 1060" role="img" aria-labelledby="title desc">
<title id="title">When the Bohemia reserve lost its name: 2005–2007 financial reporting</title>
<desc id="desc">The Orleans Levee District labeled 456,190 dollars at June 30, 2005 and 339,407 dollars at June 30, 2006 as Bohemia Spillway escrow. At June 30, 2007 it listed 292,522 dollars under the broader heading Legal Settlements. These categories cannot be assumed identical, and the figures do not establish payments to landowners. Sources: official district financial statements for fiscal 2005, 2006 and 2007 held by the Louisiana Legislative Auditor.</desc>
<rect width="780" height="1060" fill="#0b1720"/>
<rect x="34" y="34" width="712" height="992" rx="13" fill="#101f2a" stroke="#42565c" stroke-width="2"/>
<text x="66" y="91" fill="#d8b77c" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="2">FINAL VESTIGE  /  RECORD COMPARISON</text>
<text x="66" y="154" fill="#f7f5ee" font-size="38" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">When an account</text>
<text x="66" y="198" fill="#f7f5ee" font-size="38" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">changed its label</text>
<text x="66" y="242" fill="#b6c3c9" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Orleans Levee District  •  year-end reserves</text>
<rect x="62" y="278" width="654" height="172" rx="9" fill="#1c303b"/>
<text x="90" y="318" fill="#d8b77c" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">30 JUN 2005</text>
<text x="90" y="372" fill="#fff9ed" font-size="43" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">$456,190</text>
<text x="90" y="411" fill="#d7e0e3" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">“Bohemia Spillway Escrow”</text>
<rect x="62" y="468" width="654" height="172" rx="9" fill="#1c303b"/>
<text x="90" y="508" fill="#d8b77c" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">30 JUN 2006</text>
<text x="90" y="562" fill="#fff9ed" font-size="43" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">$339,407</text>
<text x="90" y="601" fill="#d7e0e3" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">“Bohemia Spillway Escrow”</text>
<line x1="80" y1="665" x2="698" y2="665" stroke="#e9b869" stroke-width="3" stroke-dasharray="10 9"/>
<rect x="211" y="644" width="358" height="42" rx="21" fill="#d8b77c"/>
<text x="390" y="672" text-anchor="middle" fill="#14222b" font-size="19" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">REPORTING CATEGORY CHANGES</text>
<rect x="62" y="710" width="654" height="170" rx="9" fill="#24343c" stroke="#d8b77c" stroke-width="2"/>
<text x="90" y="752" fill="#f2c984" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">30 JUN 2007</text>
<text x="90" y="806" fill="#fff9ed" font-size="43" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">$292,522</text>
<text x="90" y="844" fill="#d7e0e3" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">“Legal Settlements”  •  broader category</text>
<text x="65" y="920" fill="#f7f5ee" font-size="20" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">NOT A VERIFIED PAYMENT SERIES.</text>
<text x="65" y="951" fill="#c6d1d6" font-size="17" font-family="DejaVu Sans,Arial,sans-serif">The 2007 amount is not identified solely as Bohemia.</text>
<text x="65" y="980" fill="#a4b3bb" font-size="16" font-family="DejaVu Sans,Arial,sans-serif">Source: Louisiana Legislative Auditor, FY2005–FY2007</text>
<text x="65" y="1003" fill="#a4b3bb" font-size="16" font-family="DejaVu Sans,Arial,sans-serif">financial reports. Original FV artwork • 13 Nov 2026.</text>

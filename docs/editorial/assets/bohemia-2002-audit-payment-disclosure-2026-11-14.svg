<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1510" viewBox="0 0 780 1510" role="img" aria-labelledby="title desc">
<title id="title">The Bohemia payment record in the Orleans Levee District financial statements for 2002</title>
<desc id="desc">Vogt and Edgecombe: judgment $1,831,528; $108,683 in small claims paid by August 15, 2000; unpaid principal $1,722,845 as of June 30, 2002. Haspel and Davis: judgment $18,767,145; $1,968,264 deposited in court registry; $350,000 fixed-cost registry deposit; $371,532 paid on judgment; unpaid $16,077,350 as of June 30, 2002. These are historical statements reported by the district, not proof of individual disbursements or present-day balances.</desc>

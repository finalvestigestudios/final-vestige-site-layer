<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway: four milestones in public control of mineral revenue</title>
<desc id="desc">2015 flood authority authorized closing a settlement escrow; November 2023 authorities negotiated a management memorandum; January 1 2024 was the reported effective date of Lakefront Management Authority control; July 25 2024 the LMA board delegated mineral leasing administration to the State Mineral and Energy Board. None establishes that all landowners were paid.</desc>
<rect width="760" height="830" fill="#111411"/>
<rect x="26" y="26" width="708" height="778" rx="8" fill="#181b18" stroke="#625e50" stroke-width="2"/>
<text x="55" y="79" fill="#d4b889" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">FINAL VESTIGE  /  DOCUMENT TRAIL</text>
<text x="55" y="129" fill="#f4f0e7" font-family="Georgia, serif" font-size="35" font-weight="bold">Who controlled the mineral rights?</text>
<text x="55" y="168" fill="#c7c0b4" font-family="Arial, sans-serif" font-size="23">A sequence of recorded decisions, not receipts</text>
<path d="M79 211 V663" stroke="#8c7a5c" stroke-width="4"/>
<g font-family="Arial, sans-serif">
<circle cx="79" cy="226" r="12" fill="#d4b889"/><text x="114" y="226" fill="#d4b889" font-size="22" font-weight="bold">MAR 19, 2015</text>
<text x="114" y="262" fill="#f5f1e8" font-size="26" font-weight="bold">Escrow closure authorized</text>
<text x="114" y="298" fill="#c9c2b6" font-size="22">Flood authority voted to close</text><text x="114" y="326" fill="#c9c2b6" font-size="22">the restricted account and transfer funds.</text>
<circle cx="79" cy="368" r="12" fill="#d4b889"/><text x="114" y="368" fill="#d4b889" font-size="22" font-weight="bold">NOVEMBER 2023</text>
<text x="114" y="404" fill="#f5f1e8" font-size="26" font-weight="bold">Management memorandum</text>
<text x="114" y="440" fill="#c9c2b6" font-size="22">Authorities negotiated reassignment</text><text x="114" y="468" fill="#c9c2b6" font-size="22">of Bohemia administration.</text>
<circle cx="79" cy="509" r="12" fill="#d4b889"/><text x="114" y="509" fill="#d4b889" font-size="22" font-weight="bold">JAN 1, 2024</text>
<text x="114" y="545" fill="#f5f1e8" font-size="26" font-weight="bold">Reported effective handoff</text>
<text x="114" y="581" fill="#c9c2b6" font-size="22">LMA counsel identified this as the</text><text x="114" y="609" fill="#c9c2b6" font-size="22">effective date of management control.</text>
<circle cx="79" cy="651" r="12" fill="#d4b889"/><text x="114" y="651" fill="#d4b889" font-size="22" font-weight="bold">JUL 25, 2024</text>
<text x="114" y="688" fill="#f5f1e8" font-size="26" font-weight="bold">Mineral leasing delegated</text>
</g>
<rect x="48" y="714" width="664" height="70" rx="4" fill="#28241d"/>
<text x="65" y="741" fill="#edc99d" font-family="Arial, sans-serif" font-size="19" font-weight="bold">NOT PROVEN BY THESE MINUTES:</text>
<text x="65" y="768" fill="#e8e1d5" font-family="Arial, sans-serif" font-size="18">Every claimant paid, every tract's title, or a bank transfer.</text>
</svg>

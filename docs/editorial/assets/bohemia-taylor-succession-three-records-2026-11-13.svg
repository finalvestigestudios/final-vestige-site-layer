<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" role="img" aria-labelledby="title desc">
<title id="title">One family, three different records: Bohemia Spillway succession 1990–2005</title>
<desc id="desc">An original documentary timeline. In December 1990 a land conveyance was acknowledged by both parties in court. In October 2003 a trial court awarded approximately 166,843 dollars in royalty principal. In April 2005 an appellate court affirmed the interest ruling but reversed the award of attorneys fees. No source examined here verifies actual payment.</desc>
<rect width="720" height="1000" fill="#171918"/>
<path d="M44 43 H676" stroke="#6f6553" stroke-width="2"/>
<text x="44" y="82" fill="#d5ad6b" font-size="21" font-family="Arial, sans-serif" letter-spacing="3">FINAL VESTIGE / CASE RECORD</text>
<text x="44" y="133" fill="#f1ece3" font-size="37" font-weight="700" font-family="Georgia, serif">A deed was not a payment</text>
<text x="44" y="173" fill="#aeb2ac" font-size="22" font-family="Arial, sans-serif">The Taylor succession • Three legal milestones</text>
<path d="M83 230 V788" stroke="#b99255" stroke-width="3" stroke-dasharray="6 10"/>
<circle cx="83" cy="265" r="11" fill="#d5ad6b"/>
<rect x="118" y="210" width="558" height="167" rx="11" fill="#262a28" stroke="#484943"/>
<text x="142" y="246" fill="#d5ad6b" font-size="24" font-weight="700" font-family="Arial, sans-serif">1990  /  TITLE</text>
<text x="142" y="283" fill="#f1ece3" font-size="27" font-weight="700" font-family="Georgia, serif">December 3: conveyance</text>
<text x="142" y="317" fill="#d2d4cf" font-size="21" font-family="Arial, sans-serif">Acknowledged in a later court stipulation.</text>
<text x="142" y="348" fill="#abb1aa" font-size="19" font-family="Arial, sans-serif">Original parish deed not independently seen.</text>
<circle cx="83" cy="466" r="11" fill="#d5ad6b"/>
<rect x="118" y="410" width="558" height="174" rx="11" fill="#262a28" stroke="#484943"/>
<text x="142" y="448" fill="#d5ad6b" font-size="24" font-weight="700" font-family="Arial, sans-serif">2003  /  PRINCIPAL</text>
<text x="142" y="486" fill="#f1ece3" font-size="27" font-weight="700" font-family="Georgia, serif">Approximately $166,843</text>
<text x="142" y="518" fill="#d2d4cf" font-size="21" font-family="Arial, sans-serif">Royalty liability acknowledged; trial judgment.</text>
<text x="142" y="551" fill="#abb1aa" font-size="19" font-family="Arial, sans-serif">Opinion varies by 3¢ on the exact sum.</text>
<circle cx="83" cy="667" r="11" fill="#d5ad6b"/>
<rect x="118" y="615" width="558" height="174" rx="11" fill="#262a28" stroke="#484943"/>
<text x="142" y="653" fill="#d5ad6b" font-size="24" font-weight="700" font-family="Arial, sans-serif">2005  /  APPEAL</text>
<text x="142" y="690" fill="#f1ece3" font-size="26" font-weight="700" font-family="Georgia, serif">Interest affirmed, fees reversed</text>
<text x="142" y="726" fill="#d2d4cf" font-size="21" font-family="Arial, sans-serif">Court declined additional interest back to 1984.</text>
<text x="142" y="756" fill="#abb1aa" font-size="19" font-family="Arial, sans-serif">No payment confirmation in the opinion.</text>
<rect x="44" y="825" width="632" height="83" rx="10" fill="#393128" stroke="#b99255"/>
<text x="67" y="858" fill="#f2d3a5" font-size="22" font-weight="700" font-family="Arial, sans-serif">THE DISTINCTION</text>
<text x="67" y="887" fill="#f1ece3" font-size="20" font-family="Arial, sans-serif">Conveyance ≠ judgment ≠ verified payment.</text>
<text x="44" y="949" fill="#c0c2bd" font-size="16" font-family="Arial, sans-serif">Source: La. Fourth Circuit, Frank v. Orleans Levee Board, Apr. 6, 2005.</text>
<text x="44" y="975" fill="#878b85" font-size="15" font-family="Arial, sans-serif">Original evidence diagram © Final Vestige Studios, 2026. Not archival imagery.</text>
</svg>
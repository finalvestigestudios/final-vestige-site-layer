<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1370" viewBox="0 0 540 1370" role="img" aria-labelledby="title desc">
<title id="title">Three instructions removed from the Bohemia Spillway law in 2005</title>
<desc id="desc">Source-grounded Final Vestige Studios diagram made for mobile reading. Act 130 struck out a previous structured-settlement July 1, 2009 final payment deadline, an annual March 1 legislative land and payments report, and a provision to escrow revenues from property with disputed title until a court judgment. This legal redline does not establish any actual beneficiary payment or discharge of a separate court judgment.</desc>
<metadata>Original evidence diagram © 2026 Final Vestige Studios, all rights reserved. Creator: Final Vestige Studios editorial research (AI-assisted design; editorial release review required). Date: 2026-11-16. Original vector composition, not an archival image or AI historical reconstruction. Sources: enrolled Louisiana Act 130 (2005), p. 4, https://www.legis.la.gov/Legis/ViewDocument.aspx?d=317802 ; Legislative Digest of SB210, pp. 1–2, https://www.legis.la.gov/Legis/ViewDocument.aspx?d=315214 . Caption: Three statutory provisions deleted by Act 130. Deletion does not prove a judgment canceled, escrow released, or claimant paid. Alt: Three large readable panels describing the removed July 2009 deadline, March 1 reports and disputed-revenue escrow rule.</metadata>
<rect width="540" height="1370" fill="#111512"/>
<rect x="20" y="20" width="500" height="1330" rx="12" fill="none" stroke="#766b52" stroke-width="2"/>
<text x="38" y="66" fill="#c6ad83" font-family="Arial,sans-serif" letter-spacing="2" font-size="22">FINAL VESTIGE / EVIDENCE</text>
<line x1="38" y1="85" x2="502" y2="85" stroke="#b99b64" stroke-width="3"/>
<text x="38" y="154" fill="#f3f0e7" font-family="Georgia,serif" font-weight="bold" font-size="52">Three rules</text>
<text x="38" y="210" fill="#f3f0e7" font-family="Georgia,serif" font-weight="bold" font-size="52">crossed out</text>
<text x="38" y="252" fill="#c3c4ba" font-family="Arial,sans-serif" font-size="23">Bohemia Spillway / Act 130 / 2005</text>
<g font-family="Arial,sans-serif">
<rect x="32" y="285" width="476" height="292" rx="12" fill="#202923" stroke="#667263" stroke-width="1.5"/>
<rect x="32" y="285" width="8" height="292" rx="3" fill="#c3a470"/>
<text x="58" y="331" font-size="23" letter-spacing=".8" fill="#cdb088">01 / SETTLEMENT DEADLINE</text>
<text x="58" y="386" font-size="42" font-weight="bold" fill="#f0eee8">July 1, 2009</text>
<text x="58" y="430" font-size="26" fill="#d7d9d0">Former final date for</text>
<text x="58" y="466" font-size="26" fill="#d7d9d0">one structured payment</text>
<text x="58" y="502" font-size="26" fill="#d7d9d0">option's revenue + interest</text>
<text x="58" y="550" font-size="26" font-weight="bold" fill="#e0b782">REMOVED IN 2005</text>
<rect x="32" y="603" width="476" height="292" rx="12" fill="#202923" stroke="#667263" stroke-width="1.5"/>
<rect x="32" y="603" width="8" height="292" rx="3" fill="#c3a470"/>
<text x="58" y="649" font-size="23" letter-spacing=".8" fill="#cdb088">02 / ANNUAL REPORTING</text>
<text x="58" y="704" font-size="42" font-weight="bold" fill="#f0eee8">Every March 1</text>
<text x="58" y="748" font-size="26" fill="#d7d9d0">Former legislative report</text>
<text x="58" y="784" font-size="26" fill="#d7d9d0">on land transferred and</text>
<text x="58" y="820" font-size="26" fill="#d7d9d0">revenue + interest paid</text>
<text x="58" y="868" font-size="26" font-weight="bold" fill="#e0b782">REMOVED IN 2005</text>
<rect x="32" y="921" width="476" height="292" rx="12" fill="#202923" stroke="#667263" stroke-width="1.5"/>
<rect x="32" y="921" width="8" height="292" rx="3" fill="#c3a470"/>
<text x="58" y="967" font-size="23" letter-spacing=".8" fill="#cdb088">03 / DISPUTED REVENUES</text>
<text x="58" y="1022" font-size="40" font-weight="bold" fill="#f0eee8">Escrow requirement</text>
<text x="58" y="1066" font-size="26" fill="#d7d9d0">Former direction to hold</text>
<text x="58" y="1102" font-size="26" fill="#d7d9d0">disputed-property revenue</text>
<text x="58" y="1138" font-size="26" fill="#d7d9d0">until a court decision</text>
<text x="58" y="1186" font-size="26" font-weight="bold" fill="#e0b782">REMOVED IN 2005</text>
</g>
<line x1="38" y1="1240" x2="502" y2="1240" stroke="#7a725e"/>
<text x="38" y="1273" font-size="22" font-family="Arial,sans-serif" fill="#e5dfce">Not proof of payment or a vacated judgment.</text>
<text x="38" y="1307" font-size="20" font-family="Arial,sans-serif" fill="#b8b7ae">SOURCE: Louisiana Act 130, p. 4; digest pp. 1–2</text>

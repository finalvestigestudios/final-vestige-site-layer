<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Three different water-control works below New Orleans: Bohemia, the 1927 Caernarvon breach, and the 1991 Caernarvon freshwater diversion</title>
<desc id="desc">Source-derived, schematic chronology, not geographically or temporally to scale. Bohemia Spillway authorized 1924 and built 1924 to 1926; 1983 constitutional amendment and 1984 land-return statute; 1986 court upholds statute; some certified property titles transferred 1991 to 1992; 2008 audited report still describes claims. Separate Caernarvon deliberate levee breach happened April 29, 1927 and a 1955 court case discusses a proposed half-mill reparations levy. The controlled Caernarvon Freshwater Diversion was built in 1991 and is not the 1927 breach. Sources: Louisiana Supreme Court 496 So. 2d 281 (1986); Louisiana Supreme Court Dantoni v Board of Levee Commissioners (1955); Vogt v Orleans Levee Board (2002); Louisiana Legislative Auditor 2008 financial report Note 7; Lopez et al GCAGS Journal 2014.</desc>
<rect width="1440" height="720" fill="#f7f6f1"/>
<text x="50" y="61" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#152d31">Three interventions. Three different records.</text>

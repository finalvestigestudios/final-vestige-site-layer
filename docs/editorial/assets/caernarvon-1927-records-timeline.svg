<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Two floods. One deliberate breach. Caernarvon, 1927.</title><desc id="desc">An original Final Vestige evidence timeline. New Orleans received more than fourteen inches of rainfall April 14–15. The Mississippi at Carrollton read 21.0 feet April 25. Governor O. H. Simpson ordered a cut April 26, performed April 29, when a contemporary report described the first blast around 2:17 pm. The National Weather Service later reported 20.7 feet on May 15. Separate retrospective estimates of the breach's stage reduction are around half a foot from NWS and two feet from a 1927 Army engineering board; methods differ and neither observes the uncut river.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d22"/><stop offset="1" stop-color="#0c1318"/></linearGradient></defs><rect width="1280" height="850" rx="12" fill="url(#bg)"/>
<rect x="58" y="54" width="4" height="101" rx="2" fill="#bf9860"/>
<text x="84" y="76" font-size="26" font-family="Georgia, serif" fill="#cba775" letter-spacing="3">FINAL VESTIGE STUDIOS / INVESTIGATIONS</text>
<text x="84" y="130" font-size="48" font-family="Georgia, serif" fill="#f6f0e4" >Two floods. One deliberate breach.</text>
<text x="84" y="163" font-size="20" font-family="Arial, sans-serif" fill="#b2bcb9" >Caernarvon, 1927  ·  What the records establish, and what they cannot</text>
<path d="M72 225 H1208" stroke="#6d786f" stroke-opacity=".55" stroke-width="2"/>
<circle cx="120" cy="225" r="11" fill="#c5a273"/><circle cx="120" cy="225" r="3.5" fill="#111c20"/>
<text x="82" y="263" font-size="20" font-family="Arial, sans-serif" fill="#cba775" font-weight="bold">APR 14–15</text>
<text x="82" y="296" font-size="29" font-family="Georgia, serif" fill="#f6f0e4" >14+ inches</text>
<text x="82" y="326" font-size="17" font-family="Arial, sans-serif" fill="#cbd0cb" >Rain in 19 hours</text>
<text x="82" y="353" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >City rainwater flood,</text>
<text x="82" y="377" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >not river overtopping</text>
<circle cx="356" cy="225" r="11" fill="#c5a273"/><circle cx="356" cy="225" r="3.5" fill="#111c20"/>
<text x="294" y="263" font-size="20" font-family="Arial, sans-serif" fill="#cba775" font-weight="bold">APR 25</text>
<text x="294" y="296" font-size="29" font-family="Georgia, serif" fill="#f6f0e4" >21.0 feet</text>
<text x="294" y="326" font-size="17" font-family="Arial, sans-serif" fill="#cbd0cb" >Carrollton river stage</text>
<text x="294" y="353" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >Recorded before the</text>
<text x="294" y="377" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >deliberate cut</text>
<circle cx="588" cy="225" r="11" fill="#c5a273"/><circle cx="588" cy="225" r="3.5" fill="#111c20"/>
<text x="520" y="263" font-size="20" font-family="Arial, sans-serif" fill="#cba775" font-weight="bold">APR 26</text>
<text x="520" y="296" font-size="29" font-family="Georgia, serif" fill="#f6f0e4" >Order issued</text>
<text x="520" y="326" font-size="17" font-family="Arial, sans-serif" fill="#cbd0cb" >Governor O. H. Simpson</text>
<text x="520" y="353" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >Specified April 29,</text>
<text x="520" y="377" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >noon, as planned time</text>
<circle cx="824" cy="225" r="11" fill="#c5a273"/><circle cx="824" cy="225" r="3.5" fill="#111c20"/>
<text x="758" y="263" font-size="20" font-family="Arial, sans-serif" fill="#cba775" font-weight="bold">APR 29</text>
<text x="758" y="296" font-size="29" font-family="Georgia, serif" fill="#f6f0e4" >First blast</text>
<text x="758" y="326" font-size="17" font-family="Arial, sans-serif" fill="#cbd0cb" >~2:17 p.m. reported</text>
<text x="758" y="353" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >Three shallow cuts;</text>
<text x="758" y="377" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >water initially trickled</text>
<circle cx="1098" cy="225" r="11" fill="#c5a273"/><circle cx="1098" cy="225" r="3.5" fill="#111c20"/>
<text x="1016" y="263" font-size="20" font-family="Arial, sans-serif" fill="#cba775" font-weight="bold">MAY 15</text>
<text x="1016" y="296" font-size="29" font-family="Georgia, serif" fill="#f6f0e4" >20.7 feet</text>
<text x="1016" y="326" font-size="17" font-family="Arial, sans-serif" fill="#cbd0cb" >NWS-reported stage</text>
<text x="1016" y="353" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >With the breach</text>
<text x="1016" y="377" font-size="16" font-family="Arial, sans-serif" fill="#96a7a5" >already open</text>
<rect x="72" y="432" width="1136" height="244" rx="13" fill="#202c2e" stroke="#58655f"/><path d="M105 491 H1175" stroke="#475553"/>
<text x="105" y="474" font-size="29" font-family="Georgia, serif" fill="#f2eee4" >The estimate is not the measurement</text>
<text x="104" y="536" font-size="45" font-family="Georgia, serif" fill="#d1aa70" >~½ foot</text>
<text x="104" y="570" font-size="18" font-family="Arial, sans-serif" fill="#d5d8d0" >Later NWS estimate of stage reduction</text>
<text x="104" y="600" font-size="16" font-family="Arial, sans-serif" fill="#91a6a2" >Retrospective summary</text>
<path d="M634 512 V633" stroke="#536762" stroke-width="2"/>
<text x="674" y="536" font-size="45" font-family="Georgia, serif" fill="#d1aa70" >~2 feet</text>
<text x="674" y="570" font-size="18" font-family="Arial, sans-serif" fill="#d5d8d0" >1927 Army board’s estimate at Carrollton</text>
<text x="674" y="600" font-size="16" font-family="Arial, sans-serif" fill="#91a6a2" >Gauge-relationship inference at a particular time</text>
<text x="104" y="648" font-size="16" font-family="Arial, sans-serif" fill="#f0c593" >Methods and reference times differ. Neither figure records the river that would have existed without the cut.</text>
<text x="82" y="721" font-size="25" font-family="Georgia, serif" fill="#f1ece0" >A decision with known consequences; a counterfactual the gauges cannot directly show.</text>
<text x="82" y="763" font-size="15" font-family="Arial, sans-serif" fill="#aebbb6" >Sources: NWS New Orleans flood history; Louisiana Supreme Court, Foret (1929); The Eugene Guard (Apr 29, 1927);</text>
<text x="82" y="786" font-size="15" font-family="Arial, sans-serif" fill="#aebbb6" >U.S. Army special engineering board, H. Doc. 70-95 (1927), appendix B. Original FV evidence graphic, 2026.</text>
<text x="82" y="820" font-size="13" font-family="Arial, sans-serif" fill="#789089" >NOT A RECONSTRUCTION OF RIVER FLOW · NO MAP LOCATIONS OR UNCITED MEASUREMENTS ARE IMPLIED</text>
</svg>
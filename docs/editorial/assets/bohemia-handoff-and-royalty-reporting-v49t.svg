<svg xmlns="http://www.w3.org/2000/svg" width="540" height="935" viewBox="0 0 540 935" role="img" aria-labelledby="title desc">
<title id="title">Bohemia royalties: four government records, four different reporting bases</title>
<desc id="desc">Original Final Vestige Studios documentary data graphic. February 2024 flood authority minutes report royalty routing to the Lakefront Management Authority. January 2025 board minutes record 250,000 dollars expected and 25,000 received, period unspecified. February 2025 board minutes report 47,000 received for 2024 and 39,000 for an ambiguously named six-month period. Fiscal 2025-26 budget forecasts 100,000 dollars. These figures cannot be summed into a reconciled ledger or used to infer private-heir restitution.</desc>
<metadata>Creator: Final Vestige Studios; Created 2026-11-17; Copyright © 2026 Final Vestige Studios. First-party vector layout, original, no third-party image material. Source A: https://www.floodauthority.org/wp-content/uploads/2024/03/2024-02-22-SLFPA-E-Finance-Committee-Minutes.pdf printed p.2. Source B: https://wwwprd.doa.louisiana.gov/boardsAndCommissions/MeetingMinutes/547_Full%20Board%20Minutes%20-%20January%2030%2C%202025final.pdf PDF p.9. Source C: https://wwwcfprd.doa.louisiana.gov/boardsandcommissions/MeetingMinutes/547_Full%20Board%20Minutes%20-%20FEB%2020%202025completed.pdf PDF p.5. Source D: https://nolalakefront.com/wp-content/uploads/2025/11/25-26-Budget-website.pdf line 444010. Alt and caption: Different public reporting bases, not a continuous cash ledger; amounts attributed to officials and budget, not proof of claimant payments.</metadata>
<rect width="540" height="935" fill="#0d1921"/>
<text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d7b879">FINAL VESTIGE  /  EVIDENCE FILE</text>
<path d="M28 48 H512" stroke="#7f7160" stroke-width="1"/>
<text x="28" y="91" font-family="Georgia,serif" font-size="31" fill="#f5f1e7">Following the royalties</text>
<text x="28" y="121" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#c9d0d1">Four records. Different accounting bases.</text>
<text x="28" y="146" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a9b9bb">No one of them is a beneficiary-payment ledger.</text>

<rect x="24" y="166" width="492" height="126" rx="10" fill="#162936" stroke="#41606a"/>
<text x="42" y="193" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ddbe82" font-weight="700">FEB 22, 2024  ·  FLOOD AUTHORITY MINUTES</text>
<text x="42" y="221" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f4f2ed" font-weight="700">Revenue routing changed</text>
<text x="42" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">No Bohemia royalties in the authority's</text>
<text x="42" y="268" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">FY2025 budget: now sent to LMA. [74]</text>

<rect x="24" y="306" width="492" height="172" rx="10" fill="#162936" stroke="#41606a"/>
<text x="42" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ddbe82" font-weight="700">JAN 30, 2025  ·  LMA DIRECTOR'S REPORT</text>
<text x="42" y="366" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5d4">Expected</text>
<text x="294" y="366" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5d4">Reported received</text>
<text x="42" y="405" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f4f2ed">$250,000</text>
<text x="294" y="405" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f4f2ed">$25,000</text>
<path d="M42 419 H498" stroke="#516873"/>
<text x="42" y="447" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">Period and lease-level basis unspecified. [72]</text>

<rect x="24" y="492" width="492" height="212" rx="10" fill="#162936" stroke="#41606a"/>
<text x="42" y="521" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ddbe82" font-weight="700">FEB 20, 2025  ·  LMA BOARD MINUTES</text>
<text x="42" y="551" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5d4">Reported for all of 2024</text>
<text x="42" y="583" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f4f2ed">$47,000</text>
<text x="270" y="551" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5d4">Reported for “six months”</text>
<text x="270" y="583" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#f4f2ed">$39,000</text>
<path d="M42 598 H498" stroke="#516873"/>
<text x="42" y="627" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">The six-month reference is ambiguous:</text>
<text x="42" y="650" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">February is too early for six calendar</text>
<text x="42" y="673" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">months of 2025 to have passed. [75]</text>

<rect x="24" y="718" width="492" height="135" rx="10" fill="#162936" stroke="#41606a"/>
<text x="42" y="747" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ddbe82" font-weight="700">FY2025–2026  ·  ADOPTED LMA BUDGET</text>
<text x="42" y="782" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f4f2ed">$100,000</text>
<text x="268" y="782" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">Projected royalties</text>
<text x="42" y="820" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e0df">Budget line 444010; not a receipt. [71]</text>
<path d="M28 872 H512" stroke="#7f7160" stroke-width="1"/>
<text x="28" y="898" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#e0d8cb">Do not add across periods or infer a debt to heirs.</text>
<text x="28" y="919" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#aeb8b8">Sources [71][72][74][75] · © Final Vestige Studios · 2026</text>
</svg>
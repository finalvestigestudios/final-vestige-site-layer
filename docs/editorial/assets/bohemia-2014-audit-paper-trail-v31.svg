<text x="48" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#77582b" letter-spacing="2">FINAL VESTIGE / EVIDENCE NOTE 31</text>
<text x="48" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#202a30">The audit reached the board.</text>
<text x="48" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#39474d">The case ledger is still missing.</text>

<title id="title">The 2014 audit reached the board; the missing case-level ledger did not reach the research file</title>
<desc id="desc">Timeline: fiscal 2013 combined judgments 21,182,620 dollars; October 2, 2014 the audit was presented to the finance committee; October 16 the board received the fiscal 2014 audit and management discussion; fiscal 2015 report retrospectively named an unspecified settlement-reduction gain in 2014. None of these records identifies a Bohemia claimant payment.</desc>

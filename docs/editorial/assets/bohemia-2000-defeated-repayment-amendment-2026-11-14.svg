<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 930" role="img" aria-labelledby="title desc">
<title id="title">The Bohemia repayment proposal defeated in the Louisiana House, May 24, 2000</title>
<desc id="desc">An original editorial graphic describing a proposed, rejected amendment to House Bill 221. It would have directed up to three million dollars annually in some riverboat franchise fees to Bohemia claims: 14.18 percent toward Vogt and Edgecombe and 85.82 percent toward Haspel and Davis. The House rejected the amendment by 36 yeas to 66 nays. No fund or payment is established by the rejected amendment.</desc>
<rect width="780" height="930" fill="#111a24"/>
<rect x="32" y="30" width="716" height="870" rx="17" fill="#172331" stroke="#54606a" stroke-width="2"/>
<rect x="55" y="60" width="7" height="69" fill="#be9760"/>
<text x="82" y="86" fill="#c9a777" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2">THE BOHEMIA FILES</text>
<text x="82" y="130" fill="#f5f2e8" font-family="Georgia,serif" font-size="39" font-weight="700">A proposed way to pay</text>
<text x="82" y="178" fill="#f5f2e8" font-family="Georgia,serif" font-size="39" font-weight="700">the judgments</text>
<text x="57" y="221" fill="#bfcad1" font-family="Arial,sans-serif" font-size="21">May 24, 2000 · Louisiana House</text>
<rect x="55" y="250" width="670" height="100" rx="9" fill="#243748"/>
<text x="78" y="284" fill="#f5f2e8" font-family="Arial,sans-serif" font-size="22" font-weight="700">THE PROPOSED DEDICATION</text>
<text x="78" y="329" fill="#dec392" font-family="Arial,sans-serif" font-size="41" font-weight="700">Up to $3 million / year</text>
<text x="57" y="389" fill="#cbd5db" font-family="Arial,sans-serif" font-size="21">Proposed allocation of qualifying riverboat</text>
<text x="57" y="420" fill="#cbd5db" font-family="Arial,sans-serif" font-size="21">franchise-fee receipts, subject to appropriation</text>
<rect x="57" y="455" width="95" height="38" fill="#c6a574"/>
<rect x="152" y="455" width="571" height="38" fill="#6e91a4"/>
<text x="58" y="530" fill="#e7d0aa" font-family="Arial,sans-serif" font-size="31" font-weight="700">14.18%</text>
<text x="58" y="562" fill="#cbd5db" font-family="Arial,sans-serif" font-size="20">Vogt / Edgecombe</text>
<text x="412" y="530" fill="#dde8ee" font-family="Arial,sans-serif" font-size="31" font-weight="700">85.82%</text>
<text x="412" y="562" fill="#cbd5db" font-family="Arial,sans-serif" font-size="20">Haspel &amp; Davis</text>
<path d="M57 602 H723" stroke="#566574" stroke-width="2"/>
<text x="58" y="652" fill="#f5f2e8" font-family="Arial,sans-serif" font-size="22" font-weight="700">THE RECORDED HOUSE VOTE</text>
<text x="57" y="719" fill="#c6a574" font-family="Arial,sans-serif" font-size="55" font-weight="700">36</text>
<text x="152" y="717" fill="#cbd5db" font-family="Arial,sans-serif" font-size="25">yeas</text>
<text x="411" y="719" fill="#d9a7a0" font-family="Arial,sans-serif" font-size="55" font-weight="700">66</text>
<text x="506" y="717" fill="#cbd5db" font-family="Arial,sans-serif" font-size="25">nays</text>
<rect x="56" y="747" width="667" height="71" rx="9" fill="#4b2d32"/>
<text x="77" y="776" fill="#ffe7e4" font-family="Arial,sans-serif" font-size="24" font-weight="700">AMENDMENT REJECTED</text>
<text x="77" y="802" fill="#f0c7c4" font-family="Arial,sans-serif" font-size="17">A proposal, not a funded account or proof of payment</text>
<text x="56" y="852" fill="#aebac3" font-family="Arial,sans-serif" font-size="16">Source: Louisiana House Official Journal, 24 May 2000, p. 9.</text>

    <p style="margin:10px 0 0;line-height:1.55;font-size:1rem;color:#cad4d0">What the judicial record confirms about the money raised in the wake of the deliberate Caernarvon levee breach.</p>

      <strong style="display:block;color:#f5ede1;margin:6px 0;font-size:1.03rem">The levee is cut</strong>
      <p style="color:#d4ded9;font-size:.96rem;line-height:1.55;margin:0">Authorities deliberately breach the embankment on April 29. Downriver property damage becomes the subject of a state reparation promise.</p>
    </li>

      <time datetime="1928" style="display:block;color:#e5bb7d;font-size:1.45rem;font-family:Georgia,serif">1928</time>
      <strong style="display:block;color:#f5ede1;margin:6px 0;font-size:1.03rem">Payment machinery</strong>
      <p style="color:#d4ded9;font-size:.96rem;line-height:1.55;margin:0">Voters adopt a constitutional reparation provision. A special tax and bond authority are created; individual claims remain subject to legal limits.</p>
    </li>
    <li style="border:1px solid #3b5a57;border-top:3px solid #e5bb7d;border-radius:11px;padding:17px 15px;background:#1c3033;min-width:0">
      <time datetime="1937-01-15" style="display:block;color:#e5bb7d;font-size:1.45rem;font-family:Georgia,serif">1937</time>
      <strong style="display:block;color:#f5ede1;margin:6px 0;font-size:1.03rem">$3.387 million</strong>
      <p style="color:#d4ded9;font-size:.96rem;line-height:1.55;margin:0">The court upholds reparation-bond refinancing. Its opinion expressly says the special tax <em>had been collected</em>; it gives no annual tax-roll series.</p>
    </li>

      <p style="color:#d4ded9;font-size:.96rem;line-height:1.55;margin:0">The Supreme Court recounts annual collection for the special bonds and refuses to accept a constitutional measure that would jeopardize their security.</p>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway: 2005 financing decision and 2006 audited disclosures</title>
<desc id="desc">Four source-derived checkpoints: August 17, 2005 funding authorization; August 29 Hurricane Katrina and subsequent financial interruption reported by the district; June 30, 2006 restricted Bohemia escrow balance of 339,407 dollars; and the same annual report's inconsistent 391,566-dollar management-discussion figure. Approval, reserve and payment are not interchangeable.</desc>
<rect width="720" height="940" fill="#10232e"/>
<rect x="30" y="30" width="660" height="880" rx="18" fill="#f5f2e9"/>
<text x="60" y="92" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#50616a" letter-spacing="1.4">FINAL VESTIGE · DOCUMENTARY CHRONOLOGY</text>
<text x="60" y="144" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#172e3c">A funding plan</text>
<text x="60" y="187" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#172e3c">meets a disaster</text>
<text x="60" y="224" font-family="Arial,sans-serif" font-size="18" fill="#50616a">What the Orleans Levee District reported, 2005–2006</text>
<path d="M87 277 L87 680" stroke="#ab7851" stroke-width="4" stroke-linecap="round"/>
<circle cx="87" cy="290" r="11" fill="#ab7851"/>
<circle cx="87" cy="414" r="11" fill="#ab7851"/>
<circle cx="87" cy="538" r="11" fill="#ab7851"/>
<circle cx="87" cy="658" r="11" fill="#ab7851"/>
<g font-family="Arial,sans-serif" fill="#172e3c">
<text x="120" y="289" font-size="21" font-weight="700">17 AUG 2005</text>
<text x="120" y="321" font-size="21">Board authorized settlement financing</text>
<text x="120" y="346" font-size="17" fill="#50616a">Authorization is not a completed payment.</text>
<text x="120" y="413" font-size="21" font-weight="700">29 AUG 2005</text>
<text x="120" y="445" font-size="21">Hurricane Katrina struck the Gulf Coast</text>
<text x="120" y="470" font-size="17" fill="#50616a">District later reported financing impractical.</text>
<text x="120" y="538" font-size="21" font-weight="700">30 JUN 2006</text>
<text x="120" y="570" font-size="21">$339,407 Bohemia escrow reserve</text>
<text x="120" y="595" font-size="17" fill="#50616a">Financial-statement notes 11 and 14.</text>
<text x="120" y="657" font-size="21" font-weight="700">REPORT DISCREPANCY</text>
<text x="120" y="688" font-size="21">$391,566 in management discussion</text>
<text x="120" y="714" font-size="17" fill="#50616a">Different figure; reconciliation not supplied.</text>
</g>
<rect x="60" y="746" width="600" height="72" rx="9" fill="#e0e8e8"/>
<text x="78" y="776" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172e3c">Authority ≠ financing ≠ reserve ≠ receipt</text>
<text x="78" y="801" font-family="Arial,sans-serif" font-size="15" fill="#50616a">Neither figure identifies an individual beneficiary.</text>
<text x="60" y="849" font-family="Arial,sans-serif" font-size="15" fill="#50616a">Source: FY2006 Orleans Levee District financial report,</text>
<text x="60" y="870" font-family="Arial,sans-serif" font-size="15" fill="#50616a">printed pp. 4, 10, 45, 49, 53–54. © FV Studios 2026.</text>
</svg>
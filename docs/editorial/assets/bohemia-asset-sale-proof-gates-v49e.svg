<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="656" viewBox="0 0 1280 656" role="img" aria-labelledby="fv-title fv-desc">
<title id="fv-title">The 80–20 law is not a payment receipt: a three-gate record test</title>
<desc id="fv-desc">Original Final Vestige Studios document analysis. Louisiana Revised Statutes 38:330.12 subsection B(2) presents three checkpoints: the non-flood property is offered to eligible public entities before sale or lease; a qualifying sale or transfer is documented for full consideration; the proceeds are allocated 80 percent to the authority and 20 percent to the Haspel and Davis class within 30 days. Separate claimant-level proof would still be needed to establish distribution. Subsection C treats ongoing operating revenues differently. The diagram illustrates legal text, not an observed asset sale.</desc>
<metadata>Creator: Final Vestige Studios Investigations Publishing Studio; created November 16, 2026; copyright © 2026 Final Vestige Studios, all rights reserved; original first-party vector diagram (not a historical photograph or AI reconstruction). Primary source: https://www.legis.la.gov/legis/Law.aspx?d=366228 sections B(2), C; cross-check Louisiana 2011 Act 363 https://www.legis.la.gov/Legis/ViewDocument.aspx?d=760740. Purpose: research illustration of conditional statutory sequence, not legal advice or proof of compliance, an asset transfer, or payment. Unverified: closing, price, remittance, ultimate claimant receipts.</metadata>

<text x="89" y="503" fill="#f3ddbd" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Separate question: did the money reach an individual beneficiary?</text>
<text x="89" y="537" fill="#dce7ed" font-family="Arial,sans-serif" font-size="19">A statutory allocation is not a bank debit, class distribution ledger, or a cleared heir receipt.</text>
<text x="65" y="599" fill="#a8c3cf" font-family="Arial,sans-serif" font-size="16">Subsection C treats ongoing operating revenues separately · Diagram of legal text, not a documented transaction</text>

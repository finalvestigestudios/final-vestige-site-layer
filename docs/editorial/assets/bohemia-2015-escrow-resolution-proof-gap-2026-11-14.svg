<svg xmlns="http://www.w3.org/2000/svg" width="390" height="740" viewBox="0 0 390 740" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway escrow: three institutional steps and the missing payment proof</title>
<desc id="desc">The 2015 flood authority minutes recite the 1997 escrow law, the 1998 board account instruction, and show an eight-to-zero 2015 vote authorizing closure and transfer of the remaining balance. A transfer receipt, final balance and beneficiary distribution schedule were not in the minutes.</desc>
<rect width="390" height="740" fill="#14212a"/>
<rect x="22" y="26" width="3" height="50" rx="1.5" fill="#d2ae6b"/>
<text x="38" y="43" fill="#d2ae6b" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="2">FINAL VESTIGE / EVIDENCE</text>
<text x="38" y="69" fill="#f8f4eb" font-family="Georgia, serif" font-size="24">The escrow trail</text>
<text x="22" y="101" fill="#c9d3d7" font-family="Arial, sans-serif" font-size="13">Three recorded steps. One missing receipt.</text>
<line x1="39" y1="133" x2="39" y2="594" stroke="#7a8c93" stroke-width="2" stroke-dasharray="4 7" opacity="0.72"/>
<g font-family="Arial, sans-serif">
<circle cx="39" cy="158" r="8" fill="#d2ae6b"/>
<rect x="63" y="126" width="301" height="126" rx="10" fill="#20323e" stroke="#52636b"/>
<text x="79" y="151" fill="#d2ae6b" font-size="11" font-weight="bold" letter-spacing="1.5">1997 · RECITED IN 2015 MINUTES</text>
<text x="79" y="178" fill="#f8f4eb" font-family="Georgia, serif" font-size="20">Escrow requirement</text>
<text x="79" y="199" fill="#dfe7e9" font-size="13">Act 1364 directed disputed-property</text>
<text x="79" y="218" fill="#dfe7e9" font-size="13">revenues into escrow pending a</text>
<text x="79" y="237" fill="#dfe7e9" font-size="13">final court determination.</text>
<circle cx="39" cy="299" r="8" fill="#d2ae6b"/>
<rect x="63" y="269" width="301" height="119" rx="10" fill="#20323e" stroke="#52636b"/>
<text x="79" y="293" fill="#d2ae6b" font-size="11" font-weight="bold" letter-spacing="1.5">1998 · RECITED IN 2015 MINUTES</text>
<text x="79" y="320" fill="#f8f4eb" font-family="Georgia, serif" font-size="20">Account instruction</text>
<text x="79" y="342" fill="#dfe7e9" font-size="13">A July 15 board resolution directed</text>
<text x="79" y="361" fill="#dfe7e9" font-size="13">an escrow account and matching</text>
<text x="79" y="380" fill="#dfe7e9" font-size="13">reserve against fund balance.</text>
<circle cx="39" cy="435" r="8" fill="#d2ae6b"/>
<rect x="63" y="405" width="301" height="126" rx="10" fill="#20323e" stroke="#d2ae6b"/>
<text x="79" y="429" fill="#d2ae6b" font-size="11" font-weight="bold" letter-spacing="1.5">2015 · RECORDED BOARD VOTE</text>
<text x="79" y="455" fill="#f8f4eb" font-family="Georgia, serif" font-size="20">Closure authorized</text>
<text x="79" y="477" fill="#dfe7e9" font-size="13">March 19 resolution 03-19-15-12</text>
<text x="79" y="496" fill="#dfe7e9" font-size="13">passed 8–0, authorizing transfer</text>
<text x="79" y="515" fill="#dfe7e9" font-size="13">of the remaining balance.</text>
<circle cx="39" cy="579" r="8" fill="#e3b597"/>
<rect x="63" y="548" width="301" height="104" rx="10" fill="#302d30" stroke="#a47865"/>
<text x="79" y="572" fill="#e3b597" font-size="11" font-weight="bold" letter-spacing="1.2">NOT DOCUMENTED IN THESE MINUTES</text>
<text x="79" y="598" fill="#f8f4eb" font-family="Georgia, serif" font-size="18">Execution and payouts</text>
<text x="79" y="620" fill="#eee2db" font-size="13">No bank receipt, final amount or</text>
<text x="79" y="639" fill="#eee2db" font-size="13">claimant-by-claimant payment list.</text>
</g>
<line x1="22" y1="676" x2="368" y2="676" stroke="#45565c"/>
<text x="22" y="697" fill="#c9d3d7" font-family="Arial, sans-serif" font-size="11">Source: SLFPA–East, March 19, 2015, pp. 24–25.</text>

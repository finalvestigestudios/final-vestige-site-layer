<g font-family="Arial,sans-serif"><text x="66" y="385" fill="#f0eadf" font-size="23">First rehearing</text><text x="66" y="413" fill="#b9b9ac" font-size="16">February 20, 1956</text><rect x="462" y="359" width="282" height="24" rx="4" fill="#353a34"/><rect x="462" y="359" width="251" height="24" rx="4" fill="#c8a772"/><text x="462" y="412" fill="#f0eadf" font-size="20">8/48</text><rect x="792" y="359" width="268" height="24" rx="4" fill="#353a34"/><rect x="792" y="359" width="30" height="24" rx="4" fill="#95a99d"/><text x="792" y="412" fill="#f0eadf" font-size="20">1/48</text></g>
<g font-family="Arial,sans-serif"><text x="66" y="490" fill="#f0eadf" font-size="23">Final corrected decree</text><text x="66" y="518" fill="#b9b9ac" font-size="16">November 21, 1956 · six wells</text><rect x="462" y="464" width="282" height="24" rx="4" fill="#353a34"/><rect x="462" y="464" width="282" height="24" rx="4" fill="#c8a772"/><text x="462" y="517" fill="#f0eadf" font-size="20">9/48 (3/16)</text><rect x="792" y="464" width="268" height="24" rx="4" fill="#353a34"/><text x="792" y="517" fill="#f0eadf" font-size="20">0 · dismissed</text></g>

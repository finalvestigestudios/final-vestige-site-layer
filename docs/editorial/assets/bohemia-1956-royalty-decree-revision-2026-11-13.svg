<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">The 1955–1956 Bohemia royalty judgment changed on rehearing</title>
<desc id="desc">In the original June 1955 ruling, Orleans received six forty-eighths and Delta one forty-eighth of a disputed 55-percent royalty-proceeds share. First rehearing awarded Orleans eight forty-eighths and Delta one forty-eighth. The final November 21, 1956 amended decree awarded Orleans nine forty-eighths and dismissed Delta's claim, and corrected the well count from four to six. These are court allocations, not actual payment receipts.</desc>

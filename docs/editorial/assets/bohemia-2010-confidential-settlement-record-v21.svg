<title id="title">Two settlements appear in the public minutes, but not their payment schedules</title>
<desc id="desc">April 15, 2010 board minutes ratified a settlement connected with Tract 22-B inside the Bohemia Spillway and a separate agreement involving leases near the spillway. Both resolutions allowed the agreements' terms to remain confidential. The public votes establish ratification, not dollars paid or beneficiary receipts.</desc>

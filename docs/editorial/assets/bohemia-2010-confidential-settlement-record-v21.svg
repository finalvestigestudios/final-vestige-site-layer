<text x="52" y="182" fill="#f4f1e8" font-family="Georgia,serif" font-weight="bold" font-size="42">Private terms.</text>
<text x="52" y="226" fill="#adbdc9" font-family="Arial,sans-serif" font-size="24">Flood Protection Authority · April 15, 2010</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1170" viewBox="0 0 960 1170" role="img" aria-labelledby="title desc">
<title id="title">A settlement vote after the financial year closed</title>
<desc id="desc">Original Final Vestige Studios source-derived timeline. Fiscal 2014 ended June 30, 2014. On July 24, 2014, five flood authority commissioners approved counsel proceeding with an offer in three named litigation dockets, with none voting against and three absent. The board vote supplies no settlement amount, signed contract or claimant receipt, and cannot alone reconcile the earlier fiscal-year liability.</desc>
<rect width="960" height="1170" fill="#111719"/>
<rect x="28" y="28" width="904" height="1114" rx="18" fill="#171f20" stroke="#a88b55" stroke-width="2"/>
<text x="65" y="91" font-family="Georgia,serif" font-size="24" fill="#c9b184" letter-spacing="3">FINAL VESTIGE / EVIDENCE GRAPHIC 37</text>
<text x="65" y="158" font-family="Georgia,serif" font-size="46" fill="#f2ede3">The vote came after</text>
<text x="65" y="212" font-family="Georgia,serif" font-size="46" fill="#f2ede3">the books closed.</text>
<text x="65" y="265" font-family="Arial,sans-serif" font-size="24" fill="#c4c9c6">Three dates, three different kinds of record</text>
<line x1="128" y1="333" x2="128" y2="832" stroke="#a88b55" stroke-width="5"/>
<circle cx="128" cy="369" r="15" fill="#a88b55"/>
<rect x="175" y="326" width="716" height="170" rx="12" fill="#24302f"/>
<text x="198" y="371" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#efdbb7">JUNE 30, 2014</text>
<text x="198" y="407" font-family="Arial,sans-serif" font-size="24" fill="#f2ede3">Fiscal 2014 ends</text>
<text x="198" y="443" font-family="Arial,sans-serif" font-size="21" fill="#c4c9c6">Financial statements must be read on</text>
<text x="198" y="472" font-family="Arial,sans-serif" font-size="21" fill="#c4c9c6">their reporting-period terms.</text>
<circle cx="128" cy="594" r="15" fill="#a88b55"/>
<rect x="175" y="525" width="716" height="209" rx="12" fill="#24302f"/>
<text x="198" y="573" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#efdbb7">JULY 24, 2014</text>
<text x="198" y="608" font-family="Arial,sans-serif" font-size="24" fill="#f2ede3">Settlement offer authorized</text>
<text x="198" y="646" font-family="Arial,sans-serif" font-size="21" fill="#c4c9c6">Resolution 07-24-14-10: 5 yes, 0 no;</text>
<text x="198" y="677" font-family="Arial,sans-serif" font-size="21" fill="#c4c9c6">3 absent. Three court dockets listed.</text>
<text x="198" y="708" font-family="Arial,sans-serif" font-size="21" fill="#c4c9c6">Not an executed settlement or receipt.</text>
<circle cx="128" cy="810" r="15" fill="#a88b55"/>
<rect x="175" y="758" width="716" height="129" rx="12" fill="#24302f"/>
<text x="198" y="802" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#efdbb7">OCTOBER 16, 2014</text>
<text x="198" y="846" font-family="Arial,sans-serif" font-size="23" fill="#f2ede3">FY2014 audit presented to the board</text>
<rect x="65" y="915" width="830" height="125" rx="11" fill="#302923" stroke="#a88b55"/>
<text x="91" y="955" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#f3ddb4">WHAT THIS DOES NOT ESTABLISH</text>
<text x="91" y="991" font-family="Arial,sans-serif" font-size="20" fill="#f2ede3">No signed agreement, amount paid, beneficiary</text>
<text x="91" y="1019" font-family="Arial,sans-serif" font-size="20" fill="#f2ede3">distribution, or FY2014 journal entry is shown.</text>
<text x="65" y="1087" font-family="Arial,sans-serif" font-size="17" fill="#adb8b4">Source: SLFPA-East board minutes, July 24, 2014, printed p. 13;</text>
<text x="65" y="1114" font-family="Arial,sans-serif" font-size="17" fill="#adb8b4">October 16, 2014 minutes. Original graphic © Final Vestige Studios 2026.</text>
</svg>
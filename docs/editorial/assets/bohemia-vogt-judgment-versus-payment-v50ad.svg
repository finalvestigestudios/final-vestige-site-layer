<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" viewBox="0 0 560 940" width="560" height="940" role="img" aria-labelledby="t d">
<title id="t">Bohemia Spillway: a judgment, a bookkeeping designation, and two appellate routes, 1998–2002</title>
<desc id="d">Original Final Vestige Studios evidence diagram. July 24, 1998: judgment for 2,853,358 dollars and 44 cents plus interest in the Vogt and Edgecombe litigation. June 30, 2000: court-reported accountant testimony identified approximately 2.7 million dollars earmarked in bookkeeping for Bohemia litigation, not a claimant payment or necessarily the later 2015 escrow. March 27, 2002: Louisiana Fourth Circuit upheld denial of seizure and mandamus. June 14, 2002: federal Fifth Circuit reversed dismissal of a related takings claim and remanded without ordering payment. These are distinct procedural events and do not prove that a claimant was paid.</desc>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about=""><dc:title>Bohemia Spillway: a judgment is not a bank credit</dc:title><dc:creator>Final Vestige Studios</dc:creator><dc:date>2026-11-18</dc:date><dc:rights>Copyright 2026 Final Vestige Studios. Original editorial evidence diagram. All rights reserved.</dc:rights><dc:source>https://cases.justia.com/louisiana/fourth-circuit-court-of-appeal/2002-2001-ca-0089.pdf?ts=1440795651</dc:source><dc:source>https://law.justia.com/cases/federal/appellate-courts/F3/294/684/545697/</dc:source><dc:description>Not a scan, photograph, title map, AI reconstruction, receipt, or allegation of missing funds.</dc:description></rdf:Description></rdf:RDF></metadata>
<rect width="560" height="940" rx="16" fill="#0f1724"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="30" y="50" font-size="15" font-weight="700" fill="#d7b778" letter-spacing="1.5">FINAL VESTIGE / EVIDENCE CHAIN</text>
<text x="30" y="91" font-size="29" font-weight="700" fill="#f7f4ee">A judgment is not</text><text x="30" y="126" font-size="29" font-weight="700" fill="#f7f4ee">a bank credit.</text>
<text x="30" y="160" font-size="16" fill="#c4cfda">The Vogt / Edgecombe case, 1998–2002</text>
<rect x="28" y="189" width="504" height="149" rx="10" fill="#1a2b3d" stroke="#466076"/>
<text x="47" y="217" font-size="15" font-weight="700" fill="#d7b778">01  ·  JULY 24, 1998</text>
<text x="47" y="260" font-size="28" font-weight="700" fill="#fff">Judgment: $2,853,358.44</text>
<text x="47" y="289" font-size="17" fill="#e0e7ee">Plus judicial interest; a court finding,</text>
<text x="47" y="312" font-size="17" fill="#e0e7ee">not a cleared transfer to claimants.</text>
<path d="M280 339 V357" stroke="#d7b778" stroke-width="2"/>
<rect x="28" y="358" width="504" height="178" rx="10" fill="#1a2b3d" stroke="#466076"/>
<text x="47" y="386" font-size="15" font-weight="700" fill="#d7b778">02  ·  AS OF JUNE 30, 2000</text>
<text x="47" y="428" font-size="24" font-weight="700" fill="#fff">Book earmark: ~$2.7 million</text>
<text x="47" y="460" font-size="16" fill="#e0e7ee">Recorded in expert testimony as “held</text>
<text x="47" y="482" font-size="16" fill="#e0e7ee">for Bohemia litigation” within a larger</text>
<text x="47" y="504" font-size="16" fill="#e0e7ee">investment account; not a payout.</text>
<path d="M280 538 V556" stroke="#d7b778" stroke-width="2"/>
<rect x="28" y="557" width="504" height="135" rx="10" fill="#1a2b3d" stroke="#466076"/>
<text x="47" y="584" font-size="15" font-weight="700" fill="#d7b778">03  ·  MARCH 27, 2002</text>
<text x="47" y="620" font-size="22" font-weight="700" fill="#fff">Louisiana appellate court</text>
<text x="47" y="650" font-size="16" fill="#e0e7ee">Seizure and mandamus denied;</text>
<text x="47" y="673" font-size="16" fill="#e0e7ee">underlying judgment not erased.</text>
<path d="M280 694 V712" stroke="#d7b778" stroke-width="2"/>
<rect x="28" y="713" width="504" height="137" rx="10" fill="#1a2b3d" stroke="#466076"/>
<text x="47" y="741" font-size="15" font-weight="700" fill="#d7b778">04  ·  JUNE 14, 2002</text>
<text x="47" y="776" font-size="22" font-weight="700" fill="#fff">Federal appellate court</text>
<text x="47" y="807" font-size="16" fill="#e0e7ee">Dismissal reversed; remanded for</text>
<text x="47" y="829" font-size="16" fill="#e0e7ee">further proceedings, no payment order.</text>
<text x="30" y="884" font-size="14" fill="#dce3eb">Distinct litigants from Eusan Tract 78.</text>
<text x="30" y="907" font-size="12" fill="#aebdcd">Original FV diagram · © 2026 · Primary appellate opinions [54–55]</text>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1300" viewBox="0 0 780 1300" role="img" aria-labelledby="title desc">
<title id="title">The claim was not the deed: historical Bohemia Spillway application process</title>
<desc id="desc">Five steps described by Louisiana regulations compiled in 2002: public notice and owner lists; 180-day application period; check against 1925 owner records and 70-day amendment opportunity; 175-dollar advance processing deposit with an indigency review option; and special-master certification. These regulations were repealed in 2008 and are not current filing guidance.</desc>
<rect x="0" y="0" width="780" height="1300" fill="#111512"/>
<rect x="32" y="32" width="716" height="1236" rx="10" fill="#171d19" stroke="#555a47" stroke-width="2"/>
<text x="64" y="85" font-family="Arial,sans-serif" font-size="21" letter-spacing="3" fill="#ceb17d">FINAL VESTIGE / DOCUMENTARY EVIDENCE</text>
<text x="64" y="150" font-family="Georgia,serif" font-size="48" fill="#f1eee7">The claim was</text>
<text x="64" y="205" font-family="Georgia,serif" font-size="48" fill="#f1eee7">not the deed.</text>
<text x="64" y="246" font-family="Arial,sans-serif" font-size="24" fill="#bfc7b6">BOHEMIA SPILLWAY · HISTORICAL PROCEDURE</text>
<line x1="64" x2="716" y1="268" y2="268" stroke="#756744" stroke-width="2"/>
<rect x="64" y="290" width="652" height="146" rx="8" fill="#222a23" stroke="#485749"/>
<text x="88" y="333" font-family="Georgia,serif" font-size="39" fill="#d9b980">01</text>
<text x="159" y="332" font-family="Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="1" fill="#f2efe6">NOTICE</text>
<text x="159" y="373" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">Newspaper notice. Original-owner lists available</text>
<text x="159" y="402" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">at designated parish libraries and public offices.</text>
<rect x="64" y="454" width="652" height="146" rx="8" fill="#222a23" stroke="#485749"/>
<text x="88" y="497" font-family="Georgia,serif" font-size="39" fill="#d9b980">02</text>
<text x="159" y="496" font-family="Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="1" fill="#f2efe6">APPLICATION</text>
<text x="159" y="537" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">Historical rule: file within 180 days of final</text>
<text x="159" y="566" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">notice publication.</text>
<rect x="64" y="618" width="652" height="146" rx="8" fill="#222a23" stroke="#485749"/>
<text x="88" y="661" font-family="Georgia,serif" font-size="39" fill="#d9b980">03</text>
<text x="159" y="660" font-family="Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="1" fill="#f2efe6">DOCUMENT CHECK</text>
<text x="159" y="701" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">Check the 1925 roster or other acquisition records.</text>
<text x="159" y="730" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">Rejected claims could be amended within 70 days.</text>
<rect x="64" y="782" width="652" height="146" rx="8" fill="#222a23" stroke="#485749"/>
<text x="88" y="825" font-family="Georgia,serif" font-size="39" fill="#d9b980">04</text>
<text x="159" y="824" font-family="Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="1" fill="#f2efe6">COST REVIEW</text>
<text x="159" y="865" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">$175 advance deposit; indigency review available.</text>
<text x="159" y="894" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">Costs could still remain due.</text>
<rect x="64" y="946" width="652" height="146" rx="8" fill="#222a23" stroke="#485749"/>
<text x="88" y="989" font-family="Georgia,serif" font-size="39" fill="#d9b980">05</text>
<text x="159" y="988" font-family="Arial,sans-serif" font-size="28" font-weight="bold" letter-spacing="1" fill="#f2efe6">CERTIFICATION</text>
<text x="159" y="1029" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">A special master assessed the claim. This was</text>
<text x="159" y="1058" font-family="Arial,sans-serif" font-size="23" fill="#c8cfc1">not itself a recorded deed or a royalty payment.</text>
<rect x="64" y="1124" width="652" height="60" rx="5" fill="#473329"/>
<text x="82" y="1162" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#f5d6b3">REPEALED IN 2008 · NOT CURRENT GUIDANCE</text>
<text x="64" y="1221" font-family="Arial,sans-serif" font-size="19" fill="#b4bbb0">Sources: Louisiana Administrative Code (Dec. 2002), Ch. 13;</text>
<text x="64" y="1248" font-family="Arial,sans-serif" font-size="19" fill="#b4bbb0">Louisiana Register (Feb. 20, 2008) · © Final Vestige Studios</text>
</svg>

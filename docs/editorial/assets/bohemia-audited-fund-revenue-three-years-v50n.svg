<title id="fvtitle">Three audited years, one broad revenue category: 2023, 2024 and 2025</title>
<desc id="fvdesc">Horizontal, zero-origin stacked bars show the Flood Protection Authority-East fiscal 2023 OLD General Fund royalties, leases and permits of $749,501, fiscal 2024 OLD $38,989 and LMA OLD Real Estate $46,497, total $85,486, and fiscal 2025 OLD $63,279 and LMA OLD Real Estate $106,377, total $169,656. Not Bohemia-specific royalty data. No cause or claimant disbursement can be inferred.</desc>
<metadata>Original chart © 2026 Final Vestige Studios, created November 18, 2026. Author: Final Vestige Studios. Original vector analysis, not a historical photo or a survey; may be reproduced on Final Vestige with source credit. Primary source FY2023 https://app.lla.state.la.us/PublicReports.nsf/0/7C1A721A298CB70786258A6D00711AD7/$FILE/00003310.pdf printed p.16; FY2024 https://app.lla.state.la.us/PublicReports.nsf/0/AB3139C8E769CB7086258BB700789609/$FILE/0000619F.pdf printed p.16; FY2025 https://app.lla.state.la.us/PublicReports.nsf/0/7A7589E9550859E586258D380070A30B/$FILE/0000906da.pdf printed pp.16 and 59. Underlying numbers are governmental-fund financial statement categories; no tract-level ledger or causality. End of each fiscal year June 30.</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1110" viewBox="0 0 780 1110" role="img" aria-labelledby="t d">
<title id="t">The accounting that reached court, Bohemia Spillway, 1997–2002</title>
<desc id="d">Four documentary milestones. A court ordered a property-specific account in May 1997. The levee board subsequently produced an account totaling 2,853,358.44 dollars. A July 1998 judgment allocated claimants' fractional ownership shares. The June 1999 appeal affirmed the judgment. The 2002 federal appeal described the collection dispute. The aggregate accounting is not proof of all claimants' entitlements or payment.</desc>

 <text x="138" y="820" font-size="25" font-weight="700" fill="#d8b278">1999 / 2002 · DIFFERENT APPEALS</text>
 <text x="138" y="865" font-size="23" fill="#f7f2ea">State judgment affirmed in 1999</text>

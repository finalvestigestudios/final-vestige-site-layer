 <circle cx="93" cy="467" r="15" fill="#d8b278"/>
 <text x="138" y="478" font-size="25" font-weight="700" fill="#d8b278">AFTER ORDER · ACCOUNT PRODUCED</text>
 <text x="138" y="523" font-size="36" font-weight="700" fill="#f7f2ea">$2,853,358.44</text>
 <text x="138" y="557" font-size="21" fill="#bacacf">Aggregate disputed-property revenues</text>
 <rect x="48" y="610" rx="12" width="684" height="151" fill="#162c37" stroke="#3e5e69"/>
 <circle cx="93" cy="646" r="15" fill="#d8b278"/>
 <text x="138" y="654" font-size="25" font-weight="700" fill="#d8b278">JULY 24, 1998 · REVISED JUDGMENT</text>
 <text x="138" y="702" font-size="25" fill="#f7f2ea">Allocate by owners' fractional shares</text>
 <text x="138" y="736" font-size="20" fill="#bacacf">Unrepresented co-owners are distinct</text>

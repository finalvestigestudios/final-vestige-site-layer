<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
<title id="title">The Taylor succession: principal, interest, and legal fees were decided separately</title>
<desc id="desc">A studio-original source-derived diagram of the Bohemia Spillway Taylor succession litigation. The parties stipulated 166,842 dollars and 53 cents principal in 2003, while the trial judgment says 166,842 dollars and 50 cents. Investment-return interest applies July 1, 1991 through July 1, 1993; legal interest from July 2, 1993 until paid. The April 6, 2005 appellate court affirmed interest but reversed attorneys' fees. This is a ruling, not evidence of actual disbursement. Source: Louisiana Fourth Circuit case 2004-CA-0358, mirrored at cases.justia.com.</desc>
<metadata>Original editorial diagram by Final Vestige Studios, November 15, 2026. Source: https://cases.justia.com/louisiana/fourth-circuit-court-of-appeal/2005-2004-ca-0358.pdf?ts=1437512407. Copyright 2026 Final Vestige Studios. No archival photo or AI reconstruction. Diagram does not establish payment.</metadata>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Two Bohemia escrows, two different purposes</title>
<desc id="desc">In March 2015, Orleans Levee District commissioners voted to close a mineral-settlement escrow with no closing amount specified in the minutes. Separate Louisiana Department of Natural Resources account 1107, for claimant administrative advance-cost deposits, reported 48,087 dollars and 59 cents in November 2020, September 2021 and November 2021. The figures are not payout amounts and these are not the same accounts.</desc>
<metadata>Created 13 November 2026 by Final Vestige Studios. Original vector evidence diagram. No historical photography, borrowed artwork or AI reconstruction. Sources: Southeast Louisiana Flood Protection Authority-East March 19 2015 minutes Resolution 03-19-15-12; Louisiana Joint Legislative Committee on the Budget Act 361 monthly escrow reports November 2020, September 2021 and November 2021. All values are historical statements, not current balances. Copyright 2026 Final Vestige Studios.</metadata>
<rect width="390" height="844" fill="#111d22"/>
<path d="M24 32h46" stroke="#d9ac70" stroke-width="3" stroke-linecap="round"/>
<text x="24" y="59" font-size="11" letter-spacing="2.2" fill="#d9ac70" font-family="Arial,Helvetica,sans-serif" font-weight="bold">FINAL VESTIGE / EVIDENCE</text>
<text x="24" y="100" font-family="Georgia,serif" font-size="30" fill="#f6ead8">Same name.</text>
<text x="24" y="139" font-family="Georgia,serif" font-size="30" fill="#f6ead8">Different money.</text>
<text x="24" y="164" font-family="Arial,sans-serif" font-size="13" fill="#b7c8c7">Why two Bohemia escrow records</text>
<text x="24" y="182" font-family="Arial,sans-serif" font-size="13" fill="#b7c8c7">must not be combined.</text>

<rect x="18" y="208" width="354" height="229" rx="14" fill="#213237" stroke="#586b6b" stroke-width="1"/>
<text x="36" y="237" fill="#e5b881" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="1.3" font-size="11">MARCH 19, 2015</text>
<text x="36" y="266" fill="#fff1de" font-family="Georgia,serif" font-size="22">Levee district settlement</text>
<text x="36" y="294" fill="#fff1de" font-family="Georgia,serif" font-size="22">escrow</text>
<text x="36" y="326" fill="#e5b881" font-family="Arial,sans-serif" font-weight="bold" font-size="18">8–0 closure vote</text>
<text x="36" y="351" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="13">Board authorized remaining balance</text>
<text x="36" y="370" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="13">to move to district General Fund.</text>
<path d="M36 385H354" stroke="#516466"/>
<text x="36" y="407" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="12">Closing balance and transfer proof</text>
<text x="36" y="423" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="12">not supplied in these minutes.</text>

<circle cx="195" cy="458" r="15" fill="#b98e5e"/>
<text x="195" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#142329">≠</text>

<rect x="18" y="480" width="354" height="261" rx="14" fill="#20343b" stroke="#64828a" stroke-width="1"/>
<text x="36" y="511" fill="#93bdc7" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="1.3" font-size="11">NOV. 2020 / SEPT. + NOV. 2021</text>
<text x="36" y="540" fill="#f4eadb" font-family="Georgia,serif" font-size="22">State DNR claimant</text>
<text x="36" y="567" fill="#f4eadb" font-family="Georgia,serif" font-size="22">administration escrow</text>
<text x="36" y="609" fill="#f5e4c9" font-family="Georgia,serif" font-size="33">$48,087.59</text>
<text x="36" y="634" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="13">Same reported balance at three dates.</text>
<text x="36" y="655" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="13">Account 1107 · agency 431 / org 4311.</text>
<path d="M36 672H354" stroke="#516466"/>
<text x="36" y="694" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="12">Advance fees for reviewing land claims,</text>
<text x="36" y="711" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="12">not the levee district's royalty escrow.</text>
<text x="36" y="727" fill="#cfdbd8" font-family="Arial,sans-serif" font-size="12">Not a verified payout or 2026 balance.</text>

<text x="22" y="770" fill="#e4b984" font-family="Arial,sans-serif" font-size="11" font-weight="bold">THE UNANSWERED QUESTION</text>
<text x="22" y="791" fill="#d1dedd" font-family="Arial,sans-serif" font-size="12">Which deposits, costs and refunds make up</text>
<text x="22" y="806" fill="#d1dedd" font-family="Arial,sans-serif" font-size="12">the DNR account balance? Ledger not inspected.</text>
<text x="22" y="830" fill="#a4b8b6" font-family="Arial,sans-serif" font-size="9">Sources: SLFPA-E minutes (2015); Louisiana JLCB Act 361 reports (2020–21).</text>
</svg>
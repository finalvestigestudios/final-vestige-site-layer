<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1620" viewBox="0 0 960 1620" role="img" aria-labelledby="ttl dscr">
<title id="ttl">The postmarked envelope mattered: Bohemia claim deadlines under the 1990 Louisiana rule</title>
<desc id="dscr">Original Final Vestige Studios documentary diagram. A dated notice controlled different 70-day periods for advance costs and amended claims. Separate indigence review featured a 30-day request and a 70-day paperwork period measured from the later of effective date or notice. A later shortfall assessment typically had 30 days, subject to an indigence deferral before transfer. Historical rules, not proof an individual lost land.</desc>
<rect width="960" height="1620" fill="#122029"/>
<rect x="35" y="35" width="890" height="1550" rx="25" fill="#172b33" stroke="#4a6467" stroke-width="2"/>
<text x="82" y="117" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#d6c398" letter-spacing="4">FINAL VESTIGE  /  DOCUMENT STUDY</text>
<text x="82" y="189" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="53" fill="#f7f1e5">THE ENVELOPE</text>
<text x="82" y="253" font-family="DejaVu Sans,sans-serif" font-weight="bold" font-size="53" fill="#f7f1e5">WAS PART OF THE CASE</text>
<text x="82" y="302" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#c7d1cc">1990 Bohemia claim-processing rule  /  LAC 43:I.1305</text>
<line x1="82" y1="340" x2="878" y2="340" stroke="#c7a36b" stroke-width="4"/>
<rect x="82" y="380" width="796" height="214" rx="20" fill="#233a40" stroke="#5f7371" stroke-width="2"/>
<circle cx="130" cy="433" r="27" fill="#d6c398"/><text x="130" y="445" text-anchor="middle" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#18252a">1</text>
<text x="185" y="446" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#f1ebe1">A mailed notice</text>
<text x="116" y="501" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">Preliminary decision sent with a postmark.</text>
<text x="116" y="537" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">Applicants told to retain the envelope.</text>
<rect x="82" y="620" width="796" height="214" rx="20" fill="#233a40" stroke="#5f7371" stroke-width="2"/>
<circle cx="130" cy="673" r="27" fill="#d6c398"/><text x="130" y="685" text-anchor="middle" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#18252a">2</text>
<text x="185" y="686" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#f1ebe1">The 70-day clocks</text>
<text x="116" y="741" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">$175 advance deposit after notice; rejected</text>
<text x="116" y="777" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">claims could submit an amended application.</text>
<rect x="82" y="860" width="796" height="214" rx="20" fill="#233a40" stroke="#5f7371" stroke-width="2"/>
<circle cx="130" cy="913" r="27" fill="#d6c398"/><text x="130" y="925" text-anchor="middle" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#18252a">3</text>
<text x="185" y="926" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#f1ebe1">A different relief path</text>
<text x="116" y="981" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">Indigence request: 30 days; complete forms:</text>
<text x="116" y="1017" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">70 days, under separate date-trigger rules.</text>
<rect x="82" y="1100" width="796" height="214" rx="20" fill="#233a40" stroke="#5f7371" stroke-width="2"/>
<circle cx="130" cy="1153" r="27" fill="#d6c398"/><text x="130" y="1165" text-anchor="middle" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#18252a">4</text>
<text x="185" y="1166" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#f1ebe1">The later cost assessment</text>
<text x="116" y="1221" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">Shortfall generally due in 30 days; approved</text>
<text x="116" y="1257" font-family="DejaVu Sans" font-size="30" fill="#d8e0dc">indigent claimants could defer before transfer.</text>
<text x="82" y="1386" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#d6c398">THIS IS A RULE, NOT AN INDIVIDUAL CASE FILE.</text>
<text x="82" y="1426" font-family="DejaVu Sans" font-size="25" fill="#c7d1cc">Different deadlines have different triggers and exceptions.</text>
<text x="82" y="1475" font-family="DejaVu Sans" font-size="24" fill="#d5d0c8">SOURCE: Louisiana Register, May 20, 1990, pp. 414–415.</text>
<text x="82" y="1513" font-family="DejaVu Sans" font-size="22" fill="#aebbb6">Original diagram © Final Vestige Studios · November 2026</text>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="776" viewBox="0 0 420 776" role="img" aria-labelledby="title desc">
<title id="title">Who could sue whom? Two federal Bohemia Spillway cases</title>
<desc id="desc">Two distinct Fifth Circuit holdings. In 1988 the Orleans Levee Board could not sue Louisiana for uncompensated taking of spillway land and mineral rights. In 2002 private landowners could sue the levee district because it was not immune as an arm of the state; the ruling did not itself produce payment. Sources: Huls, 852 F.2d 140, and Vogt, 294 F.3d 684.</desc>
<rect width="420" height="776" fill="#10151b"/>
<rect x="13" y="13" width="394" height="750" rx="8" fill="none" stroke="#867252" stroke-width="1"/>
<text x="29" y="49" fill="#c5b79c" font-family="Georgia,serif" font-size="15" letter-spacing="2">FINAL VESTIGE STUDIOS / EVIDENCE</text>
<text x="29" y="88" fill="#f7f1e6" font-family="Georgia,serif" font-size="28">Who could sue whom?</text>
<text x="29" y="117" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15">The same land. Two different legal questions.</text>
<rect x="29" y="143" width="362" height="252" rx="8" fill="#1c2530" stroke="#616d78"/>
<rect x="43" y="157" width="104" height="30" rx="15" fill="#c5a66e"/>
<text x="60" y="179" fill="#0e1720" font-family="Arial,sans-serif" font-size="17" font-weight="bold">1988</text>
<text x="165" y="179" fill="#f8f0df" font-family="Georgia,serif" font-size="21">Huls</text>
<text x="43" y="216" fill="#d9e2ea" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Levee board → Louisiana</text>
<text x="43" y="245" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="16">The board sought compensation</text>
<text x="43" y="269" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="16">for land and mineral interests.</text>
<text x="43" y="302" fill="#e8c987" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Claim rejected</text>
<text x="43" y="329" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15.5">A state agency could not bring</text>
<text x="43" y="351" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15.5">this federal takings claim</text>
<text x="43" y="373" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15.5">against the state.</text>
<path d="M210 397 L210 422" stroke="#c5a66e" stroke-width="2" />
<path d="M203 416 L210 424 L217 416" fill="none" stroke="#c5a66e" stroke-width="2"/>
<rect x="29" y="429" width="362" height="241" rx="8" fill="#1c2530" stroke="#616d78"/>
<rect x="43" y="443" width="104" height="30" rx="15" fill="#c5a66e"/>
<text x="60" y="465" fill="#0e1720" font-family="Arial,sans-serif" font-size="17" font-weight="bold">2002</text>
<text x="165" y="465" fill="#f8f0df" font-family="Georgia,serif" font-size="21">Vogt</text>
<text x="43" y="502" fill="#d9e2ea" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Landowners → levee district</text>
<text x="43" y="531" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="16">Private claimants sought relief</text>
<text x="43" y="555" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="16">for an unpaid judgment.</text>
<text x="43" y="588" fill="#e8c987" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Dismissal reversed</text>
<text x="43" y="615" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15.5">The district was not immune</text>
<text x="43" y="637" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="15.5">under the Eleventh Amendment.</text>
<text x="29" y="699" fill="#f7f1e6" font-family="Arial,sans-serif" font-size="15" font-weight="bold">Neither ruling proves anyone was paid.</text>
<text x="29" y="724" fill="#b2b7bf" font-family="Arial,sans-serif" font-size="12">Sources: 852 F.2d 140 (1988); 294 F.3d 684 (2002).</text>
<text x="29" y="745" fill="#b2b7bf" font-family="Arial,sans-serif" font-size="12">Original diagram © Final Vestige Studios, Nov. 13, 2026</text>
</svg>
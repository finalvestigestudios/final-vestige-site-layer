<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="fv-mardi-desktop-title fv-mardi-desktop-desc"><title id="fv-mardi-desktop-title">Mardi Gras Pass: what was observed, modeled and later surveyed</title><desc id="fv-mardi-desktop-desc">Three source-labeled stages: 2012 breach later documented by NASA, 2020 conditional 20-year Delft3D forecast, and actual 2023 to 2024 field surveys with unchanged average width and minus 0.7 percent mean cross-sectional area. The 2024 observation does not validate the full 20-year forecast.</desc><rect width="1200" height="565" fill="#101b24"/><text x="40" y="51" font-size="17" font-weight="700" letter-spacing="2" fill="#dda95f">FINAL VESTIGE / EVIDENCE NOTE</text><text x="40" y="92" font-size="28" font-weight="700" fill="#f6f1e4">A forecast is not a measurement</text><g><rect x="38" y="119" width="365" height="324" rx="13" fill="#182936" stroke="#355161"/><text x="61" y="169" font-size="37" font-weight="700" fill="#dda95f">2012</text><text x="61" y="201" font-size="12" font-weight="700" letter-spacing=".8" fill="#b1bfbd">OBSERVED / RETROSPECTIVE</text><text x="61" y="250" font-size="21" font-weight="700" fill="#f6f1e4">A new channel opened</text><text x="61" y="305" font-size="15.5" fill="#d2dfdf">NASA dates the breach to February 2012</text><text x="61" y="341" font-size="15.5" fill="#d2dfdf">Satellite comparison: 2007 and 2023</text><line x1="61" x2="380" y1="374" y2="374" stroke="#355161"/><text x="61" y="407" font-size="14" fill="#b1bfbd">NASA Earth Observatory [9]</text></g><g><rect x="423" y="119" width="365" height="324" rx="13" fill="#182936" stroke="#355161"/><text x="446" y="169" font-size="37" font-weight="700" fill="#dda95f">2020</text><text x="446" y="201" font-size="12" font-weight="700" letter-spacing=".8" fill="#b1bfbd">MODELED / CONDITIONAL</text><text x="446" y="250" font-size="21" font-weight="700" fill="#f6f1e4">A river-course forecast</text><text x="446" y="305" font-size="15.5" fill="#d2dfdf">Delft3D study: 20-year scenario</text><text x="446" y="341" font-size="15.5" fill="#d2dfdf">Near-term avulsion not projected</text><line x1="446" x2="765" y1="374" y2="374" stroke="#355161"/><text x="446" y="407" font-size="14" fill="#b1bfbd">Hansen, UNO M.S. thesis [41]</text></g><g><rect x="808" y="119" width="365" height="324" rx="13" fill="#182936" stroke="#355161"/><text x="831" y="169" font-size="37" font-weight="700" fill="#dda95f">2024</text><text x="831" y="201" font-size="12" font-weight="700" letter-spacing=".8" fill="#b1bfbd">OBSERVED / FIELD SURVEY</text><text x="831" y="250" font-size="21" font-weight="700" fill="#f6f1e4">One year of modest change</text><text x="831" y="305" font-size="15.5" fill="#d2dfdf">Mean width: 263 ft in 2023 and 2024</text><text x="831" y="341" font-size="15.5" fill="#d2dfdf">Mean cross-section: down 0.7%</text><line x1="831" x2="1150" y1="374" y2="374" stroke="#355161"/><text x="831" y="407" font-size="14" fill="#b1bfbd">Pontchartrain Conservancy [39]</text></g><text x="40" y="488" font-size="16" font-weight="700" fill="#f6f1e4">The essential limitation</text><text x="40" y="515" font-size="15" fill="#d2dfdf">One observed year cannot verify a 20-year modeled scenario. These records ask different questions.</text><text x="40" y="546" font-size="12" fill="#b1bfbd">Original diagram: Final Vestige Studios, 2026. Sources: NASA [9]; Hansen 2020 [41]; Songy &amp; Hopkins 2024 [39].</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="744" viewBox="0 0 390 744" role="img" aria-labelledby="title desc">
<title id="title">The Bohemia cost-recovery rule outlived two agency names</title>
<desc id="desc">A timeline of the state cost-recovery statute, Louisiana Revised Statutes 30:21.2. The law originated with Act 644 in 1987. The 2023 Act 150 renamed the Department of Natural Resources as the Department of Energy and Natural Resources effective January 10 2024. The department became the Department of Conservation and Energy October 1 2025. The current statute assigns actual claim-administration expenses after final disposition, with apportioned costs deposited in the state treasury. It proves neither an unpaid claim nor the 2026 balance of a 2021 escrow account.</desc>
<metadata>Original evidence diagram by Final Vestige Studios, November 13, 2026. No borrowed images, historical photographs, visual reconstructions or external assets. Sources: Louisiana Legislature R.S. 30:21.2 https://legis.la.gov/legis/Law.aspx?d=87164 ; official 2023 Act 150 legislative digest https://www.legis.la.gov/legis/ViewDocument.aspx?d=1333622 ; Louisiana Department of Conservation and Energy agency statement June 24 2025 https://www.dce.louisiana.gov/news/denr-reorg-bill-sb244-signed-into-law . Copyright 2026 Final Vestige Studios.</metadata>
<rect x="0" y="0" width="390" height="744" fill="#111d22"/>
<path d="M24 30h48" stroke="#d9ac70" stroke-width="3"/>
<text x="24" y="56" fill="#dfb784" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2.1" font-weight="700">FINAL VESTIGE / SOURCE MAP</text>
<text x="24" y="102" fill="#f8eddd" font-family="Georgia,serif" font-size="28">The law outlasted</text>
<text x="24" y="138" fill="#f8eddd" font-family="Georgia,serif" font-size="28">the department's name.</text>
<text x="24" y="163" fill="#bccdcc" font-family="Arial,Helvetica,sans-serif" font-size="13">Bohemia Spillway cost recovery, 1987–2026</text>
<path d="M44 206v295" stroke="#627578" stroke-width="2"/>
<circle cx="44" cy="218" r="7" fill="#d9ac70"/>
<text x="66" y="211" fill="#d9ac70" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="1">1987</text>
<text x="66" y="239" fill="#f8eddd" font-family="Georgia,serif" font-size="19">Cost-recovery rule</text>
<text x="66" y="261" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">Act 644; later amended in 1992.</text>
<text x="66" y="280" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">Actual administration costs can be</text>
<text x="66" y="299" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">apportioned after a claim is resolved.</text>
<circle cx="44" cy="354" r="7" fill="#d9ac70"/>
<text x="66" y="347" fill="#d9ac70" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="1">JANUARY 10, 2024</text>
<text x="66" y="375" fill="#f8eddd" font-family="Georgia,serif" font-size="19">First agency renaming</text>
<text x="66" y="397" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">Act 150 (2023): Natural Resources</text>
<text x="66" y="416" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">becomes Energy &amp; Natural Resources.</text>
<circle cx="44" cy="472" r="7" fill="#d9ac70"/>
<text x="66" y="465" fill="#d9ac70" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="1">OCTOBER 1, 2025</text>
<text x="66" y="493" fill="#f8eddd" font-family="Georgia,serif" font-size="19">Second reorganization</text>
<text x="66" y="515" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">Act 458: Department of Conservation</text>
<text x="66" y="534" fill="#c3d0d0" font-family="Arial,Helvetica,sans-serif" font-size="12.5">and Energy takes its current name.</text>
<rect x="18" y="568" width="354" height="108" rx="12" fill="#24363b" stroke="#678187"/>
<text x="35" y="591" fill="#e6bb84" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12">WHAT THE CURRENT LAW DOES NOT PROVE</text>
<text x="35" y="617" fill="#e5eded" font-family="Arial,Helvetica,sans-serif" font-size="12.5">No claimant's unpaid balance is established.</text>
<text x="35" y="638" fill="#e5eded" font-family="Arial,Helvetica,sans-serif" font-size="12.5">No 2026 escrow balance is established.</text>
<text x="35" y="659" fill="#e5eded" font-family="Arial,Helvetica,sans-serif" font-size="12.5">A statute is not a payment ledger.</text>
<text x="24" y="704" fill="#b9c6c5" font-family="Arial,Helvetica,sans-serif" font-size="11">Sources: Louisiana Legislature, R.S. 30:21.2;</text>
<text x="24" y="721" fill="#b9c6c5" font-family="Arial,Helvetica,sans-serif" font-size="11">Act 150 digest; Louisiana DCE (2025). © FV 2026.</text>
</svg>

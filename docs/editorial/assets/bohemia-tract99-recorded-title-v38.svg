<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1050" width="390" height="1050" role="img" aria-labelledby="fv-title fv-desc">
<title id="fv-title">One tract, two incompatible plats: the 2005 Bohemia royalty-title case</title>
<desc id="fv-desc">An original non-geographic evidence diagram. The levee board's unrecorded Brodtmann inventory placed the Zenon and Schneidau claim at Tract 99 and the Fisher tract at Tract 101. Recorded pre-1925 deeds and an 1893 Mississippi River Commission survey placed Fisher's land at Section 9, where a later Fenstermaker survey placed Tract 99. The June 22, 2005 Fourth Circuit appeal affirmed the award of disputed mineral royalties to Fisher heirs. It does not show a payment receipt or a historical property map.</desc>
<rect width="390" height="1050" fill="#101c28"/>
<rect x="0" y="0" width="390" height="9" fill="#cfad71"/>
<text x="22" y="44" fill="#cfad71" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">FINAL VESTIGE  /  EVIDENCE STUDY</text>
<text x="22" y="89" fill="#faf7f0" font-family="Georgia, serif" font-size="30">One tract.</text>
<text x="22" y="124" fill="#faf7f0" font-family="Georgia, serif" font-size="30">Two different plats.</text>
<text x="22" y="154" fill="#c7d2db" font-family="Arial, Helvetica, sans-serif" font-size="13">Cox Bay Field • Bohemia Spillway • Louisiana</text>
<line x1="22" y1="178" x2="368" y2="178" stroke="#4b5a64"/>
<rect x="20" y="195" width="350" height="178" rx="12" fill="#253440" stroke="#62727c"/>
<text x="38" y="225" fill="#cfad71" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">1920s LEVEE-BOARD INVENTORY</text>
<text x="38" y="251" fill="#ffffff" font-family="Georgia, serif" font-size="20">Brodtmann plat</text>
<text x="38" y="283" fill="#edf0f0" font-family="Arial, Helvetica, sans-serif" font-size="15">Tract 99  →  Zenon / Schneidau</text>
<text x="38" y="308" fill="#edf0f0" font-family="Arial, Helvetica, sans-serif" font-size="15">Fisher tract  →  Tract 101</text>
<text x="38" y="345" fill="#ffd7a1" font-family="Arial, Helvetica, sans-serif" font-size="12">Unrecorded; court called it an inventory,</text>
<text x="38" y="361" fill="#ffd7a1" font-family="Arial, Helvetica, sans-serif" font-size="12">not an ownership survey.</text>
<line x1="195" y1="373" x2="195" y2="411" stroke="#c8ad77" stroke-width="2"/>
<path d="M 190 405 L 195 413 L 200 405" fill="none" stroke="#c8ad77" stroke-width="2"/>
<rect x="20" y="414" width="350" height="168" rx="12" fill="#1d3440" stroke="#557a88"/>
<text x="38" y="444" fill="#95d2ce" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">DEEDS + 1893 RIVER COMMISSION SURVEY</text>
<text x="38" y="473" fill="#ffffff" font-family="Georgia, serif" font-size="20">Recorded title evidence</text>
<text x="38" y="505" fill="#edf0f0" font-family="Arial, Helvetica, sans-serif" font-size="15">Section 9  →  Fisher land</text>
<text x="38" y="532" fill="#cad9dc" font-family="Arial, Helvetica, sans-serif" font-size="12">Between the Zettwoch and Favrot tracts.</text>
<text x="38" y="555" fill="#cad9dc" font-family="Arial, Helvetica, sans-serif" font-size="12">Different from the inventory's placement.</text>
<line x1="195" y1="582" x2="195" y2="620" stroke="#95d2ce" stroke-width="2"/>
<path d="M 190 614 L 195 622 L 200 614" fill="none" stroke="#95d2ce" stroke-width="2"/>
<rect x="20" y="623" width="350" height="126" rx="12" fill="#1d3440" stroke="#557a88"/>
<text x="38" y="653" fill="#95d2ce" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">LATER SURVEY FOR MINERAL OWNERSHIP</text>
<text x="38" y="684" fill="#ffffff" font-family="Georgia, serif" font-size="20">Fenstermaker plat</text>
<text x="38" y="713" fill="#edf0f0" font-family="Arial, Helvetica, sans-serif" font-size="14">Its Tract 99 / Section 9  →  Fisher</text>
<line x1="195" y1="749" x2="195" y2="787" stroke="#95d2ce" stroke-width="2"/>
<path d="M 190 781 L 195 789 L 200 781" fill="none" stroke="#95d2ce" stroke-width="2"/>
<rect x="20" y="790" width="350" height="138" rx="12" fill="#2b3843" stroke="#cfad71" stroke-width="1.3"/>
<text x="38" y="821" fill="#cfad71" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">JUNE 22, 2005 • FOURTH CIRCUIT</text>
<text x="38" y="853" fill="#ffffff" font-family="Georgia, serif" font-size="19">Royalties awarded to Fisher heirs</text>
<text x="38" y="880" fill="#edf0f0" font-family="Arial, Helvetica, sans-serif" font-size="13">Trial judgment affirmed on the record.</text>
<text x="38" y="904" fill="#ffd7a1" font-family="Arial, Helvetica, sans-serif" font-size="12">The ruling is not a payment receipt.</text>
<text x="22" y="961" fill="#c7d2db" font-family="Arial, Helvetica, sans-serif" font-size="12">Evidence logic only; not a geographic reconstruction</text>
<text x="22" y="982" fill="#c7d2db" font-family="Arial, Helvetica, sans-serif" font-size="12">or facsimile of either historical plat.</text>
<text x="22" y="1011" fill="#c7d2db" font-family="Arial, Helvetica, sans-serif" font-size="11">SOURCE: LA. FOURTH CIRCUIT, NO. 2004-CA-1059</text>
<text x="22" y="1031" fill="#cfad71" font-family="Arial, Helvetica, sans-serif" font-size="11">© FINAL VESTIGE STUDIOS • 15 NOV 2026</text>
</svg>
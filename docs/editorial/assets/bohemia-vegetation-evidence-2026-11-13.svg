<svg xmlns="http://www.w3.org/2000/svg" width="390" height="548" viewBox="0 0 390 548" role="img" aria-labelledby="title description">
<title id="title">Vegetated marsh area in the Mardi Gras Pass outfall, 2008 and 2021</title>
<desc id="description">A source-derived comparison of preliminary satellite classifications reported by Michael Hopkins at State of the Coast 2023. Vegetated outfall area was 33.1 square kilometers in 2008 and 30.0 square kilometers in 2021, a net decrease of approximately 3.1 square kilometers. The same abstract estimated a 0.3 square kilometer decrease in 2017 to 2021. The data do not establish that Mardi Gras Pass caused the earlier losses or show a 2026 outcome.</desc>
<rect width="390" height="548" rx="20" fill="#111b21"/>
<rect x="21" y="22" width="4" height="46" rx="2" fill="#c5a46b"/>
<text x="39" y="41" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7" fill="#c5a46b">FINAL VESTIGE  /  EVIDENCE</text>
<text x="39" y="63" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#faf8f0">A marsh ledger in motion</text>
<text x="25" y="96" font-family="Arial, sans-serif" font-size="13" fill="#c9d3d4">Estimated rooted vegetated area in the</text>
<text x="25" y="115" font-family="Arial, sans-serif" font-size="13" fill="#c9d3d4">Mardi Gras Pass outfall study area</text>
<line x1="25" y1="138" x2="365" y2="138" stroke="#53636a" stroke-width="1"/>
<text x="25" y="169" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f6f1">2008</text>
<text x="365" y="169" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f7f6f1">33.1 km²</text>
<rect x="25" y="181" width="340" height="22" rx="3" fill="#293b43"/>
<rect x="25" y="181" width="322" height="22" rx="3" fill="#c5a46b"/>
<text x="25" y="239" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f6f1">2021</text>
<text x="365" y="239" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f7f6f1">30.0 km²</text>
<rect x="25" y="252" width="340" height="22" rx="3" fill="#293b43"/>
<rect x="25" y="252" width="291" height="22" rx="3" fill="#8eaeb2"/>
<text x="25" y="308" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#f7f6f1">3.1 km² net decline</text>
<text x="25" y="329" font-family="Arial, sans-serif" font-size="12" fill="#c9d3d4">Across 2008–2021 · preliminary classification</text>
<rect x="25" y="347" width="340" height="64" rx="9" fill="#22343b"/>
<text x="38" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c5a46b">THE LATER INTERVAL WAS DIFFERENT</text>
<text x="38" y="391" font-family="Arial, sans-serif" font-size="13" fill="#faf8f0">2017–2021 decline: about 0.3 km²</text>
<text x="25" y="436" font-family="Arial, sans-serif" font-size="11" fill="#c9d3d4">These numbers are not proof that the pass caused</text>
<text x="25" y="453" font-family="Arial, sans-serif" font-size="11" fill="#c9d3d4">the earlier losses, or that net land gains followed.</text>
<line x1="25" y1="469" x2="365" y2="469" stroke="#53636a" stroke-width="1"/>
<text x="25" y="488" font-family="Arial, sans-serif" font-size="10" fill="#a9b8b9">SOURCE  Michael Hopkins / Pontchartrain Conservancy,</text>

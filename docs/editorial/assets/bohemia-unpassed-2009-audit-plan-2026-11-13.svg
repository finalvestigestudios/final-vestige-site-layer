<svg xmlns="http://www.w3.org/2000/svg" width="390" height="945" viewBox="0 0 390 945" role="img" aria-labelledby="title desc">
<title id="title">The Bohemia audit Louisiana proposed, but did not enact, in 2009</title>
<desc id="desc">Source-derived Final Vestige timeline. June 22 2009: Louisiana House passed Senate Bill 350 with amendments 93 to 0. June 25: Senate adopted a conference report 35 to 0. The bill tracker ends at Senate adoption and shows no enacted act. A proposed audit would have listed property returns, revenues, lawsuits, judgments, and claimant payments. The study requirement did not become law through SB350.</desc>
<rect width="390" height="945" fill="#111711"/>
<path d="M25 50H365" stroke="#596456" stroke-width="1"/>
<text x="25" y="32" font-family="Arial,sans-serif" font-size="12" letter-spacing="2.5" fill="#BDA77E">FINAL VESTIGE  /  EVIDENCE 49</text>
<text x="25" y="88" font-family="Georgia,serif" font-size="29" fill="#F3ECD9">THE AUDIT THAT</text>
<text x="25" y="121" font-family="Georgia,serif" font-size="29" fill="#F3ECD9">NEVER BECAME LAW</text>
<text x="25" y="153" font-family="Arial,sans-serif" font-size="14" fill="#BCBDB2">Louisiana SB350 · 2009 regular session</text>
<text x="25" y="176" font-family="Arial,sans-serif" font-size="12" fill="#9BA598">Procedural record, not a payment record</text>
<path d="M45 217V477" stroke="#78917E" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="45" cy="219" r="7" fill="#BDA77E"/>
<text x="67" y="224" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#F3ECD9">JUNE 22</text>
<text x="67" y="246" font-family="Arial,sans-serif" font-size="14" fill="#D9DFD0">House passed amended bill</text>
<text x="67" y="267" font-family="Arial,sans-serif" font-size="14" fill="#BDA77E">93–0</text>
<circle cx="45" cy="322" r="7" fill="#BDA77E"/>
<text x="67" y="327" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#F3ECD9">JUNE 25</text>
<text x="67" y="348" font-family="Arial,sans-serif" font-size="14" fill="#D9DFD0">Senate adopted conference report</text>
<text x="67" y="369" font-family="Arial,sans-serif" font-size="14" fill="#BDA77E">35–0 · final recorded vote</text>
<circle cx="45" cy="427" r="7" fill="#D18A7A"/>
<text x="67" y="432" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#F3ECD9">SESSION CLOSE</text>
<text x="67" y="453" font-family="Arial,sans-serif" font-size="14" fill="#D9DFD0">No enacted SB350 or Act number</text>
<text x="67" y="475" font-family="Arial,sans-serif" font-size="13" fill="#BDBBB0">Conference report remained a proposal</text>
<rect x="21" y="505" width="348" height="280" rx="14" fill="#222B22" stroke="#485547"/>
<text x="39" y="536" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1" fill="#BDA77E">WHAT THE BILL WOULD HAVE REQUIRED</text>
<text x="39" y="570" font-family="Georgia,serif" font-size="18" fill="#F3ECD9">Auditor + State Law Institute</text>
<text x="39" y="603" font-family="Arial,sans-serif" font-size="14" fill="#DCE0D6">A property-return and claims inquiry:</text>
<text x="42" y="637" font-family="Arial,sans-serif" font-size="14" fill="#DCE0D6">01  Tracts transferred or returned</text>
<text x="42" y="672" font-family="Arial,sans-serif" font-size="14" fill="#DCE0D6">02  Spillway revenues received</text>
<text x="42" y="707" font-family="Arial,sans-serif" font-size="14" fill="#DCE0D6">03  Claims, judgments and expenses</text>
<text x="42" y="742" font-family="Arial,sans-serif" font-size="14" fill="#DCE0D6">04  Amounts paid to claimants</text>
<rect x="21" y="804" width="348" height="67" rx="11" fill="#3C2B25"/>
<text x="37" y="827" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#F6DDC9">NOT AN ENACTED AUDIT MANDATE</text>
<text x="37" y="850" font-family="Arial,sans-serif" font-size="12" fill="#F3DED3">Nor proof no other review took place.</text>
<text x="25" y="900" font-family="Arial,sans-serif" font-size="11" fill="#ABB1A5">Sources: LA Legislature SB350 bill history,</text>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="516" viewBox="0 0 390 516" role="img" aria-labelledby="title desc">
<title id="title">Money reserved for Bohemia settlements, 2005 and 2006</title>
<desc id="desc">Original Final Vestige Studios comparison from Orleans Levee District audited statements. General Fund Bohemia-restricted balance was $456,190 at June 30, 2005, and $339,407 at June 30, 2006, a decrease of $116,783. These are reserve balances, not proof of disbursements or beneficiary receipts.</desc>
<rect width="390" height="516" rx="18" fill="#f7f3ea"/>
<path d="M25 24h46" stroke="#a77940" stroke-width="4"/>
<text x="25" y="54" font-size="12" font-family="Arial, sans-serif" fill="#5c655e" letter-spacing="1.4">FINAL VESTIGE · EVIDENCE GRAPHIC</text>
<text x="25" y="91" font-size="24" font-weight="700" font-family="Georgia,serif" fill="#213039">The money marked</text>
<text x="25" y="120" font-size="24" font-weight="700" font-family="Georgia,serif" fill="#213039">for Bohemia</text>
<text x="25" y="148" font-size="14" font-family="Arial,sans-serif" fill="#59656a">General Fund balances reserved for settlements</text>
<line x1="25" y1="166" x2="365" y2="166" stroke="#d8d5cc"/>
<text x="25" y="197" font-size="15" font-weight="700" font-family="Arial,sans-serif" fill="#213039">June 30, 2005</text>
<text x="365" y="197" font-size="18" text-anchor="end" font-weight="700" font-family="Arial,sans-serif" fill="#213039">$456,190</text>
<rect x="25" y="210" width="340" height="29" rx="5" fill="#e2e6e2"/>
<rect x="25" y="210" width="340" height="29" rx="5" fill="#9c7b4c"/>
<text x="25" y="276" font-size="15" font-weight="700" font-family="Arial,sans-serif" fill="#213039">June 30, 2006</text>
<text x="365" y="276" font-size="18" text-anchor="end" font-weight="700" font-family="Arial,sans-serif" fill="#213039">$339,407</text>
<rect x="25" y="289" width="340" height="29" rx="5" fill="#e2e6e2"/>
<rect x="25" y="289" width="253" height="29" rx="5" fill="#567984"/>
<rect x="25" y="344" width="340" height="66" rx="8" fill="#e8e5dd"/>
<text x="41" y="368" font-size="13" font-weight="700" font-family="Arial,sans-serif" fill="#4b5a5e">CHANGE IN RESERVED BALANCE</text>
<text x="41" y="396" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#213039">−$116,783</text>
<text x="25" y="435" font-size="13" font-weight="700" font-family="Arial,sans-serif" fill="#273841">A smaller reserve does not prove a payment.</text>
<text x="25" y="456" font-size="12" font-family="Arial,sans-serif" fill="#46575e">The source does not reconcile the change.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="980" viewBox="0 0 780 980" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway: physical flood corridor versus legislative land boundary</title>
<desc id="desc">Original Final Vestige schematic from Louisiana Supreme Court Richardson and Bass opinion, 1955–56. Approximately eleven miles of Mississippi River levee were removed; a back levee was built 2,500 to 3,000 feet from the river. A disputed tract roughly one mile east of that back levee was outside the physical flow corridor but inside the broader area defined in Louisiana's 1942 statute. Diagram is not drawn to scale; it does not map parcel boundaries, determine modern title, or show claimant payments.</desc>
<rect width="780" height="980" fill="#111619"/>
<rect x="0" y="0" width="780" height="8" fill="#c39c63"/>
<text x="48" y="63" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#c39c63" font-weight="700">FINAL VESTIGE  /  DOCUMENTARY DIAGRAM</text>
<text x="48" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" fill="#f4f0e7" font-weight="700">One spillway.</text>
<text x="48" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" fill="#f4f0e7" font-weight="700">Two boundaries.</text>
<text x="48" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#c8c9c5">The 1955–56 court record distinguishes flowing</text>
<text x="48" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#c8c9c5">water from the legally defined land area.</text>
<rect x="40" y="283" width="700" height="394" rx="15" fill="#1b2529" stroke="#495255" stroke-width="2"/>
<text x="63" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" letter-spacing="2" fill="#d1aa70">RIVER TO BACK LEVEE  ·  WATER CORRIDOR</text>
<rect x="62" y="343" width="656" height="81" rx="10" fill="#213c45"/>
<text x="83" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#e9f1ee">Mississippi riverbank</text>
<text x="83" y="407" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#c5d8df">About 11 miles of existing levee removed</text>
<line x1="390" y1="432" x2="390" y2="465" stroke="#c39c63" stroke-width="4" stroke-dasharray="8 7"/>
<rect x="62" y="467" width="656" height="90" rx="10" fill="#283138"/>
<text x="83" y="503" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#f4f0e7">Back levee</text>
<text x="83" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#ced1cf">Built about 2,500–3,000 ft inland</text>
<line x1="390" y1="566" x2="390" y2="593" stroke="#c39c63" stroke-width="4" stroke-dasharray="8 7"/>
<rect x="62" y="596" width="656" height="61" rx="10" fill="#30312e"/>
<text x="83" y="634" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#f3e0bc">Openings sent high water into canals and bays</text>
<text x="49" y="717" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" letter-spacing="2" fill="#d1aa70">FARTHER EAST  ·  STILL WITHIN THE 1942 AREA</text>
<rect x="41" y="735" width="697" height="96" rx="15" fill="#312c29" stroke="#c39c63" stroke-width="2"/>
<text x="66" y="771" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="27" fill="#f4f0e7">Disputed Cox Bay tract</text>
<text x="66" y="804" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#e0d8cd">About 1 mile east of the back levee</text>
<text x="48" y="868" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#ccd2d0">Not to scale · Not a cadastral map or evidence of payment.</text>
<text x="48" y="899" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#ccd2d0">Source: La. Supreme Court, Richardson &amp; Bass,</text>
<text x="48" y="926" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#ccd2d0">231 La. 299; original and rehearing opinions (1955–56).</text>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110" role="img" aria-labelledby="title desc">
<title id="title">Five Haspel and Davis payments recorded in 2010, then a separate 2013 compromise approval</title>
<desc id="desc">A February 18, 2010 public resolution of the Southeast Louisiana Flood Protection Authority–East recited five payments dated 2000 through 2005 totaling 5,545,818 dollars and 89 cents. A separate October 17, 2013 public resolution approved a proposed compromise with five affirmative votes and three abstentions. A board recital is not independent claimant-level payment verification, and an approval is not proof of execution.</desc>

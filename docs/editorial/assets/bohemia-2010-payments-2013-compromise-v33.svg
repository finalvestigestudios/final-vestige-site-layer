<svg xmlns="http://www.w3.org/2000/svg" width="390" height="950" viewBox="0 0 390 950" role="img" aria-labelledby="fv-title fv-desc">
<title id="fv-title">Five recorded Haspel and Davis payments, and a separate 2013 compromise vote</title>
<desc id="fv-desc">Original Final Vestige source-derived diagram. February 2010 authority board minutes recite five historical payments dated 2000 to 2005, totaling five million five hundred forty-five thousand eight hundred eighteen dollars and eighty-nine cents. October 2013 board minutes record a distinct compromise proposal approved with five yeas, no nays and three abstentions. The minutes are not payment receipts or proof of settlement execution.</desc>
<metadata>© Final Vestige Studios, November 15, 2026. All rights reserved. Original vector diagram with no third-party pixels or remote resources; no AI historical reconstruction. Primary documents: https://www.floodauthority.org/wp-content/uploads/minutes/2010%2002%2018%20-%20Board%20Meeting%20Minutes.pdf (resolution 02-18-10-08 printed pp.14–15); https://www.floodauthority.org/wp-content/uploads/minutes/2013%2010%2017%20-%20Board%20Meeting%20Minutes.pdf (resolution 10-17-13-12 printed pp.21–22). Official indexed text checked; original-page PDF screenshots unavailable.</metadata>

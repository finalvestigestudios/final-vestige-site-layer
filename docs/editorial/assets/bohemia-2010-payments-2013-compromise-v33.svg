<text x="27" y="830" font-family="Arial,sans-serif" font-weight="bold" font-size="21" fill="#f3d9b6">5 yes · 0 no · 3 abstained</text>
<text x="27" y="858" font-family="Arial,sans-serif" font-size="13" fill="#c5d5df">Terms, execution and payment distribution</text>
<text x="27" y="876" font-family="Arial,sans-serif" font-size="13" fill="#c5d5df">are not established by these minutes.</text>

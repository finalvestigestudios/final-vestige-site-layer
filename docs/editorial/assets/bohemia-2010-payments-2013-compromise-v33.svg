<text x="27" y="167" font-family="Arial,sans-serif" font-size="13" letter-spacing=".7" fill="#bacbd6">FEBRUARY 18, 2010 · 7–0 VOTE</text>
<text x="27" y="202" font-family="Georgia,serif" font-size="20" fill="#f2f2ee">Five payments recited</text>
<text x="27" y="230" font-family="Arial,sans-serif" font-size="13" fill="#b8c5d2">On or about dates, 2000–2005</text>
<line x1="27" x2="363" y1="247" y2="247" stroke="#516171"/><text x="29" y="282" font-family="Arial,sans-serif" font-size="16" fill="#e9eef2">Dec 11, 2000</text><text x="360" y="282" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#f6f1e8">$2,318,263.72</text><line x1="27" x2="363" y1="306" y2="306" stroke="#516171"/><text x="29" y="341" font-family="Arial,sans-serif" font-size="16" fill="#e9eef2">Aug 15, 2001</text><text x="360" y="341" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#f6f1e8">$371,532.00</text><line x1="27" x2="363" y1="365" y2="365" stroke="#516171"/><text x="29" y="400" font-family="Arial,sans-serif" font-size="16" fill="#e9eef2">Feb 7, 2003</text><text x="360" y="400" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#f6f1e8">$1,906,023.17</text><line x1="27" x2="363" y1="424" y2="424" stroke="#516171"/><text x="29" y="459" font-family="Arial,sans-serif" font-size="16" fill="#e9eef2">Feb 27, 2004</text><text x="360" y="459" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#f6f1e8">$600,000.00</text><line x1="27" x2="363" y1="483" y2="483" stroke="#516171"/><text x="29" y="518" font-family="Arial,sans-serif" font-size="16" fill="#e9eef2">Jan 4, 2005</text><text x="360" y="518" text-anchor="end" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#f6f1e8">$350,000.00</text>
<rect x="27" y="565" width="336" height="84" rx="8" fill="#304658" stroke="#c5a77b" stroke-width="1.2"/>
<text x="43" y="590" font-family="Arial,sans-serif" font-size="13" letter-spacing=".7" fill="#c3d0da">BOARD-RECITED TOTAL</text>
<text x="347" y="631" text-anchor="end" font-family="Georgia,serif" font-weight="bold" font-size="27" fill="#f6d6a4">$5,545,818.89</text>
<text x="27" y="674" font-family="Arial,sans-serif" font-size="13" fill="#c5d5df">This is an official recital, not an inspected</text>
<text x="27" y="692" font-family="Arial,sans-serif" font-size="13" fill="#c5d5df">bank receipt or claimant-level payee ledger.</text>

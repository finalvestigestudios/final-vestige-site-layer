<svg xmlns="http://www.w3.org/2000/svg" width="540" height="914" viewBox="0 0 540 914" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway, 2024–2025: a new administrator, an audit question and a royalty forecast</title>
<desc id="desc">Original editorial evidence diagram showing the reported January 2024 transfer of Bohemia asset administration to the Lakefront Management Authority, a March 2025 director statement seeking an audit of current mineral-lease payments, and a 2025–2026 budget forecast of 100,000 dollars in Bohemia royalties. No payment to heirs is established by these records.</desc>
<metadata>Creator: Final Vestige Studios | Created: 2026-11-17 | Copyright © 2026 Final Vestige Studios, original vector typography and diagram (no third-party media). Source A: Lakefront Management Authority July 25 2024 Commercial Real Estate Committee minutes, https://nolalakefront.com/wp-content/uploads/2024/10/25-JULY-2024-Commercial-Real-estate-Committee-Minutes_Approved-9.19.2024.pdf ; Source B: LMA March 26 2025 Finance Committee minutes, https://nolalakefront.com/wp-content/uploads/2025/07/Finance-Minutes-March-26-2025final.pdf ; Source C: LMA fiscal year 2025-2026 budget, https://nolalakefront.com/wp-content/uploads/2025/11/25-26-Budget-website.pdf . Caption: Three documents about public administration and expected lease revenue; no beneficiary distribution conclusion.</metadata>
<rect width="540" height="914" rx="0" fill="#f7f5ef"/>
<rect x="0" y="0" width="540" height="13" fill="#ac7836"/>
<text x="28" y="54" font-size="15" letter-spacing="2" fill="#6a665c" font-family="Arial,Helvetica,sans-serif">FINAL VESTIGE / EVIDENCE NOTE</text>
<text x="28" y="99" font-size="30" font-weight="700" fill="#192f3c" font-family="Georgia,serif">A new keeper.</text>
<text x="28" y="136" font-size="30" font-weight="700" fill="#192f3c" font-family="Georgia,serif">An open account question.</text>
<text x="28" y="165" font-size="16" fill="#615f5a" font-family="Arial,Helvetica,sans-serif">Three government records / Three different claims</text>
<line x1="28" y1="188" x2="512" y2="188" stroke="#b8b1a5" stroke-width="1"/>
<rect x="28" y="210" width="484" height="160" rx="8" fill="#fff" stroke="#d6d0c3"/>
<circle cx="61" cy="242" r="14" fill="#1f4455"/>
<text x="61" y="248" font-size="16" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">1</text>
<text x="88" y="249" font-size="18" font-weight="700" fill="#1f4455" font-family="Arial,sans-serif">JANUARY 1, 2024</text>
<text x="48" y="288" font-size="24" font-weight="700" fill="#172d37" font-family="Georgia,serif">Asset administration shifts</text>
<text x="48" y="319" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">LMA counsel described an MOU</text>
<text x="48" y="341" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">effective on this date. [A]</text>
<rect x="28" y="390" width="484" height="180" rx="8" fill="#fff" stroke="#d6d0c3"/>
<circle cx="61" cy="423" r="14" fill="#1f4455"/>
<text x="61" y="429" font-size="16" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">2</text>
<text x="88" y="430" font-size="18" font-weight="700" fill="#1f4455" font-family="Arial,sans-serif">MARCH 26, 2025</text>
<text x="48" y="466" font-size="24" font-weight="700" fill="#172d37" font-family="Georgia,serif">Lease payments questioned</text>
<text x="48" y="497" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">Director sought a revenue audit,</text>
<text x="48" y="520" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">saying leases had not been</text>
<text x="48" y="543" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">audited since 2007. [B]</text>
<rect x="28" y="590" width="484" height="172" rx="8" fill="#fff" stroke="#d6d0c3"/>
<circle cx="61" cy="623" r="14" fill="#1f4455"/>
<text x="61" y="629" font-size="16" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">3</text>
<text x="88" y="630" font-size="18" font-weight="700" fill="#1f4455" font-family="Arial,sans-serif">FY 2025–2026 BUDGET</text>
<text x="47" y="686" font-size="38" font-weight="700" fill="#996320" font-family="Georgia,serif">$100,000</text>
<text x="255" y="678" font-size="17" font-weight="700" fill="#172d37" font-family="Arial,sans-serif">Bohemia royalties [C]</text>
<text x="255" y="702" font-size="16" fill="#555a57" font-family="Arial,sans-serif">Planned, not verified</text>
<text x="48" y="737" font-size="17" fill="#333a3b" font-family="Arial,sans-serif">The budget is not a cash-receipt ledger.</text>
<rect x="28" y="786" width="484" height="94" rx="8" fill="#193544"/>
<text x="46" y="815" font-size="16" font-weight="700" fill="#f7e7c6" font-family="Arial,sans-serif">CRITICAL DISTINCTION</text>
<text x="46" y="842" font-size="17" fill="#fff" font-family="Arial,sans-serif">Public lease income ≠ payments to heirs.</text>
<text x="46" y="864" font-size="15" fill="#e8e3d5" font-family="Arial,sans-serif">Neither a forecast nor an audit request is a receipt.</text>
<text x="28" y="903" font-size="11" fill="#66635b" font-family="Arial,sans-serif">Source notes [A–C] and full URLs in accompanying article. © FV STUDIOS 2026.</text>

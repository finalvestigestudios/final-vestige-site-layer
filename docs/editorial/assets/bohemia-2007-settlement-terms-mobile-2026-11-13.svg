<svg xmlns="http://www.w3.org/2000/svg" width="390" height="735" viewBox="0 0 390 735" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Bohemia settlement: immediate versus contingent sums</title>
<desc id="chart-desc">A Fifth Circuit opinion described a 2.318 million dollar immediate settlement term and 18.767 million conditional on appropriations. The court noted some payments but an unmet 2.6 million dollar annual threshold and reversed a separate federal takings judgment. The chart does not show verified payments or current debt.</desc>
<rect width="390" height="735" fill="#111B22"/>
<rect x="12" y="12" width="366" height="711" rx="18" fill="#19252B" stroke="#4D605F"/>
<text x="30" y="51" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#D7B36A">FINAL VESTIGE  /  EVIDENCE</text>
<text x="30" y="92" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#F0E9DB">A settlement is not</text>
<text x="30" y="127" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#F0E9DB">a payment record.</text>
<text x="30" y="157" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#C9D1D0">Fifth Circuit opinion, July 23, 2007</text>
<rect x="30" y="184" width="330" height="12" rx="6" fill="#6D9CAA"/>
<rect x="30" y="184" width="36" height="12" rx="6" fill="#D7B36A"/>
<rect x="30" y="216" width="330" height="133" rx="10" fill="#2C3538"/>
<rect x="30" y="217" width="5" height="131" rx="2" fill="#D7B36A"/>
<text x="47" y="247" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.2" font-weight="bold" fill="#E4C58A">IMMEDIATE-PAYMENT TERM</text>
<text x="47" y="286" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#F7EFE1">$2,318,263.72</text>
<text x="47" y="320" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#D1D8D6">About 11% of agreed amount</text>
<rect x="30" y="364" width="330" height="139" rx="10" fill="#2C3538"/>
<rect x="30" y="365" width="5" height="137" rx="2" fill="#6D9CAA"/>
<text x="47" y="394" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1" font-weight="bold" fill="#B7D4DB">CONDITIONAL APPROPRIATION</text>
<text x="47" y="433" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#F7EFE1">$18,767,145.26</text>
<text x="47" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#D1D8D6">About 89%, subject to funding</text>
<text x="30" y="539" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#ECE9DD">What the opinion says</text>
<text x="30" y="568" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#C9D4D3">Some payments occurred; the annual</text>
<text x="30" y="589" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#C9D4D3">$2.6M threshold was not met.</text>
<text x="30" y="619" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#C9D4D3">The separate federal judgment was</text>
<text x="30" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#C9D4D3">reversed. No current balance shown.</text>
<line x1="30" y1="660" x2="360" y2="660" stroke="#4B5D60"/>
<text x="30" y="681" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#AEBEBD">Source: Fifth Circuit, 07-30086, pp. 3–4, 10–11.</text>
<text x="30" y="701" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#AEBEBD">Original graphic © Final Vestige Studios 2026</text>
</svg>
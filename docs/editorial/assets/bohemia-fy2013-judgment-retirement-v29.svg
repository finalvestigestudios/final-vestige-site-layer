<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="390" height="622" viewBox="0 0 390 622">
<title id="title">A reduction in combined judgments is not a Bohemia payment register</title>
<desc id="desc">The Southeast Louisiana Flood Protection Authority-East fiscal 2013 audit reports a combined governmental judgments balance of 22,595,389 dollars at June 30, 2012; 1,412,769 dollars in retirement; and 21,182,620 dollars at June 30, 2013. In a separate litigation note it acknowledges some Haspel and Davis payments since 2001. It does not allocate the 2013 retirement to Bohemia or identify beneficiaries.</desc>
<rect width="390" height="622" fill="#f7f6f2"/>
<rect x="17" y="17" width="356" height="588" rx="15" fill="#fff" stroke="#d2d8db"/>
<rect x="17" y="17" width="356" height="8" rx="4" fill="#176575"/>
<text x="35" y="57" fill="#176575" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="1.1">FVS / EVIDENCE NOTE 029</text>
<text x="35" y="86" fill="#1d2b34" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="20">A judgment balance</text>
<text x="35" y="111" fill="#1d2b34" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="20">is not a payment ledger.</text>
<text x="35" y="139" fill="#596a76" font-family="DejaVu Sans,Arial,sans-serif" font-size="11">Authority-wide governmental judgments, FY2013</text>
<rect x="35" y="159" width="320" height="69" rx="9" fill="#edf3f4"/>
<text x="48" y="182" fill="#4b5962" font-family="DejaVu Sans,Arial,sans-serif" font-size="11">OPENING · 30 JUN 2012</text>
<text x="48" y="210" fill="#1b3440" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="25">$22,595,389</text>
<path d="M195 231 V247" stroke="#176575" stroke-width="2"/><path d="M189 243 L195 251 L201 243" fill="none" stroke="#176575" stroke-width="2"/>
<rect x="35" y="257" width="320" height="75" rx="9" fill="#fdf2df" stroke="#e4d2a9"/>
<text x="48" y="280" fill="#6b5130" font-family="DejaVu Sans,Arial,sans-serif" font-size="11">RETIRED DURING FY2013 · COMBINED</text>
<text x="48" y="311" fill="#734920" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="25">−$1,412,769</text>
<path d="M195 334 V350" stroke="#176575" stroke-width="2"/><path d="M189 346 L195 354 L201 346" fill="none" stroke="#176575" stroke-width="2"/>
<rect x="35" y="360" width="320" height="70" rx="9" fill="#edf3f4"/>
<text x="48" y="382" fill="#4b5962" font-family="DejaVu Sans,Arial,sans-serif" font-size="11">CLOSING · 30 JUN 2013</text>
<text x="48" y="410" fill="#1b3440" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="25">$21,182,620</text>
<rect x="35" y="444" width="320" height="94" rx="9" fill="#faf6f0" stroke="#dacfc0"/>
<text x="49" y="467" font-family="DejaVu Sans,Arial,sans-serif" fill="#584232" font-size="12" font-weight="bold">A DIFFERENT NOTE SAYS</text>
<text x="49" y="488" font-family="DejaVu Sans,Arial,sans-serif" fill="#353f44" font-size="12">Some Haspel &amp; Davis payments were</text>
<text x="49" y="505" font-family="DejaVu Sans,Arial,sans-serif" fill="#353f44" font-size="12">made since 2001. It does not assign</text>
<text x="49" y="522" font-family="DejaVu Sans,Arial,sans-serif" fill="#353f44" font-size="12">FY2013 retirements to those claimants.</text>
<line x1="35" x2="355" y1="551" y2="551" stroke="#d5dadd"/>

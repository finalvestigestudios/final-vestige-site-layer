<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="t d">
<title id="t">Bohemia's 2005 law: four different documentary milestones</title><desc id="d">Act 130 of 2005 records partial settlement payments and halted payments for disputed titles; requires a claim by June 30, 2007; and mandates contact after a certified conveyance within 30 days to negotiate mineral revenue. These are not evidence of beneficiary receipt.</desc>
<rect width="760" height="720" fill="#101c24"/>
<g font-family="Georgia, serif" fill="#f4eee4">
<text x="44" y="65" font-size="32" font-weight="bold">A LAW IS NOT A RECEIPT</text>
<text x="44" y="103" font-size="17" fill="#c9c5bb">Bohemia Spillway · Louisiana Act 130 · June 22, 2005</text>
</g>
<line x1="75" y1="158" x2="75" y2="555" stroke="#bc9457" stroke-width="3"/>
<g font-family="Arial, sans-serif">
<circle cx="75" cy="188" r="9" fill="#bc9457"/>
<rect x="112" y="148" width="600" height="91" rx="10" fill="#1f3039" stroke="#53646a"/>
<text x="134" y="176" font-size="17" font-weight="bold" fill="#f8f3e8">THE SETTLEMENT RECORD</text>
<text x="134" y="202" font-size="17" fill="#efede8">Partial Haspel payments acknowledged;</text>
<text x="134" y="225" font-size="17" fill="#efede8">more payments contemplated, not proved.</text>
<circle cx="75" cy="301" r="9" fill="#bc9457"/>
<rect x="112" y="262" width="600" height="85" rx="10" fill="#1f3039" stroke="#53646a"/>
<text x="134" y="291" font-size="17" font-weight="bold" fill="#f8f3e8">WHEN TITLE IS DISPUTED</text>
<text x="134" y="318" font-size="17" fill="#efede8">Legislature recorded payment suspensions</text>
<text x="134" y="339" font-size="17" fill="#efede8">pending litigation.</text>
<circle cx="75" cy="414" r="9" fill="#bc9457"/>
<rect x="112" y="374" width="600" height="85" rx="10" fill="#1f3039" stroke="#53646a"/>
<text x="134" y="403" font-size="17" font-weight="bold" fill="#f8f3e8">JUNE 30, 2007</text>
<text x="134" y="430" font-size="17" fill="#efede8">Claim-filing cutoff under the 2005 law.</text>
<text x="134" y="452" font-size="15" fill="#c9c5bb">A filing is not a deed or a royalty check.</text>
<circle cx="75" cy="526" r="9" fill="#bc9457"/>
<rect x="112" y="487" width="600" height="87" rx="10" fill="#1f3039" stroke="#53646a"/>
<text x="134" y="516" font-size="17" font-weight="bold" fill="#f8f3e8">AFTER A CERTIFIED CONVEYANCE</text>
<text x="134" y="543" font-size="17" fill="#efede8">Contact owner within 30 days to negotiate</text>
<text x="134" y="564" font-size="17" fill="#efede8">mineral-revenue settlement.</text>
</g>
<rect x="42" y="605" width="676" height="67" rx="9" fill="#304046"/>
<text x="59" y="632" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e5c58a">WHAT THE LAW DOES NOT SHOW</text>
<text x="59" y="656" font-family="Arial, sans-serif" font-size="16" fill="#f8f3e8">Final claimant-by-claimant bank transfers or satisfaction.</text>
<text x="42" y="700" font-family="Arial, sans-serif" font-size="12" fill="#aab5b7">© Final Vestige Studios · Primary source: Louisiana 2005 Act 130, pp. 3–7 · Source-derived diagram</text>
</svg>
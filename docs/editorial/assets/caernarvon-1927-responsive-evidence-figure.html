<figure class="fv-evidence-visual fv-caernarvon-timeline" role="group" aria-label="Caernarvon flood chronology and distinctions between measured river stages and later estimates" style="box-sizing:border-box;max-width:1120px;margin:2.25rem auto;background:#111c20;color:#f3e8d7;border:1px solid #566460;border-radius:16px;padding:clamp(18px,3vw,32px);font-family:inherit;overflow:hidden">
  <div style="border-left:4px solid #e6b97e;padding-left:17px;margin-bottom:18px">
    <p style="margin:0 0 5px;color:#e6b97e;font-size:.77rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase">Final Vestige Studios / Evidence graphic</p>
    <p style="margin:0;font-family:Georgia,serif;font-size:clamp(1.5rem,3vw,2.15rem);line-height:1.2;color:#f6efe5">Two floods. One deliberate breach.</p>
    <p style="margin:6px 0 0;color:#c4cecb;font-size:.92rem">Caernarvon, 1927 · The chronology the records establish</p>
  </div>
  <ol style="list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,172px),1fr));gap:9px">
    <li style="background:#203033;border:1px solid #465858;border-radius:12px;padding:14px 15px;min-width:0"><span style="display:block;color:#e6b97e;font-size:.82rem;font-weight:700;letter-spacing:.065em">APR 14–15</span><strong style="display:block;font-size:1.5rem;line-height:1.3;color:#f3e8d7;font-family:Georgia,serif">More than 14 inches</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Rain in about 19 hours; rainwater flooding in New Orleans, not overtopping by the Mississippi.</span></li>
<li style="background:#203033;border:1px solid #465858;border-radius:12px;padding:14px 15px;min-width:0"><span style="display:block;color:#e6b97e;font-size:.82rem;font-weight:700;letter-spacing:.065em">APR 25</span><strong style="display:block;font-size:1.5rem;line-height:1.3;color:#f3e8d7;font-family:Georgia,serif">21.0 feet</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Recorded Carrollton river stage before the deliberate cut.</span></li>
<li style="background:#203033;border:1px solid #465858;border-radius:12px;padding:14px 15px;min-width:0"><span style="display:block;color:#e6b97e;font-size:.82rem;font-weight:700;letter-spacing:.065em">APR 26</span><strong style="display:block;font-size:1.5rem;line-height:1.3;color:#f3e8d7;font-family:Georgia,serif">The order</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Governor O. H. Simpson orders the breach for noon on April 29.</span></li>
<li style="background:#203033;border:1px solid #465858;border-radius:12px;padding:14px 15px;min-width:0"><span style="display:block;color:#e6b97e;font-size:.82rem;font-weight:700;letter-spacing:.065em">APR 29</span><strong style="display:block;font-size:1.5rem;line-height:1.3;color:#f3e8d7;font-family:Georgia,serif">About 2:17 p.m.</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">The first reported detonation; contemporary press says the initial cuts were shallow.</span></li>
<li style="background:#203033;border:1px solid #465858;border-radius:12px;padding:14px 15px;min-width:0"><span style="display:block;color:#e6b97e;font-size:.82rem;font-weight:700;letter-spacing:.065em">MAY 15</span><strong style="display:block;font-size:1.5rem;line-height:1.3;color:#f3e8d7;font-family:Georgia,serif">20.7 feet</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Later river stage reported by the National Weather Service; the breach was already open.</span></li>
  </ol>
  <div style="background:#213034;border:1px solid #536660;border-radius:12px;margin-top:15px;padding:16px 17px">
    <p style="margin:0 0 10px;font-family:Georgia,serif;font-size:1.22rem;color:#f5ecdf">The estimate is not the measurement</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:12px">
      <div><strong style="display:block;color:#e6b97e;font-family:Georgia,serif;font-size:1.9rem;line-height:1.15">≈½ foot</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Later National Weather Service estimate of the stage reduction attributed to the cut.</span></div>
      <div><strong style="display:block;color:#e6b97e;font-family:Georgia,serif;font-size:1.9rem;line-height:1.15">≈2 feet</strong><span style="display:block;color:#cad3cf;font-size:.95rem;line-height:1.5;margin-top:5px">Army board’s 1927 gauge-relationship inference at a particular reference time.</span></div>
    </div>
    <p style="color:#f0ce9c;font-size:.9rem;line-height:1.5;margin:14px 0 0">Different methods and reference conditions. Neither number is a direct measurement of the river level that would have occurred without the breach.</p>
  </div>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1070" viewBox="0 0 780 1070" role="img" aria-labelledby="title description">
<title id="title">The liability that was corrected on paper, Orleans Levee District fiscal 2004</title>
<desc id="description">An original evidence-based diagram. The FY2004 financial report's Note 21 records a 4,964,233 dollar prior-period adjustment for previously understated Bohemia litigation judgment liability and accrued interest. A separate Note 13 rollforward reports 19,135,560 dollars of judgments at July 1, 2003, 1,185,648 dollars in additions, 600,000 dollars in reductions, and 19,721,208 dollars in combined judgments at June 30, 2004. The combined category includes non-Bohemia contractual litigation. A liability correction or reduction is not proof of payment to individual landowners.</desc>
<rect width="780" height="1070" fill="#101a22"/>
<rect x="42" y="42" width="696" height="986" rx="22" fill="#16252e" stroke="#45616a" stroke-width="2"/>
<text x="80" y="103" fill="#c9ac80" font-size="25" font-family="Arial, sans-serif" letter-spacing="3">FINAL VESTIGE  /  EVIDENCE FILE</text>
<text x="80" y="164" fill="#f6efe3" font-size="43" font-weight="700" font-family="Arial, sans-serif">The liability corrected</text>
<text x="80" y="216" fill="#f6efe3" font-size="43" font-weight="700" font-family="Arial, sans-serif">on paper</text>
<text x="80" y="260" fill="#bac6c5" font-size="26" font-family="Arial, sans-serif">Orleans Levee District  |  FY 2004</text>
<rect x="79" y="301" width="622" height="207" rx="17" fill="#223641" stroke="#59737a" stroke-width="2"/>
<text x="104" y="353" fill="#d5c2a3" font-size="25" font-family="Arial, sans-serif">NOTE 21  /  PRIOR-YEAR RESTATEMENT</text>
<text x="104" y="422" fill="#fff5e5" font-size="60" font-weight="700" font-family="Arial, sans-serif">$4,964,233</text>
<text x="105" y="466" fill="#d9e0dc" font-size="25" font-family="Arial, sans-serif">Judgment understated in 2001;</text>
<text x="105" y="496" fill="#d9e0dc" font-size="25" font-family="Arial, sans-serif">interest had accrued</text>
<text x="80" y="572" fill="#f6efe3" font-size="31" font-weight="700" font-family="Arial, sans-serif">NOTE 13  /  JUDGMENTS ROLL-FORWARD</text>
<line x1="80" y1="590" x2="700" y2="590" stroke="#66818a" stroke-width="2"/>
<text x="92" y="641" fill="#dce5e0" font-size="29" font-family="Arial, sans-serif">July 1, 2003 (restated)</text>
<text x="695" y="641" text-anchor="end" fill="#f6efe3" font-size="31" font-weight="700" font-family="Arial, sans-serif">$19,135,560</text>
<text x="92" y="708" fill="#dce5e0" font-size="29" font-family="Arial, sans-serif">Additions</text>
<text x="695" y="708" text-anchor="end" fill="#e3d0a7" font-size="31" font-weight="700" font-family="Arial, sans-serif">+$1,185,648</text>
<text x="92" y="775" fill="#dce5e0" font-size="29" font-family="Arial, sans-serif">Reductions</text>
<text x="695" y="775" text-anchor="end" fill="#e3d0a7" font-size="31" font-weight="700" font-family="Arial, sans-serif">−$600,000</text>
<line x1="80" y1="797" x2="700" y2="797" stroke="#66818a" stroke-width="2"/>
<text x="92" y="845" fill="#fff2df" font-size="29" font-weight="700" font-family="Arial, sans-serif">June 30, 2004</text>
<text x="695" y="845" text-anchor="end" fill="#fff2df" font-size="35" font-weight="700" font-family="Arial, sans-serif">$19,721,208</text>
<text x="81" y="908" fill="#c5d3d3" font-size="23" font-family="Arial, sans-serif">The roll-forward covers combined judgments,</text>
<text x="81" y="939" fill="#c5d3d3" font-size="23" font-family="Arial, sans-serif">including non-Bohemia litigation. These are</text>
<text x="81" y="970" fill="#c5d3d3" font-size="23" font-family="Arial, sans-serif">accounting entries, not claimant receipts.</text>
<text x="80" y="1008" fill="#a6b5b3" font-size="20" font-family="Arial, sans-serif">SOURCE: FY2004 audit, Notes 13 &amp; 21, pp. 55, 66–67.</text>
</svg>

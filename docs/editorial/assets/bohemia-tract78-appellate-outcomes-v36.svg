<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc">
<title id="title">Tract 78: a deed returned, three different court outcomes</title>
<desc id="desc">Original documentary diagram. The 2012 Louisiana Fourth Circuit opinion reports that Tract 78 was returned on August 9, 2005 and recorded on August 25. The appellate court affirmed $996,596.40 past revenues and $366,957.12 statutory interest, reversed $365,777.34 additional interest characterized as civil fruits, and affirmed unquantified legal interest. No bank payment or final distribution is documented by this graphic.</desc>
<rect width="960" height="1120" fill="#181A19"/>
<rect x="54" y="48" width="8" height="104" rx="4" fill="#C5A875"/>
<text x="90" y="82" fill="#C5A875" font-family="Georgia,serif" font-size="25" letter-spacing="3">FINAL VESTIGE STUDIOS  /  DOCUMENTARY EVIDENCE</text>
<text x="90" y="126" fill="#F1EDE3" font-family="Georgia,serif" font-size="48" font-weight="bold">The deed came back.</text>
<text x="90" y="178" fill="#F1EDE3" font-family="Georgia,serif" font-size="48" font-weight="bold">The interest did not all survive.</text>
<text x="60" y="232" fill="#B3B6B1" font-family="Arial,sans-serif" font-size="22">BOHEMIA TRACT 78 · LOUISIANA FOURTH CIRCUIT · SEPT. 26, 2012</text>
<path d="M60 261 H900" stroke="#525A53" stroke-width="2"/>
<text x="60" y="316" fill="#E6E3D7" font-family="Arial,sans-serif" font-weight="bold" font-size="25">THE RETURN</text>
<rect x="60" y="342" width="840" height="148" rx="16" fill="#262C29" stroke="#657067" stroke-width="2"/>
<text x="88" y="390" fill="#C5A875" font-family="Arial,sans-serif" font-size="25" font-weight="bold">JUNE 3, 2005</text>
<text x="330" y="390" fill="#F1EDE3" font-family="Arial,sans-serif" font-size="27">Successors certified by DNR</text>
<path d="M88 415 H872" stroke="#4D5750"/>
<text x="88" y="460" fill="#C5A875" font-family="Arial,sans-serif" font-size="25" font-weight="bold">AUG. 9, 2005</text>
<text x="330" y="460" fill="#F1EDE3" font-family="Arial,sans-serif" font-size="26">Land conveyed; recorded Aug. 25</text>
<text x="60" y="550" fill="#E6E3D7" font-family="Arial,sans-serif" font-weight="bold" font-size="25">THE APPEAL'S THREE MEASURED AMOUNTS</text>
<rect x="60" y="580" width="840" height="118" rx="15" fill="#26372E" stroke="#709B77" stroke-width="2"/>
<text x="86" y="624" fill="#D4E8D6" font-family="Arial,sans-serif" font-size="23">PAST REVENUES</text>
<text x="86" y="673" fill="#FFF9EE" font-family="Arial,sans-serif" font-size="39" font-weight="bold">$996,596.40</text>
<rect x="690" y="611" width="174" height="55" rx="28" fill="#3B6149"/><text x="777" y="647" text-anchor="middle" fill="#F0F9EF" font-family="Arial,sans-serif" font-size="24" font-weight="bold">AFFIRMED</text>
<rect x="60" y="715" width="840" height="118" rx="15" fill="#26372E" stroke="#709B77" stroke-width="2"/>
<text x="86" y="759" fill="#D4E8D6" font-family="Arial,sans-serif" font-size="23">STATUTORY INTEREST</text>
<text x="86" y="808" fill="#FFF9EE" font-family="Arial,sans-serif" font-size="39" font-weight="bold">$366,957.12</text>
<rect x="690" y="746" width="174" height="55" rx="28" fill="#3B6149"/><text x="777" y="782" text-anchor="middle" fill="#F0F9EF" font-family="Arial,sans-serif" font-size="24" font-weight="bold">AFFIRMED</text>
<rect x="60" y="850" width="840" height="118" rx="15" fill="#372E2B" stroke="#A67E71" stroke-width="2"/>
<text x="86" y="894" fill="#F0D3CA" font-family="Arial,sans-serif" font-size="23">ADDITIONAL “CIVIL FRUITS” INTEREST</text>
<text x="86" y="943" fill="#FFF9EE" font-family="Arial,sans-serif" font-size="39" font-weight="bold">$365,777.34</text>
<rect x="690" y="881" width="174" height="55" rx="28" fill="#775047"/><text x="777" y="917" text-anchor="middle" fill="#FFF4F0" font-family="Arial,sans-serif" font-size="24" font-weight="bold">REVERSED</text>
<text x="60" y="1017" fill="#F1EDE3" font-family="Arial,sans-serif" font-size="23">Legal interest was also affirmed, without a dollar total in the opinion.</text>
<text x="60" y="1054" fill="#C5A875" font-family="Arial,sans-serif" font-size="23" font-weight="bold">A judicial award is not proof of a cleared payment.</text>

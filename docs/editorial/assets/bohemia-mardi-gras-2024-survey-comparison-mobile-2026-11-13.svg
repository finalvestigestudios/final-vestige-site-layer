<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="title desc">
<title id="title">Mardi Gras Pass 2023 and 2024 January survey comparison</title>
<desc id="desc">Width unchanged at 263 feet from January 2023 to January 2024. Mean cross-sectional area decreased from 6247 to 6201 square feet, about 0.7 percent, across 45 transects. Not a direct flow measurement.</desc>
<rect width="600" height="820" fill="#141817"/>
<rect x="21" y="21" width="558" height="778" rx="18" fill="#1b211e" stroke="#3f5145" stroke-width="2"/>
<text x="48" y="69" fill="#d2b98b" font-family="Arial,sans-serif" font-size="17" letter-spacing="1.8">FINAL VESTIGE · EVIDENCE</text>
<text x="48" y="122" fill="#f7f0e3" font-family="Georgia,serif" font-size="37">The pass did not</text>
<text x="48" y="165" fill="#f7f0e3" font-family="Georgia,serif" font-size="37">keep widening</text>
<text x="48" y="200" fill="#c7cbbf" font-family="Arial,sans-serif" font-size="20">Mardi Gras Pass · January surveys</text>
<path d="M48 228 H552" stroke="#48534a" stroke-width="2"/>
<text x="48" y="267" fill="#d2b98b" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.3">AVERAGE WIDTH</text>
<text x="48" y="311" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">2023</text>
<text x="423" y="311" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">263 ft</text>
<rect x="120" y="289" width="285" height="26" rx="6" fill="#303a34"/><rect x="120" y="289" width="249.85" height="26" rx="6" fill="#c9a96d"/>
<text x="48" y="358" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">2024</text>
<text x="423" y="358" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">263 ft</text>
<rect x="120" y="335" width="285" height="26" rx="6" fill="#303a34"/><rect x="120" y="335" width="249.85" height="26" rx="6" fill="#c9a96d"/>
<path d="M48 398 H552" stroke="#48534a" stroke-width="2"/>
<text x="48" y="436" fill="#d2b98b" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.3">MEAN CROSS-SECTION</text>
<text x="48" y="468" fill="#abb5aa" font-family="Arial,sans-serif" font-size="17">Area, not volume of water per second</text>
<text x="48" y="514" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">2023</text>
<text x="415" y="514" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="22">6,247 ft²</text>
<rect x="120" y="492" width="280" height="26" rx="6" fill="#303a34"/><rect x="120" y="492" width="269.1" height="26" rx="6" fill="#77ac9d"/>
<text x="48" y="560" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="23">2024</text>
<text x="415" y="560" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="22">6,201 ft²</text>
<rect x="120" y="538" width="280" height="26" rx="6" fill="#303a34"/><rect x="120" y="538" width="267.1" height="26" rx="6" fill="#77ac9d"/>
<path d="M48 593 H552" stroke="#48534a" stroke-width="2"/>
<text x="48" y="640" fill="#f7f0e3" font-family="Arial,sans-serif" font-size="27">−0.7% change</text>
<text x="48" y="669" fill="#d2d6ca" font-family="Arial,sans-serif" font-size="19">45 transects, two surveys.</text>
<text x="48" y="701" fill="#d2d6ca" font-family="Arial,sans-serif" font-size="19">Not a permanence claim.</text>

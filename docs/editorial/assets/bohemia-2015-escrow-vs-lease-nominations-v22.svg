<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway: two separate votes at one 2015 board meeting</title>
<desc id="desc">On March 19, 2015, the flood authority voted eight to zero to authorize closure of the Bohemia claims escrow. Immediately afterward, it voted seven to one to authorize mineral lease nominations for three approximately sized tracts, 463, 233 and 585 acres. Both were authorizations, not evidence of payment or an executed lease.</desc>
<rect width="600" height="860" fill="#11191d"/>
<rect x="28" y="28" width="544" height="804" rx="18" fill="none" stroke="#566062" stroke-width="2"/>
<text x="52" y="76" fill="#c7a870" font-size="15" font-weight="700" font-family="DejaVu Sans, sans-serif" letter-spacing="2">FINAL VESTIGE · SOURCE DIAGRAM</text>
<text x="52" y="124" fill="#f1f0e9" font-size="30" font-weight="700" font-family="DejaVu Sans, sans-serif">One meeting.</text>
<text x="52" y="163" fill="#f1f0e9" font-size="30" font-weight="700" font-family="DejaVu Sans, sans-serif">Two separate votes.</text>
<text x="52" y="200" fill="#b8c1c2" font-size="16" font-family="DejaVu Sans, sans-serif">March 19, 2015 · Louisiana flood authority</text>
<line x1="52" y1="229" x2="548" y2="229" stroke="#536063"/>
<rect x="52" y="254" width="496" height="158" rx="12" fill="#222d31" stroke="#4a5b60"/>
<text x="72" y="284" fill="#c7a870" font-size="17" font-weight="700" font-family="DejaVu Sans, sans-serif">RESOLUTION 03-19-15-12</text>
<text x="72" y="321" fill="#f1f0e9" font-size="24" font-weight="700" font-family="DejaVu Sans, sans-serif">Escrow closure</text>
<text x="72" y="351" fill="#d0d9d8" font-size="17" font-family="DejaVu Sans, sans-serif">8–0 · Authorized remaining funds to move</text>
<text x="72" y="379" fill="#d0d9d8" font-size="17" font-family="DejaVu Sans, sans-serif">to a district general-fund account</text>
<path d="M300 423 v32 m-10 -10 l10 10 l10 -10" stroke="#c7a870" stroke-width="3" fill="none"/>
<rect x="52" y="472" width="496" height="220" rx="12" fill="#222d31" stroke="#4a5b60"/>
<text x="72" y="504" fill="#c7a870" font-size="17" font-weight="700" font-family="DejaVu Sans, sans-serif">RESOLUTION 03-19-15-13</text>
<text x="72" y="541" fill="#f1f0e9" font-size="24" font-weight="700" font-family="DejaVu Sans, sans-serif">Mineral lease nominations</text>
<text x="72" y="572" fill="#d0d9d8" font-size="17" font-family="DejaVu Sans, sans-serif">7–1 · Three proposed nomination areas:</text>
<text x="87" y="606" fill="#f1f0e9" font-size="20" font-weight="700" font-family="DejaVu Sans, sans-serif">≈463 acres   ≈233 acres   ≈585 acres</text>
<text x="72" y="637" fill="#b8c1c2" font-size="15" font-family="DejaVu Sans, sans-serif">One member raised possible subsidence concerns</text>
<text x="72" y="662" fill="#b8c1c2" font-size="15" font-family="DejaVu Sans, sans-serif">from mineral extraction</text>
<text x="52" y="732" fill="#f1f0e9" font-size="19" font-weight="700" font-family="DejaVu Sans, sans-serif">Authorization ≠ completed transaction.</text>
<text x="52" y="759" fill="#d0d9d8" font-size="15" font-family="DejaVu Sans, sans-serif">Minutes do not prove bank transfer, lease award,</text>
<text x="52" y="782" fill="#d0d9d8" font-size="15" font-family="DejaVu Sans, sans-serif">parcel overlap, or individual claimant payment.</text>
<text x="52" y="814" fill="#a0acab" font-size="12" font-family="DejaVu Sans, sans-serif">Source: SLFPA–East board minutes, March 19, 2015, pp. 24–26</text>
</svg>
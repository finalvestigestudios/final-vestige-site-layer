<title id="ttl">Three Decisions, Not One — Bohemia leasing paper trail</title>
<desc id="desc">Original FV Studios timeline. July 25 2024: commercial real estate committee recommended approval of Schroeder's approximately 107-acre application. The full Lakefront Management Authority board voted 9 to 0 to delegate mineral-leasing authority but the full board minutes record no outcome on the separately listed application. A state mineral lease award or execution, and resulting payments, are unverified. This diagram does not map property or prove private restitution.</desc>
<metadata>Creator: Final Vestige Studios; Created: 2026-11-17; Copyright: © 2026 Final Vestige Studios; Rights: original editorial evidence schematic; not a historical source image. Primary sources: https://nolalakefront.com/wp-content/uploads/2024/10/25-JULY-2024-Commercial-Real-estate-Committee-Minutes_Approved-9.19.2024.pdf ; https://nolalakefront.com/wp-content/uploads/2025/08/JULY-25-2024-Board-Minutes_approved.pdf ; Context: https://www.dce.louisiana.gov/state-mineral-and-energy-board . Art does not assert a lease was awarded or that claimants were paid.</metadata>

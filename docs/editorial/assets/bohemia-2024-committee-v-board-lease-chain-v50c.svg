<text x="58" y="175" font-size="38" font-family="Georgia,serif" font-weight="bold" fill="#f6f1e6">Not One</text>
<text x="58" y="211" font-size="20" font-family="Arial,sans-serif" fill="#cad4dc">Bohemia mineral leasing · July 2024</text>

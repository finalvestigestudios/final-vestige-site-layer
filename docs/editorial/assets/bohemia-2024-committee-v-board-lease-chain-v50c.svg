<text x="138" y="314" font-size="21" font-family="Arial,sans-serif" fill="#f5f1e8">Schroeder's ~107-acre application:</text>
<text x="138" y="346" font-size="21" font-family="Arial,sans-serif" fill="#f5f1e8">favorable recommendation passed.</text>
<text x="138" y="382" font-size="17" font-family="Arial,sans-serif" fill="#b9c9d5">LMA Commercial Real Estate Committee [17]</text>
<circle cx="85" cy="493" r="10" fill="#d3b27a"/>
<rect x="118" y="435" width="509" height="184" rx="13" fill="#233440" stroke="#718390"/>
<text x="138" y="470" font-size="21" font-family="Arial,sans-serif" font-weight="bold" fill="#f5db9c">02  FULL BOARD · TWO ITEMS</text>
<text x="138" y="508" font-size="21" font-family="Arial,sans-serif" fill="#f5f1e8">Delegation to state board passed 9–0.</text>
<text x="138" y="544" font-size="21" font-family="Arial,sans-serif" fill="#f5f1e8">Application separately listed;</text>
<text x="138" y="576" font-size="21" font-family="Arial,sans-serif" fill="#f5f1e8">no board disposition recorded.</text>
<text x="138" y="604" font-size="17" font-family="Arial,sans-serif" fill="#b9c9d5">LMA full-board minutes [15]</text>

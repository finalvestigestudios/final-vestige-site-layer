<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
<title id="title">Bohemia Spillway 2002: a restricted investment and two unpaid judgments</title>
<desc id="desc">The Orleans Levee District reported 639,356 dollars in investments reserved for Bohemia litigation at June 30, 2002. Separately it reported 1,722,845 dollars unpaid in Vogt and 16,077,350 dollars unpaid in Haspel and Davis, totaling 17,800,195 dollars in judgments payable. These are different accounting categories; no individual payment or contemporary balance can be inferred.</desc>
<rect width="1000" height="930" rx="30" fill="#121d24"/>
<rect x="44" y="38" width="9" height="78" rx="4" fill="#d4a866"/>
<text x="76" y="66" fill="#f5e9d5" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" letter-spacing="2">FINAL VESTIGE / EVIDENCE FIGURE 25</text>
<text x="76" y="108" fill="#b9c6c9" font-family="Arial,Helvetica,sans-serif" font-size="27">ORLEANS LEVEE DISTRICT · JUNE 30, 2002</text>
<text x="52" y="181" fill="#ffffff" font-family="Georgia,serif" font-size="52" font-weight="bold">The reserve was not the judgment.</text>
<text x="52" y="223" fill="#c2cdd0" font-family="Arial,Helvetica,sans-serif" font-size="29">One financial report. Two different accounting categories.</text>
<rect x="51" y="272" width="898" height="186" rx="17" fill="#233842" stroke="#47616a" stroke-width="2"/>
<text x="80" y="318" fill="#bad1d9" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="bold">RESTRICTED INVESTMENT / ASSET</text>
<text x="80" y="389" fill="#f6c883" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="bold">$639,356</text>
<text x="80" y="432" fill="#f0f5f3" font-family="Arial,Helvetica,sans-serif" font-size="28">Investments held for Bohemia litigation</text>
<rect x="51" y="487" width="898" height="264" rx="17" fill="#26303b" stroke="#566575" stroke-width="2"/>
<text x="80" y="531" fill="#c7d5e1" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="bold">JUDGMENTS PAYABLE / LIABILITY</text>
<text x="80" y="595" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="34">Vogt &amp; Edgecombe, reported unpaid</text>
<text x="905" y="595" text-anchor="end" fill="#f5e7ce" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold">$1,722,845</text>
<line x1="80" y1="620" x2="910" y2="620" stroke="#50606d" stroke-width="2"/>
<text x="80" y="672" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="34">Haspel &amp; Davis, reported unpaid</text>
<text x="905" y="672" text-anchor="end" fill="#f5e7ce" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold">$16,077,350</text>
<line x1="80" y1="698" x2="910" y2="698" stroke="#50606d" stroke-width="2"/>
<text x="80" y="737" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="bold">Reported total</text>
<text x="905" y="737" text-anchor="end" fill="#f6c883" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="bold">$17,800,195</text>
<text x="51" y="805" fill="#f4dcad" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="bold">DO NOT SUBTRACT THESE AS A VERIFIED PAYMENT GAP.</text>
<text x="51" y="850" fill="#d0dade" font-family="Arial,Helvetica,sans-serif" font-size="26">A reserve and a judgment are not a bank reconciliation or payee receipt.</text>
<text x="51" y="895" fill="#aebfc6" font-family="Arial,Helvetica,sans-serif" font-size="24">Source: Louisiana Legislative Auditor, FY2002 report, pp. 18, 51, 54.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" role="img" aria-labelledby="fv-mardi-mobile-title fv-mardi-mobile-desc"><title id="fv-mardi-mobile-title">Mardi Gras Pass: observed, modeled and measured records</title><desc id="fv-mardi-mobile-desc">NASA's documented 2012 breach; a 2020 model predicting no near-term river-course avulsion in a 20-year scenario; and a 2024 field report showing 263-foot mean width both years and 0.7-percent smaller mean cross-sectional area. The forecast is not a measurement.</desc><rect width="390" height="980" fill="#101b24"/><text x="18" y="36" font-size="11" font-weight="700" letter-spacing="1.5" fill="#dda95f">FINAL VESTIGE / EVIDENCE NOTE</text><text x="18" y="79" font-size="23" font-weight="700" fill="#f6f1e4">A forecast is not</text><text x="18" y="108" font-size="23" font-weight="700" fill="#f6f1e4">a measurement</text><g><rect x="17" y="151" width="356" height="236" rx="14" fill="#182936" stroke="#355161"/><text x="35" y="195" font-size="30" font-weight="700" fill="#dda95f">2012</text><text x="35" y="221" font-size="10.5" font-weight="700" letter-spacing=".5" fill="#b1bfbd">OBSERVED / RETROSPECTIVE</text><text x="35" y="254" font-size="18" font-weight="700" fill="#f6f1e4">A new channel opened</text><text x="35" y="288" font-size="12.8" fill="#d2dfdf">NASA dates the breach to February 2012</text><text x="35" y="324" font-size="12.8" fill="#d2dfdf">Satellite comparison: 2007 and 2023</text><text x="35" y="371" font-size="11.5" fill="#b1bfbd">NASA Earth Observatory [9]</text></g><g><rect x="17" y="402" width="356" height="236" rx="14" fill="#182936" stroke="#355161"/><text x="35" y="446" font-size="30" font-weight="700" fill="#dda95f">2020</text><text x="35" y="472" font-size="10.5" font-weight="700" letter-spacing=".5" fill="#b1bfbd">MODELED / CONDITIONAL</text><text x="35" y="505" font-size="18" font-weight="700" fill="#f6f1e4">A river-course forecast</text><text x="35" y="539" font-size="12.8" fill="#d2dfdf">Delft3D study: 20-year scenario</text><text x="35" y="575" font-size="12.8" fill="#d2dfdf">Near-term avulsion not projected</text><text x="35" y="622" font-size="11.5" fill="#b1bfbd">Hansen, UNO M.S. thesis [41]</text></g><g><rect x="17" y="653" width="356" height="236" rx="14" fill="#182936" stroke="#355161"/><text x="35" y="697" font-size="30" font-weight="700" fill="#dda95f">2024</text><text x="35" y="723" font-size="10.5" font-weight="700" letter-spacing=".5" fill="#b1bfbd">OBSERVED / FIELD SURVEY</text><text x="35" y="756" font-size="18" font-weight="700" fill="#f6f1e4">One year of modest change</text><text x="35" y="790" font-size="12.8" fill="#d2dfdf">Mean width: 263 ft in 2023 and 2024</text><text x="35" y="826" font-size="12.8" fill="#d2dfdf">Mean cross-section: down 0.7%</text><text x="35" y="873" font-size="11.5" fill="#b1bfbd">Pontchartrain Conservancy [39]</text></g><text x="18" y="933" font-size="12.7" font-weight="700" fill="#f6f1e4">One observed year does not prove a</text><text x="18" y="952" font-size="12.7" fill="#f6f1e4">20-year forecast. Sources [9], [39], [41].</text></svg>
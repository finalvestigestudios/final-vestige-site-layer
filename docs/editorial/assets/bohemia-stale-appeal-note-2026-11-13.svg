<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" width="420" height="760" role="img" aria-labelledby="tit desc">
<title id="tit">The same Bohemia royalty figure, two incompatible descriptions</title>
<desc id="desc">An evidence comparison of a Louisiana appellate opinion and Orleans Levee District audited financial statement notes. The April 2005 court decision identifies 166,842 dollars and 53 cents as stipulated royalty principal and reverses attorney fees. A financial statement published in October 2005 describes the same dollar amount as interest and attorney fees still on appeal, and the 2006 statement repeats that description. The evidence is not reconciled and no bank receipt is shown.</desc>
<rect width="420" height="760" fill="#171c1c"/>
<rect x="18" y="18" width="384" height="724" rx="16" fill="#202827" stroke="#526361" stroke-width="1"/>
<text x="38" y="51" fill="#c7ad7e" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">FINAL VESTIGE / EVIDENCE FILE</text>
<text x="38" y="90" fill="#f7f0e4" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold">One figure.</text>
<text x="38" y="119" fill="#f7f0e4" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold">Two descriptions.</text>
<text x="38" y="150" fill="#c9d2ca" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">Taylor succession / Bohemia Spillway</text>
<rect x="38" y="175" width="344" height="159" rx="10" fill="#2d3936"/>
<rect x="38" y="175" width="5" height="159" rx="2" fill="#b9d4c2"/>
<text x="57" y="201" fill="#b9d4c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold">APRIL 6, 2005 · APPELLATE COURT</text>
<text x="57" y="239" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold">$166,842.53</text>
<text x="57" y="266" fill="#f2e6cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">Stipulated royalty principal</text>
<text x="57" y="292" fill="#d8e0da" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Attorney-fee award reversed;</text>
<text x="57" y="309" fill="#d8e0da" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">interest terms affirmed</text>
<line x1="210" y1="346" x2="210" y2="363" stroke="#a3aca6" stroke-width="2" stroke-dasharray="3 4"/>
<path d="M205 360 L210 366 L215 360" fill="none" stroke="#a3aca6" stroke-width="2"/>
<rect x="38" y="376" width="344" height="160" rx="10" fill="#39352d"/>
<rect x="38" y="376" width="5" height="160" rx="2" fill="#dbbc84"/>
<text x="57" y="402" fill="#e2c38b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold">OCT. 26, 2005 · FINANCIAL REPORT</text>
<text x="57" y="440" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="bold">$166,842.53</text>
<text x="57" y="466" fill="#f2e6cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">Described as interest and fees</text>
<text x="57" y="491" fill="#e7d9c1" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Reported as still on appeal;</text>
<text x="57" y="509" fill="#e7d9c1" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">FY2006 note repeats this wording</text>
<rect x="38" y="555" width="344" height="75" rx="10" fill="#202827" stroke="#8f8170" stroke-dasharray="4 4"/>
<text x="55" y="582" fill="#f0d8a8" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold">DISCREPANCY UNRESOLVED</text>
<text x="55" y="603" fill="#d0d9d3" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Not a second payment or cleared receipt.</text>
<text x="55" y="619" fill="#d0d9d3" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Underlying ledger still needed.</text>
<line x1="38" y1="651" x2="382" y2="651" stroke="#526361"/>
<text x="38" y="672" fill="#c4cfc8" font-family="DejaVu Sans, Arial, sans-serif" font-size="10">SOURCES: Frank v. Orleans Levee Board (2005);</text>
<text x="38" y="689" fill="#c4cfc8" font-family="DejaVu Sans, Arial, sans-serif" font-size="10">Orleans Levee District FY2005 p. 64, FY2006 pp. 53–54.</text>
<text x="38" y="716" fill="#a7b4aa" font-family="DejaVu Sans, Arial, sans-serif" font-size="10">Original source-derived chart · FV Studios · Nov 13, 2026</text>

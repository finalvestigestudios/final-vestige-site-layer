<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1000" viewBox="0 0 560 1000" role="img" aria-labelledby="title description">
<title id="title">March 19, 2015: the Bohemia escrow closure vote and a separate mineral-interest vote</title>
<desc id="description">An original documentary timeline. The 2015 flood authority minutes recap a 1997 statutory escrow condition and a 1998 resolution authorizing an account and reserved fund balance. In 2015, the board voted unanimously to close the escrow account and transfer its balance into the Orleans Levee District General Fund. In a separate 7 to 1 vote that day, it authorized Plaquemines Parish mineral lease nominations. Neither vote proves named-claimant payments or executed leases; parcel overlap is unverified.</desc>
<rect width="560" height="1000" fill="#10151B"/>
<text x="32" y="49" fill="#EFE8DA" font-size="30" font-family="Arial,sans-serif" font-weight="700">THE ESCROW VOTE</text>
<text x="32" y="81" fill="#CFB584" font-size="17" font-family="Arial,sans-serif">Bohemia records · March 19, 2015</text>
<path d="M37 113 L37 754" stroke="#8C7957" stroke-width="3" stroke-dasharray="5 9"/>
<rect x="56" y="128" width="474" height="143" rx="12" fill="#202832" stroke="#34414C"/>
<circle cx="37" cy="157" r="8" fill="#CCAC73"/>
<text x="77" y="157" fill="#D7BD8D" font-size="17" font-family="Arial,sans-serif" font-weight="700">1997 · LEGISLATIVE CONDITION</text>
<text x="77" y="188" fill="#FFF6E6" font-size="21" font-family="Arial,sans-serif" font-weight="700">As recited in the 2015 vote</text>
<text x="77" y="216" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">Disputed-property revenues to be</text>
<text x="77" y="242" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">escrowed until final court disposition.</text>
<rect x="56" y="284" width="474" height="142" rx="12" fill="#202832" stroke="#34414C"/>
<circle cx="37" cy="313" r="8" fill="#CCAC73"/>
<text x="77" y="313" fill="#D7BD8D" font-size="17" font-family="Arial,sans-serif" font-weight="700">1998 · DISTRICT RESOLUTION</text>
<text x="77" y="344" fill="#FFF6E6" font-size="21" font-family="Arial,sans-serif" font-weight="700">Account and reserve authorized</text>
<text x="77" y="372" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">Bank escrow directed by resolution</text>
<text x="77" y="398" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">1-071598; matching fund-balance reserve.</text>
<rect x="56" y="439" width="474" height="164" rx="12" fill="#202832" stroke="#34414C"/>
<circle cx="37" cy="468" r="8" fill="#CCAC73"/>
<text x="77" y="468" fill="#D7BD8D" font-size="17" font-family="Arial,sans-serif" font-weight="700">2015 · RESOLUTION 03-19-15-12</text>
<text x="77" y="499" fill="#FFF6E6" font-size="21" font-family="Arial,sans-serif" font-weight="700">Close and transfer · 8–0</text>
<text x="77" y="527" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">Board approved closing the account</text>
<text x="77" y="553" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">and moving its remaining balance into</text>
<text x="77" y="579" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">a General Fund account. Sum unstated.</text>
<rect x="56" y="616" width="474" height="157" rx="12" fill="#202832" stroke="#34414C"/>
<circle cx="37" cy="645" r="8" fill="#CCAC73"/>
<text x="77" y="645" fill="#D7BD8D" font-size="17" font-family="Arial,sans-serif" font-weight="700">2015 · RESOLUTION 03-19-15-13</text>
<text x="77" y="676" fill="#FFF6E6" font-size="21" font-family="Arial,sans-serif" font-weight="700">Separate mineral action · 7–1</text>
<text x="77" y="704" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">Authorized Plaquemines Parish lease</text>
<text x="77" y="730" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">nominations; no signed lease shown.</text>
<text x="77" y="756" fill="#D1D9DC" font-size="17" font-family="Arial,sans-serif">Bohemia parcel overlap unverified.</text>
<rect x="29" y="790" width="502" height="139" rx="12" fill="#2D2720" stroke="#776648"/>
<text x="48" y="823" fill="#F2D7A6" font-size="18" font-family="Arial,sans-serif" font-weight="700">NOT ESTABLISHED BY THE MINUTES</text>
<text x="48" y="852" fill="#F0E7DB" font-size="17" font-family="Arial,sans-serif">Final bank transfer, closing balance,</text>
<text x="48" y="879" fill="#F0E7DB" font-size="17" font-family="Arial,sans-serif">individual distributions, or land title.</text>
<text x="29" y="958" fill="#A8B2B9" font-size="13" font-family="Arial,sans-serif">Source: SLFPA-E approved minutes, 19 Mar 2015, pp. 24–25.</text>
<text x="29" y="979" fill="#A8B2B9" font-size="13" font-family="Arial,sans-serif">Original evidence diagram © Final Vestige Studios · 2026</text>

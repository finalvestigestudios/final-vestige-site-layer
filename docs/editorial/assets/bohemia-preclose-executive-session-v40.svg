<title id="t">Before the books closed: 2014 Bohemia-related litigation timeline</title>
<desc id="d">Three documented milestones: June 19, 2014 the flood authority board held an executive session with three Bohemia-related cases on the agenda; June 30 fiscal 2014 ended; July 24 the board authorized legal counsel to proceed with a settlement offer. The June 19 board also authorized a separate two-million-dollar maintenance account for storm gates, which is not a Bohemia claimants' fund. Neither meeting record proves a signed agreement, journal entry or claimant payment.</desc>
<rect width="780" height="1100" fill="#f5f2ea"/><rect x="28" y="28" width="724" height="1044" rx="16" fill="#fffdf8" stroke="#aeb4b4" stroke-width="2"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="60" y="87" font-size="19" font-weight="700" letter-spacing="3" fill="#956a38">FINAL VESTIGE  /  INVESTIGATIONS</text><text x="60" y="145" font-size="36" font-weight="700" fill="#192d38">Before the books closed</text><text x="60" y="184" font-size="19" fill="#47606a">What the board minutes do, and do not, establish</text></g>
<path d="M105 263 V733" stroke="#b5c6c2" stroke-width="8" stroke-linecap="round"/><circle cx="105" cy="272" r="19" fill="#225e63"/><circle cx="105" cy="497" r="19" fill="#225e63"/><circle cx="105" cy="721" r="19" fill="#225e63"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#192d38">
<text x="147" y="258" font-size="18" font-weight="700" fill="#956a38">JUNE 19, 2014</text><text x="147" y="298" font-size="26" font-weight="700">Cases on the closed-session agenda</text><text x="147" y="334" font-size="18">Three proceedings were listed for discussion:</text><text x="147" y="365" font-size="18">DNR 563586; Plaquemines 55-774, 61-051.</text><text x="147" y="400" font-size="18">Minutes record an executive session,</text><text x="147" y="430" font-size="18">not its private advice or settlement terms.</text>
<text x="147" y="484" font-size="18" font-weight="700" fill="#956a38">JUNE 30, 2014</text><text x="147" y="522" font-size="26" font-weight="700">Fiscal-year cutoff</text><text x="147" y="558" font-size="18">The June 30 judgment-liability balance</text><text x="147" y="588" font-size="18">requires accounting records to explain</text><text x="147" y="618" font-size="18">what was recognized by that date.</text>
<text x="147" y="709" font-size="18" font-weight="700" fill="#956a38">JULY 24, 2014</text><text x="147" y="747" font-size="26" font-weight="700">Authorization to make an offer</text><text x="147" y="783" font-size="18">Resolution 07-24-14-10 approved counsel</text><text x="147" y="813" font-size="18">proceeding with a settlement offer.</text><text x="147" y="843" font-size="18">No executed deal or payment shown.</text></g>
<rect x="58" y="877" width="664" height="121" rx="12" fill="#e7edf0"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#193642"><text x="78" y="907" font-size="17" font-weight="700">DO NOT CONFUSE TWO ESCROWS</text><text x="78" y="938" font-size="17">The June 19 board also approved a separate $2m</text><text x="78" y="965" font-size="17">storm-gate maintenance reserve, not a claimant fund.</text></g>
<text x="60" y="1034" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#506169">Sources: SLFPA-East board minutes, June 19 (pp. 22–23, 26–27), July 24, 2014 (pp. 12–13).</text><text x="60" y="1052" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#506169">© Final Vestige Studios · 15 Nov 2026 · original analytical diagram · not a historical map.</text>

<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1">

<script>(()=>{const box=document.querySelector('[data-fvx-chronology]');const $=(root,sel)=>root.querySelector(sel);const $$=(root,sel)=>[...root.querySelectorAll(sel)];const range=$(box,'[data-fvx-chrono-tool] input[type=range]');const update=()=>{const t=Number(range.value);const photos = $(box, '[data-fvx-chrono-photo]');if(photos.length === 3) {const index=t<6?0:(t<11.3?1:2);photos.forEach((photo,i)=>{photo.hidden=i!==index;photo.classList.toggle('is-current',i===index)});const pos=$(box,'[data-fvx-chrono-position]');pos.hidden=false;pos.textContent='Context photo '+(index+1)+' of 3 · These photographs do not depict the marked seconds.';}};range.addEventListener('input',update);update();$(box,'[data-fvx-chrono-tool]').hidden=false;})();</script>

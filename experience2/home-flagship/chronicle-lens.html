<!-- Enhances the real 1847 and 1848 note articles. Hidden until optional JS initializes. -->
<div class="fv-hf__chronicle-lens" data-fv-chronicle-lens hidden>
  <div class="fv-hf__chronicle-lens-heading">
    <span>READ THE SURVIVING RECORD</span>
    <p>Choose a dated entry, then return to the complete sheet.</p>
  </div>
  <div class="fv-hf__chronicle-lens-actions" role="group" aria-label="Choose how to read the Victory Point note">
    <button type="button" data-fv-chronicle-view="original" aria-pressed="false"><span aria-hidden="true">01</span> Original · 1847</button>
    <button type="button" data-fv-chronicle-view="addition" aria-pressed="false"><span aria-hidden="true">02</span> Addition · 1848</button>
    <button type="button" data-fv-chronicle-view="both" aria-pressed="true"><span aria-hidden="true">03</span> Compare both</button>
  </div>
  <p class="fv-hf__chronicle-lens-status" data-fv-chronicle-lens-status role="status" aria-live="polite" aria-atomic="true">Both entries are visible. The original and later addition share one surviving sheet.</p>
</div>

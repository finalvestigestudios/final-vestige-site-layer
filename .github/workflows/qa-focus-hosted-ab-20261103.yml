name: Focus hosted browser in-memory conditional-gift A/B (HOLD)
on:
  pull_request:
    paths:
      - 'qa/focus_hosted_ab_20261103/**'
      - '.github/workflows/qa-focus-hosted-ab-20261103.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-only fail-closed contract suite
        run: |
          cd qa/focus_hosted_ab_20261103
          python -m py_compile baseline.py candidate.py test_candidate.py
          python -m unittest -v test_candidate.py
  hosted-candidate:
    needs: offline-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium engine
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Compare real anonymous Focus baseline and in-memory correction only
        run: python qa/focus_hosted_ab_20261103/candidate.py --out focus-hosted-ab-evidence
      - name: Preserve evidence even when the gate holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-hosted-inmemory-ab-HOLD
          path: focus-hosted-ab-evidence/
          if-no-files-found: warn
          retention-days: 7

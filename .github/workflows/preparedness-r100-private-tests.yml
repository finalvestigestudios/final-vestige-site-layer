name: Preparedness R100 Printed Planner Assumptions and Source Custody (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r99-print-css-baseline-semantics-hold-20261103
    paths:
      - preparedness/tools/r100_printed_planner_context_custody.py
      - preparedness/tests/test_r100_printed_planner_context_custody.py
      - preparedness/docs/R100_PRINTED_PLANNER_CONTEXT_SOURCE_HOLD.md
      - .github/workflows/preparedness-r100-private-tests.yml
permissions:
  contents: read
jobs:
  private-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm frozen R99 parent, seven cluster refs and additive-only R100
        run: |
          python -I - <<'PY'
          import subprocess
          base = "dcbe4a736fbf36b9a33741ea23df29634952a2f2"
          actual_parent = subprocess.check_output(
              ["git", "rev-parse", "refs/remotes/origin/review/preparedness-r99-print-css-baseline-semantics-hold-20261103"], text=True).strip()
          assert actual_parent == base, ("R99 parent changed", actual_parent, base)
          actual = set(subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True).splitlines())
          expected = {
              "A\tpreparedness/tools/r100_printed_planner_context_custody.py",
              "A\tpreparedness/tests/test_r100_printed_planner_context_custody.py",
              "A\tpreparedness/docs/R100_PRINTED_PLANNER_CONTEXT_SOURCE_HOLD.md",
              "A\t.github/workflows/preparedness-r100-private-tests.yml",
          }
          assert actual == expected, (actual, expected)
          pins = {
              "claude/prep-start-bbfeb8": "2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e": "5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55": "f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444": "d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19": "67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38": "7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767": "4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101": "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for ref, pin in pins.items():
              actual_ref = subprocess.check_output(["git", "rev-parse", "refs/remotes/origin/" + ref], text=True).strip()
              assert actual_ref == pin, (ref, actual_ref, pin)
          print("R100 exact parent and eight source refs verified; release HOLD.")
          PY
      - name: Compile and execute 56 isolated R100 adversarial tests
        run: |
          python -I -m compileall -q preparedness/tools/r100_printed_planner_context_custody.py preparedness/tests/test_r100_printed_planner_context_custody.py
          python -I -m unittest discover -s preparedness/tests -p test_r100_printed_planner_context_custody.py -v
      - name: Run actual private 35+1 draft / print assumption / source citation custody
        run: |
          python -I preparedness/tools/r100_printed_planner_context_custody.py --private-json-stdout > "$RUNNER_TEMP/private-r100.json"
          python -I - <<'PY'
          import json, os, pathlib
          x = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-r100.json").read_text())
          assert x["schema"] == "r100-private-print-planner-context-custody-v1"
          assert x["release_state"] == "HOLD" and x["may_publish"] is False
          assert x["hidden_print_assumption_fields"] == [
              "wp-days", "wp-extra", "wp-filled", "wp-hot",
              "wp-people", "wp-petgal", "wp-pets", "wp-stored"]
          assert x["cited_source_ids_NOT_HUMAN_VERIFIED"] == [
              "cdc-water-store", "ready-pets", "ready-water"]
          assert x["human_source_claim_review"] == "NOT_REVIEWED"
          assert x["qualified_water_and_medical_safety_review"] == "NOT_REVIEWED"
          assert x["browser_print_verification"] == "NOT_REVIEWED"
          assert x["independent_QD"] == "NOT_REVIEWED"
          assert x["prior_36_draft_custody_seal"] and x["sha256_seal"]
          print("R100 35+1 private draft source/print assumptions audited, HOLD.")
          PY
      - name: Original validation and offline private WordPress-ready draft generation
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Complete Python regression suite (36+)
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Human source, qualified safety, QD and mandatory release integrity remain unapproved
        if: always()
        run: echo 'PRIVATE HOLD; no CMS, WordPress, publishing, nav, human medical approval or QD PASS.'

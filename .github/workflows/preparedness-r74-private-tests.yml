name: Preparedness R74 Quantity Context & Citation Custody (PRIVATE HOLD)
on:
  pull_request:
    branches: [review/preparedness-r73-consequential-action-triage-hold-20261102]
    paths:
      - preparedness/tools/r74_quantity_context_custody.py
      - preparedness/tests/test_r74_quantity_context_custody.py
      - preparedness/docs/R74_QUANTITY_CONTEXT_AND_SOURCE_CUSTODY_HOLD.md
      - .github/workflows/preparedness-r74-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r74-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-draft-scope-and-citation-custody:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read-only PR checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R73 exact base and four additive private R74 files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "a59ae75355e49e06330063f49093ab2a59c62d31"
          test "$BASE_REF" = "review/preparedness-r73-consequential-action-triage-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r74-quantity-context-custody-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r74-changed-paths
          python -I - <<'PY'
          from pathlib import Path
          observed={x.decode() for x in Path("/tmp/r74-changed-paths").read_bytes().split(b"\0") if x}
          permitted={
            "preparedness/tools/r74_quantity_context_custody.py",
            "preparedness/tests/test_r74_quantity_context_custody.py",
            "preparedness/docs/R74_QUANTITY_CONTEXT_AND_SOURCE_CUSTODY_HOLD.md",
            ".github/workflows/preparedness-r74-private-tests.yml"
          }
          assert observed==permitted,(observed,permitted)
          print("R74 exactly four additive review-only files")
          PY
      - name: Check seven Claude branch SHAs and separate RC SHA
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          expected={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":
                "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for branch,sha in expected.items():
              observed=subprocess.check_output(["git","rev-parse","--verify",
                  "refs/remotes/origin/"+branch+"^{commit}"],text=True).strip()
              assert observed==sha,(branch,observed,sha)
          print("Seven contributor refs and separate RC pinned; not source truth")
          PY
      - name: Syntax compile without bytecode writes
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for s in ("preparedness/tools/r74_quantity_context_custody.py",
                    "preparedness/tests/test_r74_quantity_context_custody.py"):
              compile(Path(s).read_text(encoding="utf-8"),s,"exec")
          print("Python syntax PASS")
          PY
      - name: 36+ isolated R74 synthetic and adversarial tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r74_quantity_context_custody.py -v
      - name: Exact private release-candidate quantity/citation/source census
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import importlib.util,io,csv,json
          path=Path("preparedness/tools/r74_quantity_context_custody.py")
          spec=importlib.util.spec_from_file_location("r74_ci",path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          report=mod.live_report()
          mod.sealed(report,mod.SCHEMA)
          c=report["counts"]
          assert tuple(c[k] for k in ("articles","tools",
             "complete_origin_scoped_source_readings","citation_occurrences",
             "unabridged_DOM_blocks"))==(35,6,244,2173,4070),c
          assert c["parent_action_triage_packets"]==975,c
          assert c["DOM_blocks_with_matching_numeric_units"]>0,c
          assert c["numeric_unit_occurrences"]>=c["DOM_blocks_with_matching_numeric_units"],c
          assert all(report[k] is False for k in mod.HOLD)
          assert all(c[k]==0 for k in ("human_source_or_claim_reviews",
                         "human_qualified_safety_reviews","independent_QD_approvals"))
          assert report==mod.live_report(),"R74 nondeterministic generation"
          rows=list(csv.DictReader(io.StringIO(mod.csv_review_packets(report))))
          assert len(rows)==c["DOM_blocks_with_matching_numeric_units"],c
          print("R74 PRIVATE reviewer-only quantity inventory",json.dumps(c,sort_keys=True))
          print("Quantity collisions are NOT contradictions; context is NOT safety clearance.")
          PY
      - name: Native source/evidence safety-state validation
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready private draft build only
        run: python -I preparedness/tools/build.py
      - name: Full native Preparedness Python test regression
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Do not bypass mandatory release integrity / independent QD
        if: always()
        run: |
          echo 'HOLD: separate seven_cluster_git_parity and mandatory 13-stage integrity remain unpassed.'
          echo 'No human source links, medical/safety conclusions, WordPress writes, nav, merges or publishing.'

# Exact-HEAD browser proof for draft PR #565 only. Never deploys or touches a CMS.
name: EX2 flagship locked-candidate browser admission
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experience2/home-flagship/**'
      - '.github/workflows/ex2-flagship-pr565-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    if: github.event.pull_request.number == 565
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR head, not synthetic merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git status --porcelain
          echo "Exact review SHA: $EXPECTED_HEAD"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused source regression tests and syntax
        shell: bash
        run: |
          python -m compileall -q experience2/home-flagship/qa/integration/verify_full_browser.py experience2/home-flagship/qa/release-candidate/verify_csp_exact_browser.py experience2/home-flagship/tests/test_browser_gate_locked_identity.py
          python -m unittest discover -s experience2/home-flagship/tests -p test_browser_gate_locked_identity.py -v
      - name: Install browser-only test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Eight-width integrated Chromium source test
        shell: bash
        run: |
          python experience2/home-flagship/qa/integration/verify_full_browser.py --root experience2/home-flagship --out "$RUNNER_TEMP/fv-ex2-browser"
      - name: Seven-width CSP and four interactions plus three negative controls
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CHROME=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          python experience2/home-flagship/qa/release-candidate/verify_csp_exact_browser.py --root experience2/home-flagship --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/fv-ex2-csp" --chromium "$CHROME"
      - name: Upload browser receipts and screenshots (non-production)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex2-pr565-exact-head-browser-proof
          path: |
            ${{ runner.temp }}/fv-ex2-browser/
            ${{ runner.temp }}/fv-ex2-csp/
          if-no-files-found: warn
          retention-days: 7

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact selected narration sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge_out
          for stem in 02 03 04 05 06; do
            var="S${stem}_URL"
            url="${!var}"
            curl --fail --location --retry 3 --retry-delay 2 "$url" --output "bridge_out/s${stem}.mp3"
            test -s "bridge_out/s${stem}.mp3"
          done
      - name: Record integrity receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "episode=POD-001"
            echo "voice_id=G39kes5C0SCb5IRyUk73"
            echo "model_id=eleven_multilingual_v2"
            for f in bridge_out/*.mp3; do
              stat -c '%n %s bytes' "$f"
              sha256sum "$f"
            done
          } | tee bridge_out/receipt.txt
      - name: Upload private bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: pod001-audio-bridge-s02-s06
          path: bridge_out/
          if-no-files-found: error
          retention-days: 1

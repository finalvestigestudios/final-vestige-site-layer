name: POD-001 Private Audio Bridge Validation

on:
  push:
    branches:
      - automation/pod001-audio-bridge

permissions:
  contents: read

env:
  S01_URL: "https://storage.googleapis.com/xi-backend/database/workspace/e90b8f8b00ee42cb82bbcaefa538df3b/content_generation/YNtWuccQOnuFnA5fxEhp/cqSyRENXcy7Og3w91G1x/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260914%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260914T055217Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact selected S01 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge_out
          curl --fail --location --retry 3 --retry-delay 2 "$S01_URL" --output bridge_out/s01.mp3
          test -s bridge_out/s01.mp3
      - name: Record integrity receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_generation=cqSyRENXcy7Og3w91G1x"
            echo "voice_id=G39kes5C0SCb5IRyUk73"
            echo "model_id=eleven_multilingual_v2"
            echo "bytes=$(stat -c %s bridge_out/s01.mp3)"
            sha256sum bridge_out/s01.mp3
          } | tee bridge_out/receipt.txt
      - name: Upload private bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: pod001-s01-bridge
          path: bridge_out/
          if-no-files-found: error
          retention-days: 1

            python products/desktop/scripts/toolchain_guard.py check $toolchain
            if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed before $app" }
            python -I -m PyInstaller --noconfirm --clean --onefile --windowed --paths products/desktop --name $app --distpath dist --workpath "build/$app" --specpath build/specs "products/desktop/launchers/$app.py"
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for $app" }
            python products/desktop/scripts/build_input_guard.py check $custody
            if ($LASTEXITCODE -ne 0) { throw "R55 input changed during $app" }
            python products/desktop/scripts/toolchain_guard.py check $toolchain
            if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed during $app" }

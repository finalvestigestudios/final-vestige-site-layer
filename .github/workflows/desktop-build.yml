        run: |
          python products/desktop/scripts/safe_unittest_r119.py
          python -OO products/desktop/scripts/safe_unittest_r119.py
      - name: Verify full normal/optimized source provenance and six smokes (R57)
        run: |
          mkdir -p "$RUNNER_TEMP/fvs-source"
          python products/desktop/scripts/offline_source_gate.py --report "$RUNNER_TEMP/fvs-source/offline-source-suite.json"
      - name: Upload internal source-only evidence (never binaries)
        uses: actions/upload-artifact@v4
        with:
          name: final-vestige-desktop-source-only
          path: ${{ runner.temp }}/fvs-source/offline-source-suite.json
          if-no-files-found: error
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on CI artifact paths before packaging (R41)
        run: python products/desktop/ci_artifact_policy.py .github/workflows/desktop-build.yml
      - name: Verify mandatory two-mode CI source gate (R57)
        run: python products/desktop/ci_source_contract.py .github/workflows/desktop-build.yml
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: R100 Windows source-stage diagnostic (read-only, NOT a release gate)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/diagnose_windows_source_r100.py
          if ($LASTEXITCODE -ne 0) { throw "Windows source-stage diagnostic unavailable" }
      - name: R101 inventory root-cause probe and regressions (diagnostic only)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          foreach ($mode in @("normal","optimized")) {
            if ($mode -eq "normal") {
              python products/desktop/tests/test_windows_inventory_forensics_r101.py 2>$null
            } else {
              python -OO products/desktop/tests/test_windows_inventory_forensics_r101.py 2>$null
            }
            if ($LASTEXITCODE -ne 0) { throw "R101 synthetic inventory verification FAILED ($mode)" }
          }
          python products/desktop/scripts/diagnose_windows_inventory_r101.py
          if ($LASTEXITCODE -ne 0) { throw "R101 diagnostic execution unavailable" }
      - name: R104 synthetic toolchain stage diagnosis (read-only, NOT a release gate)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/diagnose_windows_toolchain_r104.py
          if ($LASTEXITCODE -ne 0) { throw "R104 diagnostic unavailable" }
      - name: Verify R100 privacy-safe source-method regressions (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop;products/desktop/tests"
          $methods = @(
            "test_only_top_level_static_test_methods_admitted",
            "test_static_method_diagnostic_round_trips_through_strict_parent",
            "test_child_rejects_synthetic_subtest_parameter_for_method_identity",
            "test_untrusted_child_cannot_supply_uninventoried_method",
            "test_child_methods_are_hidden_without_parent_inventory",
            "test_unknown_customer_values_cannot_escape_via_method_field",
            "test_parent_rejects_duplicated_unsorted_and_bogus_counts",
            "test_module_only_legacy_diagnostic_remains_accepted",
            "test_many_failures_are_sorted_and_limited_to_ten",
            "test_real_subprocess_keeps_private_exception_data_hidden_both_modes"
          )
          $failed = 0
          foreach ($method in $methods) {
            foreach ($mode in @("normal", "optimized")) {
              if ($mode -eq "normal") {
                python -m unittest "test_static_method_diagnostics_r100.StaticMethodDiagnosticsR100.$method" *> $null
              } else {
                python -OO -m unittest "test_static_method_diagnostics_r100.StaticMethodDiagnosticsR100.$method" *> $null
              }
              if ($LASTEXITCODE -ne 0) {
                Write-Host "R100 source-owned method FAILED: $method ($mode)"
                $failed++
              }
            }
          }
          if ($failed -ne 0) { throw "R100 static-source privacy regression gate FAILED" }
      - name: Verify R105 native-window ownership regressions (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R105 synthetic native GUI validation FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R105 optimized synthetic native GUI validation FAILED" }
      - name: Verify R106 source-owned keyboard contracts (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R106 keyboard source contract FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R106 optimized keyboard source contract FAILED" }
      - name: Verify R107 scaled-form source contracts (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' *> $null

          python -m unittest discover -s products/desktop/tests -p 'test_native_sealed_roundtrip_r118.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_sealed_roundtrip_r118.py' > /dev/null 2>&1

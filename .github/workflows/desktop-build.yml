name: Desktop suite build (internal)
on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent runner pool: even when Windows fails before step 1, we can
  # obtain real source-suite regression and six-engine smoke evidence on Linux.
  # This job NEVER validates or uploads Windows executables.
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: products/desktop
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (node24)
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12'
      - name: Fail closed on CI artifact paths (R41)
        run: python products/desktop/ci_artifact_policy.py .github/workflows/desktop-build.yml
      - name: Verify mandatory two-mode CI source gate (R57)
        run: python products/desktop/ci_source_contract.py .github/workflows/desktop-build.yml
      - name: R266 privacy of real Python thread and unraisable faults (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_background_privacy_r266.py'
          python -OO -m unittest discover -s products/desktop/tests -p 'test_background_privacy_r266.py'
      - name: R267 main-thread uncaught traceback privacy (normal and -OO)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p 'test_main_exception_privacy_r267.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_main_exception_privacy_r267.py'
      - name: R268 Tk callback handler installation custody (normal and -OO)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p 'test_tk_callback_install_custody_r268.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_tk_callback_install_custody_r268.py'
      - name: R271 six-app private Windows report custody (normal and -OO)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p 'test_offline_windows_report_custody_r271.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_offline_windows_report_custody_r271.py'
      - name: R272 isolated packaging entrypoint imports (normal and -OO)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p 'test_isolated_packaging_entrypoints_r272.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_isolated_packaging_entrypoints_r272.py'
      - name: R273 strict source receipt JSON and private runner integration (normal and -OO)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p 'test_strict_source_receipt_r273.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_strict_source_receipt_r273.py'
          python -W error -m unittest discover -s products/desktop/tests -p 'test_source_receipt_integration_r273.py'
          python -OO -W error -m unittest discover -s products/desktop/tests -p 'test_source_receipt_integration_r273.py'
      - name: R274 integer-only private receipt numbers (normal and -OO)

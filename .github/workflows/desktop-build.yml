name: Desktop suite build (internal)
on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent runner pool: even when Windows fails before step 1, we can
  # obtain real source-suite regression and six-engine smoke evidence on Linux.
  # This job NEVER validates or uploads Windows executables.
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: products/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Run complete cross-platform desktop regression suite
        run: python -m unittest discover -s products/desktop/tests -v
      - name: Verify recent provenance/parser checks with optimized Python
        run: |
          python -OO -m unittest discover -s products/desktop/tests -p 'test_csv_physical_provenance_r19.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_premium_review_csv_r20.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_source_smoke_gate_r21.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_amount_lexical_integrity_r22.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_quantity_lexical_integrity_r23.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_ascii_data_privacy_r24.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_csv_import_bounds_r25.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_policy_diff_r26.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_policy_engine_r26.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_atomic_reports_r27.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_engine_writer_r27.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_atomic_text_r28.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_text_evidence_integration_r28.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_manifest_guard_r29.py' -v
          python -OO -m unittest discover -s products/desktop/tests -p 'test_manifest_integration_r29.py' -v
      - name: Execute six synthetic source engines and inventory their source hashes
        run: |
          mkdir -p "$RUNNER_TEMP/fvs-source"
          python products/desktop/scripts/source_smoke_gate.py --report "$RUNNER_TEMP/fvs-source/source-smoke.json"
      - name: Upload internal source-only evidence (never binaries)
        uses: actions/upload-artifact@v4
        with:
          name: final-vestige-desktop-source-only
          path: ${{ runner.temp }}/fvs-source/source-smoke.json
          if-no-files-found: error
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Run deterministic engine tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -v
      - name: Validate optimization-safe release checks (R10)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -O -m unittest discover -s products/desktop/tests -p test_release_hardening_r10.py -v
          if ($LASTEXITCODE -ne 0) { throw "R10 optimization-safe smoke and integrity checks failed" }
      - name: Install packaging tool
        run: python -m pip install "pyinstaller>=6.12,<7"
      - name: Build six standalone Windows executables
        shell: pwsh
        run: |
          $apps = @("LedgerDiffLite","InvoiceTwinScout","SpendMapLite","PolicyDeltaDesk","GrantAuditStudioPro","ProcureGuardStudioPro")
          foreach ($app in $apps) {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --paths products/desktop --name $app --distpath dist --workpath "build/$app" --specpath build/specs "products/desktop/launchers/$app.py"
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for $app" }
          }
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding ascii
          }
      - name: R9 offline Windows x64 release-candidate gate (internal only)
        shell: pwsh
        run: |
          python products/desktop/release_gate.py dist --smoke --report dist/offline-candidate-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "R9 binary integrity/smoke gate failed" }
          Write-Host "All six Windows x64 candidate binaries verified; NOT approved for release."
      - name: Upload internal pre-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-vestige-desktop-windows-internal
          path: dist/*
          if-no-files-found: error
          retention-days: 7

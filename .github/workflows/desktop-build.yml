name: Desktop suite build (internal)
on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent runner pool: even when Windows fails before step 1, we can
  # obtain real source-suite regression and six-engine smoke evidence on Linux.
  # This job NEVER validates or uploads Windows executables.
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: products/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on CI artifact paths (R41)
        run: python products/desktop/ci_artifact_policy.py .github/workflows/desktop-build.yml
      - name: Verify mandatory two-mode CI source gate (R57)
        run: python products/desktop/ci_source_contract.py .github/workflows/desktop-build.yml
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Verify R100 privacy-safe source-method regressions (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_static_method_diagnostics_r100.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_static_method_diagnostics_r100.py' > /dev/null 2>&1
      - name: Verify R101 synthetic inventory forensics (normal and -OO)
        run: |
          python products/desktop/tests/test_windows_inventory_forensics_r101.py 2>/dev/null
          python -OO products/desktop/tests/test_windows_inventory_forensics_r101.py 2>/dev/null
      - name: Verify R105 native-window ownership regressions (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' > /dev/null 2>&1
      - name: Verify R106 source-owned keyboard contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' > /dev/null 2>&1
      - name: Verify R107 keyboard-visible scrolling contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' > /dev/null 2>&1
      - name: Verify R108 actual-event snapshot contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' > /dev/null 2>&1
      - name: Verify R109 private Win11 manual acceptance custody (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_windows11_manual_acceptance_r109.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_windows11_manual_acceptance_r109.py' > /dev/null 2>&1
      - name: Verify full normal/optimized source provenance and six smokes (R57)
        run: |
          mkdir -p "$RUNNER_TEMP/fvs-source"
          python products/desktop/scripts/offline_source_gate.py --report "$RUNNER_TEMP/fvs-source/offline-source-suite.json"
      - name: Upload internal source-only evidence (never binaries)
        uses: actions/upload-artifact@v4
        with:
          name: final-vestige-desktop-source-only
          path: ${{ runner.temp }}/fvs-source/offline-source-suite.json
          if-no-files-found: error
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on CI artifact paths before packaging (R41)
        run: python products/desktop/ci_artifact_policy.py .github/workflows/desktop-build.yml
      - name: Verify mandatory two-mode CI source gate (R57)
        run: python products/desktop/ci_source_contract.py .github/workflows/desktop-build.yml
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: R100 Windows source-stage diagnostic (read-only, NOT a release gate)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/diagnose_windows_source_r100.py
          if ($LASTEXITCODE -ne 0) { throw "Windows source-stage diagnostic unavailable" }
      - name: R101 inventory root-cause probe and regressions (diagnostic only)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          foreach ($mode in @("normal","optimized")) {
            if ($mode -eq "normal") {
              python products/desktop/tests/test_windows_inventory_forensics_r101.py 2>$null
            } else {
              python -OO products/desktop/tests/test_windows_inventory_forensics_r101.py 2>$null
            }
            if ($LASTEXITCODE -ne 0) { throw "R101 synthetic inventory verification FAILED ($mode)" }
          }
          python products/desktop/scripts/diagnose_windows_inventory_r101.py
          if ($LASTEXITCODE -ne 0) { throw "R101 diagnostic execution unavailable" }
      - name: R104 synthetic toolchain stage diagnosis (read-only, NOT a release gate)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/diagnose_windows_toolchain_r104.py
          if ($LASTEXITCODE -ne 0) { throw "R104 diagnostic unavailable" }
      - name: Verify R100 privacy-safe source-method regressions (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop;products/desktop/tests"
          $methods = @(
            "test_only_top_level_static_test_methods_admitted",
            "test_static_method_diagnostic_round_trips_through_strict_parent",
            "test_child_rejects_synthetic_subtest_parameter_for_method_identity",
            "test_untrusted_child_cannot_supply_uninventoried_method",
            "test_child_methods_are_hidden_without_parent_inventory",
            "test_unknown_customer_values_cannot_escape_via_method_field",
            "test_parent_rejects_duplicated_unsorted_and_bogus_counts",
            "test_module_only_legacy_diagnostic_remains_accepted",
            "test_many_failures_are_sorted_and_limited_to_ten",
            "test_real_subprocess_keeps_private_exception_data_hidden_both_modes"
          )
          $failed = 0
          foreach ($method in $methods) {
            foreach ($mode in @("normal", "optimized")) {
              if ($mode -eq "normal") {
                python -m unittest "test_static_method_diagnostics_r100.StaticMethodDiagnosticsR100.$method" *> $null
              } else {
                python -OO -m unittest "test_static_method_diagnostics_r100.StaticMethodDiagnosticsR100.$method" *> $null
              }
              if ($LASTEXITCODE -ne 0) {
                Write-Host "R100 source-owned method FAILED: $method ($mode)"
                $failed++
              }
            }
          }
          if ($failed -ne 0) { throw "R100 static-source privacy regression gate FAILED" }
      - name: Verify R105 native-window ownership regressions (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R105 synthetic native GUI validation FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R105 optimized synthetic native GUI validation FAILED" }
      - name: Verify R106 source-owned keyboard contracts (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R106 keyboard source contract FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R106 optimized keyboard source contract FAILED" }
      - name: Verify R107 scaled-form source contracts (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R107 local-first viewport regression FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R107 optimized viewport regression FAILED" }
      - name: Verify R108 Tk accelerator and cancel safety (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R108 Tk accelerator regression FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R108 optimized Tk accelerator regression FAILED" }
      - name: Verify R109 manual Win11 candidate custody regressions (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_windows11_manual_acceptance_r109.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R109 private acceptance source validation FAILED" }
          python -OO -m unittest discover -s products/desktop/tests -p 'test_windows11_manual_acceptance_r109.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R109 optimized private acceptance source validation FAILED" }
      - name: Verify full normal/optimized source suite before packaging (R57)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/offline_source_gate.py
          if ($LASTEXITCODE -ne 0) { throw "R57 complete source and engine smoke verification FAILED" }
      - name: Install packaging tool
        run: python -m pip install "pyinstaller>=6.12,<7"
      - name: Build six standalone Windows executables
        shell: pwsh
        run: |
          $custody = Join-Path $env:RUNNER_TEMP "fvs-six-build-inputs.json"
          $toolchain = Join-Path $env:RUNNER_TEMP "fvs-six-toolchain-inputs.json"
          python products/desktop/scripts/toolchain_guard.py capture $toolchain
          if ($LASTEXITCODE -ne 0) { throw "R56 cannot pin packaging interpreter and installed dependencies" }
          python products/desktop/scripts/build_input_guard.py capture $custody
          if ($LASTEXITCODE -ne 0) { throw "R55 cannot pin six-app build inputs" }
          $apps = @("LedgerDiffLite","InvoiceTwinScout","SpendMapLite","PolicyDeltaDesk","GrantAuditStudioPro","ProcureGuardStudioPro")
          foreach ($app in $apps) {
            python products/desktop/scripts/build_input_guard.py check $custody
            if ($LASTEXITCODE -ne 0) { throw "R55 input changed before $app" }
            python products/desktop/scripts/toolchain_guard.py check $toolchain
            if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed before $app" }
            python -I -m PyInstaller --noconfirm --clean --onefile --windowed --paths products/desktop --name $app --distpath dist --workpath "build/$app" --specpath build/specs "products/desktop/launchers/$app.py"
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for $app" }
            python products/desktop/scripts/build_input_guard.py check $custody
            if ($LASTEXITCODE -ne 0) { throw "R55 input changed during $app" }
            python products/desktop/scripts/toolchain_guard.py check $toolchain
            if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed during $app" }
          }
          python products/desktop/build_inventory.py dist
          if ($LASTEXITCODE -ne 0) { throw "R40 fail-closed candidate inventory build failed" }
          python products/desktop/scripts/build_input_guard.py check $custody
          if ($LASTEXITCODE -ne 0) { throw "R55 source changed during inventory creation" }
          python products/desktop/scripts/toolchain_guard.py check $toolchain
          if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed during inventory creation" }
      - name: R9 offline Windows x64 release-candidate gate (internal only)
        shell: pwsh
        run: |
          $custody = Join-Path $env:RUNNER_TEMP "fvs-six-build-inputs.json"
          $toolchain = Join-Path $env:RUNNER_TEMP "fvs-six-toolchain-inputs.json"
          python products/desktop/scripts/toolchain_guard.py check $toolchain
          if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed before executable gate" }
          python products/desktop/scripts/build_input_guard.py check $custody
          if ($LASTEXITCODE -ne 0) { throw "R55 source custody failed before binary verification" }
          python products/desktop/release_gate.py dist --smoke --report build/offline-candidate-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "R9 binary integrity/smoke gate failed" }
          python products/desktop/report_attestation.py build/offline-candidate-evidence.json dist
          if ($LASTEXITCODE -ne 0) { throw "R39 independent offline report consistency failed" }
          python products/desktop/scripts/build_input_guard.py check $custody
          if ($LASTEXITCODE -ne 0) { throw "R55 source custody failed after binary verification" }
          python products/desktop/scripts/toolchain_guard.py check $toolchain
          if ($LASTEXITCODE -ne 0) { throw "R56 toolchain changed after executable gate" }
          Write-Host "Six Windows x64 candidate smokes and source custody checked; NOT approved for release."
      - name: Upload internal pre-release evidence only
        uses: actions/upload-artifact@v4
        with:
          name: final-vestige-desktop-windows-internal
          path: |
            dist/SHA256SUMS.txt
            build/offline-candidate-evidence.json
          if-no-files-found: error
          retention-days: 7
      # Deliberately AFTER the internal R9 evidence upload: an unavailable
      # interactive desktop must never erase independently verified PE/SHA proof.
      # Any failure still marks the full workflow RED and blocks all release.
      - name: R105 native Windows GUI and premium-lock observation (release HOLD)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/windows_gui_probe_r105.py dist --report build/offline-gui-surface-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "R105 GUI or premium lock unavailable; release HOLD" }

      # Source Tk layout inspection runs only after six actual Windows EXEs
      # have cleared R9 and R105; it cannot unlock or launch premium editors.
      # Unlike R105, this inspects deterministic native Tk Tab traversal and
      # shortcut bindings in the four free source interfaces. No files picked.
      - name: R106 native Tk keyboard and focus preflight (release HOLD)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/native_keyboard_probe_r106.py
          if ($LASTEXITCODE -ne 0) { throw "R106 native focus or keyboard contract unavailable; release HOLD" }

      # R107 checks real native Tk scaled forms without touching financial data,
      # changing license gates, or uploading EXEs. Enforced AFTER R9/R105/R106.
      - name: R107 native 200/400-percent scaled scrolling and focus (release HOLD)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/native_scale_probe_r107.py
          if ($LASTEXITCODE -ne 0) { throw "R107 scaled native focus unavailable; release HOLD" }

      # R108 dispatches real source-bound Tk synthetic Alt/Ctrl events after
      # all six packaged images, premium lock, focus and scaled layout gates.
      # Cancelled file pickers, blank-input validation and no engine calls.
      - name: R108 native Tk accelerator event and cancel-safety preflight (release HOLD)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/native_shortcut_events_r108.py
          if ($LASTEXITCODE -ne 0) { throw "R108 Tk event delivery or cancel-safety unavailable; release HOLD" }

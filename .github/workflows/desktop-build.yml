          python -OO -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R107 optimized viewport regression FAILED" }
      - name: Verify R108 Tk accelerator and cancel safety (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' *> $null

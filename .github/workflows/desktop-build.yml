name: Desktop suite build (internal)
on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Independent runner pool: even when Windows fails before step 1, we can
  # obtain real source-suite regression and six-engine smoke evidence on Linux.
  # This job NEVER validates or uploads Windows executables.
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: products/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on CI artifact paths (R41)
        run: python products/desktop/ci_artifact_policy.py .github/workflows/desktop-build.yml
      - name: Verify mandatory two-mode CI source gate (R57)
        run: python products/desktop/ci_source_contract.py .github/workflows/desktop-build.yml
      - name: Install pinned local evidence crypto dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Verify R100 privacy-safe source-method regressions (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_static_method_diagnostics_r100.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_static_method_diagnostics_r100.py' > /dev/null 2>&1
      - name: Verify R101 synthetic inventory forensics (normal and -OO)
        run: |
          python products/desktop/tests/test_windows_inventory_forensics_r101.py 2>/dev/null
          python -OO products/desktop/tests/test_windows_inventory_forensics_r101.py 2>/dev/null
      - name: Verify R105 native-window ownership regressions (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_gui_probe_r105.py' > /dev/null 2>&1
      - name: Verify R106 source-owned keyboard contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_keyboard_probe_r106.py' > /dev/null 2>&1
      - name: Verify R107 keyboard-visible scrolling contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_scroll_access_r107.py' > /dev/null 2>&1
      - name: Verify R108 actual-event snapshot contracts (normal and -OO)
        run: |
          python -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' > /dev/null 2>&1
          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' > /dev/null 2>&1
      - name: Verify R109/R110 bound private Win11 acceptance (normal and -OO)
        run: |
          python products/desktop/scripts/safe_unittest_methods_r110.py
          python -OO products/desktop/scripts/safe_unittest_methods_r110.py
      - name: R122 private one-check Win11 witness writer (normal and -OO)
        run: |
          python products/desktop/scripts/safe_unittest_r122.py
          python -OO products/desktop/scripts/safe_unittest_r122.py
      - name: R123 read-only Win11 progress custody (normal and -OO)
        run: |
          python products/desktop/scripts/safe_unittest_r123.py
          python -OO products/desktop/scripts/safe_unittest_r123.py
      - name: R124 fail-closed reviewer witness inventory (normal and -OO)
        run: |

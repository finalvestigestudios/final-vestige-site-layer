          python -OO -m unittest discover -s products/desktop/tests -p 'test_native_shortcut_events_r108.py' *> $null
          if ($LASTEXITCODE -ne 0) { throw "R108 optimized Tk accelerator regression FAILED" }
      - name: Verify R109/R110 private Win11 reviewer-witness binding (normal and -OO)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "products/desktop"
          python products/desktop/scripts/safe_unittest_methods_r110.py
          if ($LASTEXITCODE -ne 0) { throw "R110 private acceptance source validation FAILED" }

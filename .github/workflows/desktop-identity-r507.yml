# Read-only R507 source gate. No Windows release authorization, artifacts, or premium payloads.
name: Labs six-image identity preflight (R507)

on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-identity-r507.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-identity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONPATH: products/desktop
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: R507 exact six-product native image identity (normal and optimized)
        run: |
          python -B -W error -m unittest discover -s products/desktop/tests -p test_candidate_identity_r507.py
          python -OO -B -W error -m unittest discover -s products/desktop/tests -p test_candidate_identity_r507.py
      - name: R507 full release gate binding (mock-only, normal and optimized)
        run: |
          python -B -W error -m unittest discover -s products/desktop/tests -p test_candidate_identity_gate_r507.py
          python -OO -B -W error -m unittest discover -s products/desktop/tests -p test_candidate_identity_gate_r507.py

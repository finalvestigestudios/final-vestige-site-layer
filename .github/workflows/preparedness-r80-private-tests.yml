name: Preparedness R80 OFFLINE Evidence Reading Room (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r79-uncited-consequential-context-hold-20261102
    paths:
      - preparedness/tools/r80_offline_evidence_reading_room.py
      - preparedness/tests/test_r80_offline_evidence_reading_room.py
      - preparedness/docs/R80_OFFLINE_EVIDENCE_READING_ROOM_HOLD.md
      - .github/workflows/preparedness-r80-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r80-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evidence-reading-room-private-only:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact isolated commit without retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce R79 immutable parent and exactly four additive private files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "f83f1af253aac8a4069ec60df2d55fcee451edc0"
          test "$BASE_REF" = "review/preparedness-r79-uncited-consequential-context-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r80-offline-evidence-reading-room-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/r80-scoped-diff"
          python -I - <<'PY'
          import os
          from pathlib import Path
          raw=Path(os.environ["RUNNER_TEMP"],"r80-scoped-diff").read_bytes().split(b"\0")
          found=[(raw[i].decode(),raw[i+1].decode()) for i in range(0,len(raw)-1,2)]
          want={
            "preparedness/tools/r80_offline_evidence_reading_room.py",
            "preparedness/tests/test_r80_offline_evidence_reading_room.py",
            "preparedness/docs/R80_OFFLINE_EVIDENCE_READING_ROOM_HOLD.md",
            ".github/workflows/preparedness-r80-private-tests.yml"}
          assert len(found)==4 and {p for _,p in found}==want,found
          assert all(s=="A" for s,_ in found),found
          print("R80 exact immutable-base and four add-only file scope PASS")
          PY
      - name: Pin all seven Claude contributor exact heads and separate release candidate
        run: |
          python -I - <<'PY'
          import subprocess
          pins={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":"ddb3528ba6494dada1fa1c3a142ce746e3a67706"}
          for branch,sha in pins.items():
              actual=subprocess.check_output(["git","rev-parse","--verify",
                  "refs/remotes/origin/"+branch+"^{commit}"],text=True).strip()
              assert actual==sha,(branch,actual,sha)
          print("All seven current contributor pins plus separate RC PASS")
          print("Frozen historical R14 source parity still has separate mandatory HOLD")
          PY
      - name: Compile new files without installing dependencies
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for file in (
              "preparedness/tools/r80_offline_evidence_reading_room.py",
              "preparedness/tests/test_r80_offline_evidence_reading_room.py"):
              compile(Path(file).read_text(encoding="utf-8"),file,"exec")
          print("R80 Python compile PASS")
          PY
      - name: Run 121 R80 isolated conservation and adversarial tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r80_offline_evidence_reading_room.py -v
      - name: Generate and audit private COMPLETE offline evidence room
        run: |
          set -euo pipefail
          python -I preparedness/tools/r80_offline_evidence_reading_room.py
          python -I preparedness/tools/r80_offline_evidence_reading_room.py --private-html-stdout > "$RUNNER_TEMP/r80-PRIVATE-NOT-FOR-PUBLICATION.html"
          R80_PRIVATE_REVIEW_HTML="$RUNNER_TEMP/r80-PRIVATE-NOT-FOR-PUBLICATION.html" python -I - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path=Path("preparedness/tools/r80_offline_evidence_reading_room.py")
          spec=importlib.util.spec_from_file_location("r80_ci",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          data=Path(os.environ["R80_PRIVATE_REVIEW_HTML"]).read_text(encoding="utf-8")
          roles=mod.audit_html(data)
          assert tuple(roles[k] for k in ("document","block","citation",
              "variant","uncited-review","source"))==(41,4070,2173,2359,347,244)
          assert "DO NOT PUBLISH THIS HTML AS AN ARTICLE" in data
          print("Private, self-contained source/citation review HTML PASS; NO PUBLICATION")
          PY
          rm -f "$RUNNER_TEMP/r80-PRIVATE-NOT-FOR-PUBLICATION.html"
      - name: Native Preparedness validator (no CMS)
        run: python -I preparedness/tools/validate.py
      - name: Generate WordPress-ready OFFLINE drafts only (no CMS)
        run: python -I preparedness/tools/build.py
      - name: Execute entire Preparedness Python suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: State mandatory safety release HOLD
        if: always()
        run: |
          echo "R80 is private machine diagnostics only."
          echo "No external source/claim verified; no medically safe guidance certified."
          echo "No human safety review, independent QD, WordPress publish, navigation, CMS writes."
          echo "13-stage mandatory integrity remains a separate FAIL-CLOSED release gate."

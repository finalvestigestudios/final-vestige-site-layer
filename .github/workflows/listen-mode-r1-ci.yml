name: Listen Mode R1 CI

on:
  pull_request:
    paths:
      - 'payloads/listen-mode-wp-block-r1.txt'
      - 'tests/verify_listen_mode_r1.py'
      - '.github/workflows/listen-mode-r1-ci.yml'
      - 'LISTEN-MODE-R1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Listen Mode R1 artifact and browser behavior
        run: python tests/verify_listen_mode_r1.py

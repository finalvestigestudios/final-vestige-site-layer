name: Preparedness R68 RC citation-to-source scope (PRIVATE HOLD)

on:
  pull_request:
    branches:
      - review/preparedness-r67-rc-source-custody-20261102
    paths:
      - preparedness/tools/r68_rc_document_citation_scope.py
      - preparedness/tests/test_r68_rc_document_citation_scope.py
      - preparedness/docs/R68_RC_DOCUMENT_SOURCE_SCOPE_HOLD.md
      - .github/workflows/preparedness-r68-isolated-tests.yml

permissions:
  contents: read

concurrency:
  group: preparedness-r68-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  private-rc-claim-source-custody-diagnostics:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Private checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact parent and four additive Preparedness-only paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "e9a7da397845f289336ba08bde1bee99ee9d8b9e"
          test "$BASE_REF" = "review/preparedness-r67-rc-source-custody-20261102"
          test "$HEAD_REF" = "review/preparedness-r68-rc-claim-source-scope-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r68-paths.bin
          python -I - <<'PY'
          from pathlib import Path
          observed = {x.decode() for x in Path('/tmp/r68-paths.bin').read_bytes().split(b'\0') if x}
          expected = {
            'preparedness/tools/r68_rc_document_citation_scope.py',
            'preparedness/tests/test_r68_rc_document_citation_scope.py',
            'preparedness/docs/R68_RC_DOCUMENT_SOURCE_SCOPE_HOLD.md',
            '.github/workflows/preparedness-r68-isolated-tests.yml',
          }
          assert observed == expected,(sorted(observed),sorted(expected))
          print('Exactly four private R68 additions; original content/locks untouched.')
          PY
      - name: Python syntax gate without bytecode writes
        run: |
          set -euo pipefail
          python -I - <<'PY'
          from pathlib import Path
          for name in ('preparedness/tools/r68_rc_document_citation_scope.py',
                       'preparedness/tests/test_r68_rc_document_citation_scope.py'):
              compile(Path(name).read_text(encoding='utf-8'),name,'exec')
          print('R68 syntax: PASS')
          PY
      - name: R68 independent synthetic and adversarial tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r68_rc_document_citation_scope.py -v
      - name: Verify all seven contributor SHA pins and separate candidate
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          refs={
            'claude/prep-start-bbfeb8':'2122d856fce9f64887c16df3d52e64be9f59a55b',
            'claude/prep-shelter-5e1e0e':'5daeaf2dd5ab71806a6b73c91edfb1d8df5da976',
            'claude/prep-food-ccdc55':'f911ff7a655de8d81535ea86ec3d65a49ee76648',
            'claude/prep-health-837444':'d5ef5bafd68361434dd1cc9209915b8e8a4eaf17',
            'claude/prep-hist-food-b81f19':'67e116e536c7410bed30f8f3b1bb8c166f3c223d',
            'claude/prep-hist-home-0e0e38':'7504a5f099594d635e3dd7332a33a2e1346c43a2',
            'claude/prep-hist-field-9db767':'4e5caf812727953aa45e3bda2d382f2c67b6a09c',
            'integration/preparedness-release-candidate-20261101':
              'ddb3528ba6494dada1fa1c3a142ce746e3a67706',
          }
          for ref,pin in refs.items():
              observed=subprocess.check_output(['git','rev-parse','--verify',
                  'refs/remotes/origin/'+ref+'^{commit}'],text=True).strip()
              if observed!=pin:
                  raise SystemExit('HOLD: source head changed: '+ref+
                                   ' expected '+pin+' observed '+observed)
          print('All seven Claude contributor branch refs and RC SHA match pins.')
          PY
      - name: Reconstruct full 41-document RC evidence without accepting source review
        shell: bash
        run: |
          set -euo pipefail
          python -I preparedness/tools/r68_rc_document_citation_scope.py > /tmp/r68-private-summary.json
          python -I preparedness/tools/r68_rc_document_citation_scope.py --task-csv-stdout > /tmp/r68-private-work-orders.csv
          python -I - <<'PY'
          import csv,json
          from pathlib import Path
          r=json.loads(Path('/tmp/r68-private-summary.json').read_text())
          c=r['counts']
          assert r['release_state']=='HOLD' and not r['all_publication_clearance']
          assert c['original_articles_conserved']==35,c
          assert c['candidate_tools']==6,c
          assert c['original_water_tool_present']==1,c
          assert c['original_citations_preserved_under_R66']==1959,c
          assert c['candidate_sources_conserved_under_R67']==244,c
          assert c['distinct_RC_document_urls']==41,c
          assert c['human_source_or_claim_checks_performed_BY_R68']==0,c
          with Path('/tmp/r68-private-work-orders.csv').open(newline='') as h:
              tasks=list(csv.DictReader(h))
          assert len(tasks)==41,len(tasks)
          assert all(x['HUMAN_CLAIM_CHECK_NOT_REVIEWED']=='NOT_REVIEWED' and
                     x['SAFETY_REVIEW_NOT_REVIEWED']=='NOT_REVIEWED'
                     for x in tasks)
          print('R68 review task census (all unapproved):',json.dumps(c,sort_keys=True))
          PY
      - name: Validate original archive (machine only, not release permission)
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready private draft build only
        run: python -I preparedness/tools/build.py
      - name: Entire native Preparedness Python suite (diagnostic only)
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Explicitly preserve all release restrictions
        if: always()
        run: |
          echo 'R68 machine tests do NOT satisfy mandatory seven_cluster_git_parity.'
          echo 'NO human source-link/claim check, NO qualified safety review, NO independent QD.'
          echo 'NO production merge, NO publishing, NO CMS or navigation writes.'

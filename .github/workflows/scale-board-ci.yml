name: Scale Board CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/scale-board-wp-block-v1.txt'
      - 'tests/verify_scale_board.py'
      - '.github/workflows/scale-board-ci.yml'
      - 'SCALE_BOARD.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print exact Scale Board payload identity
        run: |
          wc -c payloads/scale-board-wp-block-v1.txt
          sha256sum payloads/scale-board-wp-block-v1.txt
      - name: Verify Scale Board artifact
        run: python tests/verify_scale_board.py

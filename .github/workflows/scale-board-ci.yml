name: Scale Board R2 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/scale-board-wp-block-r2.txt'
      - 'tests/verify_scale_board_r2.py'
      - 'tests/fixtures/scale-board-r2-*.html'
      - '.github/workflows/scale-board-ci.yml'
      - 'SCALE_BOARD.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Scale Board R2 artifact and browser behavior
        run: python tests/verify_scale_board_r2.py

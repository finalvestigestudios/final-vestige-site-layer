name: Evidence Desk CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/evidence-desk-wp-block-v1.txt'
      - 'tests/verify_evidence_desk.py'
      - '.github/workflows/evidence-desk-ci.yml'
      - 'EVIDENCE-DESK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FV_BROWSER_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version;           elif command -v chromium >/dev/null 2>&1; then chromium --version;           elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version;           else echo "No Chrome/Chromium runtime found" >&2; exit 1; fi
      - name: Verify Evidence Desk artifact and browser behavior
        run: python tests/verify_evidence_desk.py

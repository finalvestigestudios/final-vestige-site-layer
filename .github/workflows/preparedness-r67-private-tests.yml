name: Preparedness R67 original-to-RC source custody (PRIVATE HOLD)

on:
  pull_request:
    branches:
      - review/preparedness-r66-cited-source-identity-ledger-hold-20261102
    paths:
      - preparedness/tools/r67_rc_source_custody_crosswalk.py
      - preparedness/tests/test_r67_rc_source_custody_crosswalk.py
      - preparedness/docs/R67_RC_SOURCE_CUSTODY_REVIEW_HOLD.md
      - .github/workflows/preparedness-r67-private-tests.yml

permissions:
  contents: read

concurrency:
  group: preparedness-r67-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  private-source-delta-integrity-diagnostics:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Private source checkout, no persisted write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exact parent, head branch and four new private paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "646c89531811bb7bc430ef115f857ff5e36bdc5c"
          test "$BASE_REF" = "review/preparedness-r66-cited-source-identity-ledger-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r67-rc-source-custody-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r67-scoped-paths.bin
          python -I - <<'PY'
          from pathlib import Path
          observed={x.decode("utf-8") for x in Path(
              "/tmp/r67-scoped-paths.bin").read_bytes().split(b"\0") if x}
          expected={
              "preparedness/tools/r67_rc_source_custody_crosswalk.py",
              "preparedness/tests/test_r67_rc_source_custody_crosswalk.py",
              "preparedness/docs/R67_RC_SOURCE_CUSTODY_REVIEW_HOLD.md",
              ".github/workflows/preparedness-r67-private-tests.yml",
          }
          assert observed == expected,(sorted(observed),sorted(expected))
          print("Four new private source-review paths only. Frozen content untouched.")
          PY
      - name: Compile source and adversarial tests without bytecode writes
        run: |
          set -euo pipefail
          python -I - <<'PY'
          from pathlib import Path
          for path in (
            "preparedness/tools/r67_rc_source_custody_crosswalk.py",
            "preparedness/tests/test_r67_rc_source_custody_crosswalk.py",
          ):
              compile(Path(path).read_text(encoding="utf-8"),path,"exec")
          print("R67 syntax: PASS")
          PY
      - name: R67 isolated synthetic and adversarial Python tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r67_rc_source_custody_crosswalk.py -v
      - name: Verify contributor and RC HEAD SHAs and both Git-object histories
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          refs={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":
              "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for name,sha in refs.items():
              observed=subprocess.check_output(["git","rev-parse","--verify",
                  "refs/remotes/origin/"+name+"^{commit}"],text=True).strip()
              if observed!=sha:
                  raise SystemExit("PRIVATE SOURCE HEAD SHA DRIFT: "+name+
                                   " pinned="+sha+" current="+observed)
          print("8 exact source Git refs (7 Claude + separate RC) checked")
          PY
          python -I preparedness/tools/r67_rc_source_custody_crosswalk.py > /tmp/r67-summary.json
          python -I preparedness/tools/r67_rc_source_custody_crosswalk.py --task-csv-stdout > /tmp/r67-private-tasks.csv
          python -I - <<'PY'
          import csv,json
          from pathlib import Path
          result=json.loads(Path("/tmp/r67-summary.json").read_text())
          c=result["counts"]
          assert result["release_state"]=="HOLD" and result["may_publish"] is False
          for k,v in {
              "original_all_source_rows":224,
              "RC_all_source_rows":244,
              "original_distinct_exact_urls":186,
              "RC_distinct_exact_urls":202,
              "original_shared_exact_url_groups":30,
              "RC_shared_exact_url_groups":32,
              "distinct_original_cited_source_records":208,
              "original_citation_occurrences":1959,
              "original_uncited_source_records_NOT_DROPPED":16,
              "new_RC_source_records":20,
              "changed_original_source_readings":2,
              "removed_original_source_records":0,
              "unchanged_original_records_not_approved":222,
              "RC_machine_probed_urls_NOT_HUMAN_CHECKS":97,
              "RC_machine_probe_ok_NOT_HUMAN_VERIFICATION":88,
              "RC_machine_probe_failed_NOT_A_HUMAN_LINK_VERDICT":9,
              "human_link_checks_performed_BY_THIS_TOOL":0,
          }.items():
              assert c[k]==v,(k,c[k],v)
          with Path("/tmp/r67-private-tasks.csv").open(newline="") as fh:
              rows=list(csv.DictReader(fh))
          assert len(rows)==244,len(rows)
          assert all(x["HUMAN_LINK_CHECK_NOT_REVIEWED"]=="NOT_REVIEWED" for x in rows)
          print(json.dumps(c,sort_keys=True))
          print("Private crosswalk/checks: PASS (machine inventory, NOT human safety)")
          PY
      - name: Native original article/source validation (machine only)
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready build of PRIVATE DRAFTS (NO CMS)
        run: python -I preparedness/tools/build.py
      - name: Full native Preparedness Python suite (diagnostic only)
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Release stays HOLD regardless of machine test status
        if: always()
        run: |
          echo "NO bypass of the original seven_cluster_git_parity private release gate."
          echo "NO human source-link approval, no claim/safety clearance, no QD PASS."
          echo "NO merge, no public publication, no CMS/nav/homepage changes."

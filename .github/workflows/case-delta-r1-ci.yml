name: Case Delta R1 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/case-delta-wp-block-r1.txt'
      - 'tests/verify_case_delta_r1.py'
      - 'tests/verify_case_delta_r1_browser.py'
      - '.github/workflows/case-delta-r1-ci.yml'
      - 'CASE_DELTA_R1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium runtime found" >&2; exit 1
          fi
      - name: Print exact Case Delta R1 payload identity
        run: |
          wc -c payloads/case-delta-wp-block-r1.txt
          sha256sum payloads/case-delta-wp-block-r1.txt
      - name: Verify Case Delta R1 exact artifact contract
        env:
          FV_BROWSER_RUNTIME: '0'
        run: python tests/verify_case_delta_r1.py
      - name: Verify Case Delta R1 browser/adversarial behavior
        run: python tests/verify_case_delta_r1_browser.py

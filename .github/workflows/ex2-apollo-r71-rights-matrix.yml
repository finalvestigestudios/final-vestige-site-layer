# DRAFT/STAGING_HOLD: no WordPress install, external fetch, or publication.
name: Apollo R71 source-rights matrix browser acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experience2/evidence-atlas/build_atlas.py'
      - 'experience2/evidence-atlas/tests/browser_r71_rights_matrix.py'
      - 'experience2/evidence-atlas/tests/test_rights_matrix_r71.py'
      - '.github/workflows/ex2-apollo-r71-rights-matrix.yml'
permissions:
  contents: read
jobs:
  r71-original-source-rights:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Install fixed Chromium and axe-core
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/r71-axe" --no-save --ignore-scripts --no-audit --no-fund axe-core@4.14.0
      - name: Original Atlas and R71 rights review contracts
        run: |
          python -m unittest discover -s experience2/evidence-atlas -p test_atlas.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_rights_matrix_r71.py -v
          python experience2/evidence-atlas/build_atlas.py --output "$RUNNER_TEMP/r71-original-atlas"
      - name: Real Chromium responsive, no-JS and axe acceptance
        run: |
          AXE="$RUNNER_TEMP/r71-axe/node_modules/axe-core/axe.min.js"
          DIGEST="$(sha256sum "$AXE" | cut -d' ' -f1)"
          python experience2/evidence-atlas/tests/browser_r71_rights_matrix.py --output "$RUNNER_TEMP/r71-proof" --axe "$AXE" --axe-sha256 "$DIGEST"
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r71-nasa-rights-matrix-proof
          path: ${{ runner.temp }}/r71-proof/
          retention-days: 7
          if-no-files-found: warn

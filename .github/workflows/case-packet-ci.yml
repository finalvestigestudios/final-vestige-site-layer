name: Case Packet CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/case-packet-wp-block-v1.txt'
      - 'tests/verify_case_packet.py'
      - '.github/workflows/case-packet-ci.yml'
      - 'CASE_PACKET.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FV_BROWSER_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium runtime found" >&2; exit 1
          fi
      - name: Print exact Case Packet payload identity
        run: |
          wc -c payloads/case-packet-wp-block-v1.txt
          sha256sum payloads/case-packet-wp-block-v1.txt
      - name: Verify Case Packet artifact and browser behavior
        run: python tests/verify_case_packet.py

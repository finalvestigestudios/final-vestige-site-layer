# No WordPress, deployment or production credentials; isolated Apollo source QA.
name: Apollo R92 source-exact navigation and Chromium (STAGING HOLD)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'experience2/evidence-atlas/tools/*r92*'
      - 'experience2/evidence-atlas/tests/*r92*'
      - 'experience2/evidence-atlas/R92_RECIPROCAL_EVIDENCE_ROUTES_STAGING_HOLD.md'
      - '.github/workflows/ex2-apollo-r92-reciprocal-routes.yml'
permissions:
  contents: read
jobs:
  real-source-determinism:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head source, adversarial navigation and inherited custody
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/apollo-r92-pycache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python -m py_compile experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py experience2/evidence-atlas/tests/test_reciprocal_routes_r92.py experience2/evidence-atlas/tests/browser_reciprocal_routes_r92.py
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_reciprocal_routes_r92.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_release_candidate_r91.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_review_hub_r89.py -v
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92-review-a" "$RUNNER_TEMP/R92_A.zip"
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92-review-b" "$RUNNER_TEMP/R92_B.zip"
          cmp "$RUNNER_TEMP/R92_A.zip" "$RUNNER_TEMP/R92_B.zip"
          sha256sum "$RUNNER_TEMP/R92_A.zip"
          test -z "$(git status --porcelain)"
      - name: Retain exact-head deterministic source
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r92-deterministic-source-STAGING-HOLD
          path: ${{ runner.temp }}/R92_A.zip
          if-no-files-found: error
          retention-days: 7
  real-chromium-axe-source-traversal:
    needs: real-source-determinism
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Pinned Playwright, Chromium, axe-core and PDF inspection
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/r92-axe" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund axe-core@4.14.0
      - name: Four real views across 40 cases, 8 axe scans, keyboard/touch, LCP/CLS and PDFs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/apollo-r92-browser-cache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92-review"
          python experience2/evidence-atlas/tests/browser_reciprocal_routes_r92.py \
            --src "$RUNNER_TEMP/r92-review" \
            --out "$RUNNER_TEMP/r92-browser-evidence" \
            --axe "$RUNNER_TEMP/r92-axe/node_modules/axe-core/axe.min.js"
          cat "$RUNNER_TEMP/r92-browser-evidence/R92_REAL_BROWSER_RECEIPT.json"
          test -z "$(git status --porcelain)"
      - name: Retain Chromium screenshots, native PDFs and receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r92-real-chromium-axe-STAGING-HOLD
          path: ${{ runner.temp }}/r92-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

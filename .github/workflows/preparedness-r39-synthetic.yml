name: Preparedness R39 isolated synthetic receipts (HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r38-quarantined-review-intake-20261031
    paths:
      - preparedness/tools/reviewer_receipt_chain_gate.py
      - preparedness/tests/test_r39_review_receipt_chain.py
      - .github/workflows/preparedness-r39-synthetic.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    name: Synthetic key receipts — NOT human validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run ONLY synthetic R39 tests; log failures without private article content
        run: |
          python -I -B -m unittest discover -s preparedness/tests -p 'test_r39_*' -v
      - name: Remind all readers this is release HOLD
        if: always()
        run: echo 'SYNTHETIC TESTS ONLY - HOLD - no independent human source or clinical review or QD approval'

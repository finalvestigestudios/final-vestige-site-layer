# Apollo R95 staging-only source-asset custody; no deploy or WordPress writes.
name: Apollo R95 sealed asset inventory and browser acceptance (STAGING HOLD)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'experience2/evidence-atlas/tools/build_curated_atlas_r94.py'
      - 'experience2/evidence-atlas/tests/test_asset_inventory_r95.py'
      - '.github/workflows/ex2-apollo-r95-sealed-inventory.yml'
permissions:
  contents: read
jobs:
  source-custody:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-head 12 adversarial + inherited tests and deterministic archive
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/r95-pycache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python -m py_compile experience2/evidence-atlas/tools/build_curated_atlas_r94.py experience2/evidence-atlas/tests/test_asset_inventory_r95.py
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_asset_inventory_r95.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_curated_atlas_r94.py -v
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92" --out "$RUNNER_TEMP/r93"
          python experience2/evidence-atlas/tools/build_curated_atlas_r94.py --src "$RUNNER_TEMP/r93" --out "$RUNNER_TEMP/a" --archive "$RUNNER_TEMP/a.zip"
          python experience2/evidence-atlas/tools/build_curated_atlas_r94.py --src "$RUNNER_TEMP/r93" --out "$RUNNER_TEMP/b" --archive "$RUNNER_TEMP/b.zip"
          cmp "$RUNNER_TEMP/a.zip" "$RUNNER_TEMP/b.zip"
          python - "$RUNNER_TEMP/a" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          receipt=json.loads((out/'R94_ATLAS_RECEIPT.json').read_text())
          files=receipt['files']
          assert len(files)==24,files.keys()
          for name,digest in files.items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest,name
          assert receipt['release']=='STAGING_HOLD'
          print('R95_EXACT_ARCHIVE_VERIFIED',len(files))
          PY
          sha256sum "$RUNNER_TEMP/a.zip"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: apollo-r95-exact-source-STAGING-HOLD
          path: ${{ runner.temp }}/a.zip
          if-no-files-found: error
          retention-days: 7
  real-chromium:
    needs: source-custody
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Pinned real Playwright Chromium, axe and PDF dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/axe" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund axe-core@4.14.0
      - name: Real 320–1920 JS/no-JS, keyboard, touch, axe, LCP/CLS, PDFs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/r95-browser-cache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92" --out "$RUNNER_TEMP/r93"
          python experience2/evidence-atlas/tools/build_curated_atlas_r94.py --src "$RUNNER_TEMP/r93" --out "$RUNNER_TEMP/preview"
          python experience2/evidence-atlas/tests/browser_curated_atlas_r94.py --src "$RUNNER_TEMP/preview" --out "$RUNNER_TEMP/evidence" --axe "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"
          cat "$RUNNER_TEMP/evidence/R94_CHROMIUM_RECEIPT.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apollo-r95-real-chromium-STAGING-HOLD
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 7

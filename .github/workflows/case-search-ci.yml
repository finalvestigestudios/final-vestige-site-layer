name: Case Search CI

on:
  pull_request:
    paths:
      - 'payloads/case-search-wp-block-v1.txt'
      - 'tests/verify_case_search.py'
      - '.github/workflows/case-search-ci.yml'
      - 'CASE-SEARCH.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Case Search artifact
        run: python tests/verify_case_search.py

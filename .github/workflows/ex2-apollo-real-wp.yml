# DRAFT/HOLD: actual local WordPress Playground + Assembler + 3 Apollo plugins.
# No WP.com API, production secrets, content/settings writes, deployment, or merge.
name: Apollo Evidence real isolated WordPress gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experience2/evidence-atlas/**'
      - '.github/workflows/ex2-apollo-real-wp.yml'
permissions:
  contents: read
jobs:
  source-contracts:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact review SHA and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Install Playwright Python API required by legacy source tests
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Source syntax, SHA-driven regressions and hostile staging fixtures
        run: |
          python -m py_compile experience2/evidence-atlas/tests/wordpress_r68.py
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_wordpress_r68.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p 'test_*.py' -q
          python -m unittest discover -s experience2/evidence-atlas -p test_atlas.py -q
          php -l experience2/evidence-atlas/integration/fv-ex2-apollo-suite.php

  authentic-ephemeral-wordpress:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      npm_config_engine_strict: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Pin required Playground CLI runtime
        run: |
          npm install --global --no-audit --no-fund npm@11.16.0
          node --version
          npm --version
          test "$(npm config get engine-strict)" = "true"
          timeout 120s npx --yes @wp-playground/cli@3.1.61 server --help >/dev/null
      - name: Acquire current official Assembler source, retain download checksum
        env:
          THEME_URL: https://public-api.wordpress.com/rest/v1/themes/download/assembler.zip
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 --proto '=https' --proto-redir '=https' --tlsv1.2 "$THEME_URL" -o "$RUNNER_TEMP/apollo-official-assembler.zip"
          unzip -t "$RUNNER_TEMP/apollo-official-assembler.zip" >/dev/null
          echo "THEME_SHA=$(sha256sum "$RUNNER_TEMP/apollo-official-assembler.zip" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "Theme pin here is from same-run official download, not independent signature."
      - name: Install actual Chromium and axe 4.14.0 without paid services
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/apollo-axe" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund axe-core@4.14.0
      - name: Genuine ephemeral WordPress/Assembler rendering, axe and responsive acceptance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/apollo-r68-evidence"
          python experience2/evidence-atlas/tests/wordpress_r68.py \
            --repo . --head "$EXPECTED_HEAD" \
            --theme-zip "$RUNNER_TEMP/apollo-official-assembler.zip" \
            --theme-sha256 "$THEME_SHA" \
            --stage "$RUNNER_TEMP/apollo-r68-stage" \
            --axe "$RUNNER_TEMP/apollo-axe/node_modules/axe-core/axe.min.js" \
            --out "$RUNNER_TEMP/apollo-r68-evidence"
      - name: Upload screenshots and redacted acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r68-authentic-wordpress-HOLD
          path: ${{ runner.temp }}/apollo-r68-evidence/
          if-no-files-found: warn
          retention-days: 7

name: Preparedness R109 private citation-neighborhood evidence (HOLD)
on:
  push:
    branches:
      - review/preparedness-r109-citation-neighborhood-hold-20261103
  pull_request:
    branches:
      - review/preparedness-r108-source-impact-crosswalk-hold-20261103
permissions:
  contents: read
jobs:
  r109-private-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Source/site scope and 12 exact external coordinator pins
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          parent = "1e6dbc7762fbf5a181c183b77a8312e96644b3b2"
          expected = {
              "A\tpreparedness/tools/r109_citation_context_custody.py",
              "A\tpreparedness/tests/test_r109_citation_context_custody.py",
              "A\tpreparedness/docs/R109_CITATION_NEIGHBORHOOD_REVIEW_HOLD.md",
              "A\t.github/workflows/preparedness-r109-private-tests.yml",
          }
          got = set(subprocess.check_output(["git", "diff", "--name-status", parent, "HEAD"], text=True).splitlines())
          assert got == expected, ("Unexpected content/CMS/homepage/nav modifications", got)
          pins = {
              "claude/prep-start-bbfeb8": "2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e": "5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55": "f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444": "d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19": "67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38": "7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767": "4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101": "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
              "review/preparedness-start-safety-20261030": "7d1ae6b8ef93d10cfb6810987672360885e9c1aa",
              "review/preparedness-food-fixture-isolation-20261030": "e9cd7766dac59d47ab467d8945269b9146c2aef5",
              "feature/vestige-assembly-home-v1": "10495883299d53596992c26a8987f629b2904670",
              "release/homepage-flagship-candidate-20261102": "bdf01b4a3e13fd6179ae9e847c9d4429bbe16176",
          }
          for ref, expected_sha in pins.items():
              sha = subprocess.check_output(["git", "rev-parse", "--verify", "refs/remotes/origin/" + ref], text=True).strip()
              assert sha == expected_sha, ("External branch moved; re-review before integration", ref, sha)
          print("R109 four additive engineering files, 12 pinned heads; all draft-only")
          PY
      - name: Compile and run 80 focused adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -m compileall -q preparedness/tools/r109_citation_context_custody.py preparedness/tests/test_r109_citation_context_custody.py
          python -I -m unittest discover -s preparedness/tests -p 'test_r109_*.py' -v
      - name: Reconstruct R107 R108 R109 exact Git source/citation evidence
        shell: bash
        run: |
          set -euo pipefail
          python -I preparedness/tools/r107_exact_branch_progression_adjudication.py --repo-root .
          python -I preparedness/tools/r108_source_citation_change_impact_crosswalk.py --repo-root .
          python -I preparedness/tools/r109_citation_context_custody.py --repo-root . --json > "$RUNNER_TEMP/r109-private.json"
          python -I - "$RUNNER_TEMP/r109-private.json" <<'PY'
          import hashlib, json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              d=json.load(f)
          h=d.pop("sha256_NOT_A_SIGNATURE")
          raw=json.dumps(d,sort_keys=True,ensure_ascii=False,allow_nan=False,separators=(",",":")).encode()
          assert hashlib.sha256(raw).hexdigest()==h
          assert d["changed_body_review_count"]==7
          assert d["release_state"]=="HOLD" and d["may_publish"] is False
          assert d["independent_QD_PASS"] is False
          assert d["qualified_emergency_safety_approved"] is False
          assert all(x["may_publish"] is False and x["human_claim_review"]=="NOT_REVIEWED" for x in d["rows_NOT_APPROVED"])
          print("R109 seven changed article bodies traced to original/current Git OIDs; all unapproved")
          PY
      - name: Native Preparedness validation and offline WordPress draft build
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Full mandatory-equivalent Python regression suite
        run: timeout 480s python -I -m unittest discover -s preparedness/tests -v
      - name: Explicit HOLD despite diagnostics
        if: always()
        run: |\n          echo "R109 PRIVATE DRAFT: R15 mandatory historical parity unchanged; no human source/safety/QD approval or CMS/publication."

name: Free desktop utilities - Windows installer CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop-software/data-import-doctor/**'
      - 'desktop-software/packet-preflight/**'
      - 'desktop-software/renewal-radar/**'
      - '.github/workflows/free-utilities-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: data-import-doctor
            source: data_import_doctor
            exe: DataImportDoctor
          - slug: packet-preflight
            source: packet_preflight
            exe: PacketPreflight
          - slug: renewal-radar
            source: renewal_radar
            exe: RenewalRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run application unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s "desktop-software/${{ matrix.slug }}" -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Install pinned packager
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed" }
      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "${{ matrix.exe }}" "desktop-software/${{ matrix.slug }}/${{ matrix.source }}.py"
          if ($LASTEXITCODE -ne 0) { throw "Executable build failed" }
          if (-not (Test-Path "dist/${{ matrix.exe }}.exe")) { throw "Executable missing" }
      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe missing" }
      - name: Build setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "desktop-software/${{ matrix.slug }}/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed" }
      - name: Smoke-test Windows silent installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/installers/${{ matrix.exe }}-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $dest = Join-Path $env:RUNNER_TEMP "${{ matrix.exe }}-install-test"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$dest"
          if ($LASTEXITCODE -ne 0) { throw "Installer execution failed with code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $dest "${{ matrix.exe }}.exe"))) { throw "Installed app missing" }
          $uninstaller = Join-Path $dest "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed" }
      - name: Create installer checksum
        shell: pwsh
        run: |
          Get-ChildItem "dist/installers/${{ matrix.exe }}-Setup-*.exe" | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)" | Out-File "dist/installers/SHA256SUMS.txt" -Append -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}-windows-installer-unsigned
          path: |
            dist/installers/*.exe
            dist/installers/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

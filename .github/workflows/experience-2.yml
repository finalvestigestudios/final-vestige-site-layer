name: experience-2

# Experience 2.0 checks only. Independent of the podcast publisher and the Site Layer release lane.
on:
  push:
    paths:
      - "experience-2.0/**"
      - ".github/workflows/experience-2.yml"
  pull_request:
    paths:
      - "experience-2.0/**"
      - ".github/workflows/experience-2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run all Experience 2.0 checks
        run: python experience-2.0/tools/run_all.py
        env:
          FVX_BROWSER_CHANNEL: ""
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-2-results
          path: |
            experience-2.0/dist/test-results.json
            experience-2.0/dist/a11y-results.json
            experience-2.0/dist/media-results.json
            experience-2.0/dist/hero-contrast.json
          if-no-files-found: ignore

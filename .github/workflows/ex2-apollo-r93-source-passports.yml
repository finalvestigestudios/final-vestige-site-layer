# Isolated Apollo R93 staging build; absolutely no deployment or WordPress credentials.
name: Apollo R93 source passports and genuine Chromium (STAGING HOLD)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'experience2/evidence-atlas/tools/*r93*'
      - 'experience2/evidence-atlas/tests/*r93*'
      - 'experience2/evidence-atlas/R93_SOURCE_PASSPORTS_STAGING_HOLD.md'
      - '.github/workflows/ex2-apollo-r93-source-passports.yml'
permissions:
  contents: read
jobs:
  source-exact-custody-and-determinism:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact commit, R92/R91 inheritance, adversarial source rights and deterministic export
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/apollo-r93-pycache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python -m py_compile experience2/evidence-atlas/tools/build_source_passports_r93.py experience2/evidence-atlas/tests/test_source_passports_r93.py experience2/evidence-atlas/tests/browser_source_passports_r93.py
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_source_passports_r93.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_reciprocal_routes_r92.py -v
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92-base"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92-base" --out "$RUNNER_TEMP/r93-a" --archive "$RUNNER_TEMP/r93-a.zip"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92-base" --out "$RUNNER_TEMP/r93-b" --archive "$RUNNER_TEMP/r93-b.zip"
          cmp "$RUNNER_TEMP/r93-a.zip" "$RUNNER_TEMP/r93-b.zip"
          sha256sum "$RUNNER_TEMP/r93-a.zip"
          test -z "$(git status --porcelain)"
      - name: Preserve source-exact deterministic staging package
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r93-exact-source-STAGING-HOLD
          path: ${{ runner.temp }}/r93-a.zip
          if-no-files-found: error
          retention-days: 7
  real-chromium-a11y-performance-and-pdf:
    needs: source-exact-custody-and-determinism
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Pinned real browser, PDF and axe-core dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/r93-axe" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund axe-core@4.14.0
      - name: Run 320-1920 Chromium, no-JS, keyboard/touch, copy, forced-colors, axe and LCP/CLS
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/apollo-r93-browser-pycache"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92-base"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92-base" --out "$RUNNER_TEMP/r93-preview"
          python experience2/evidence-atlas/tests/browser_source_passports_r93.py --src "$RUNNER_TEMP/r93-preview" --out "$RUNNER_TEMP/r93-evidence" --axe "$RUNNER_TEMP/r93-axe/node_modules/axe-core/axe.min.js"
          cat "$RUNNER_TEMP/r93-evidence/R93_BROWSER_RECEIPT.json"
          test -z "$(git status --porcelain)"
      - name: Preserve screenshots, native PDF, axe and browser receipts even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r93-real-chromium-STAGING-HOLD
          path: ${{ runner.temp }}/r93-evidence/
          if-no-files-found: warn
          retention-days: 7

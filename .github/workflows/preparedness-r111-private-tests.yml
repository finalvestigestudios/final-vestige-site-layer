name: Preparedness R111 private source convergence (HOLD)
on:
  push:
    branches:
      - review/preparedness-r111-converged-source-custody-hold-20261103
  pull_request:
    branches:
      - review/preparedness-r110-uncited-caveat-custody-hold-20261103
permissions:
  contents: read
jobs:
  r111-private-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Assert four add-only engineering paths and 12 external pins
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          base = '18fd87aabe8b2eeb4c5c78157b4f8ef77876d618'
          expected = {
              'A\tpreparedness/tools/r111_converged_source_review_gate.py',
              'A\tpreparedness/tests/test_r111_converged_source_review_gate.py',
              'A\tpreparedness/docs/R111_CONVERGED_SOURCE_CUSTODY_HOLD.md',
              'A\t.github/workflows/preparedness-r111-private-tests.yml',
          }
          actual = set(subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines())
          assert actual == expected, ('Unexpected article/source/CMS/navigation edit', actual)
          pins = {
              'claude/prep-start-bbfeb8':'2122d856fce9f64887c16df3d52e64be9f59a55b',
              'claude/prep-shelter-5e1e0e':'5daeaf2dd5ab71806a6b73c91edfb1d8df5da976',
              'claude/prep-food-ccdc55':'f911ff7a655de8d81535ea86ec3d65a49ee76648',
              'claude/prep-health-837444':'d5ef5bafd68361434dd1cc9209915b8e8a4eaf17',
              'claude/prep-hist-food-b81f19':'67e116e536c7410bed30f8f3b1bb8c166f3c223d',
              'claude/prep-hist-home-0e0e38':'7504a5f099594d635e3dd7332a33a2e1346c43a2',
              'claude/prep-hist-field-9db767':'4e5caf812727953aa45e3bda2d382f2c67b6a09c',
              'integration/preparedness-release-candidate-20261101':'ddb3528ba6494dada1fa1c3a142ce746e3a67706',
              'review/preparedness-start-safety-20261030':'7d1ae6b8ef93d10cfb6810987672360885e9c1aa',
              'review/preparedness-food-fixture-isolation-20261030':'e9cd7766dac59d47ab467d8945269b9146c2aef5',
              'feature/vestige-assembly-home-v1':'10495883299d53596992c26a8987f629b2904670',
              'release/homepage-flagship-candidate-20261102':'bdf01b4a3e13fd6179ae9e847c9d4429bbe16176',
          }
          for ref, expected_sha in pins.items():
              current = subprocess.check_output(['git','rev-parse','--verify','refs/remotes/origin/'+ref], text=True).strip()
              assert current == expected_sha, ('Contributor, QA or homepage head changed',ref,current)
          print('Four isolated engineering files; all 12 external refs unchanged; HOLD')
          PY
      - name: Python compile and 78 isolated R111 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -m compileall -q preparedness/tools/r111_converged_source_review_gate.py preparedness/tests/test_r111_converged_source_review_gate.py
          python -I -m unittest discover -s preparedness/tests -p 'test_r111_*.py' -v
      - name: Native validation and private WordPress-ready draft build
        shell: bash
        run: |
          set -euo pipefail
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Exact-Git 35-draft/23-path/30-URL source reviewer dossier
        shell: bash
        run: |
          set -euo pipefail
          python -I preparedness/tools/r111_converged_source_review_gate.py --repo-root . --json > "$RUNNER_TEMP/r111-source-review-HOLD.json"
          python -I - "$RUNNER_TEMP/r111-source-review-HOLD.json" <<'PY'
          import hashlib, json, sys
          with open(sys.argv[1],encoding='utf-8') as f:
              report=json.load(f)
          seal=report.pop('sha256_NOT_A_SIGNATURE')
          expected=hashlib.sha256(json.dumps(report,sort_keys=True,ensure_ascii=False,
                          separators=(',',':'),allow_nan=False).encode()).hexdigest()
          assert seal==expected, 'Private review output changed'
          assert (report['article_count'],report['changed_contributor_paths_pending_review'],
                  report['changed_article_bodies_pending_review'],report['shared_url_groups_pending_review'])==(35,23,7,30)
          assert report['may_publish'] is False and report['may_merge'] is False
          assert report['independent_QD_PASS'] is False and report['qualified_safety_review_approved'] is False
          print('Private converged source reviewer docket consistent; no safety/QD approvals; HOLD')
          PY
      - name: Full Preparedness Python regression suite with bounded time
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s python -I -m unittest discover -s preparedness/tests -v
      - name: Preserve explicit release HOLD
        if: always()
        shell: bash
        run: |
          echo 'R111 engineering diagnostics never authorize merges, CMS writes, QD PASS or emergency advice publication.'

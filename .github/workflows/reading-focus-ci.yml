name: Reading Focus CI

on:
  pull_request:
    paths:
      - 'payloads/reading-focus-wp-block-v1.txt'
      - 'tests/verify_reading_focus.py'
      - '.github/workflows/reading-focus-ci.yml'
      - 'READING-FOCUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Reading Focus artifact
        run: python tests/verify_reading_focus.py

name: EX2 anonymous hosted first-screen Margins visual evidence (HOLD)
on:
  pull_request:
    paths:
      - 'experience2/home-flagship/qa/release-candidate/capture_hosted_margins_visual.py'
      - 'experience2/home-flagship/qa/release-candidate/test_capture_hosted_margins_visual.py'
      - 'experience2/home-flagship/qa/release-candidate/HOSTED_FIRSTSCREEN_VISUAL_HOLD.md'
      - '.github/workflows/ex2-hosted-margins-firstscreen-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact SHA and adversarial source tests
        run: |
          git rev-parse HEAD
          cd experience2/home-flagship/qa/release-candidate
          python -m py_compile capture_hosted_margins_visual.py test_capture_hosted_margins_visual.py
          python -m unittest -v test_capture_hosted_margins_visual.py
  hosted:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Chromium tools only; never on WordPress
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Read-only live public first-screen visual comparison
        run: |
          git rev-parse HEAD
          python experience2/home-flagship/qa/release-candidate/capture_hosted_margins_visual.py --output-dir visual_receipt
      - name: Keep screenshot and JSON evidence even if capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex2-hosted-firstscreen-visual-HOLD
          retention-days: 7
          if-no-files-found: ignore
          path: visual_receipt/

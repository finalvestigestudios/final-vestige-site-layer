# Independent, read-only diagnostic for #73. Source evidence is NOT a Windows release gate.
# SHA-256 source inventory and every inherited test command are pinned in the R509 manifest.
# The runner fails closed on missing/changed commands; never approves QD or release.
name: Desktop six-engine source evidence (R385, INTERNAL)

on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-source-evidence-r385.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence:
    name: Six source engines / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONPATH: products/desktop
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pinned offline cryptography dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Run immutable R509 source matrix (414 inherited commands + 2 custody tests)
        run: python -B -W error products/desktop/scripts/source_evidence_runner_r509.py

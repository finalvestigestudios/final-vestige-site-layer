# Independent, read-only diagnostic for #73. Source evidence is NOT a Windows release gate.
# This workflow deliberately does not inherit the growing desktop-build.yml job graph.
name: Desktop six-engine source evidence (R385, INTERNAL)

on:
  pull_request:
    paths:
      - 'products/desktop/**'
      - '.github/workflows/desktop-source-evidence-r385.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence:
    name: Six source engines / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONPATH: products/desktop
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install pinned offline cryptography dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Prove independent CI custody rules in normal and optimized mode
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_independent_ci_r385.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_independent_ci_r385.py
      - name: R386 reject fabricated source smoke output receipts (normal and optimized)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_smoke_result_custody_r386.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_smoke_result_custody_r386.py
      - name: R387 six-product exact report counts and R21 source gate regressions
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_smoke_receipt_contract_r387.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_smoke_receipt_contract_r387.py
          python -W error -m unittest discover -s products/desktop/tests -p test_source_smoke_gate_r21.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_source_smoke_gate_r21.py
      - name: R388 ProcureGuard private JSON parser and real policy loader (normal and optimized)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_procurement_policy_private_json_r388.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_procurement_policy_private_json_r388.py
          python -W error -m unittest discover -s products/desktop/tests -p test_procurement_policy_privacy_integration_r388.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_procurement_policy_privacy_integration_r388.py
      - name: R389 verify all six report roles and required premium manifests (normal and optimized)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_smoke_output_roles_r389.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_smoke_output_roles_r389.py
      - name: R390 Windows release-candidate reparse-path and descriptor custody (normal and optimized)
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_candidate_reparse_r390.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_candidate_reparse_r390.py
      - name: Execute six synthetic engines with before-and-after SHA-256 source inventory
        run: |
          python -W error products/desktop/scripts/source_smoke_gate.py
          python -OO -W error products/desktop/scripts/source_smoke_gate.py
      - name: Run six-app financial regression including Decimal and provenance
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_safety_smoke.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_safety_smoke.py
      - name: Require 22 actual AES-GCM regression cases on the full checkout
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_vault_crypto_gate_r316.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_vault_crypto_gate_r316.py
      - name: Require real Ed25519 issuance, verification and SQLite registry cases
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_offline_entitlement_r11.py
          python -W error -m unittest discover -s products/desktop/tests -p test_license_issuer_r12.py
          python -W error -m unittest discover -s products/desktop/tests -p test_license_registry_r13.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_offline_entitlement_r11.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_license_issuer_r12.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_license_registry_r13.py
      - name: Check latest premium entitlement payload confidentiality regressions
        run: |
          python -W error -m unittest discover -s products/desktop/tests -p test_entitlement_payload_privacy_r384.py
          python -OO -W error -m unittest discover -s products/desktop/tests -p test_entitlement_payload_privacy_r384.py

name: Preparedness R99 Print CSS Baseline and Media Semantics (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r98-print-source-safety-visibility-hold-20261103
    paths:
      - preparedness/tools/r98_print_source_visibility_custody.py
      - preparedness/tests/test_r98_print_source_visibility_custody.py
      - preparedness/docs/R99_PRINT_CSS_BASELINE_SEMANTICS_HOLD.md
      - .github/workflows/preparedness-r99-private-tests.yml
permissions:
  contents: read
jobs:
  private-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen R98 parent, seven cluster refs and additive-only R99 footprint
        run: |
          python -I - <<'PY'
          import subprocess
          base = "4f3de05d05e40fe06bf2e1ab68b1b04556fb4378"
          got = subprocess.check_output(["git", "rev-parse", "refs/remotes/origin/review/preparedness-r98-print-source-safety-visibility-hold-20261103"], text=True).strip()
          assert got == base, ("R98 parent changed", got, base)
          actual = set(subprocess.check_output(["git", "diff", "--name-status", base, "HEAD"], text=True).splitlines())
          expected = {
              "M\tpreparedness/tools/r98_print_source_visibility_custody.py",
              "M\tpreparedness/tests/test_r98_print_source_visibility_custody.py",
              "A\tpreparedness/docs/R99_PRINT_CSS_BASELINE_SEMANTICS_HOLD.md",
              "A\t.github/workflows/preparedness-r99-private-tests.yml",
          }
          assert actual == expected, (actual, expected)
          pins = {
              "claude/prep-start-bbfeb8": "2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e": "5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55": "f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444": "d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19": "67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38": "7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767": "4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101": "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for ref, pin in pins.items():
              actual_sha = subprocess.check_output(["git", "rev-parse", "refs/remotes/origin/" + ref], text=True).strip()
              assert actual_sha == pin, (ref, actual_sha, pin)
          print("R99 exact parent and eight source references checked. Release HOLD.")
          PY
      - name: Compile and run dedicated R98 plus R99 adversarial CSS suite
        run: |
          python -I -m compileall -q preparedness/tools/r98_print_source_visibility_custody.py preparedness/tests/test_r98_print_source_visibility_custody.py
          python -I -m unittest discover -s preparedness/tests -p test_r98_print_source_visibility_custody.py -v
      - name: Verify actual 35+1 private rendered source and print CSS custody
        run: |
          python -I preparedness/tools/r98_print_source_visibility_custody.py
          python -I preparedness/tools/r98_print_source_visibility_custody.py --private-json-stdout > "$RUNNER_TEMP/private-r99.json"
          python -I - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-r99.json").read_text())
          assert report["schema"] == "r98-print-offline-source-review-css-hold-v1"
          assert report["release_state"] == "HOLD" and report["may_publish"] is False
          assert report["protected_article_drafts"] == 35 and report["protected_real_tool_drafts"] == 1
          assert report["prior_citation_occurrences_preserved_R93_R97"] == 1959
          assert report["css_custody"]["browser_print_QA"] == "NOT_REVIEWED"
          assert report["css_custody"]["calculator_hidden_on_print_REVIEW_REQUIRED"]
          assert len(report["css_custody"]["screen_only_decorative_pseudo_hide_exceptions_NOT_SAFETY_APPROVAL"]) == 5
          assert report["independent_QD"] == "NOT_REVIEWED"
          print("Original CSS and 36 private draft route/citation custody held.")
          PY
      - name: Original evidence safety-state validator and private WordPress draft build
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Complete Python suite (at least 36)
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Human/QD/print/mandatory integrity remain separate release HOLD
        if: always()
        run: echo 'No publish, no WordPress writes, no independent QD pass and no qualified safety verdict.'

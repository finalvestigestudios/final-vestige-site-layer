name: Scale Board R7 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/scale-board-wp-block-r7.txt'
      - 'tests/verify_scale_board_r7.py'
      - 'tests/fixtures/scale-board-r7-*.html'
      - 'tests/fixtures/scale-board-r5-*.html'
      - 'tests/fixtures/scale-board-r4-*.html'
      - 'tests/fixtures/scale-board-r3-*.html'
      - 'tests/fixtures/scale-board-r2-*.html'
      - 'tests/fixtures/scale-board-r1-*.html'
      - '.github/workflows/scale-board-r7-ci.yml'
      - 'SCALE_BOARD_R7.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Scale Board R7 artifact and browser behavior
        run: python tests/verify_scale_board_r7.py
      - name: Upload R7 browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-board-r7-diagnostics
          path: scale-board-r7-*-failure.txt
          if-no-files-found: ignore
          retention-days: 1

name: EX2 combined rights + Margins hosted ephemeral admission (HOLD)
on:
  pull_request:
    paths:
      - 'experience2/home-flagship/qa/release-candidate/verify_integrated_rights_contrast.py'
      - 'experience2/home-flagship/qa/release-candidate/test_verify_integrated_rights_contrast.py'
      - 'experience2/home-flagship/qa/release-candidate/INTEGRATED_RIGHTS_CONTRAST_HOLD.md'
      - '.github/workflows/ex2-integrated-rights-contrast-HOLD.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and adversarial source tests
        run: |
          git rev-parse HEAD
          python -I -m py_compile experience2/home-flagship/qa/release-candidate/verify_integrated_rights_contrast.py
          python -I -m py_compile experience2/home-flagship/qa/release-candidate/test_verify_integrated_rights_contrast.py
          python -m unittest discover -v -s experience2/home-flagship/qa/release-candidate -p 'test_verify_integrated_rights_contrast.py'

  real-host-ephemeral:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin actual Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Install pinned local axe-core without repository dependencies
        run: |
          mkdir -p /tmp/fv-ex2-axe
          cd /tmp/fv-ex2-axe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --no-save axe-core@4.10.3
          test -s /tmp/fv-ex2-axe/node_modules/axe-core/axe.min.js
      - name: Actual anonymous public host two-fix integration (never publish)
        run: |
          git rev-parse HEAD
          python experience2/home-flagship/qa/release-candidate/verify_integrated_rights_contrast.py \
            --out ex2_combined_hold \
            --axe /tmp/fv-ex2-axe/node_modules/axe-core/axe.min.js
      - name: Preserve sanitized release-HOLD evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex2-combined-nypl-margins-hosted-HOLD
          path: ex2_combined_hold/
          retention-days: 7
          if-no-files-found: warn

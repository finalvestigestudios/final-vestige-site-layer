name: Preparedness R78 Document Citation Matrix (PRIVATE HOLD)
on:
  pull_request:
    branches: [review/preparedness-r77-temporal-evidence-custody-hold-20261102]
    paths:
      - preparedness/tools/r78_document_citation_review_matrix.py
      - preparedness/tests/test_r78_document_citation_review_matrix.py
      - preparedness/docs/R78_DOCUMENT_CITATION_REVIEW_HOLD.md
      - .github/workflows/preparedness-r78-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r78-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  document-citation-matrix-private-only:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout draft exact SHA, no retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce R77 parent exactly and four add-only engineering files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "377d5f7d1c2e9a64943268562750cf8d468bd917"
          test "$BASE_REF" = "review/preparedness-r77-temporal-evidence-custody-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r78-document-citation-review-matrix-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r78-changed
          python -I - <<'PY'
          from pathlib import Path
          raw=Path("/tmp/r78-changed").read_bytes().split(b"\0")
          found=[(raw[i].decode(),raw[i+1].decode()) for i in range(0,len(raw)-1,2)]
          want={
            "preparedness/tools/r78_document_citation_review_matrix.py",
            "preparedness/tests/test_r78_document_citation_review_matrix.py",
            "preparedness/docs/R78_DOCUMENT_CITATION_REVIEW_HOLD.md",
            ".github/workflows/preparedness-r78-private-tests.yml"}
          assert len(found)==4 and {path for _,path in found}==want,found
          assert all(status=="A" for status,_ in found),found
          print("R78 add-only four-file custody scope PASS")
          PY
      - name: Pin all seven Claude contributors and independent RC
        run: |
          python -I - <<'PY'
          import subprocess
          refs={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":"ddb3528ba6494dada1fa1c3a142ce746e3a67706"}
          for ref,want in refs.items():
              got=subprocess.check_output(["git","rev-parse","--verify",
                 "refs/remotes/origin/"+ref+"^{commit}"],text=True).strip()
              assert got==want,(ref,got,want)
          print("Contributor exact SHAs and RC pin match; historical parity remains separate.")
          PY
      - name: Compile both new Python files without pycache
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for path in ("preparedness/tools/r78_document_citation_review_matrix.py",
                       "preparedness/tests/test_r78_document_citation_review_matrix.py"):
              compile(Path(path).read_text(encoding="utf-8"),path,"exec")
          print("R78 Python syntax compiled.")
          PY
      - name: Run 83 R78 individual tests (41 documents and 42 safeguards)
        run: python -I -m unittest discover -s preparedness/tests -p test_r78_document_citation_review_matrix.py -v
      - name: Verify sealed 35+6 document source/citation review matrix
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import csv,importlib.util,io
          f=Path("preparedness/tools/r78_document_citation_review_matrix.py")
          spec=importlib.util.spec_from_file_location("r78_ci",f)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          row=mod.live_report()
          mod.sealed(row)
          counts=row["counts"]
          assert tuple(counts[k] for k in (
            "articles","tools","distinct_source_readings_retained",
            "citation_occurrences_retained","source_variant_edges_retained",
            "unabridged_DOM_blocks_retained","shared_URL_source_groups_retained",
            "reused_source_ID_groups_retained"))==(35,6,244,2173,2359,4070,32,15),counts
          assert len(row["document_review_packets_NOT_APPROVED"])==41
          assert counts["consequential_action_or_quantity_review_blocks"]==1068
          assert counts["consequential_blocks_without_same_block_citations"]==347
          assert len(list(csv.DictReader(io.StringIO(
               mod.csv_private_document_queue(row)))))==41
          assert all(row[k] is False for k in mod.HOLD_KEYS)
          assert row["publication_clearance"] is False
          assert row==mod.live_report(),"nondeterministic R78 report"
          print("R78 document-first crosswalk exact census and HOLD PASS")
          PY
      - name: Original native content and source validator (no CMS)
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready private draft build only
        run: python -I preparedness/tools/build.py
      - name: Full native Preparedness Python suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Reminder mandatory independent release integrity is separate
        if: always()
        run: |
          echo "RELEASE HOLD: no publication, CMS, WordPress or navigation writes."
          echo "No human source, claim or qualified medical/food/water safety approval."
          echo "The separate 13-stage integrity, browser QD and expert review remain required."

name: Preparedness R94 Original Body Reading Custody (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r93-rendered-citation-fidelity-hold-20261103
    paths:
      - preparedness/tools/r94_body_custody.py
      - preparedness/tests/test_r94_body_custody.py
      - preparedness/docs/R94_ORIGINAL_BODY_CUSTODY_HOLD.md
      - .github/workflows/preparedness-r94-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r94-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  private-read-only:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable R93 parent, seven Claude branches, RC and four ADD-only files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -I - <<'PY'
          import os, subprocess
          assert os.environ["BASE_SHA"] == "84eb6fa8f7de20d4e7737769d2052e55c722131a"
          assert os.environ["BASE_REF"] == "review/preparedness-r93-rendered-citation-fidelity-hold-20261103"
          assert os.environ["HEAD_REF"] == "review/preparedness-r94-original-body-reading-custody-hold-20261103"
          rows = subprocess.check_output(["git", "diff", "--name-status",
                    os.environ["BASE_SHA"], "HEAD"], text=True).splitlines()
          expected = {
              "preparedness/tools/r94_body_custody.py",
              "preparedness/tests/test_r94_body_custody.py",
              "preparedness/docs/R94_ORIGINAL_BODY_CUSTODY_HOLD.md",
              ".github/workflows/preparedness-r94-private-tests.yml",
          }
          assert len(rows) == 4 and set(rows) == {"A\t" + p for p in expected}, rows
          pinned = {
              "claude/prep-start-bbfeb8": "2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e": "5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55": "f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444": "d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19": "67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38": "7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767": "4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101":
                  "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for ref, sha in pinned.items():
              got = subprocess.check_output(["git", "rev-parse",
                      "refs/remotes/origin/" + ref], text=True).strip()
              assert got == sha, (ref, got, sha)
              print(ref, got)
          print("R94 PASS: source and predecessor refs and four ADD-only files")
          PY
      - name: R94 independent synthetic/adversarial mutation suite
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for p in ("preparedness/tools/r94_body_custody.py",
                    "preparedness/tests/test_r94_body_custody.py"):
              compile(Path(p).read_text(encoding="utf-8"), p, "exec")
          PY
          python -I -m unittest discover -s preparedness/tests -p test_r94_body_custody.py -v
      - name: Actual original author text to WordPress rendered-body evidence
        run: |
          python -I preparedness/tools/r94_body_custody.py
          python -I preparedness/tools/r94_body_custody.py --private-json-stdout > "$RUNNER_TEMP/r94-private.json"
          python -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "r94-private.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["schema"] == "r94-original-editorial-body-custody-private-hold-v1"
          assert report["release_state"] == "HOLD" and report["may_publish"] is False
          assert report["article_draft_pairs"] == 35
          assert report["planned_tools"] == 6
          assert report["real_drafts_read"] == 35 + report["actual_tool_draft_pairs"]
          assert len(report["missing_tool_draft_pairs_NOT_IMPORTABLE"]) == 6-report["actual_tool_draft_pairs"]
          assert report["citations_independently_rechecked_through_R93"] >= 1500
          assert report["literal_body_blocks_preserved"] > 1000
          assert all(x["release_state"] == "HOLD" and x["may_publish"] is False
                     for x in report["private_editorial_body_witnesses_NOT_APPROVED"])
          seal = report.pop("sha256_seal")
          raw = json.dumps(report, sort_keys=True, ensure_ascii=False,
                           separators=(",", ":"), allow_nan=False).encode("utf-8")
          assert hashlib.sha256(raw).hexdigest() == seal
          print("R94 PASS: complete original text witness, scripts, 35+current tools, R93 citations, HOLD")
          PY
          rm -f "$RUNNER_TEMP/r94-private.json"
      - name: Native validator and offline WordPress DRAFT ONLY build
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Full Preparedness Python regression suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Publication and QD gates remain closed
        if: always()
        run: |
          echo 'PRIVATE DIAGNOSTIC ONLY; mandatory machine release-integrity not waived.'
          echo 'NO independent QD PASS, qualified emergency safety, human source or claim approval.'
          echo 'NO WordPress/CMS writes, homepage/nav changes, merge or public release.'

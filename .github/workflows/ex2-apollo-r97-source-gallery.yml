# Apollo-only staging CI. No deployment or WordPress writes.
name: Apollo R97 rights-safe source gallery (STAGING HOLD)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'experience2/evidence-atlas/tools/build_source_gallery_r97.py'
      - 'experience2/evidence-atlas/tests/test_source_gallery_r97.py'
      - 'experience2/evidence-atlas/tests/browser_source_gallery_r97.py'
      - 'experience2/evidence-atlas/R97_RIGHTS_SAFE_GALLERY_STAGING_HOLD.md'
      - '.github/workflows/ex2-apollo-r97-source-gallery.yml'
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial source custody and reproducible staging exports
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/r97-pycache"
          python -m py_compile experience2/evidence-atlas/tools/build_source_gallery_r97.py experience2/evidence-atlas/tests/test_source_gallery_r97.py experience2/evidence-atlas/tests/browser_source_gallery_r97.py
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_source_gallery_r97.py -v
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92" --out "$RUNNER_TEMP/r93"
          python experience2/evidence-atlas/tools/build_curated_atlas_r94.py --src "$RUNNER_TEMP/r93" --out "$RUNNER_TEMP/r94"
          python experience2/evidence-atlas/tools/build_source_gallery_r97.py --src "$RUNNER_TEMP/r94" --out "$RUNNER_TEMP/a" --archive "$RUNNER_TEMP/a.zip"
          python experience2/evidence-atlas/tools/build_source_gallery_r97.py --src "$RUNNER_TEMP/r94" --out "$RUNNER_TEMP/b" --archive "$RUNNER_TEMP/b.zip"
          cmp "$RUNNER_TEMP/a.zip" "$RUNNER_TEMP/b.zip"
          sha256sum "$RUNNER_TEMP/a.zip"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: apollo-r97-deterministic-source-STAGING-HOLD
          path: ${{ runner.temp }}/a.zip
          if-no-files-found: error
          retention-days: 7
  real-chromium:
    needs: source-custody
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install pinned free browser and accessibility dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/axe" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund axe-core@4.14.0
      - name: Genuine HTTP Playwright, axe, 320-1920, JS/no-JS, touch and PDF
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/r97-chromium-cache"
          python experience2/evidence-atlas/tools/build_reciprocal_routes_r92.py "$RUNNER_TEMP/r92"
          python experience2/evidence-atlas/tools/build_source_passports_r93.py --src "$RUNNER_TEMP/r92" --out "$RUNNER_TEMP/r93"
          python experience2/evidence-atlas/tools/build_curated_atlas_r94.py --src "$RUNNER_TEMP/r93" --out "$RUNNER_TEMP/r94"
          python experience2/evidence-atlas/tools/build_source_gallery_r97.py --src "$RUNNER_TEMP/r94" --out "$RUNNER_TEMP/gallery"
          python experience2/evidence-atlas/tests/browser_source_gallery_r97.py --src "$RUNNER_TEMP/gallery" --out "$RUNNER_TEMP/browser-evidence" --axe "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"
          cat "$RUNNER_TEMP/browser-evidence/R97_BROWSER_RECEIPT.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apollo-r97-real-chromium-axe-STAGING-HOLD
          path: ${{ runner.temp }}/browser-evidence/
          if-no-files-found: warn
          retention-days: 7

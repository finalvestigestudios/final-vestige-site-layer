# Draft/HOLD: disposable WordPress/Assembler evidence for the CURRENT seven-chapter candidate.
# No WP.com production endpoint, API key, hosted staging, database import, deployment or merge.
name: EX2 real isolated WordPress staging admission
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experience2/home-flagship/**'
      - '.github/workflows/ex2-private-wp-native-staging.yml'
permissions:
  contents: read
jobs:
  exact-source-php:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'qa/ex2-private-wp-candidate-contract-20261102' || github.head_ref == 'fix/ex2-pr573-native-wordpress-slash-custody-20261101' || github.head_ref == 'fix/ex2-pr576-local-playground-readiness-evidence-20261101' || github.head_ref == 'fix/ex2-pr580-playground-runtime-pin-20261102' || github.head_ref == 'fix/ex2-pr588-real-wp-admission-20261102' || github.head_ref == 'fix/ex2-pr591-redirect-classification-20261102' || github.head_ref == 'fix/ex2-pr594-direct-login-health-20261102' || github.head_ref == 'fix/ex2-pr597-rest-readiness-20261102' || github.head_ref == 'fix/ex2-pr601-redirect-provenance-20261102' || github.head_ref == 'fix/ex2-pr603-loopback-cookie-handshake-20261102' || github.head_ref == 'fix/ex2-pr605-visible-archive-browser-admission-20261102' || github.head_ref == 'qa/ex2-pr607-true-viewport-private-render-20261102' || github.head_ref == 'qa/ex2-pr609-release-content-parity-20261102' || github.head_ref == 'qa/ex2-pr613-throttled-private-performance-20261102' || github.head_ref == 'qa/ex2-nypl-capture-rights-custody-20261102' || github.head_ref == 'qa/ex2-pr625-private-lighthouse-20261102' || github.head_ref == 'qa/ex2-pr632-keyboard-touch-320-reflow-20261102' || github.head_ref == 'qa/ex2-pr637-real-pinch-and-reflow-20261102' || github.head_ref == 'qa/ex2-pr643-nypl-no-reproduction-20261102' || github.head_ref == 'qa/ex2-pr650-image-network-allowlist-20261102' || github.head_ref == 'qa/ex2-pr652-nojs-archival-image-recovery-20261102')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact review commit, never PR synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm 40-character reviewed source SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute real PHP composition with original eleven source assets + four hostile mutations
        shell: bash
        run: |
          php -v
          php -l experience2/home-flagship/qa/integration/private-preview/fv-ex2-private-preview.php
          python -m unittest discover -s experience2/home-flagship/qa/integration/private-preview/tests -p test_current_candidate_compose.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground -p test_normalize_official_assembler.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground/parity -p test_prepare_unified_playground.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground/parity -p test_wp_slash_persistence.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground -p test_local_http_readiness.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground -p test_measure_private_lab.py -v
          python -m unittest discover -s experience2/home-flagship/qa/playground -p test_private_usability.py -v
          node --check experience2/home-flagship/qa/playground/lighthouse_receipt.mjs
          node --check experience2/home-flagship/qa/playground/measure_private_lighthouse.mjs
          node --test experience2/home-flagship/qa/playground/test_private_lighthouse.mjs
          python -m unittest discover -s experience2/home-flagship/qa/playground -p test_playground_runtime_contract.py -v
          node --test experience2/home-flagship/qa/release-candidate/source_gate.test.mjs
          python experience2/home-flagship/qa/release-candidate/verify_release_content_parity.py --repo .
          python -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_release_content_parity.py -v
          python -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_exact_staging.py -v
          python -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_media_transfer_admission.py -v

  ephemeral-wordpress:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'qa/ex2-private-wp-candidate-contract-20261102' || github.head_ref == 'fix/ex2-pr573-native-wordpress-slash-custody-20261101' || github.head_ref == 'fix/ex2-pr576-local-playground-readiness-evidence-20261101' || github.head_ref == 'fix/ex2-pr580-playground-runtime-pin-20261102' || github.head_ref == 'fix/ex2-pr588-real-wp-admission-20261102' || github.head_ref == 'fix/ex2-pr591-redirect-classification-20261102' || github.head_ref == 'fix/ex2-pr594-direct-login-health-20261102' || github.head_ref == 'fix/ex2-pr597-rest-readiness-20261102' || github.head_ref == 'fix/ex2-pr601-redirect-provenance-20261102' || github.head_ref == 'fix/ex2-pr603-loopback-cookie-handshake-20261102' || github.head_ref == 'fix/ex2-pr605-visible-archive-browser-admission-20261102' || github.head_ref == 'qa/ex2-pr607-true-viewport-private-render-20261102' || github.head_ref == 'qa/ex2-pr609-release-content-parity-20261102' || github.head_ref == 'qa/ex2-pr613-throttled-private-performance-20261102' || github.head_ref == 'qa/ex2-nypl-capture-rights-custody-20261102' || github.head_ref == 'qa/ex2-pr625-private-lighthouse-20261102' || github.head_ref == 'qa/ex2-pr632-keyboard-touch-320-reflow-20261102' || github.head_ref == 'qa/ex2-pr637-real-pinch-and-reflow-20261102' || github.head_ref == 'qa/ex2-pr643-nypl-no-reproduction-20261102' || github.head_ref == 'qa/ex2-pr650-image-network-allowlist-20261102' || github.head_ref == 'qa/ex2-pr652-nojs-archival-image-recovery-20261102')
    needs: exact-source-php
    env:
      npm_config_engine_strict: 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact draft SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Pin Node/npm to installed Playground CLI 3.1.61 engine requirements
        shell: bash
        run: |
          set -euo pipefail
          # 3.1.61 requires Node >=24.18.0 and npm >=11.16.0;
          # GitHub run 41407578279 incorrectly used Node 22/npm 10.
          # GitHub runner only: no CMS, hosted staging or credentials.
          npm install --global --no-audit --no-fund npm@11.16.0
          python experience2/home-flagship/qa/playground/check_playground_runtime.py
          test "$(npm config get engine-strict)" = "true"
      - name: Pin exact source and ensure no staging CMS production endpoint
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          php -v
          python -m py_compile experience2/home-flagship/qa/playground/ci_ex2_wp_playground.py
          python -m py_compile experience2/home-flagship/qa/playground/measure_private_lab.py
          python -m py_compile experience2/home-flagship/qa/playground/verify_private_usability.py
          mkdir -p "$RUNNER_TEMP/fv-ex2-wordpress-receipt"
      - name: Download official Automattic Assembler theme (source origin audited, immutable pin still pending)
        shell: bash
        env:
          THEME_URL: https://public-api.wordpress.com/rest/v1/themes/download/assembler.zip
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 --proto '=https' --proto-redir '=https' --tlsv1.2 "$THEME_URL" --output "$RUNNER_TEMP/fv-ex2-official-assembler.zip"
          unzip -t "$RUNNER_TEMP/fv-ex2-official-assembler.zip" >/dev/null
          # Automattic packages official files beneath assembler-wpcom/, while
          # the pinned local WordPress staging kit requires assembler/.
          # Rewrite only the archive folder prefix; preserve each file's bytes
          # and retain BOTH SHA-256 digests for custody review.
          python experience2/home-flagship/qa/playground/normalize_official_assembler.py \
            --source "$RUNNER_TEMP/fv-ex2-official-assembler.zip" \
            --derived "$RUNNER_TEMP/fv-ex2-canonical-assembler.zip" \
            --receipt "$RUNNER_TEMP/fv-ex2-wordpress-receipt/THEME_CUSTODY.json"
          echo "Official WordPress.com download URL: $THEME_URL" >> "$RUNNER_TEMP/fv-ex2-wordpress-receipt/THEME_SOURCE_ORIGIN.txt"
          echo "Derived ZIP is NOT a separately signed official release" >> "$RUNNER_TEMP/fv-ex2-wordpress-receipt/THEME_SOURCE_ORIGIN.txt"
      - name: Prepare existing, custody-checked private WordPress/Assembler kit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          THEME_SHA=$(sha256sum "$RUNNER_TEMP/fv-ex2-canonical-assembler.zip" | cut -d' ' -f1)
          python experience2/home-flagship/qa/playground/prepare_isolated_stage.py \
            --repo . --expected-head "$EXPECTED_HEAD" \
            --assembler-zip "$RUNNER_TEMP/fv-ex2-canonical-assembler.zip" \
            --expected-theme-sha256 "$THEME_SHA" \
            --out "$RUNNER_TEMP/fv-ex2-ephemeral-stage"
          python experience2/home-flagship/qa/playground/parity/prepare_unified_playground.py \
            --repo . --expected-head "$EXPECTED_HEAD" \
            --prepared-stage "$RUNNER_TEMP/fv-ex2-ephemeral-stage" \
            --assembler-zip "$RUNNER_TEMP/fv-ex2-canonical-assembler.zip" \
            --assembler-sha256 "$THEME_SHA"
      - name: Install actual browser and axe-core for real accessibility testing
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/fv-ex2-axe" --no-save --ignore-scripts --no-package-lock axe-core@4.14.0
      - name: Install pinned genuine Lighthouse and copy exact-SHA runner outside checkout
        shell: bash
        run: |
          set -euo pipefail
          SRC="experience2/home-flagship/qa/playground"
          DEST="$RUNNER_TEMP/fv-ex2-lighthouse"
          mkdir -p "$DEST"
          npm install --prefix "$DEST" --no-save --no-audit --no-fund --ignore-scripts \
            lighthouse@12.8.2 chrome-launcher@1.2.0 playwright-core@1.55.0
          for name in lighthouse_receipt.mjs measure_private_lighthouse.mjs test_private_lighthouse.mjs; do
            cp "$SRC/$name" "$DEST/$name"
            cmp "$SRC/$name" "$DEST/$name"
          done
          node --check "$DEST/measure_private_lighthouse.mjs"
          node --test "$DEST/test_private_lighthouse.mjs"

      - name: Prewarm pinned Playground 3.1.61 CLI under engine-strict runtime
        shell: bash
        env:
          npm_config_yes: 'true'
          npm_config_audit: 'false'
          CI: 'true'
        run: |
          set -euo pipefail
          # No production URL or credentials. This is a CLI-only preflight,
          # never a claim that WordPress has rendered.
          timeout 120s npx --yes @wp-playground/cli@3.1.61 server --help >/dev/null

      - name: Launch ephemeral local WordPress and run the existing five-width source/integration/axe/media gate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python experience2/home-flagship/qa/playground/ci_ex2_wp_playground.py \
            --repo . --expected-head "$EXPECTED_HEAD" \
            --stage "$RUNNER_TEMP/fv-ex2-ephemeral-stage" \
            --axe-script "$RUNNER_TEMP/fv-ex2-axe/node_modules/axe-core/axe.min.js" \
            --lighthouse-runner "$RUNNER_TEMP/fv-ex2-lighthouse/measure_private_lighthouse.mjs" \
            --out "$RUNNER_TEMP/fv-ex2-wordpress-receipt"
      - name: Upload redacted staging receipts and screenshots only (no credentials, database or plugin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex2-ephemeral-assembler-wordpress-HOLD
          path: ${{ runner.temp }}/fv-ex2-wordpress-receipt/
          if-no-files-found: warn
          retention-days: 7

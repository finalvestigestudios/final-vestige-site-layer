name: Evidence Trace CI

on:
  pull_request:
    paths:
      - 'payloads/evidence-trace-wp-block-v1.txt'
      - 'tests/verify_evidence_trace.py'
      - '.github/workflows/evidence-trace-ci.yml'
      - 'EVIDENCE-TRACE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Evidence Trace artifact
        run: python tests/verify_evidence_trace.py

name: Listen Mode CI

on:
  pull_request:
    paths:
      - 'payloads/listen-mode-wp-block-v1.txt'
      - 'tests/verify_listen_mode.py'
      - '.github/workflows/listen-mode-ci.yml'
      - 'LISTEN-MODE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Listen Mode artifact
        run: python tests/verify_listen_mode.py

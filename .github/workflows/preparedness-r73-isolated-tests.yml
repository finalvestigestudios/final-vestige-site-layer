name: Preparedness R73 Consequential Action Language Review (PRIVATE HOLD)
on:
  pull_request:
    branches: [review/preparedness-r72-source-scope-impact-collision-hold-20261102]
    paths:
      - preparedness/tools/r73_consequential_language_review.py
      - preparedness/tests/test_r73_consequential_language_review.py
      - preparedness/docs/R73_CONSEQUENTIAL_ACTION_LANGUAGE_EVIDENCE_HOLD.md
      - .github/workflows/preparedness-r73-isolated-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r73-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  private-consequential-language-custody-review:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read-only exact PR checkout, no persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact R72 base, review branch and four-file scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "e614894a99dfeeebb2b2d723e1d5816625e80da5"
          test "$BASE_REF" = "review/preparedness-r72-source-scope-impact-collision-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r73-consequential-action-triage-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r73-draft-paths
          python -I - <<'PY'
          from pathlib import Path
          seen={p.decode() for p in Path("/tmp/r73-draft-paths").read_bytes().split(b"\0") if p}
          allowed={
              "preparedness/tools/r73_consequential_language_review.py",
              "preparedness/tests/test_r73_consequential_language_review.py",
              "preparedness/docs/R73_CONSEQUENTIAL_ACTION_LANGUAGE_EVIDENCE_HOLD.md",
              ".github/workflows/preparedness-r73-isolated-tests.yml",
          }
          assert seen==allowed,(seen,allowed)
          print("R73 exactly 4 additive review-only files; originals untouched")
          PY
      - name: Exact seven Claude contributors plus separate RC reference
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          expected={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":
                "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
          }
          for branch,sha in expected.items():
              actual=subprocess.check_output(["git","rev-parse","--verify",
                  "refs/remotes/origin/"+branch+"^{commit}"],text=True).strip()
              assert actual==sha,(branch,sha,actual)
          print("7/7 live contributors + RC exact SHA pins PASS; unchanged evidence is not verified advice")
          PY
      - name: Compile R73 Python without writing bytecode
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for path in ("preparedness/tools/r73_consequential_language_review.py",
                       "preparedness/tests/test_r73_consequential_language_review.py"):
              compile(Path(path).read_text(encoding="utf-8"),path,"exec")
          print("R73 Python syntax PASS")
          PY
      - name: 36+ isolated synthetic and adversarial R73 tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r73_consequential_language_review.py -v
      - name: Full exact RC source and consequential-action triage census
        run: |
          python -I - <<'PY'
          import csv,importlib.util,io,json
          from pathlib import Path
          path=Path("preparedness/tools/r73_consequential_language_review.py")
          spec=importlib.util.spec_from_file_location("r73_ci",path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          r=module.live_report()
          c=r["counts"]
          assert (c["articles"],c["tools"],c["complete_distinct_origin_scoped_source_readings"],
                  c["citation_occurrences"],c["unabridged_DOM_review_tasks"])==(35,6,244,2173,4070),c
          assert c["topic_with_action_cue"]+c["topic_without_action_cue"]+\
                 c["general_editorial_blocks"]==4070,c
          assert c["consequential_action_wording_triage_packets"]==c["topic_with_action_cue"],c
          assert all(r[key] is False for key in module.HOLD)
          assert all(c[key]==0 for key in ("human_claim_support_reviews",
              "human_qualified_safety_reviews","independent_QD_approvals"))
          module.sealed(r,module.SCHEMA)
          assert r==module.live_report(),"R73 non-deterministic"
          rows=list(csv.DictReader(io.StringIO(module.csv_action_packets(r))))
          assert len(rows)==c["consequential_action_wording_triage_packets"],c
          print("R73 private machine triage PASS",json.dumps(c,sort_keys=True))
          print("No human claim/source/qualified safety/QD verification. No URL fetch, CMS, publishing.")
          PY
      - name: Native original Preparedness validation (machine only)
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready private draft build only
        run: python -I preparedness/tools/build.py
      - name: Full native Preparedness Python regression suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Separate mandatory 13-stage integrity release gate remains HOLD
        if: always()
        run: |
          echo 'Source/citation structural tests are not source-truth or medical/emergency safety checks.'
          echo 'R73 does not bypass seven_cluster_git_parity or grant QD PASS.'
          echo 'No live publishing, WP/CMS writes, site navigation edits or branch merges.'

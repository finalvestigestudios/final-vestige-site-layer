name: Return Trail R1 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/return-trail-wp-block-r1.txt'
      - 'tests/verify_return_trail_r1.py'
      - '.github/workflows/return-trail-r1-ci.yml'
      - 'RETURN_TRAIL_R1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FV_BROWSER_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium runtime found" >&2; exit 1
          fi
      - name: Print exact Return Trail R1 payload identity
        run: |
          wc -c payloads/return-trail-wp-block-r1.txt
          sha256sum payloads/return-trail-wp-block-r1.txt
      - name: Verify Return Trail R1 artifact and browser behavior
        run: python tests/verify_return_trail_r1.py 2>&1 | tee return-trail-r1-verification.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-trail-r1-verification-${{ github.sha }}
          path: return-trail-r1-verification.log
          if-no-files-found: error
          retention-days: 3

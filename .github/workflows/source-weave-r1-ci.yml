name: Source Weave R1 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/source-weave-wp-block-r1.txt'
      - 'tests/verify_source_weave_r1.py'
      - '.github/workflows/source-weave-r1-ci.yml'
      - 'SOURCE_WEAVE_R1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FV_BROWSER_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium runtime found" >&2; exit 1
          fi
      - name: Verify Source Weave R1 exact identity and browser behavior
        run: python tests/verify_source_weave_r1.py

name: Preparedness R86 Full Slate Historical Citation Bridge (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r85-source-change-citation-impact-hold-20261102
    paths:
      - preparedness/tools/r86_full_slate_historical_citation_bridge.py
      - preparedness/tests/test_r86_full_slate_historical_citation_bridge.py
      - preparedness/docs/R86_FULL_SLATE_HISTORICAL_CITATION_BRIDGE_HOLD.md
      - .github/workflows/preparedness-r86-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r86-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  private-cross-slate-citation-custody:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable historical evidence without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact immutable R85 parent and FOUR strictly additive files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "7f29bedb594ec6690a445d59b239914c16013926"
          test "$BASE_REF" = "review/preparedness-r85-source-change-citation-impact-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r86-full-slate-citation-bridge-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/r86-scope"
          python -I - <<'PY'
          import os
          from pathlib import Path
          b = (Path(os.environ['RUNNER_TEMP']) / 'r86-scope').read_bytes().split(b'\0')
          actual = [(b[i].decode(), b[i+1].decode()) for i in range(0, len(b)-1, 2)]
          expected = {
              'preparedness/tools/r86_full_slate_historical_citation_bridge.py',
              'preparedness/tests/test_r86_full_slate_historical_citation_bridge.py',
              'preparedness/docs/R86_FULL_SLATE_HISTORICAL_CITATION_BRIDGE_HOLD.md',
              '.github/workflows/preparedness-r86-private-tests.yml'}
          assert len(actual) == len(expected), actual
          assert {path for _, path in actual} == expected, actual
          assert all(mode == 'A' for mode, _ in actual), actual
          print('Exactly four ADD-only files, immutable R85 parent, no CMS/publication edits PASS')
          PY
      - name: Compile R86 new module and synthetic tests
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for name in (
            'preparedness/tools/r86_full_slate_historical_citation_bridge.py',
            'preparedness/tests/test_r86_full_slate_historical_citation_bridge.py'):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          print('R86 source and test syntax PASS')
          PY
      - name: R86 synthetic adversarial source and review-state tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r86_full_slate_historical_citation_bridge.py -v
      - name: Reconfirm exact seven contributor SHAs and separate RC
        run: |
          set -euo pipefail
          for pair in \
            'claude/prep-start-bbfeb8 2122d856fce9f64887c16df3d52e64be9f59a55b' \
            'claude/prep-shelter-5e1e0e 5daeaf2dd5ab71806a6b73c91edfb1d8df5da976' \
            'claude/prep-food-ccdc55 f911ff7a655de8d81535ea86ec3d65a49ee76648' \
            'claude/prep-health-837444 d5ef5bafd68361434dd1cc9209915b8e8a4eaf17' \
            'claude/prep-hist-food-b81f19 67e116e536c7410bed30f8f3b1bb8c166f3c223d' \
            'claude/prep-hist-home-0e0e38 7504a5f099594d635e3dd7332a33a2e1346c43a2' \
            'claude/prep-hist-field-9db767 4e5caf812727953aa45e3bda2d382f2c67b6a09c' \
            'integration/preparedness-release-candidate-20261101 ddb3528ba6494dada1fa1c3a142ce746e3a67706'; do
            ref="${pair%% *}"
            expected="${pair##* }"
            actual="$(git rev-parse "refs/remotes/origin/$ref")"
            test "$actual" = "$expected"
            echo "$ref = $actual"
          done
      - name: Construct lossless 41-doc to 29-history private source bridge
        run: |
          set -euo pipefail
          python -I preparedness/tools/r86_full_slate_historical_citation_bridge.py
          python -I preparedness/tools/r86_full_slate_historical_citation_bridge.py --private-csv-stdout > "$RUNNER_TEMP/r86-review.csv"
          python -I - <<'PY'
          import csv, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'r86-review.csv'
          with path.open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          assert all(row['review_state'] == 'NOT_REVIEWED' for row in rows)
          print('Private HOLD review cues, NOT confirmed errors:', len(rows))
          PY
          rm -f "$RUNNER_TEMP/r86-review.csv"
      - name: Original native Preparedness validator, strict
        run: python -I preparedness/tools/validate.py
      - name: Original offline WordPress-ready private DRAFT build, no CMS
        run: python -I preparedness/tools/build.py
      - name: Full existing Preparedness Python regression suite, no time waiver
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Unconditional public-release HOLD reminder
        if: always()
        run: |
          echo 'R86 diagnostic only: mandatory 13-stage release integrity and independent QD separate.'
          echo 'Human claim, original source, expert safety and independent QD approvals = 0.'
          echo 'Do NOT merge, publish, deploy, write WordPress/CMS/navigation, or call advice safe.'

name: Compare Lens R1 CI

on:
  pull_request:
    branches: [production]
    paths:
      - 'payloads/compare-lens-wp-block-r1.txt'
      - 'tests/verify_compare_lens_r1.py'
      - '.github/workflows/compare-lens-r1-ci.yml'
      - 'COMPARE_LENS_R1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - network
          - state-absent
          - state-owned
          - scroll-fail
          - focus-fail
          - missing-boundary
          - id-only
          - class-only
          - exact-plus-partial
          - duplicate-exact
          - reversed-notes
    env:
      FV_BROWSER_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm browser runtime
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium runtime found" >&2; exit 1
          fi
      - name: Print exact Compare Lens R1 payload identity
        run: |
          wc -c payloads/compare-lens-wp-block-r1.txt
          sha256sum payloads/compare-lens-wp-block-r1.txt
      - name: Verify exact artifact and browser mode
        run: python tests/verify_compare_lens_r1.py

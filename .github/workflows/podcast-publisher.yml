name: Final Vestige Podcast Publisher

on:
  pull_request:
    paths:
      - 'services/podcast-publisher/**'
      - '.github/workflows/podcast-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'publisher/requests/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Governed publish request path'
        required: true
        default: 'publisher/requests/POD-001.json'

permissions:
  contents: read

env:
  BUZZSPROUT_PODCAST_ID: '2650509'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publisher contract tests
        run: node services/podcast-publisher/test.mjs

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: podcast-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install host-audio probe dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify host-audio probe runtime
        run: ffprobe -version >/dev/null
      - name: Resolve exactly one governed request file
        id: req
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST='${{ inputs.request_file }}'
            test -f "$REQUEST"
          else
            mapfile -t REQUESTS < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^publisher/requests/.*\.json$' || true)
            if [ "${#REQUESTS[@]}" -ne 1 ]; then
              echo "Expected exactly one changed governed request; found ${#REQUESTS[@]}" >&2
              exit 1
            fi
            REQUEST="${REQUESTS[0]}"
            test -f "$REQUEST"
          fi
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
      - name: Publish exact governed episode or private canary
        env:
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
          PODCAST_CANARY_ENABLED: ${{ secrets.PODCAST_CANARY_ENABLED }}
          PODCAST_AUTH_PACKAGE_ID: ${{ secrets.PODCAST_AUTH_PACKAGE_ID }}
          PODCAST_AUTH_MASTER_SHA256: ${{ secrets.PODCAST_AUTH_MASTER_SHA256 }}
          PODCAST_AUTH_ARTWORK_SHA256: ${{ secrets.PODCAST_AUTH_ARTWORK_SHA256 }}
          PODCAST_AUTH_RELEASE_SHA256: ${{ secrets.PODCAST_AUTH_RELEASE_SHA256 }}
          PUBLISH_REQUEST_FILE: ${{ steps.req.outputs.request }}
        run: node services/podcast-publisher/publisher-v3.mjs
      - name: Archive publisher receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-publisher-receipt-${{ github.run_id }}
          path: publisher-receipt.json
          if-no-files-found: ignore
          retention-days: 90

# DRAFT/STAGING_HOLD. Exact-head print custody in isolated Chromium, NO CMS writes.
name: Apollo R73 closed-disclosure print custody acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experience2/evidence-atlas/build_atlas.py'
      - 'experience2/evidence-atlas/tests/test_print_custody_r73.py'
      - 'experience2/evidence-atlas/tests/browser_r73_print_custody.py'
      - '.github/workflows/ex2-apollo-r73-print-custody.yml'
permissions:
  contents: read
jobs:
  r73-six-photo-print:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and unmodified source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Install fixed Playwright and PDF extractor
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==5.9.0
          python -m playwright install --with-deps chromium
      - name: Original NASA and rights custody contract
        run: |
          python -m unittest discover -s experience2/evidence-atlas -p test_atlas.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_rights_matrix_r71.py -v
          python -m unittest discover -s experience2/evidence-atlas/tests -p test_print_custody_r73.py -v
      - name: Real Chromium and rendered six-source PDF acceptance
        run: |
          python experience2/evidence-atlas/tests/browser_r73_print_custody.py --output "$RUNNER_TEMP/r73-proof"
      - name: Preserve exact-head screenshots, PDF and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-r73-print-custody-proof
          path: ${{ runner.temp }}/r73-proof/
          retention-days: 7
          if-no-files-found: warn

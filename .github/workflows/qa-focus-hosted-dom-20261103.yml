name: Focus anonymous hosted DOM read-only QA (HOLD)
on:
  pull_request:
    paths:
      - 'qa/focus_hosted_dom/**'
      - '.github/workflows/qa-focus-hosted-dom-20261103.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run isolated tests
        run: |
          cd qa/focus_hosted_dom
          python -m py_compile check_focus_dom.py test_check_focus_dom.py
          python -m unittest -v test_check_focus_dom.py
  hosted-anonymous:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check actual public Focus DOM (GET only, no signup)
        run: python qa/focus_hosted_dom/check_focus_dom.py --out focus-dom-evidence
      - name: Preserve bounded evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-hosted-dom-HOLD
          path: focus-dom-evidence/
          retention-days: 7
          if-no-files-found: warn

name: Preparedness R91 Claim-Boundary Citation Review (PRIVATE HOLD)
on:
  pull_request:
    branches:
      - review/preparedness-r90-claim-scope-quantity-sequence-hold-20261103
    paths:
      - preparedness/tools/r91_historical_citation_claim_boundary.py
      - preparedness/tests/test_r91_historical_citation_claim_boundary.py
      - preparedness/docs/R91_CITATION_CLAIM_BOUNDARY_BINDINGS_HOLD.md
      - .github/workflows/preparedness-r91-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r91-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  private-read-only:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable R90 base, additive-only files and eight contributor refs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -I - <<'PY'
          import os,subprocess
          assert os.environ["BASE_SHA"]=="93415c0bb00c35e0a9789abbd8614fa417148cd7"
          assert os.environ["BASE_REF"]=="review/preparedness-r90-claim-scope-quantity-sequence-hold-20261103"
          assert os.environ["HEAD_REF"]=="review/preparedness-r91-citation-claim-boundary-bindings-hold-20261103"
          rows=subprocess.check_output(["git","diff","--name-status",
              os.environ["BASE_SHA"],"HEAD"],text=True).splitlines()
          expected={
            "preparedness/tools/r91_historical_citation_claim_boundary.py",
            "preparedness/tests/test_r91_historical_citation_claim_boundary.py",
            "preparedness/docs/R91_CITATION_CLAIM_BOUNDARY_BINDINGS_HOLD.md",
            ".github/workflows/preparedness-r91-private-tests.yml"}
          assert len(rows)==4 and set(rows)=={"A\t"+x for x in expected},rows
          refs={
            "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
            "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
            "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
            "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
            "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
            "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
            "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
            "integration/preparedness-release-candidate-20261101":"ddb3528ba6494dada1fa1c3a142ce746e3a67706"}
          for name,sha in refs.items():
              actual=subprocess.check_output(["git","rev-parse",
                     "refs/remotes/origin/"+name],text=True).strip()
              assert actual==sha,(name,actual,sha)
              print(name,actual)
          print("PASS: 4 additive files, all 8 protected research refs identical")
          PY
      - name: Python syntax and 36+ synthetic/adversarial R91 cases
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for name in ("preparedness/tools/r91_historical_citation_claim_boundary.py",
                       "preparedness/tests/test_r91_historical_citation_claim_boundary.py"):
              compile(Path(name).read_text(encoding="utf-8"),name,"exec")
          PY
          python -I -m unittest discover -s preparedness/tests -p test_r91_historical_citation_claim_boundary.py -v
      - name: Verify 41 complete private dossiers and 2173 citation workorders
        run: |
          python -I preparedness/tools/r91_historical_citation_claim_boundary.py
          python -I preparedness/tools/r91_historical_citation_claim_boundary.py --private-csv-stdout > "$RUNNER_TEMP/r91-metadata-only.csv"
          python -I - <<'PY'
          import csv,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r91-metadata-only.csv"
          with p.open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2173,len(rows)
          assert all(x["qualified_safety_review"]=="NOT_REVIEWED"
                     and x["human_claim_support"]=="NOT_REVIEWED"
                     and x["may_publish"]=="FALSE" for x in rows)
          print("PASS: all 2173 private rows, zero safety/source/QD publication approvals")
          PY
          rm -f "$RUNNER_TEMP/r91-metadata-only.csv"
      - name: Native validation and offline WordPress-ready draft build
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Complete Preparedness Python regression suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Release and human safety gates remain CLOSED
        if: always()
        run: |
          echo 'PRIVATE diagnostics only: NOT full mandatory release integrity.'
          echo 'No independent QD PASS, no qualified safety review, no source approval.'
          echo 'No CMS, WordPress, navigation, homepage or public release operations.'

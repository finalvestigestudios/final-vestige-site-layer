name: EX2 isolated Gutenberg EDITOR Save and raw readback - SYNTHETIC HOLD

on:
  pull_request:
    paths:
      - 'experience2/home-flagship/qa/release-candidate/**'
      - '.github/workflows/ex2-gutenberg-editor-save-HOLD.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ex2-gutenberg-editor-save-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-gutenberg-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline syntax and adversarial tests (no WordPress, no network)
        run: |
          set -euo pipefail
          node --check experience2/home-flagship/qa/release-candidate/playground_gutenberg_editor_gate.mjs
          node experience2/home-flagship/qa/release-candidate/playground_gutenberg_editor_gate.mjs --self-test
          php -l experience2/home-flagship/qa/release-candidate/playground_gutenberg_editor_gate.php
          python -I -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_gutenberg_editor_bridge.py -v
          python -I -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_probe_cleanup.py -v
      - name: Source builder preflight
        run: |
          python -I -m unittest discover -s experience2/home-flagship/qa/release-candidate -p test_build_combined_page6_offline.py -v
          python -I experience2/home-flagship/qa/release-candidate/write_synthetic_playground_candidate.py \
            --output "${RUNNER_TEMP}/fv-ex2-synthetic-candidate.html" \
            --manifest "${RUNNER_TEMP}/fv-ex2-synthetic-manifest.json"
      - name: Install free pinned Playground and Chromium packages
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund \
            @wp-playground/cli@3.1.56 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Gutenberg editor data-store save, hash-identical readback and deletion
        timeout-minutes: 16
        run: |
          set -euo pipefail
          node experience2/home-flagship/qa/release-candidate/playground_gutenberg_editor_gate.mjs \
            --candidate "${RUNNER_TEMP}/fv-ex2-synthetic-candidate.html" \
            --manifest "${RUNNER_TEMP}/fv-ex2-synthetic-manifest.json"
      - name: Never upload page source, cookies, database or token
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/fv-ex2-synthetic-candidate.html" \
                "${RUNNER_TEMP}/fv-ex2-synthetic-manifest.json"
          echo "Synthetic-only local WordPress editor QA. No content/DB/secrets artifacts."

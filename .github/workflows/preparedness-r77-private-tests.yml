name: Preparedness R77 Temporal Source Custody (PRIVATE HOLD)
on:
  pull_request:
    branches: [review/preparedness-r76-consequential-source-impact-crosswalk-hold-20261102]
    paths:
      - preparedness/tools/r77_temporal_evidence_custody.py
      - preparedness/tests/test_r77_temporal_evidence_custody.py
      - preparedness/docs/R77_TEMPORAL_EVIDENCE_CUSTODY_HOLD.md
      - .github/workflows/preparedness-r77-private-tests.yml
permissions:
  contents: read
concurrency:
  group: preparedness-r77-private-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  temporal-source-custody-private-only:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact isolated draft without retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce R76 immutable parent and four additive files ONLY
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "06593b2ee812168991e941b9484753862e96567a"
          test "$BASE_REF" = "review/preparedness-r76-consequential-source-impact-crosswalk-hold-20261102"
          test "$HEAD_REF" = "review/preparedness-r77-temporal-evidence-custody-hold-20261102"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > /tmp/r77-changed
          python -I - <<'PY'
          from pathlib import Path
          parts = Path("/tmp/r77-changed").read_bytes().split(b"\0")
          rows = [(parts[i].decode(),parts[i+1].decode())
                  for i in range(0,len(parts)-1,2)]
          expected = {
              "preparedness/tools/r77_temporal_evidence_custody.py",
              "preparedness/tests/test_r77_temporal_evidence_custody.py",
              "preparedness/docs/R77_TEMPORAL_EVIDENCE_CUSTODY_HOLD.md",
              ".github/workflows/preparedness-r77-private-tests.yml"}
          assert len(rows)==4 and {path for _,path in rows}==expected,rows
          assert all(status=="A" for status,_ in rows),rows
          print("Four isolated additive private engineering files; no content edits.")
          PY
      - name: Verify all seven Claude clusters and release candidate current pinned SHAs
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          refs = {
              "claude/prep-start-bbfeb8":"2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e":"5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55":"f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444":"d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19":"67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38":"7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767":"4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101":"ddb3528ba6494dada1fa1c3a142ce746e3a67706"}
          for ref, want in refs.items():
              got = subprocess.check_output(["git","rev-parse","--verify",
                      "refs/remotes/origin/"+ref+"^{commit}"],text=True).strip()
              assert got == want,(ref,got,want)
          print("Seven contributor and separate RC branch SHAs pinned; human provenance still HOLD.")
          PY
      - name: Python syntax compilation without writing pycache
        run: |
          python -I - <<'PY'
          from pathlib import Path
          for path in ("preparedness/tools/r77_temporal_evidence_custody.py",
                       "preparedness/tests/test_r77_temporal_evidence_custody.py"):
              compile(Path(path).read_text(encoding="utf-8"),path,"exec")
          print("R77 syntax compiled.")
          PY
      - name: Run isolated 36+ synthetic and adversarial R77 tests
        run: python -I -m unittest discover -s preparedness/tests -p test_r77_temporal_evidence_custody.py -v
      - name: Exact 35 article, six tool, 244 source, citation and review HOLD census
        run: |
          python -I - <<'PY'
          import csv,io,importlib.util,json
          from pathlib import Path
          path=Path("preparedness/tools/r77_temporal_evidence_custody.py")
          spec=importlib.util.spec_from_file_location("r77_ci",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          row=mod.live_report()
          mod.sealed(row)
          c=row["counts"]
          assert tuple(c[k] for k in (
              "articles","tools","source_readings_preserved",
              "citation_occurrences_preserved",
              "unabridged_DOM_blocks_preserved",
              "citation_source_variant_edges_preserved",
              "shared_URL_groups_preserved",
              "reused_ID_groups_preserved"))==(35,6,244,2173,4070,2359,32,15),c
          assert all(c[k]==0 for k in (
              "human_link_checks","human_claim_support_reviews",
              "qualified_safety_reviews","independent_QD_approvals"))
          assert all(row[k] is False for k in mod.HOLD_KEYS)
          assert row["publication_clearance"] is False
          assert row["pinned_snapshot_date_NOT_LIVE_FRESHNESS_CHECK"]=="2026-11-02"
          assert row==mod.live_report(),"report is nondeterministic"
          assert len(list(csv.DictReader(io.StringIO(
              mod.csv_review_work_order(row)))))==244
          print("R77 review-only temporal corpus census:",json.dumps(c,sort_keys=True))
          print("R77 holds: NO human URL/claim, safety/QD, or publication approvals.")
          PY
      - name: Original native Preparedness content/source validator
        run: python -I preparedness/tools/validate.py
      - name: Offline WordPress-ready drafts only (NO CMS or publishing)
        run: python -I preparedness/tools/build.py
      - name: Complete Preparedness Python regression suite
        run: python -I -m unittest discover -s preparedness/tests -v
      - name: Mandatory release integrity and QD remain independent and CLOSED
        if: always()
        run: |
          echo "RELEASE HOLD: the 13-stage mandatory gate previously failed seven_cluster_git_parity."
          echo "Human source scope and claim checks, qualified emergency-safety checks, actual WP/browser QA and QD remain required."
          echo "No merge, CMS, homepage, navigation, WordPress or public publishing."

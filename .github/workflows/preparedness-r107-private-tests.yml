name: Preparedness R107 seven-branch source provenance adjudication (PRIVATE HOLD)
on:
  push:
    branches:
      - review/preparedness-r107-contributor-progression-review-hold-20261103
  pull_request:
    branches:
      - review/preparedness-r106-bounded-native-suite-timeout-hold-20261103
    paths:
      - preparedness/tools/r107_exact_branch_progression_adjudication.py
      - preparedness/tests/test_r107_exact_branch_progression_adjudication.py
      - preparedness/docs/R107_SEVEN_CLUSTER_ADJUDICATION_HOLD.md
      - .github/workflows/preparedness-r107-private-tests.yml
permissions:
  contents: read
jobs:
  r107-private-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify R106 ancestry, strictly add-only scope and exact collaborator refs
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import subprocess
          parent = "62c9768ac2ede3d155da0e5f62b80bcdd72bf31c"
          expected = {
              "A\tpreparedness/tools/r107_exact_branch_progression_adjudication.py",
              "A\tpreparedness/tests/test_r107_exact_branch_progression_adjudication.py",
              "A\tpreparedness/docs/R107_SEVEN_CLUSTER_ADJUDICATION_HOLD.md",
              "A\t.github/workflows/preparedness-r107-private-tests.yml",
          }
          found = set(subprocess.check_output(
              ["git", "diff", "--name-status", parent, "HEAD"],
              text=True).splitlines())
          assert found == expected, ("not isolated from source/site/CMS", found)
          pins = {
              "claude/prep-start-bbfeb8": "2122d856fce9f64887c16df3d52e64be9f59a55b",
              "claude/prep-shelter-5e1e0e": "5daeaf2dd5ab71806a6b73c91edfb1d8df5da976",
              "claude/prep-food-ccdc55": "f911ff7a655de8d81535ea86ec3d65a49ee76648",
              "claude/prep-health-837444": "d5ef5bafd68361434dd1cc9209915b8e8a4eaf17",
              "claude/prep-hist-food-b81f19": "67e116e536c7410bed30f8f3b1bb8c166f3c223d",
              "claude/prep-hist-home-0e0e38": "7504a5f099594d635e3dd7332a33a2e1346c43a2",
              "claude/prep-hist-field-9db767": "4e5caf812727953aa45e3bda2d382f2c67b6a09c",
              "integration/preparedness-release-candidate-20261101": "ddb3528ba6494dada1fa1c3a142ce746e3a67706",
              "review/preparedness-start-safety-20261030": "7d1ae6b8ef93d10cfb6810987672360885e9c1aa",
              "review/preparedness-food-fixture-isolation-20261030": "e9cd7766dac59d47ab467d8945269b9146c2aef5",
              "feature/vestige-assembly-home-v1": "10495883299d53596992c26a8987f629b2904670",
              "release/homepage-flagship-candidate-20261102": "bdf01b4a3e13fd6179ae9e847c9d4429bbe16176",
          }
          for ref, expected_sha in pins.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", "--verify", "refs/remotes/origin/" + ref],
                  text=True).strip()
              assert actual == expected_sha, ("unreviewed contributor/agent ref drift", ref, actual)
          print("R107 add-only isolation and all 12 contributor/QA/homepage refs PASS")
          PY
      - name: Compile and run all R107 synthetic source-and-branch adversarial tests
        run: |
          python -I -m compileall -q preparedness/tools/r107_exact_branch_progression_adjudication.py preparedness/tests/test_r107_exact_branch_progression_adjudication.py
          python -I -m unittest discover -s preparedness/tests -p 'test_r107_*.py' -v
      - name: Reconstruct exact Git-object progression and inspect strict HOLD docket
        shell: bash
        run: |
          set -euo pipefail
          python -I preparedness/tools/r107_exact_branch_progression_adjudication.py --repo-root .
          python -I preparedness/tools/r107_exact_branch_progression_adjudication.py --repo-root . --json > "$RUNNER_TEMP/r107-private-hold.json"
          python -I - "$RUNNER_TEMP/r107-private-hold.json" <<'PY'
          import hashlib, json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          seal = data.pop("sha256_NOT_A_SIGNATURE")
          raw = json.dumps(data, sort_keys=True, ensure_ascii=False, allow_nan=False,
                           separators=(",", ":")).encode("utf-8")
          assert hashlib.sha256(raw).hexdigest() == seal
          assert data["may_publish"] is False
          assert data["release_state"] == "HOLD"
          assert data["moved_branch_count"] == 5
          assert data["distinct_original_articles"] == 29
          assert data["original_evidence_paths"] == 72
          assert data["changed_path_count"] == 23
          assert data["change_classification_counts"] == {
              "body": 7, "doc": 5, "fragment": 3, "meta": 6, "test": 2
          }, data["change_classification_counts"]
          assert all(x["human_provenance_review"] == "NOT_REVIEWED" and
                     x["human_source_and_claim_review"] == "NOT_REVIEWED" and
                     x["may_publish"] is False
                     for x in data["contributor_reviewer_queue_NOT_APPROVED"])
          print("Exact 5 moved contributor branches / 23 modified paths / 29 articles / 72 custody paths — HOLD")
          PY
      - name: Recheck original native validator and private WordPress draft build
        run: |
          python -I preparedness/tools/validate.py
          python -I preparedness/tools/build.py
      - name: Re-run all Preparedness Python tests, without skipping a class
        run: |
          python -I -m unittest discover -s preparedness/tests -v
      - name: Confirm original R15 strict parity rejects moved contributor branches
        shell: bash
        run: |
          set -euo pipefail
          if python -I preparedness/tools/cluster_git_parity_gate.py \
               --repo-root . \
               --manifest preparedness/docs/R14-SEVEN-CLUSTER-GIT-BLOB-PARITY.json \
               --current-integrated-sha "$GITHUB_SHA" \
               > "$RUNNER_TEMP/r107-r15-should-not-pass.json" \
               2> "$RUNNER_TEMP/r107-r15-fail.json"; then
            echo "ERROR: historical strict parity unexpectedly passed; potential guard weakening"
            exit 1
          fi
          grep -q 'live contributor branch moved' "$RUNNER_TEMP/r107-r15-fail.json"
          echo "Original mandatory R15 parity remains FAILED CLOSED on moved contributor refs"
      - name: This is private Git provenance triage, never publication approval
        if: always()
        run: echo 'STRICT HOLD. No merges, source/medical/QD approvals, WordPress, site or navigation writes.'

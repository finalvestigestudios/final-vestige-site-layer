<script>(()=>{const KEY='fvFieldCabinetV1';const safeParse=v=>{try{return JSON.parse(v)||{}}catch(e){return {}}};const base=()=>({version:1,saved:[],recent:[],reading:{}});const load=()=>{const d=safeParse(localStorage.getItem(KEY));const raw=d&&typeof d==='object'&&!Array.isArray(d)?d:{};return {...base(),...raw,saved:safeItems(raw.saved),recent:safeItems(raw.recent),reading:safeReading(raw.reading)}};const save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){return false}};const safeUrl=value=>{if(typeof value!=='string'||!value.trim()||value.length>2048||/[\u0000-\u001f\u007f]/.test(value))return '';try{const url=new URL(value.trim(),window.location.origin);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)return '';return url.href}catch(e){return ''}};const safeItems=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==='object'&&typeof x.title==='string'&&x.id!=null&&safeUrl(x.url)).slice(0,100).map(x=>({...x,url:safeUrl(x.url)})):[];const safeReading=r=>{const out=Object.create(null);if(!r||typeof r!=='object'||Array.isArray(r))return out;Object.entries(r).slice(0,100).forEach(([key,value])=>{if(key==='__proto__'||key==='constructor'||key==='prototype'||!value||typeof value!=='object'||!safeUrl(value.url))return;out[key]={...value,url:safeUrl(value.url)}});return out};const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const status=document.querySelector('[data-fv-cabinet-status]');const msg=document.querySelector('[data-fv-cabinet-message]');const announce=t=>{if(msg)msg.textContent=t};const section=(sel,items,kind)=>{const el=document.querySelector(sel);if(!el)return;items=safeItems(items);if(!items.length){el.innerHTML='<p class="fv-cabinet-empty">Nothing here yet.</p>';return}el.innerHTML=items.map(item=>`<article class="fv-cabinet-card" data-fv-id="${esc(item.id)}"><p class="fv-cabinet-card-meta">${esc(item.meta||kind)}</p><h3><a href="${esc(safeUrl(item.url))}">${esc(item.title)}</a></h3>${item.lastSection?`<p>You stopped near: “${esc(item.lastSectionLabel||item.lastSection)}”.</p>`:''}<div class="fv-cabinet-card-actions"><a href="${esc(item.url+(item.lastSection?'#'+item.lastSection:''))}">${item.lastSection?'Continue reading':'Open'}</a>${kind!=='Recent'?`<button type="button" data-fv-remove="${esc(item.id)}">Remove</button>`:''}</div></article>`).join('')};const render=()=>{const d=load();const saved=d.saved||[];const inv=saved.filter(x=>x.type==='investigation');const research=saved.filter(x=>x.type==='research');const tools=saved.filter(x=>x.type==='tool');const reading=Object.entries(d.reading||{}).map(([id,r])=>Object.assign({id},r)).filter(x=>x.url);section('[data-fv-cabinet-continue]',reading,'Continue');section('[data-fv-cabinet-investigations]',inv,'Investigation');section('[data-fv-cabinet-research]',research,'Research');section('[data-fv-cabinet-tools]',tools,'Tool');section('[data-fv-cabinet-recent]',d.recent||[],'Recent');if(status)status.textContent=`${saved.length} browser saves · ${reading.length} in progress · ${(d.recent||[]).length} recently viewed`;document.querySelectorAll('[data-fv-remove]').forEach(b=>b.addEventListener('click',()=>{const d2=load();d2.saved=(d2.saved||[]).filter(x=>String(x.id)!==String(b.dataset.fvRemove));save(d2);render();announce('Removed from Browser Cabinet.')}))};document.querySelector('[data-fv-clear-recent]')?.addEventListener('click',()=>{const d=load();d.recent=[];save(d);render();announce('Recently viewed cleared.')});document.querySelector('[data-fv-export]')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='final-vestige-field-cabinet.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.querySelector('[data-fv-copy-list]')?.addEventListener('click',async()=>{const d=load();const text=(d.saved||[]).map(x=>`${x.title} — ${x.url}`).join('\n');try{await navigator.clipboard.writeText(text);announce('Saved-item list copied.')}catch(e){window.prompt('Copy your saved-item list:',text)}});document.querySelector('[data-fv-import]')?.addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>2*1024*1024){announce('The import file is too large (2 MB maximum).');return}const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!incoming||!Array.isArray(incoming.saved))throw new Error();const d=load();const map=new Map((d.saved||[]).map(x=>[String(x.id),x]));incoming.saved.forEach(x=>{if(x&&x.id!=null&&typeof x.title==='string'&&safeUrl(x.url))map.set(String(x.id),{...x,url:safeUrl(x.url)})});d.saved=[...map.values()].slice(0,100);if(incoming.reading&&typeof incoming.reading==='object')d.reading={...d.reading,...safeReading(incoming.reading)};save(d);render();announce('Browser Cabinet imported.')}catch(err){announce('That file is not a valid Field Cabinet export.')}};r.readAsText(f)});window.addEventListener('storage',e=>{if(e.key===KEY)render()});render()})();</script>

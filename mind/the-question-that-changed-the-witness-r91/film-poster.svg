<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="t d"><title id="t">The question that changed the witness</title><desc id="d">Original typographic educational poster. An unchanging traffic sign contrasts with changing questions.</desc><rect width="540" height="960" fill="#0d1013"/><path d="M60 95H480M60 854H480" stroke="#a78f69" stroke-width="2"/><text x="60" y="158" fill="#dcc297" font-family="sans-serif" font-size="19" letter-spacing="3">MIND / EVIDENCE / 091</text><text x="60" y="260" fill="#fff1d9" font-family="serif" font-size="47">THE QUESTION</text><text x="60" y="324" fill="#fff1d9" font-family="serif" font-size="47">THAT CHANGED</text><text x="60" y="388" fill="#fff1d9" font-family="serif" font-size="47">THE WITNESS</text><rect x="198" y="455" width="145" height="145" rx="10" fill="#8b382f" stroke="#e3d0b1" stroke-width="9"/><text x="270" y="538" text-anchor="middle" fill="#fff4e6" font-family="sans-serif" font-weight="bold" font-size="25">STOP</text><text x="60" y="690" fill="#f4e6d4" font-family="serif" font-size="27">The scene stayed still.</text><text x="60" y="736" fill="#f4e6d4" font-family="serif" font-size="27">The question changed.</text><text x="60" y="880" fill="#dcc297" font-family="sans-serif" font-size="16">40s educational story / no product claims</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The question of moving first</title><desc id="desc">An original abstract schematic with two paths: a hand moves an indicator, or a tabletop moves beneath the hand. It illustrates a causal question, not Faraday's original 1853 instrument.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102126"/><stop offset="1" stop-color="#263a3c"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><g fill="none" stroke="#bca46e" stroke-width="2"><rect x="55" y="52" width="1090" height="565" rx="15"/><path d="M55 165H1145"/><path d="M600 195V580" stroke-dasharray="8 12"/></g><g font-family="Georgia,serif" fill="#f5e3bc"><text x="90" y="117" font-size="40">THE TABLE MOVED.</text><text x="755" y="117" font-size="32">WHO MOVED IT?</text><text x="160" y="251" font-size="28">HANDS FIRST?</text><text x="733" y="251" font-size="28">TABLE FIRST?</text></g><g transform="translate(120 294)" stroke="#dfc182" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 115H358"/><path d="M110 100C72 67 85 42 95 40C109 39 138 74 153 79V9C153 -4 175 -5 175 10V54V2C175 -9 198 -6 198 6V51V6C198 -7 222 -3 222 14V60V22C222 10 247 15 246 27V88C246 136 211 161 166 161H127C110 161 95 141 90 131" stroke-width="6"/><path d="M35 210H330"/></g><g transform="translate(692 294)" stroke="#dfc182" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 115H358"/><path d="M110 100C72 67 85 42 95 40C109 39 138 74 153 79V9C153 -4 175 -5 175 10V54V2C175 -9 198 -6 198 6V51V6C198 -7 222 -3 222 14V60V22C222 10 247 15 246 27V88C246 136 211 161 166 161H127C110 161 95 141 90 131" stroke-width="6"/><path d="M35 210H330"/></g><g fill="#91d2c8"><path d="M385 377l62 30-62 30v-17H299v-26h86z"/><path d="M815 468l-62 -30 62 -30v17h86v26h-86z"/></g><g fill="#e8e6d5" font-family="system-ui,sans-serif" font-size="19"><text x="98" y="569">An observable force</text><text x="715" y="569">A reported feeling</text><text x="92" y="653" font-size="15">FINAL VESTIGE · ORIGINAL CONCEPT ART · NOT A HISTORICAL RECONSTRUCTION</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The stopped-clock question</title><desc id="desc">An original diagram of a clock with a gold hand; caption asks whether time stopped or perception shifted.</desc><rect width="960" height="540" fill="#172225"/><circle cx="480" cy="224" r="163" fill="none" stroke="#baa57f" stroke-width="3"/><g stroke="#baa57f" stroke-width="3"><path d="M480 76v18M480 354v18M332 224h18M610 224h18"/></g><path d="M480 224L575 144" stroke="#f4d994" stroke-width="9" stroke-linecap="round"/><path d="M480 224L455 301" stroke="#f4d994" stroke-width="5" stroke-linecap="round"/><circle cx="480" cy="224" r="10" fill="#f4d994"/><text x="480" y="450" font-family="system-ui,sans-serif" text-anchor="middle" fill="#f0eada" font-size="28">DID TIME STOP—OR DID PERCEPTION SHIFT?</text><text x="480" y="490" font-family="system-ui,sans-serif" text-anchor="middle" fill="#baa57f" font-size="15">FINAL VESTIGE · ORIGINAL EDITORIAL CONCEPT · NOT DOCUMENTARY FOOTAGE</text></svg>
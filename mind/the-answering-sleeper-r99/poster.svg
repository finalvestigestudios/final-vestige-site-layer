<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-labelledby="t d"><title id="t">The Twelve-Minute Question</title><desc id="d">An original clock and research notebook metaphor.</desc><rect width="540" height="960" fill="#0b1214"/><rect x="24" y="24" width="492" height="912" fill="none" stroke="#947445" stroke-width="2"/><text x="46" y="100" fill="#e8bf84" font-family="sans-serif" letter-spacing="4" font-size="19">FINAL VESTIGE / MIND</text><text x="46" y="168" fill="#f5eddd" font-family="Georgia,serif" font-size="46">TWELVE MINUTES.</text><text x="46" y="222" fill="#f5eddd" font-family="Georgia,serif" font-size="46">ONE BIG CLAIM.</text><circle cx="270" cy="450" r="165" stroke="#c49a5d" stroke-width="6" fill="#131d1e"/><circle cx="270" cy="450" r="130" stroke="#5e5444" stroke-width="1" fill="none"/><path d="M270 450 L270 337 M270 450 L334 483" stroke="#eed1a4" stroke-width="9" stroke-linecap="round"/><text x="270" y="665" fill="#eed1a4" text-anchor="middle" font-size="56" font-family="Georgia,serif">12:00</text><rect x="65" y="725" width="410" height="90" fill="#1a292b" stroke="#ad956c"/><text x="270" y="765" fill="#f2e6d4" font-size="22" text-anchor="middle" font-family="sans-serif">A ritual is a choice.</text><text x="270" y="799" fill="#f2e6d4" font-size="22" text-anchor="middle" font-family="sans-serif">A result needs evidence.</text><text x="46" y="897" fill="#e8bf84" font-family="sans-serif" font-size="16">UNPUBLISHED · ORIGINAL ART</text></svg>
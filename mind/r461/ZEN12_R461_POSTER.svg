<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc"><title id="title">What we notice is not everything</title><desc id="desc">Four empty observation windows on a near-black field, one selected by a golden beam. Original and copyright-clear abstract visual; not an image from the gorilla experiments.</desc><rect width="1280" height="720" fill="#0a0c0e"/><g fill="#1e2020" stroke="#605d55" stroke-width="4"><rect x="96" y="170" rx="14" width="240" height="232"/><rect x="378" y="170" rx="14" width="240" height="232"/><rect x="660" y="170" rx="14" width="240" height="232"/><rect x="942" y="170" rx="14" width="240" height="232"/></g><path d="M498 50 378 170 618 170Z" fill="#c79b5d" opacity=".28"/><rect x="378" y="170" rx="14" width="240" height="232" fill="#28251f" stroke="#edc77f" stroke-width="7"/><g stroke="#e8c789" stroke-width="7" fill="none"><circle cx="498" cy="287" r="47"/><path d="M468 287h60 M498 257v60"/></g><g stroke="#817f77" stroke-width="7" fill="none"><path d="M156 343l60-60 60 60"/><circle cx="780" cy="287" r="47"/><path d="M1017 285h103 M1069 234v102"/></g><text x="96" y="475" font-family="Georgia,serif" font-size="26" letter-spacing="2" fill="#d7b985">FINAL VESTIGE · MIND &amp; PERCEPTION</text><text x="96" y="567" font-family="Georgia,serif" font-size="62" fill="#f4eddf">What you notice</text><text x="96" y="646" font-family="Georgia,serif" font-size="62" fill="#d6ac70">is not everything.</text></svg>
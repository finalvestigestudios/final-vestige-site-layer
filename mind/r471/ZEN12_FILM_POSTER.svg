<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Same signal, different interpretation</title><desc id="desc">An original abstract geometric research poster with two rings, an axis of rotation, and a source-first message. Not a reproduction of a Thatcherized human face.</desc><rect width="960" height="540" fill="#151a23"/><g stroke="#997b43" stroke-width="2" opacity=".35"><path d="M48 54h864M48 486h864M85 55v430M875 55v430"/></g><g transform="translate(260 260)"><circle r="116" fill="none" stroke="#debf7d" stroke-width="9"/><path d="M-55 -23h110M-55 24h110" stroke="#ecd6a9" stroke-width="8" stroke-linecap="round"/><path d="M-18 -170L18 -170M0 -186v32" stroke="#ab986d" stroke-width="4"/></g><g transform="translate(700 260) rotate(180)"><circle r="116" fill="none" stroke="#debf7d" stroke-width="9"/><path d="M-55 -23h110M-55 24h110" stroke="#ecd6a9" stroke-width="8" stroke-linecap="round"/><path d="M-18 -170L18 -170M0 -186v32" stroke="#ab986d" stroke-width="4"/></g><path d="M408 260h144" stroke="#dac28a" stroke-width="4" stroke-dasharray="9 11"/><path d="m544 250 12 10-12 10" fill="none" stroke="#dac28a" stroke-width="4"/><g fill="#f0e7d6" font-family="Georgia,serif" text-anchor="middle"><text x="480" y="63" font-size="39">SAME SIGNAL.</text><text x="480" y="115" font-size="39">DIFFERENT INTERPRETATION.</text></g><text x="480" y="465" fill="#d9c399" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" letter-spacing="3">FINAL VESTIGE · SOURCE BEFORE STORY</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p-title p-desc" viewBox="0 0 540 960"><title id="p-title">The door between two faces</title><desc id="p-desc">An original schematic poster showing a pale doorway splitting two simple figures, with the phrase 'Did you notice the change?'. Not a reenactment of a study.</desc><rect width="540" height="960" fill="#101414"/><rect x="36" y="36" width="468" height="888" fill="none" stroke="#9b825c" stroke-width="2"/><text x="62" y="105" font-size="20" letter-spacing="6" font-family="sans-serif" fill="#c7a66c">THE MIND / 52</text><rect x="202" y="221" width="136" height="386" fill="#b8a17b" opacity=".82"/><rect x="215" y="235" width="108" height="359" fill="#282825"/><circle cx="151" cy="386" r="59" fill="#8eaaa1"/><path d="M77 587q9-123 74-123t74 123" fill="#5b7770"/><circle cx="388" cy="386" r="59" fill="#b9a29d"/><path d="M314 587q9-123 74-123t74 123" fill="#866963"/><path d="M270 207v420" stroke="#c7a66c" stroke-width="4"/><text x="270" y="710" font-size="35" text-anchor="middle" font-family="Georgia,serif" fill="#f4efe6">DID YOU NOTICE</text><text x="270" y="756" font-size="35" text-anchor="middle" font-family="Georgia,serif" fill="#f4efe6">THE CHANGE?</text><text x="270" y="824" font-size="17" text-anchor="middle" font-family="sans-serif" fill="#c4b8a5">40-second original explainer</text><text x="270" y="851" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#a7a197">Conceptual illustration · Not an experiment</text></svg>
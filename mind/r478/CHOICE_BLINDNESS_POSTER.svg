<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Two answers, one changed card</title><desc id="d">Original dark navy and gold typographic poster, one original choice and one changed result, with a visible line between them</desc><rect width="1280" height="720" fill="#0b1520"/><path d="M130 290h1020" stroke="#b99052" stroke-width="3"/><g fill="#e2bd79" font-family="system-ui,sans-serif" font-size="28" letter-spacing="4"><text x="134" y="185">CHOICE BLINDNESS</text><text x="132" y="440">ORIGINAL CHOICE</text><text x="795" y="440">RETURNED RESULT</text></g><g fill="#fff5e5" font-family="system-ui,sans-serif" font-size="60" font-weight="700"><text x="130" y="257">THE ANSWER CHANGED</text><text x="130" y="558" font-size="34" font-weight="400">Did they miss it—or keep quiet?</text></g><circle cx="601" cy="416" r="58" fill="none" stroke="#e2bd79" stroke-width="4"/><path d="M581 416h40m-12-12 12 12-12 12" stroke="#e2bd79" fill="none" stroke-width="4"/><text x="130" y="642" fill="#acbac8" font-family="system-ui,sans-serif" font-size="24">Original FV research · no product efficacy claim</text></svg>
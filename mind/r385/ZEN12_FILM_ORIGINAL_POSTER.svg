<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Original abstract poster for 42-second Thatcher illusion evidence film</title>
<desc id="desc">An abstract face outline and vertical ledger. Caption reads What you saw is not what it proves. Designed for high contrast and independently created; not a reproduction of Thompson's experiment.</desc>
<rect width="640" height="360" fill="#101714"/><rect x="28" y="28" width="584" height="304" rx="18" fill="#1b2723" stroke="#e9cf91" stroke-width="2"/>
<ellipse cx="208" cy="178" rx="104" ry="125" fill="#263b33" stroke="#e9cf91" stroke-width="3"/>
<path d="M137 144q28-24 60 0 M220 144q29-24 59 0 M162 218q45 38 90 0" fill="none" stroke="#e9cf91" stroke-width="8" stroke-linecap="round"/>
<line x1="352" y1="94" x2="352" y2="270" stroke="#839b89" stroke-width="2"/>
<text x="374" y="138" font-family="Georgia,serif" font-size="24" fill="#f0ede3">What you saw</text>
<text x="374" y="177" font-family="system-ui" font-size="24" fill="#e9cf91">≠</text>
<text x="374" y="215" font-family="Georgia,serif" font-size="24" fill="#f0ede3">What it proves</text>
<text x="374" y="257" font-family="system-ui" font-size="14" fill="#d0d8cf">Original concept · 42 s</text></svg>
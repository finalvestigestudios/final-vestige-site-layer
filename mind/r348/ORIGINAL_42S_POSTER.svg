<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="p-title p-desc"><title id="p-title">Twelve Minutes, Two Explanations — film concept poster</title><desc id="p-desc">Original abstract illustration: two paths diverge from a single short listening session, one labelled experience and the other evidence. No depiction of measured brain activity.</desc><rect width="1280" height="720" fill="#101512"/><g fill="none" stroke="#d9b578" stroke-width="3" opacity=".72"><path d="M110 445H430 Q520 445 555 360 T760 230 H1170"/><path d="M110 445H430 Q520 445 555 530 T760 605 H1170"/><circle cx="430" cy="445" r="32"/><circle cx="760" cy="230" r="16"/><circle cx="760" cy="605" r="16"/></g><g font-family="Georgia,serif" fill="#f1eee5"><text x="100" y="120" font-size="54">TWELVE MINUTES.</text><text x="100" y="183" font-size="54">TWO EXPLANATIONS.</text><text x="790" y="220" font-size="32">WHAT YOU FELT</text><text x="790" y="594" font-size="32">WHAT WAS TESTED</text></g><text x="102" y="672" fill="#d9b578" font-family="sans-serif" font-size="18" letter-spacing="5">FINAL VESTIGE · MIND / SOURCE BEFORE STORY</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The Second Target, original studio poster</title><desc id="desc">Four thin outlined archive cards across a charcoal canvas; the second target is screened by an amber contour. A graphic idea, not a reenactment of an experiment.</desc><rect width="1280" height="720" fill="#151b20"/><path d="M88 88H1192M88 633H1192" stroke="#877253" stroke-width="3"/><text x="88" y="143" fill="#dfb676" font-family="Georgia,serif" font-size="30" letter-spacing="5">FINAL VESTIGE / OBSERVER LAB</text><text x="88" y="235" fill="#f9f1df" font-family="Georgia,serif" font-size="66">THE SECOND TARGET</text><text x="88" y="289" fill="#c6baa3" font-family="sans-serif" font-size="27">A thought experiment about what attention leaves behind</text><g fill="#232c31" stroke="#b69b6b" stroke-width="3"><rect x="88" y="356" width="238" height="208" rx="6"/><rect x="371" y="356" width="238" height="208" rx="6"/><rect x="654" y="356" width="238" height="208" rx="6"/><rect x="937" y="356" width="238" height="208" rx="6"/></g><g font-family="Georgia,serif" font-size="110" text-anchor="middle" fill="#f9e9c4"><text x="207" y="491">1</text><text x="490" y="491">2</text><text x="773" y="491">3</text><text x="1056" y="491">4</text></g><path d="M373 358L604 559M604 360L375 555" stroke="#dfb676" stroke-width="13" stroke-linecap="round" opacity=".8"/><text x="88" y="616" fill="#dfb676" font-family="sans-serif" font-size="19" letter-spacing="4">ORIGINAL ILLUSTRATION · NOT LAB STIMULUS</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ttl desc"><title id="ttl">An evidence card swaps places</title><desc id="desc">Original geometric illustration: two labeled note cards, original choice and later explanation, connected by a dashed arrow; no experimental subject photographs.</desc><rect width="960" height="540" fill="#111b1d"/><text x="70" y="85" font-size="38" fill="#f3e1aa" font-family="system-ui">Which choice did you make?</text><rect x="75" y="155" width="360" height="220" rx="15" fill="#2a4144" stroke="#b1c5b7" stroke-width="3"/><rect x="525" y="155" width="360" height="220" rx="15" fill="#344448" stroke="#d4c28b" stroke-width="3"/><text x="110" y="215" font-family="system-ui" font-size="25" fill="#d5e8df">Original note</text><text x="560" y="215" font-family="system-ui" font-size="25" fill="#efdeb6">Later explanation</text><text x="110" y="275" font-family="system-ui" font-size="34" fill="#fff">Option A</text><text x="560" y="275" font-family="system-ui" font-size="34" fill="#fff">Option B?</text><path d="M435 285 H520" stroke="#dfce9d" stroke-width="5" stroke-dasharray="9 12"/><path d="M504 271 L520 285 L504 299" fill="none" stroke="#dfce9d" stroke-width="5"/><text x="75" y="460" font-family="system-ui" font-size="23" fill="#e1e0d5">Record the choice. Then compare the explanation.</text><text x="75" y="499" font-family="system-ui" font-size="17" fill="#aabeba">FV original diagram · conceptual, not a recreation of trial imagery</text></svg>
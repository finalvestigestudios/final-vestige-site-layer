<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" viewBox="0 0 540 960"><title id="ttl">The second target</title><desc id="desc">Original gold-on-black information art: a bright 7 and a faint 4 within rapid rows of letters, representing a laboratory second-target report gap rather than a true vision test.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d0f"/><stop offset="1" stop-color="#1f1b16"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1d69b"/><stop offset="1" stop-color="#a68047"/></linearGradient></defs><rect width="540" height="960" fill="url(#bg)"/><path d="M50 135H490M50 805H490" stroke="#675b46" stroke-width="2"/><text x="52" y="90" fill="#d5b16e" font-size="20" font-family="sans-serif" letter-spacing="4">FINAL VESTIGE / MIND</text><text x="270" y="218" fill="#aaa093" text-anchor="middle" font-family="monospace" font-size="32" letter-spacing="9">W K L H P</text><text x="270" y="310" fill="#a89e8b" text-anchor="middle" font-family="monospace" font-size="32" letter-spacing="9">J S T A Q</text><text x="270" y="485" fill="url(#warm)" text-anchor="middle" font-family="Georgia,serif" font-size="183">7</text><rect x="210" y="520" width="120" height="3" fill="#d0a761"/><text x="270" y="620" fill="#d6cab5" opacity=".53" text-anchor="middle" font-family="Georgia,serif" font-size="115">4</text><text x="270" y="690" fill="#a89e8b" text-anchor="middle" font-family="monospace" font-size="32" letter-spacing="9">R B X E N</text><text x="50" y="860" fill="#f4efe6" font-size="35" font-family="Georgia,serif">THE SECOND</text><text x="50" y="907" fill="#f4efe6" font-size="35" font-family="Georgia,serif">NUMBER</text><text x="492" y="906" text-anchor="end" fill="#d5b16e" font-size="15" font-family="sans-serif">40s film</text></svg>
<svg viewBox="0 0 540 960" role="img" aria-labelledby="fv63-svgtitle fv63-svgdesc" xmlns="http://www.w3.org/2000/svg">
<title id="fv63-svgtitle">The second target: a conceptual poster</title><desc id="fv63-svgdesc">Original illustrated card showing a rapid sequence of letters around two numbers, with the second number partially obscured by a bronze time-window band; not a validated perception test.</desc>
<rect width="540" height="960" fill="#101714"/><rect x="28" y="28" width="484" height="904" rx="14" fill="#19211e" stroke="#9a7e55" stroke-width="2"/>
<text x="54" y="91" fill="#d5ad70" font-size="20" font-family="sans-serif" letter-spacing="4">FINAL VESTIGE / MIND</text>
<text x="54" y="190" fill="#f3eee4" font-family="Georgia,serif" font-size="51">THE SECOND</text><text x="54" y="250" fill="#f3eee4" font-family="Georgia,serif" font-size="51">NUMBER</text>
<text x="54" y="310" fill="#d5ad70" font-family="Georgia,serif" font-size="50">VANISHED.</text>
<g font-family="monospace" font-size="78" text-anchor="middle">
<text x="92" y="485" fill="#969e94">A</text><text x="182" y="485" fill="#f3eee4">7</text><text x="272" y="485" fill="#969e94">K</text><text x="362" y="485" fill="#d5ad70">3</text><text x="452" y="485" fill="#969e94">R</text></g>
<path d="M42 521H498" stroke="#d5ad70" stroke-width="3"/><text x="54" y="569" font-family="sans-serif" fill="#d9d3c8" font-size="20">THE TARGETS ARE IN THE STREAM.</text>
<text x="54" y="609" font-family="sans-serif" fill="#d9d3c8" font-size="20">THE REPORT MAY NOT BE.</text>
<rect x="54" y="665" width="432" height="136" rx="8" fill="#252f29" stroke="#72684f"/><text x="80" y="717" font-family="sans-serif" fill="#f3eee4" font-size="23">A research question.</text><text x="80" y="758" font-family="sans-serif" fill="#c7bfb3" font-size="20">Not a diagnosis or a product claim.</text>
<text x="54" y="884" font-family="sans-serif" fill="#d5ad70" font-size="19" letter-spacing="2">40s • OPTIONAL • TRANSCRIPT BELOW</text>

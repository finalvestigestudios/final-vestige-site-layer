<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The label and the listening</title><desc id="desc">Two equal illustrated waveforms: one called hypnosis and one called quiet listening. The underlying sound is visually identical. The caption asks what a name changes.</desc><rect width="960" height="540" fill="#0b1019"/><rect x="35" y="35" width="890" height="470" rx="18" fill="#152432" stroke="#687785" stroke-width="2"/><text x="80" y="112" fill="#e6c892" font-family="system-ui, sans-serif" font-weight="700" font-size="23" letter-spacing="4">FINAL VESTIGE / MIND &amp; PERCEPTION</text><text x="80" y="180" fill="#f9f3ea" font-family="system-ui, sans-serif" font-size="48" font-weight="700">Same sound. Different name.</text><rect x="80" y="223" width="370" height="142" rx="10" fill="#223447"/><rect x="510" y="223" width="370" height="142" rx="10" fill="#223447"/><text x="107" y="259" fill="#f6e2c0" font-size="22" font-family="system-ui, sans-serif">Hypnosis</text><text x="537" y="259" fill="#f6e2c0" font-size="22" font-family="system-ui, sans-serif">Quiet listening</text><path d="M105 314 Q125 275 145 314 T185 314 T225 314 T265 314 T305 314 T345 314 T385 314 T425 314" stroke="#efc88c" fill="none" stroke-width="5" stroke-linecap="round"/><path d="M535 314 Q555 275 575 314 T615 314 T655 314 T695 314 T735 314 T775 314 T815 314 T855 314" stroke="#efc88c" fill="none" stroke-width="5" stroke-linecap="round"/><text x="80" y="424" fill="#d4dce2" font-family="system-ui, sans-serif" font-size="27">What changes before you press play?</text><text x="80" y="466" fill="#b9c5cd" font-family="system-ui, sans-serif" font-size="17">Original illustration • no seller artwork or study footage</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The choice and the returned card</title><desc id="desc">Two differently marked abstract cards linked by a thin line. Above them asks: Did the outcome match the choice?</desc><rect width="960" height="540" fill="#111821"/><g fill="none" stroke="#e7c57f" stroke-width="3"><rect x="112" y="158" width="296" height="246" rx="14"/><rect x="552" y="158" width="296" height="246" rx="14"/><path d="M408 280H552"/></g><rect x="159" y="206" width="200" height="90" rx="10" fill="#395b65"/><circle cx="652" cy="249" r="58" fill="#aa7a4e"/><text x="480" y="84" fill="#f3e5c5" font-size="43" text-anchor="middle" font-family="Georgia,serif">Did the outcome match?</text><text x="260" y="357" fill="#f3e5c5" font-size="25" text-anchor="middle" font-family="system-ui,sans-serif">YOUR CHOICE</text><text x="700" y="357" fill="#f3e5c5" font-size="25" text-anchor="middle" font-family="system-ui,sans-serif">PRESENTED OUTCOME</text><text x="480" y="482" fill="#d5c5a2" font-size="19" text-anchor="middle" font-family="system-ui,sans-serif">An original illustration • Choice blindness is not product proof</text></svg>
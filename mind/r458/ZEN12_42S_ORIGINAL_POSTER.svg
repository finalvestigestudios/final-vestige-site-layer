<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">The second target that vanished</title><desc id="d">An original abstract representation of two gold visual targets separated by an empty frame. Not an attention experiment.</desc><rect width="1200" height="675" fill="#151c27"/><path d="M90 100H1110M90 575H1110" stroke="#6f6551" stroke-width="2"/><circle cx="310" cy="322" r="122" stroke="#dabb7a" stroke-width="7" fill="none"/><circle cx="310" cy="322" r="25" fill="#dabb7a"/><rect x="520" y="204" width="160" height="236" rx="14" fill="#242d38" stroke="#61707d" stroke-width="5" stroke-dasharray="12 14"/><circle cx="888" cy="322" r="122" stroke="#dabb7a" stroke-width="7" fill="none"/><circle cx="888" cy="322" r="25" fill="#dabb7a"/><path d="M500 322H454M746 322H700" stroke="#dabb7a" stroke-width="5"/><text x="95" y="68" font-family="system-ui,sans-serif" font-size="24" letter-spacing="4" fill="#dbc99e">MIND &amp; PERCEPTION</text><text x="600" y="532" font-family="Georgia,serif" font-size="46" text-anchor="middle" fill="#f4f0e6">What happened between two targets?</text><text x="600" y="613" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle" fill="#c1bcb1">An illustration, not a diagnostic test</text></svg>
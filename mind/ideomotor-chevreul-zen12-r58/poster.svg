<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="poster-title poster-description"><title id="poster-title">The pendulum moved. What moved it?</title><desc id="poster-description">An original evidence-first graphic: a small brass pendulum on a thread over two arrows, against dark archival paper. No claims of supernatural movement.</desc><defs><radialGradient id="bg" cx=".52" cy=".37" r=".9"><stop stop-color="#1d2220"/><stop offset="1" stop-color="#060807"/></radialGradient><linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2cb"/><stop offset=".5" stop-color="#c4a16c"/><stop offset="1" stop-color="#795c34"/></linearGradient></defs><rect width="540" height="960" fill="url(#bg)"/><rect x="21" y="21" width="498" height="918" fill="none" stroke="#806c4a" stroke-width="2"/><text x="52" y="93" fill="#d8bd82" font-size="17" letter-spacing="5" font-family="sans-serif">FINAL VESTIGE / MIND ARCHIVE</text><text x="52" y="171" fill="#f5ecdc" font-size="44" font-family="Georgia,serif">THE PENDULUM</text><text x="52" y="226" fill="#f5ecdc" font-size="50" font-family="Georgia,serif">MOVED.</text><text x="52" y="289" fill="#d2bf9b" font-size="27" font-family="Georgia,serif">What moved it?</text><line x1="270" y1="370" x2="310" y2="655" stroke="#cbb789" stroke-width="3"/><ellipse cx="310" cy="696" rx="31" ry="45" fill="url(#brass)"/><circle cx="310" cy="656" r="5" fill="#e7c999"/><path d="M170 717 A170 135 0 0 1 370 717" fill="none" stroke="#8e774b" stroke-width="3" stroke-dasharray="7 11"/><path d="M169 715l16 -11m-16 11l21 3" stroke="#8e774b" stroke-width="3" fill="none"/><text x="52" y="805" fill="#f6e5c6" font-size="25" font-family="Georgia,serif">A tiny movement.</text><text x="52" y="841" fill="#f6e5c6" font-size="25" font-family="Georgia,serif">A much larger explanation.</text><text x="52" y="912" fill="#b5ae9e" font-size="15" font-family="sans-serif">40 SECONDS · HISTORICAL SCIENCE · NOT AN EXPERIMENT</text></svg>
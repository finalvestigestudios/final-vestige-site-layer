<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">The threshold between two ordinary tasks</title><desc id="desc">Original minimal archival-style illustration: a study with a notebook on the desk at left, an open doorway in the middle, and a quieter room at right. Two different lit spaces suggest a change in context without implying the brain physically resets.</desc><defs><linearGradient id="back" x1="0" x2="1"><stop stop-color="#17231e"/><stop offset="1" stop-color="#303a30"/></linearGradient><linearGradient id="warm" x1="0" x2="1"><stop stop-color="#e8c78c" stop-opacity=".20"/><stop offset="1" stop-color="#e8c78c" stop-opacity=".06"/></linearGradient></defs><rect width="1200" height="660" fill="url(#back)"/><path d="M0 480H1200" stroke="#a49468" stroke-width="4"/><path d="M518 95v420M754 95v420M518 95h236" stroke="#d5b77f" stroke-width="22" fill="none"/><path d="M540 117h188v365H540z" fill="#101c19"/><path d="M544 475l183-71V131H544z" fill="url(#warm)" stroke="#b8a278" stroke-width="3"/><path d="M150 403h285M190 403V483M391 403v80" stroke="#cfb888" stroke-width="16" stroke-linecap="round"/><rect x="208" y="355" width="136" height="25" rx="4" fill="#e1c58e"/><path d="M218 353v-54h126v54" stroke="#f0dba6" stroke-width="5" fill="#b6a173"/><path d="M255 316h66" stroke="#5a503b" stroke-width="3"/><path d="M879 480v-154h172v154" stroke="#7c8e7f" stroke-width="10" fill="#222f27"/><circle cx="968" cy="230" r="77" fill="none" stroke="#bcad83" stroke-width="4"/><path d="M595 275l37 0" stroke="#f1d69b" stroke-width="3"/><circle cx="643" cy="275" r="4" fill="#f1d69b"/><text x="72" y="86" fill="#e1c58e" font-family="Georgia,serif" font-size="26" letter-spacing="5">FINAL VESTIGE / MIND ARCHIVE</text><text x="70" y="589" fill="#f3ebd8" font-family="Georgia,serif" font-size="45">The reason may lag behind.</text><text x="73" y="625" fill="#c8bda8" font-family="system-ui,sans-serif" font-size="19">An original illustration of event boundaries — not a brain scan or experimental stimulus</text></svg>
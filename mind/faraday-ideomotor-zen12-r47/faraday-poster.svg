<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="poster-title poster-desc"><title id="poster-title">Original film poster: The table moved. The hand went first.</title><desc id="poster-desc">A diagram of an oval tabletop and two hands above it, a golden indicator needle between them.</desc><rect width="540" height="960" fill="#0b0d0f"/><rect x="24" y="25" width="492" height="910" fill="none" stroke="#343331" stroke-width="2"/><text x="46" y="76" fill="#c6a163" font-family="sans-serif" font-size="17">FINAL VESTIGE / MIND &amp; PERCEPTION</text><text x="270" y="214" fill="#f4ecdc" text-anchor="middle" font-family="Georgia,serif" font-size="54">THE TABLE</text><text x="270" y="285" fill="#f4ecdc" text-anchor="middle" font-family="Georgia,serif" font-size="54">MOVED.</text><ellipse cx="270" cy="510" rx="155" ry="29" stroke="#c6a163" stroke-width="6" fill="none"/><line x1="205" y1="459" x2="218" y2="498" stroke="#eee8de" stroke-width="10"/><line x1="336" y1="459" x2="321" y2="498" stroke="#eee8de" stroke-width="10"/><line x1="270" y1="500" x2="324" y2="429" stroke="#c6a163" stroke-width="6"/><text x="270" y="735" text-anchor="middle" fill="#efe8da" font-family="sans-serif" font-size="27">The hand went first.</text><text x="270" y="791" text-anchor="middle" fill="#aea89c" font-family="sans-serif" font-size="19">1853 · Faraday · The ideomotor effect</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">The Listening Test</title><desc id="d">Two twelve-minute work choices, quiet and headphones, are compared without a claim of superior outcomes.</desc><rect width="960" height="540" fill="#101a1b"/><rect x="50" y="65" width="410" height="370" rx="18" fill="#223033" stroke="#a58a62"/><rect x="500" y="65" width="410" height="370" rx="18" fill="#262d31" stroke="#a58a62"/><g fill="#efd8a8" font-family="Arial,sans-serif"><text x="75" y="112" font-size="21">CONDITION A</text><text x="525" y="112" font-size="21">CONDITION B</text><text x="75" y="179" font-size="50">12:00</text><text x="525" y="179" font-size="50">12:00</text><text x="75" y="239" font-size="27">Quiet work</text><text x="525" y="239" font-size="27">With headphones</text><text x="480" y="502" text-anchor="middle" font-size="27">What made the difference?</text></g><g stroke="#dec99b" stroke-width="3" fill="none"><path d="M80 280h30v30H80z M530 280h30v30h-30z M85 293l8 8 15-19 M535 293l8 8 15-19 M128 296h260 M578 296h260 M128 344h260 M578 344h260"/></g></svg>
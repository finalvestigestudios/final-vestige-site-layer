<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d"><title id="t">The Pendulum That Answered</title><desc id="d">Original typography-led poster: a pendulum over a dark archival grid, showing a circular arc and the distinction between motion and knowledge.</desc><defs><radialGradient id="bg"><stop stop-color="#323026"/><stop offset="1" stop-color="#090c0d"/></radialGradient><linearGradient id="met" x2="1" y2="1"><stop stop-color="#ffe3a8"/><stop offset=".5" stop-color="#b29153"/><stop offset="1" stop-color="#6b5836"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/><g stroke="#aa8d53" opacity=".15"><path d="M90 0V1920M270 0V1920M450 0V1920M630 0V1920M810 0V1920M990 0V1920M0 160H1080M0 430H1080M0 700H1080M0 970H1080M0 1240H1080M0 1510H1080M0 1780H1080"/></g><g fill="none" stroke="#c3a269"><path d="M540 190V1080" stroke-width="7"/><circle cx="540" cy="1150" r="270" stroke-dasharray="12 18" stroke-width="5" opacity=".62"/><path d="M540 450Q700 730 750 1080" stroke-width="4" opacity=".3"/></g><circle cx="540" cy="1100" r="78" fill="url(#met)" stroke="#e5c58f" stroke-width="9"/><g fill="#f4ebd9" font-family="Georgia,serif" text-anchor="middle"><text x="540" y="310" font-size="58">FINAL VESTIGE</text><text x="540" y="390" font-size="31" letter-spacing="11">MIND &amp; PERCEPTION</text><text x="540" y="1550" font-size="80">THE PENDULUM</text><text x="540" y="1650" font-size="80">THAT ANSWERED</text><text x="540" y="1750" font-size="35">A MOVEMENT IS NOT A MESSAGE</text></g></svg>
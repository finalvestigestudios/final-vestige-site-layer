<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Look for one thing; notice another</title><desc id="d">Original gold-on-midnight illustration: a highlighted search target at left and an unexpected faint shape beyond the instructed search on the right. The lines meet at a question mark. Not an experimental stimulus or a promised cognitive effect.</desc>
<rect width="800" height="450" fill="#101923"/><rect x="26" y="26" width="748" height="398" rx="14" fill="#1b2935" stroke="#a28a5e" stroke-opacity=".65"/>
<text x="55" y="83" font-family="Georgia,serif" font-size="30" fill="#f4e9d5">THE TASK SETS THE FRAME</text>
<text x="56" y="111" font-family="Arial,sans-serif" font-size="15" fill="#c6c2b5">An original conceptual drawing • not an eye-tracking result</text>
<path d="M86 235h622" stroke="#65747e" stroke-width="2" stroke-dasharray="5 9"/>
<circle cx="245" cy="230" r="76" fill="none" stroke="#f0cd80" stroke-width="5"/><circle cx="245" cy="230" r="26" fill="#f0cd80"/>
<text x="245" y="338" font-family="Arial,sans-serif" font-size="18" fill="#fff0c9" text-anchor="middle">INSTRUCTED TARGET</text>

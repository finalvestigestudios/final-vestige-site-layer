<path d="M549 193l-27 46h54z" fill="#b4c3c4" opacity=".9"/>
<text x="550" y="337" font-family="Arial,sans-serif" font-size="18" fill="#dbe4e2" text-anchor="middle">UNEXPECTED</text>
<path d="M318 206c51-42 100-40 138 0" fill="none" stroke="#dfc58b" stroke-width="3" stroke-linecap="round"/>
<text x="399" y="197" font-family="Georgia,serif" font-size="30" text-anchor="middle" fill="#e7c682">?</text>
<text x="400" y="391" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#b9c8c9">WHAT DID THE TASK ASK YOU TO REPORT?</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The second number</title><desc id="desc">A poster illustration, not a replicated attention experiment: two golden numeral shapes appear in a dark horizontal stream, with a fading outline around the second.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c0b"/><stop offset="1" stop-color="#171a18"/></linearGradient></defs><rect width="1280" height="720" fill="url(#b)"/><g stroke="#736047" stroke-opacity=".45" fill="none"><path d="M120 350h1040"/><rect x="118" y="100" width="1044" height="520" rx="5"/></g><g font-family="Georgia,serif" font-size="300" text-anchor="middle"><text x="470" y="474" fill="#ddba7e">4</text><text x="790" y="474" fill="#c5ac81" opacity=".23">7</text></g><text x="640" y="170" fill="#f3ebd9" font-size="32" text-anchor="middle" font-family="Georgia,serif">THE SECOND NUMBER ARRIVED.</text><text x="640" y="585" fill="#afa99d" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif">An illustration of attention's timing, not a performance claim</text></svg>
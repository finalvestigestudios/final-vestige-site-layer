<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="ttl desc"><title id="ttl">The unanswered pendulum</title><desc id="desc">Original gold pendulum above a historian's field ledger, on a charcoal field with a fine geometric grid. No depiction of a supernatural effect.</desc><rect width="1280" height="720" fill="#171919"/><g stroke="#383a37" stroke-width="1"><path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/></g><path d="M640 60V420" stroke="#dfc590" stroke-width="4"/><path d="M640 420l-34 67h68z" fill="#d6b879" stroke="#f3dda8" stroke-width="4"/><path d="M130 560q510 -45 1020 0l-30 105H160z" fill="#282a28" stroke="#9c927a" stroke-width="3"/><g stroke="#b5a687" stroke-width="2" opacity=".8"><path d="M260 590H550M260 616H510M730 590H1040M730 616H970"/></g><text x="80" y="100" fill="#e1c791" font-family="Georgia,serif" font-size="46">THE PENDULUM</text><text x="80" y="147" fill="#e9e2d2" font-family="Georgia,serif" font-size="27">the movement was real • the meaning was disputed</text><text x="960" y="670" fill="#d1c6ad" font-family="sans-serif" font-size="18">FINAL VESTIGE / ORIGINAL ART</text></svg>
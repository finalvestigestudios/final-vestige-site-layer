<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">The missing detail: original film concept poster</title><desc id="d">Editorial abstract of seven cream paper squares, one amber circle among them and a divided observation path. This is original art, not a replication of an experimental film.</desc><rect width="1280" height="720" fill="#101c24"/><path d="M0 610 C220 500 360 720 570 590 S1040 490 1280 560" fill="none" stroke="#526b72" stroke-width="3" opacity=".6"/><g fill="#f2e8d8" stroke="#d3b896" stroke-width="3"><rect x="126" y="190" width="164" height="162" rx="14"/><rect x="327" y="190" width="164" height="162" rx="14"/><rect x="528" y="190" width="164" height="162" rx="14"/><rect x="729" y="190" width="164" height="162" rx="14"/><rect x="930" y="190" width="164" height="162" rx="14"/></g><g fill="#263943"><circle cx="208" cy="271" r="42"/><circle cx="409" cy="271" r="42"/><circle cx="610" cy="271" r="42"/><circle cx="811" cy="271" r="42"/></g><circle cx="1012" cy="271" r="46" fill="#d9ad65"/><path d="M1020 243 L1007 269 L1028 285" fill="none" stroke="#14212a" stroke-width="8" stroke-linecap="round"/><text x="126" y="118" fill="#efd5a1" font-family="Georgia,serif" font-size="54">What did you notice?</text><text x="126" y="425" fill="#d7e0dd" font-family="system-ui,sans-serif" font-size="27">An original forty-two-second guide to evidence and expectation.</text><text x="126" y="645" fill="#d7e0dd" font-family="system-ui,sans-serif" font-size="23">FINAL VESTIGE STUDIOS  /  MIND &amp; PERCEPTION</text></svg>
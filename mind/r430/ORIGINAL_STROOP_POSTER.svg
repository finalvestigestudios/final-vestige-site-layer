<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Say the ink, not the word</title><desc id="d">Original vector art for an unproduced short film concept, depicting the word BLUE in reddish ink and RED in blue ink.</desc><rect width="1280" height="720" fill="#090f19"/><path d="M90 120H1190M90 596H1190" stroke="#e9c58d" stroke-width="2"/><text x="90" y="91" font-size="23" letter-spacing="6" fill="#e9c58d" font-family="Arial">FINAL VESTIGE · MIND &amp; PERCEPTION</text><text x="90" y="310" font-family="Georgia" font-size="195" font-weight="bold" fill="#db6767">BLUE</text><text x="655" y="515" font-family="Georgia" font-size="195" font-weight="bold" fill="#6ca8e0">RED</text><text x="93" y="659" font-family="Arial" font-size="42" fill="#f8f3e8">SAY THE INK. NOT THE WORD.</text></svg>
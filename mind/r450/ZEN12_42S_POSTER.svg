<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">The door that obscured a change</title><desc id="desc">Original geometric illustration of a door between two simple anonymous figures, with a gold outline denoting attention and comparison. No photograph or experiment footage.</desc><rect width="960" height="440" fill="#151b20"/><path d="M20 360 H940" stroke="#d4b878" stroke-width="3"/><path d="M92 360 V145 M92 145 H868 M868 145 V360" fill="none" stroke="#48555b" stroke-width="4"/><circle cx="260" cy="205" r="46" fill="#a7adb0"/><path d="M187 360 Q175 250 260 260 Q345 250 333 360" fill="#a7adb0"/><circle cx="724" cy="205" r="46" fill="#c9b077"/><path d="M651 360 Q640 250 724 260 Q809 250 797 360" fill="#c9b077"/><rect x="403" y="66" width="152" height="294" rx="3" fill="#2b3438" stroke="#c9b077" stroke-width="5"/><circle cx="526" cy="223" r="6" fill="#c9b077"/><path d="M365 224 H402 M556 224 H592" stroke="#d2be92" stroke-width="2" stroke-dasharray="6 10"/><text x="480" y="46" fill="#e9dbbe" text-anchor="middle" font-family="Georgia, serif" font-size="28">WHAT CHANGED?</text><text x="480" y="412" fill="#d6c8aa" text-anchor="middle" font-family="sans-serif" font-size="16">FINAL VESTIGE · ORIGINAL ILLUSTRATION · UNPUBLISHED</text></svg>
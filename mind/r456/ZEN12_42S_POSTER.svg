<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="pTitle pDesc"><title id="pTitle">The sound we fill in</title><desc id="pDesc">Original abstract diagram: an audio line interrupted in the middle, inviting a question about perception.</desc><rect width="960" height="540" fill="#132123"/><rect x="54" y="56" width="852" height="428" rx="22" fill="#1b2e2e" stroke="#657c74" stroke-width="2"/><g stroke="#e1ba78" stroke-width="7" fill="none" stroke-linecap="round"><path d="M115 270h70l18-68 32 145 30-126 34 92 24-43h80"/><path stroke-dasharray="5 16" opacity=".6" d="M430 270h100"/><path d="M557 270h64l26-99 32 181 28-132 30 76 18-26h89"/></g><text x="480" y="130" text-anchor="middle" fill="#f5e2bc" font-family="Georgia,serif" font-size="52">What did you hear?</text><text x="480" y="425" text-anchor="middle" fill="#c6d0c9" font-family="Arial,sans-serif" font-size="24">A missing sound. A complete experience. Different evidence.</text></svg>
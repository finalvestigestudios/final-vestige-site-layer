<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">The tree that was never magnetized</title><desc id="desc">Original geometric illustration: four pale trees on the near side of a dividing line, one gold apricot tree beyond it, with a blindfold silhouette.</desc><rect width="540" height="960" fill="#121a20"/><path d="M0 720L540 720" stroke="#9e8666" stroke-width="2"/><text x="45" y="100" font-family="Georgia,serif" font-size="45" fill="#f7e7cb">THE TREE THAT</text><text x="45" y="157" font-family="Georgia,serif" font-size="45" fill="#f7e7cb">WAS NEVER</text><text x="45" y="214" font-family="Georgia,serif" font-size="45" fill="#f7e7cb">MAGNETIZED</text><text x="45" y="263" font-family="sans-serif" font-size="18" fill="#e1cda8">PASSY, 1784 · THE BLIND TEST</text><g stroke="#e9e1d1" stroke-width="14" stroke-linecap="round" fill="none"><path d="M86 590V430m-38 63l38 23 38-23"/><path d="M210 590V430m-38 63l38 23 38-23"/><path d="M334 590V430m-38 63l38 23 38-23"/><path d="M458 590V430m-38 63l38 23 38-23"/></g><g stroke="#e9e1d1" stroke-width="3" fill="#526451"><circle cx="86" cy="430" r="51"/><circle cx="210" cy="430" r="51"/><circle cx="334" cy="430" r="51"/><circle cx="458" cy="430" r="51"/></g><g fill="#f6ead7" font-family="sans-serif" font-size="18"><text x="82" y="654">1</text><text x="206" y="654">2</text><text x="330" y="654">3</text><text x="454" y="654">4</text></g><path d="M160 828h220" stroke="#ddbb82" stroke-width="4"/><text x="54" y="784" fill="#e8c18a" font-size="23" font-family="Georgia,serif">THE PREPARED TREE WAS ELSEWHERE.</text><text x="54" y="889" fill="#f4f0e9" font-size="23" font-family="Georgia,serif">Experience ≠ proof of its cause</text><text x="54" y="924" fill="#dbc3a4" font-size="15" font-family="sans-serif">FINAL VESTIGE STUDIOS · EVIDENCE BEFORE CLAIM</text></svg>
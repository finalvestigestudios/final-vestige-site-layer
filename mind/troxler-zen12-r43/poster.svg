<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="t d"><title id="t">The dot did not move</title><desc id="d">Original schematic: a stationary center cross and muted peripheral circle, not a vision test.</desc><rect width="540" height="960" fill="#111b20"/><rect x="45" y="135" width="450" height="490" rx="26" fill="#2a3d42"/><circle cx="401" cy="355" r="44" fill="#a6cdb7" opacity=".43"/><path d="M270 324v62M239 355h62" stroke="#efd29f" stroke-width="6"/><g font-family="Georgia,serif" fill="#f5efe5" text-anchor="middle"><text x="270" y="85" font-size="34">THE DOT DID NOT MOVE</text><text x="270" y="723" font-size="25">A change in experience</text><text x="270" y="765" font-size="25">does not change the object.</text></g><g fill="#d8d3c5" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle"><text x="270" y="857">FINAL VESTIGE • MIND &amp; PERCEPTION</text><text x="270" y="895">Original educational schematic</text></g></svg>
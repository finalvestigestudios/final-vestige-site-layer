<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The evidence gap between a laboratory attention study and a meditation advertisement</title><desc id="desc">An original dark editorial illustration: on the left a small recording and attention task labelled LABORATORY; on the right a commercial screen labelled SALES PAGE. A golden question mark occupies the gap between them.</desc><rect width="960" height="540" fill="#12191d"/><rect x="42" y="44" width="875" height="450" rx="24" fill="#1e272c" stroke="#b69c68" stroke-width="2"/><text x="480" y="96" text-anchor="middle" fill="#eedab7" font-family="Georgia,serif" font-size="37">One recording does not validate another.</text><rect x="98" y="145" width="325" height="275" rx="18" fill="#29383e"/><rect x="537" y="145" width="325" height="275" rx="18" fill="#29383e"/><text x="260" y="183" text-anchor="middle" fill="#e0bf89" font-family="sans-serif" font-size="24" letter-spacing="3">LABORATORY</text><text x="700" y="183" text-anchor="middle" fill="#e0bf89" font-family="sans-serif" font-size="24" letter-spacing="3">SALES PAGE</text><g stroke="#edf1eb" stroke-width="10" stroke-linecap="round"><path d="M165 253h90m-45-40l45 40-45 40"/><path d="M270 253h90m-45-40l45 40-45 40"/></g><text x="260" y="347" text-anchor="middle" fill="#edf1eb" font-family="sans-serif" font-size="21">Narrow attention task</text><text x="260" y="379" text-anchor="middle" fill="#c5d0d2" font-family="sans-serif" font-size="17">10-minute guided session</text><g fill="none" stroke="#edf1eb" stroke-width="5"><rect x="624" y="225" width="150" height="77" rx="9"/><path d="M638 243h122m-122 18h78m-78 19h91"/></g><text x="700" y="347" text-anchor="middle" fill="#edf1eb" font-family="sans-serif" font-size="21">Commercial promise</text><text x="700" y="379" text-anchor="middle" fill="#c5d0d2" font-family="sans-serif" font-size="17">12-minute program</text><circle cx="480" cy="272" r="46" fill="#a68955"/><text x="480" y="293" text-anchor="middle" fill="#101518" font-family="Georgia,serif" font-size="66">?</text><text x="480" y="463" text-anchor="middle" fill="#dcd5c7" font-family="sans-serif" font-size="19">The missing proof is a direct product-specific comparison.</text></svg>
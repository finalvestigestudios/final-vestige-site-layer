<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">The absent word</title><desc id="d">An original editorial graphic shows a word list, an empty line, and a distinction between observation and inference.</desc><rect width="960" height="540" fill="#0b1321"/><rect x="58" y="56" width="844" height="428" rx="19" fill="#172437" stroke="#e4c37a"/><text x="90" y="119" font-family="sans-serif" font-size="26" letter-spacing="3" fill="#e4c37a">FINAL VESTIGE · MIND &amp; PERCEPTION</text><text x="90" y="195" font-family="Georgia,serif" font-size="46" fill="#f1efe8">The Word Nobody Said</text><text x="90" y="264" font-family="sans-serif" font-size="29" fill="#dfd7c6">BED    REST    AWAKE    DREAM    ...</text><rect x="90" y="293" width="774" height="2" fill="#ac9870"/><text x="90" y="365" font-family="sans-serif" font-size="27" fill="#f1efe8">A remembered word is not always a recorded word.</text><text x="90" y="429" font-family="sans-serif" font-size="22" fill="#e4c37a">Observe the source. Test the inference.</text></svg>
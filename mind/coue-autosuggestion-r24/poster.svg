<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">Twelve minutes without a guarantee</title><desc id="desc">An original clock diagram with bronze markers and text emphasizing a practical duration rather than a proven shortcut</desc><rect width="540" height="960" fill="#0c0d0d"/><circle cx="270" cy="350" r="184" fill="none" stroke="#34322e" stroke-width="3"/><circle cx="270" cy="350" r="162" fill="none" stroke="#b8955e" stroke-width="14" stroke-dasharray="4 26"/><path d="M270 185V350L370 408" fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="350" r="11" fill="#b8955e"/><text x="270" y="627" font-family="Georgia,serif" fill="#b8955e" font-size="90" text-anchor="middle">12:00</text><text x="270" y="706" font-family="system-ui,sans-serif" fill="#f4efe6" font-size="25" text-anchor="middle">A practical length.</text><text x="270" y="745" font-family="system-ui,sans-serif" fill="#f4efe6" font-size="25" text-anchor="middle">Not a proven shortcut.</text><path d="M60 813H480" stroke="#34322e"/><text x="270" y="860" font-family="system-ui,sans-serif" fill="#aaa49a" font-size="16" letter-spacing="2" text-anchor="middle">FINAL VESTIGE · MIND ARCHIVE</text></svg>
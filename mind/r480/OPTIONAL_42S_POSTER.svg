<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1280" height="720" viewBox="0 0 1280 720"><title id="title">The motion is real. The explanation needs evidence.</title><desc id="desc">Original abstract illustration of a very light paper pendulum over a cream and charcoal background divided into observation, explanation and proof.</desc><rect width="1280" height="720" fill="#141a17"/><g stroke="#dbb777" stroke-width="2" opacity=".33"><path d="M75 180H1205M75 540H1205M270 75V645M1010 75V645"/></g><circle cx="640" cy="188" r="12" fill="#e2bf85"/><path d="M640 200L700 455" fill="none" stroke="#e4c99d" stroke-width="3"/><circle cx="700" cy="465" r="24" fill="#d4b578"/><path d="M570 463Q700 520 830 463" stroke="#d4b578" stroke-width="4" fill="none" stroke-dasharray="10 14" opacity=".7"/><g font-family="Georgia,serif" fill="#f3efe5" text-anchor="middle"><text x="640" y="100" font-size="40">THE MOTION IS REAL</text><text x="640" y="590" font-size="46">THE CAUSE STILL NEEDS PROOF</text></g><g font-family="Arial,sans-serif" fill="#e0bf87" font-size="25" letter-spacing="4" text-anchor="middle"><text x="240" y="675">OBSERVATION</text><text x="640" y="675">EXPLANATION</text><text x="1035" y="675">PROOF</text></g></svg>
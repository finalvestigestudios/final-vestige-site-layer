<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The second number disappears</title><desc id="desc">Editorial concept of a rapid letter stream: the first number is highlighted, the second is dimmed.</desc><rect width="1280" height="720" fill="#142126"/><path d="M95 160H1185M95 560H1185" stroke="#806b43" stroke-width="2"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="34" fill="#d8c8a9" letter-spacing="5">FINAL VESTIGE / MIND &amp; PERCEPTION</text><text x="105" y="348" font-family="monospace" font-size="126" fill="#c0c7c4" letter-spacing="12">D F <tspan fill="#ffce73">3</tspan> T E K <tspan fill="#7b817e">7</tspan> P</text><text x="105" y="465" font-family="Georgia,serif" font-size="54" fill="#faf4e8">The second target went by.</text><text x="105" y="622" font-family="Arial,sans-serif" font-size="25" fill="#cabf9e">What an attentional-blink study actually measured</text></svg>
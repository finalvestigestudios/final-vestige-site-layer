<svg viewBox="0 0 540 960" role="img" aria-labelledby="fvz-poster-title fvz-poster-desc" xmlns="http://www.w3.org/2000/svg"><title id="fvz-poster-title">The photograph you never chose</title><desc id="fvz-poster-desc">Two stylized anonymous portraits stand side by side with a dotted question mark suggesting an exchanged outcome. Original conceptual illustration, not an experiment photograph.</desc><rect width="540" height="960" fill="#0c0e0e"/><rect x="27" y="29" width="486" height="902" rx="10" fill="#151918" stroke="#a78655" stroke-width="2"/><text x="58" y="102" font-size="20" fill="#c9a774" font-family="Arial" letter-spacing="4">FINAL VESTIGE</text><text x="56" y="162" font-size="44" fill="#f2ecdf" font-family="Georgia">THE CARD</text><text x="56" y="218" font-size="44" fill="#f2ecdf" font-family="Georgia">YOU CHOSE?</text><rect x="60" y="293" width="180" height="258" fill="#233b3b" stroke="#c9a774" stroke-width="2"/><circle cx="150" cy="398" r="49" fill="#ada18c"/><path d="M82 531 Q150 429 219 531Z" fill="#ada18c"/><rect x="301" y="293" width="180" height="258" fill="#3a313c" stroke="#c9a774" stroke-width="2"/><circle cx="391" cy="398" r="49" fill="#ada18c"/><path d="M323 531 Q391 429 460 531Z" fill="#ada18c"/><path d="M241 421 L299 421" stroke="#c9a774" stroke-width="6" stroke-dasharray="11 11"/><text x="58" y="633" fill="#e7decc" font-size="29" font-family="Georgia">You choose one.</text><text x="58" y="680" fill="#e7decc" font-size="29" font-family="Georgia">What if it changes?</text><path d="M58 742 H484" stroke="#78674d"/><text x="58" y="796" fill="#c9a774" font-size="21" font-family="Arial">40-SECOND VIDEO CONCEPT</text><text x="58" y="845" fill="#eee8dd" font-size="20" font-family="Arial">An explanation is not a record.</text></svg>
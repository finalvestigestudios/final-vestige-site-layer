<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="t d"><title id="t">The Second Number</title><desc id="d">Original bronze and cream editorial poster: two numbers in a vertical stream, with the second obscured by a translucent circle. Not a recreated experiment.</desc><rect width="540" height="960" fill="#0a0d0e"/><path d="M38 75H502 M38 885H502" stroke="#aa8350" stroke-width="2"/><text x="42" y="128" font-family="sans-serif" font-size="21" fill="#c9a16b" letter-spacing="4">FINAL VESTIGE · MIND</text><text x="42" y="260" font-family="Georgia,serif" font-size="60" fill="#f6f0e7">THE SECOND</text><text x="42" y="322" font-family="Georgia,serif" font-size="60" fill="#f6f0e7">NUMBER</text><text x="42" y="374" font-family="Georgia,serif" font-size="29" fill="#c9a16b">Forty seconds about attention</text><g font-family="Georgia,serif" text-anchor="middle" font-size="145"><text x="270" y="570" fill="#f6f0e7">7</text><text x="270" y="735" fill="#9c825f">2</text></g><circle cx="270" cy="678" r="124" fill="#0b0d0e" fill-opacity=".65" stroke="#ac8852" stroke-width="2"/><path d="M180 678H360 M270 587V769" stroke="#c9a16b" opacity=".45"/><text x="42" y="923" font-family="sans-serif" font-size="20" fill="#ded4c2">OBSERVATION ≠ EXPLANATION</text></svg>
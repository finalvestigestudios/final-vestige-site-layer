<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 720"><title id="title">The hand, the thread, the inference</title><desc id="desc">An original pendulum diagram showing an almost motionless hand above a delicate gold line, a weight and a dotted arc; the captions separate what was seen from what caused it.</desc><rect width="1280" height="720" fill="#101713"/><g fill="none" stroke="#8e7d56" stroke-width="2"><path d="M90 120H1190M90 610H1190"/><path d="M650 220V568" stroke="#cfb374" stroke-width="4"/><path d="M565 218Q650 178 735 218" stroke="#c9a36d" stroke-width="12" stroke-linecap="round"/><path d="M650 226 Q735 400 795 550" stroke="#ead090" stroke-width="3" stroke-dasharray="8 15"/><path d="M650 226 Q565 400 505 550" stroke="#ead090" stroke-width="3" stroke-dasharray="8 15"/><path d="M490 555Q650 650 810 555" stroke="#9f8756" stroke-width="2" stroke-dasharray="8 16"/></g><circle cx="650" cy="565" r="30" fill="#d4ae6f" stroke="#f6e1b9" stroke-width="3"/><g font-family="Georgia,serif" fill="#eee1c6"><text x="90" y="83" font-size="31">FINAL VESTIGE  /  MIND &amp; PERCEPTION</text><text x="95" y="320" font-size="42">The motion</text><text x="95" y="367" font-size="42">is real.</text><text x="835" y="320" font-size="42">The explanation</text><text x="835" y="367" font-size="42">must be tested.</text></g><g font-family="system-ui,sans-serif" font-size="19" letter-spacing="5" fill="#d9b87f"><text x="95" y="430">OBSERVATION</text><text x="835" y="430">INFERENCE</text></g><text x="95" y="672" font-family="system-ui,sans-serif" fill="#bcb6a7" font-size="20">Original illustration · November 2026 · Unpublished concept</text></svg>
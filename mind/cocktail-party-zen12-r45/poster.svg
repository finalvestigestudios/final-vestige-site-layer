<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">The Name in the Other Ear</title><desc id="desc">Original schematic of competing sound streams; one highlighted word crosses the boundary of attention.</desc><rect width="540" height="960" fill="#0b0e0e"/><path d="M40 100H500 M40 850H500" stroke="#564832" stroke-width="2"/><text x="40" y="61" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#c8ac77">FINAL VESTIGE / MIND</text><text x="270" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#f3ede2">THE NAME</text><text x="270" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#f3ede2">IN THE</text><text x="270" y="302" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#c8ac77">OTHER EAR</text><text x="270" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c9c4b9">A laboratory story about attention</text><path d="M85 470Q130 430 174 470T263 470T352 470T441 470" stroke="#607b74" fill="none" stroke-width="7" stroke-linecap="round"/><path d="M85 560Q130 600 174 560T263 560T352 560T441 560" stroke="#c8ac77" fill="none" stroke-width="7" stroke-linecap="round"/><circle cx="270" cy="515" r="62" fill="#1b2422" stroke="#c8ac77" stroke-width="3"/><text x="270" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#f3ede2">NAME</text><text x="88" y="635" font-family="Arial,sans-serif" font-size="16" fill="#a8bdb6">SELECTED VOICE</text><text x="88" y="675" font-family="Arial,sans-serif" font-size="16" fill="#c8ac77">IGNORED VOICE</text><text x="40" y="781" font-family="Georgia,serif" font-size="27" fill="#f3ede2">A signal can capture attention.</text><text x="40" y="817" font-family="Georgia,serif" font-size="27" fill="#f3ede2">It does not always do so.</text><text x="40" y="906" font-family="Arial,sans-serif" letter-spacing="2" font-size="14" fill="#b6a58a">ORIGINAL EDUCATIONAL FILM • 40 SECONDS</text></svg>
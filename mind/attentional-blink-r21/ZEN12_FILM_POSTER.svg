<text x="42" y="70" fill="#c7a66c" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">FINAL VESTIGE STUDIOS</text>
<text x="42" y="506" fill="#b8955e" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">THE MIND ARCHIVE</text>
<text x="42" y="585" fill="#f4efe6" font-family="Georgia,serif" font-size="52">A half second</text><text x="42" y="647" fill="#f4efe6" font-family="Georgia,serif" font-size="52">can change</text><text x="42" y="709" fill="#f4efe6" font-family="Georgia,serif" font-size="52">a report.</text>
<text x="42" y="787" fill="#cdc1ae" font-family="Arial,sans-serif" font-size="20">An evidence-first look at attention</text><text x="42" y="817" fill="#cdc1ae" font-family="Arial,sans-serif" font-size="20">and short meditation audio.</text>

<rect width="540" height="960" fill="url(#g)"/>
<g fill="#e3d4be" opacity=".17" font-family="Georgia,serif" font-size="42" text-anchor="middle"><text x="85" y="205">F</text><text x="180" y="155">8</text><text x="278" y="232">A</text><text x="388" y="162">7</text><text x="470" y="250">Q</text><text x="85" y="340">T</text><text x="185" y="310">C</text><text x="350" y="352">5</text><text x="455" y="325">L</text></g>

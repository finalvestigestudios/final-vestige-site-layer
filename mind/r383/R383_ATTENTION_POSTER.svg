<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">A second target slips through the stream</title><desc id="desc">Original abstract visual demonstration of attention as a stream of letter-like glyphs, with two gold circles at different strengths. This is illustrative and not measured experimental output.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1921"/><stop offset="1" stop-color="#243139"/></linearGradient></defs><rect width="960" height="540" fill="url(#bg)"/><g fill="none" stroke="#6b675c" stroke-width="1"><path d="M80 120h800M80 250h800M80 380h800"/></g><g font-family="Georgia,serif" font-size="64" text-anchor="middle"><text x="150" y="290" fill="#a5a9a5">A</text><text x="275" y="290" fill="#bfc5c4">R</text><text x="400" y="290" fill="#f3cc7e">T₁</text><text x="540" y="290" fill="#d0d5d4">X</text><text x="685" y="290" fill="#8e9b9b">T₂</text><text x="810" y="290" fill="#bec7c4">S</text></g><circle cx="399" cy="267" r="80" fill="none" stroke="#e1b977" stroke-width="5"/><circle cx="682" cy="267" r="80" fill="none" stroke="#e1b977" stroke-width="3" opacity=".24"/><text x="80" y="85" fill="#e1b977" font-family="Arial,sans-serif" font-size="21" letter-spacing="4">A MOMENT BETWEEN TARGETS</text><text x="80" y="458" fill="#f3eee4" font-family="Georgia,serif" font-size="31">Attention is not a continuous inventory.</text><text x="80" y="493" fill="#b6c0c0" font-family="Arial,sans-serif" font-size="17">EDITORIAL ILLUSTRATION · NOT EXPERIMENTAL DATA</text></svg>
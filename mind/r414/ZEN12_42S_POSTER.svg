<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Two measures of attention</title><desc id="d">An abstract evidence diagram contrasts the feeling of concentration with the record of completed work.</desc><rect width="960" height="540" fill="#101820"/><rect x="38" y="38" width="884" height="464" rx="20" fill="#19242d" stroke="#9f8b64" stroke-width="2"/><text x="76" y="105" font-family="Georgia,serif" font-size="28" fill="#e9c77c" letter-spacing="2">THE TWELVE-MINUTE QUESTION</text><path d="M480 148 V408" stroke="#7f8d96" stroke-width="2" stroke-dasharray="9 12"/><rect x="78" y="166" width="350" height="248" rx="14" fill="#26323c"/><rect x="532" y="166" width="350" height="248" rx="14" fill="#26323c"/><text x="112" y="219" font-family="system-ui,sans-serif" font-weight="700" font-size="27" fill="#fff8e8">FELT FOCUS</text><text x="112" y="255" font-family="system-ui,sans-serif" font-size="19" fill="#d1dbdd">How concentrated was I?</text><path d="M113 334 Q196 259 260 327 T399 295" fill="none" stroke="#efc982" stroke-width="5" stroke-linecap="round"/><text x="566" y="219" font-family="system-ui,sans-serif" font-weight="700" font-size="27" fill="#fff8e8">WORK DONE</text><text x="566" y="255" font-family="system-ui,sans-serif" font-size="19" fill="#d1dbdd">What actually got finished?</text><rect x="565" y="316" width="34" height="34" rx="5" stroke="#efc982" stroke-width="3" fill="none"/><path d="M574 333 L583 342 L598 322" stroke="#e9c77c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M620 332 H820" stroke="#d1dbdd" stroke-width="5" stroke-linecap="round"/><text x="76" y="462" font-family="system-ui,sans-serif" font-size="20" fill="#e1e4e5">Two observations. Neither is a product-efficacy trial.</text></svg>
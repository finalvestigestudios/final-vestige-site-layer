<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">The hand and the hypothesis</title><desc id="d">An original graphic explaining that observation, expectation, and explanation are separate steps.</desc><rect width="960" height="540" fill="#0b1321"/><rect x="52" y="52" width="856" height="436" rx="16" fill="#172437" stroke="#e4c37a" stroke-opacity=".55"/><text x="84" y="126" font-size="26" fill="#e4c37a" font-family="sans-serif" letter-spacing="4">FINAL VESTIGE STUDIOS</text><text x="84" y="193" font-size="42" fill="#f2f0e8" font-family="Georgia,serif">A hand. A sensation. A question.</text><path d="M675 365 L653 292 Q651 273 664 271 Q681 271 685 296 L691 247 Q694 228 708 233 Q722 235 720 254 L725 225 Q728 205 744 208 Q760 210 758 232 L763 238 Q767 219 782 225 Q797 230 793 250 L787 294 Q804 267 819 279 Q833 290 822 310 L792 375 Q778 415 737 420 L712 420 Q681 414 675 365Z" fill="none" stroke="#e4c37a" stroke-width="8" stroke-linejoin="round"/><text x="84" y="296" font-size="26" fill="#f2f0e8" font-family="sans-serif">01   OBSERVATION</text><text x="84" y="345" font-size="26" fill="#f2f0e8" font-family="sans-serif">02   EXPECTATION</text><text x="84" y="394" font-size="26" fill="#f2f0e8" font-family="sans-serif">03   EXPLANATION</text><text x="84" y="453" font-size="20" fill="#c4cedb" font-family="sans-serif">Three things worth keeping separate.</text></svg>
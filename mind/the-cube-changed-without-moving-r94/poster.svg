<svg viewBox="0 0 320 290" role="img" aria-labelledby="fvm94-cube-title fvm94-cube-desc" xmlns="http://www.w3.org/2000/svg"><title id="fvm94-cube-title">Unshaded reversible Necker cube</title><desc id="fvm94-cube-desc">Two offset squares connected at corresponding corners by four diagonal lines. The same lines can suggest either square is nearer. Nothing actually moves.</desc><rect width="320" height="290" fill="#0e1b20"/><g fill="none" stroke="#d6b780" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M66 38H210V182H66Z"/><path d="M110 82H254V226H110Z"/><path d="M66 38L110 82 M210 38L254 82 M210 182L254 226 M66 182L110 226"/></g><text x="160" y="267" fill="#c4c8c7" text-anchor="middle" font-size="13" font-family="system-ui">TWO READINGS. ONE DRAWING.</text></svg>
<text x="84" y="171" font-family="Georgia,serif" font-size="57" fill="#f5ede0">THE WORD NO ONE SPOKE</text>
<text x="86" y="214" font-family="Arial,sans-serif" font-size="23" fill="#bcc9c6">A memorable idea is not the same as a recorded word.</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="fm-poster-title fm-poster-desc"><title id="fm-poster-title">The circle that did not leave</title><desc id="fm-poster-desc">A pale ring at the edge of a charcoal field and a small fixed cross in the center. The image remains static.</desc><rect width="540" height="960" fill="#111311"/><circle cx="402" cy="477" r="70" fill="none" stroke="#799ca1" stroke-width="21" opacity=".50"/><path d="M250 477h40 M270 457v40" stroke="#dcb980" stroke-width="5"/><text x="45" y="132" fill="#dcb980" font-family="Georgia,serif" font-size="27">THE PERIPHERY</text><text x="45" y="179" fill="#f1ede3" font-family="Georgia,serif" font-size="37">DISAPPEARED</text><text x="45" y="833" fill="#d7d2c9" font-family="Arial,sans-serif" font-size="20">THE SCREEN NEVER CHANGED.</text><text x="45" y="866" fill="#baac93" font-family="Arial,sans-serif" font-size="16">An original educational illustration.</text><text x="45" y="899" fill="#baac93" font-family="Arial,sans-serif" font-size="16">Not a controlled experiment.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">A voice between two signals</title><desc id="desc">Original graphic showing two waves, one called SOUND and one called SIGHT, converging on a central question mark. Not a research stimulus.</desc><rect width="960" height="420" fill="#12181d"/><g stroke="#e8c47a" stroke-width="5" fill="none"><path d="M55 160 Q85 60 115 160 T175 160 T235 160 T295 160 T355 160"/><path d="M605 240 Q635 340 665 240 T725 240 T785 240 T845 240 T905 240"/><path stroke="#6d7d7e" stroke-width="3" d="M360 160 L450 205 M600 240 L510 205"/></g><circle cx="480" cy="205" r="68" fill="#242e30" stroke="#e8c47a" stroke-width="4"/><text x="480" y="235" text-anchor="middle" font-size="88" fill="#f9e6c3" font-family="serif">?</text><g fill="#f9e6c3" font-size="24" font-family="sans-serif" font-weight="700" letter-spacing="6"><text x="105" y="70">SOUND</text><text x="700" y="375">SIGHT</text></g><text x="480" y="394" text-anchor="middle" fill="#f1d18c" font-size="16" font-family="sans-serif">A documented percept is not a product promise</text></svg>
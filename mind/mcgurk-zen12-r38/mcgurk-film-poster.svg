<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">The syllable that was not spoken</title><desc id="desc">Original typographic schematic of BA as the soundtrack, GA as mouth movements, and sometimes DA as the listener's report. This image is an explanation, not a real audiovisual experiment.</desc><rect width="540" height="960" fill="#090a0a"/><rect x="26" y="26" width="488" height="908" fill="none" stroke="#b8955e" stroke-width="2"/><text x="50" y="105" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#c4a16b">FINAL VESTIGE  /  MIND</text><text x="49" y="200" font-family="Georgia,serif" font-size="51" fill="#f4efe6">The syllable</text><text x="49" y="257" font-family="Georgia,serif" font-size="50" fill="#f4efe6">not spoken.</text><line x1="50" y1="291" x2="490" y2="291" stroke="#5a5348"/><text x="50" y="346" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#cac4b9">SOUNDTRACK</text><text x="385" y="369" font-family="Georgia,serif" font-size="69" fill="#e4bd7c">BA</text><path d="M55 399 Q95 365 135 399 T215 399 T295 399" fill="none" stroke="#c4a16b" stroke-width="3"/><text x="50" y="475" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#cac4b9">MOUTH MOVEMENTS</text><text x="380" y="497" font-family="Georgia,serif" font-size="69" fill="#e4bd7c">GA</text><ellipse cx="175" cy="538" rx="100" ry="47" fill="none" stroke="#e8ded0" stroke-width="5"/><ellipse cx="175" cy="538" rx="54" ry="17" fill="#2b1b18"/><line x1="50" y1="630" x2="490" y2="630" stroke="#5a5348"/><text x="50" y="692" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#cac4b9">SOME LISTENERS REPORT</text><text x="50" y="790" font-family="Georgia,serif" font-size="105" fill="#f4efe6">DA</text><text x="51" y="853" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#d5bd97">Illustration only — not a live test.</text><text x="51" y="888" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#a9a295">1976 study · independent research</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">The second thing you never saw</title><desc id="d">Original conceptual graphic: two numbers positioned in a stream of gray letters, with the second number marked by a narrow gold highlight. It is not a reconstruction of a laboratory trial.</desc><rect width="1200" height="630" fill="#10161c"/><path d="M70 100H1130 M70 530H1130" stroke="#806f50" stroke-width="2"/><g font-family="Georgia,serif" font-size="115" text-anchor="middle"><text x="220" y="340" fill="#627078">A</text><text x="365" y="340" fill="#627078">R</text><text x="510" y="340" fill="#efcf91">2</text><text x="655" y="340" fill="#627078">T</text><rect x="731" y="218" width="130" height="158" fill="none" stroke="#dcb875" stroke-width="3"/><text x="796" y="340" fill="#efcf91">7</text><text x="945" y="340" fill="#627078">M</text></g><text x="70" y="70" fill="#dcb875" font-family="Arial,sans-serif" font-size="19" letter-spacing="5">FINAL VESTIGE / MIND &amp; PERCEPTION</text><text x="70" y="478" fill="#f1e8d6" font-family="Georgia,serif" font-size="57">THE SECOND TARGET</text><text x="70" y="571" fill="#b8afa3" font-family="Arial,sans-serif" font-size="20">AN ILLUSTRATION OF TEMPORAL ATTENTION · NOT EXPERIMENTAL DATA</text></svg>
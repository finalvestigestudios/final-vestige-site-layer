<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">The word and the ink</title><desc id="d">An original conceptual illustration of Stroop interference: the word BLUE appears in warm brown ink, beside a cool blue swatch and a question about what is read versus seen.</desc><rect width="960" height="540" fill="#eee8d9"/><rect x="52" y="58" width="856" height="424" rx="22" fill="#fffdfa" stroke="#71634b" stroke-width="3"/><text x="102" y="121" fill="#293443" font-size="23" font-family="Arial">THE WORD AND THE INK</text><text x="104" y="313" font-size="152" font-weight="bold" font-family="Georgia" fill="#995333">BLUE</text><rect x="678" y="187" width="132" height="132" rx="12" fill="#225f88"/><text x="104" y="402" fill="#293443" font-size="25" font-family="Arial">Which property did you notice first?</text><path d="M628 190v130" stroke="#b39c74" stroke-width="4"/><text x="700" y="350" fill="#293443" font-size="18" font-family="Arial">Ink sample</text></svg>
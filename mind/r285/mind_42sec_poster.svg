<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Mind &amp; Perception: A Timer Is Not a Result</title><desc id="d">Dark bronze original short film poster. A quiet concentric orbit surrounds the headline: A timer is not a result. No product benefit is implied.</desc><rect width="960" height="540" fill="#0a0d0f"/><rect x="44" y="38" width="872" height="464" fill="none" stroke="#514939" stroke-width="2"/><g fill="none" stroke="#514838" stroke-width="2"><circle cx="480" cy="278" r="134"/><circle cx="480" cy="278" r="166" stroke-dasharray="230 800"/><circle cx="480" cy="278" r="196" stroke-dasharray="310 900"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="75" y="83" font-size="20" font-weight="700" fill="#d8bf87">FINAL VESTIGE STUDIOS / MIND &amp; PERCEPTION</text><text x="75" y="122" font-size="17" fill="#b8b0a3">INDEPENDENT BUYER RESEARCH • UNPUBLISHED</text><text x="480" y="266" text-anchor="middle" font-size="44" font-weight="700" fill="#f1ede4">A TIMER IS NOT A RESULT</text><text x="480" y="321" text-anchor="middle" font-size="23" fill="#b8b0a3">Twelve minutes is a duration, not a guarantee.</text><text x="75" y="464" font-size="20" font-weight="700" fill="#d8bf87">OPTIONAL 42-SECOND EXPLAINER</text><text x="795" y="464" font-size="20" font-weight="700" fill="#d8bf87">00:42</text></g><rect x="75" y="480" width="810" height="6" rx="3" fill="#353329"/></svg>
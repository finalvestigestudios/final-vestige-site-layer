<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="poster-title poster-description"><title id="poster-title">The Word Came After: forty-second short-film poster</title><desc id="poster-description">Two study prompt cards marked HIT and SMASHED over an evidence label explaining that the film contained no broken glass.</desc><rect width="800" height="470" fill="#0b0c0c"/><rect x="24" y="24" width="752" height="422" fill="#171918" stroke="#c7a66c"/><text x="52" y="72" fill="#c7a66c" font-family="Georgia,serif" font-size="27">THE FILM NEVER CHANGED.</text><rect x="52" y="114" width="320" height="118" fill="#252923" stroke="#7c6e59"/><rect x="426" y="114" width="320" height="118" fill="#252923" stroke="#7c6e59"/><text x="87" y="186" fill="#f4efe6" font-size="62" font-family="Georgia,serif">HIT</text><text x="455" y="186" fill="#f4efe6" font-size="58" font-family="Georgia,serif">SMASHED</text><path d="M52 269H748" stroke="#c7a66c"/><text x="52" y="323" fill="#f4efe6" font-size="36" font-family="Georgia,serif">16 of 50 reported glass.</text><text x="52" y="361" fill="#d0c8bb" font-size="19" font-family="system-ui,sans-serif">The film showed none. Loftus &amp; Palmer 1974.</text><text x="52" y="411" fill="#c7a66c" font-size="16" font-family="system-ui,sans-serif">UNHOSTED VIDEO CONCEPT · 40 SECONDS</text></svg>
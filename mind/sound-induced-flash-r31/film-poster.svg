<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" role="img" aria-labelledby="title31 desc31"><title id="title31">Twelve minutes, one honest question</title><desc id="desc31">Static typographic poster with a gold clock circle and text: A routine is not a clinical result. No flash or animation.</desc><rect width="540" height="760" fill="#090a0a"/><circle cx="270" cy="270" r="124" fill="none" stroke="#c7a66c" stroke-width="4"/><path d="M270 146V270L345 320" fill="none" stroke="#c7a66c" stroke-width="6" stroke-linecap="round"/><text x="38" y="66" font-size="18" font-family="sans-serif" letter-spacing="4" fill="#c7a66c">FINAL VESTIGE</text><text x="40" y="525" font-size="63" font-family="Georgia,serif" fill="#f4efe6">12 minutes.</text><text x="40" y="585" font-size="41" font-family="Georgia,serif" fill="#f4efe6">One honest question.</text><text x="40" y="665" font-size="22" font-family="sans-serif" fill="#d8d2c7">A routine is not a clinical result.</text><text x="40" y="718" font-size="15" font-family="sans-serif" fill="#c7a66c">ORIGINAL 40-SECOND FILM CONCEPT</text></svg>
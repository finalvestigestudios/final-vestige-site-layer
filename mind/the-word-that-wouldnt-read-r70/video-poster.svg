<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="fvr70-poster-title fvr70-poster-desc"><title id="fvr70-poster-title">The word that would not read itself — original 40-second video poster</title><desc id="fvr70-poster-desc">On a charcoal field, large letters spell BLUE in gold. A red underline introduces the conflict between the color name and printed ink. A line at the bottom reads: A word, a color, a question.</desc><defs><linearGradient id="fvr70-a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181b1b"/><stop offset="1" stop-color="#0c0d0d"/></linearGradient></defs><rect width="540" height="960" fill="url(#fvr70-a)"/><rect x="35" y="35" width="470" height="890" fill="none" stroke="#c9a66d" stroke-width="2" opacity=".5"/><text x="64" y="120" fill="#c9a66d" font-size="19" font-family="sans-serif" letter-spacing="5">FINAL VESTIGE / MIND</text><text x="64" y="420" fill="#c9a66d" font-family="Georgia,serif" font-size="130">BLUE</text><rect x="65" y="442" width="395" height="8" fill="#d36a61"/><text x="64" y="535" fill="#f4efe6" font-size="29" font-family="Georgia,serif">What color did you read?</text><text x="64" y="820" fill="#d8d2c7" font-size="25" font-family="Georgia,serif">A word. A color.</text><text x="64" y="856" fill="#d8d2c7" font-size="25" font-family="Georgia,serif">A question about suggestion.</text></svg>
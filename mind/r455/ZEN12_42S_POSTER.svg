<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Twelve minutes and a question</title><desc id="desc">Original flat illustration of a clock at twelve minutes beside an open research notebook with a question mark. No product endorsement.</desc><rect width="800" height="450" fill="#172a2d"/><rect x="60" y="46" width="680" height="356" rx="18" fill="#263e40" stroke="#829b8b" stroke-width="2"/><g transform="translate(254 224)"><circle r="122" fill="#f4f1e7" stroke="#9dae9f" stroke-width="8"/><circle r="9" fill="#3d615b"/><path d="M0 0 L0 -93" stroke="#172a2d" stroke-width="8" stroke-linecap="round"/><path d="M0 0 L86 -43" stroke="#c46b32" stroke-width="7" stroke-linecap="round"/><path d="M0 -104V-114 M104 0H114 M0 104V114 M-104 0H-114" stroke="#263e40" stroke-width="5"/></g><g transform="translate(470 120)"><path d="M0 32q84-20 146 0v198q-66-20-146 0z" fill="#ece6d8"/><path d="M0 32q-84-20-146 0v198q66-20 146 0z" fill="#f4f1e7"/><path d="M0 35v192" stroke="#a8b8a9" stroke-width="4"/><g stroke="#b6b8a6" stroke-width="4"><path d="M-123 77h95 M-123 101h95 M-123 125h95 M-123 149h95 M28 77h95 M28 101h95 M28 125h95"/></g><text x="67" y="198" fill="#3d615b" text-anchor="middle" font-family="Georgia,serif" font-size="75">?</text></g><text x="400" y="413" fill="#d9e4dd" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" letter-spacing="3">TIME IS A FEATURE · EFFECT IS A QUESTION</text></svg>
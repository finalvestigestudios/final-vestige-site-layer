<svg viewBox="0 0 960 540" role="img" aria-labelledby="posterTitle posterDesc" xmlns="http://www.w3.org/2000/svg"><title id="posterTitle">Twelve minutes before you buy</title><desc id="posterDesc">Original line-art clock framed by two abstract faces. A notice reads twelve minutes, one practical choice; this is a storyboard concept, not rendered motion.</desc><rect width="960" height="540" rx="18" fill="#10261e"/><circle cx="480" cy="264" r="174" fill="#183a2b" stroke="#e2c993" stroke-width="6"/><path d="M480 121v142l92 54" stroke="#f3e1b3" stroke-width="13" stroke-linecap="round" fill="none"/><g stroke="#afbeaa" stroke-width="5" fill="none"><ellipse cx="180" cy="270" rx="103" ry="135"/><ellipse cx="781" cy="270" rx="103" ry="135"/><path d="M145 242h70M145 330q40 35 70 0M747 242h70M747 330q40 35 70 0"/></g><text x="480" y="468" text-anchor="middle" fill="#f3dfb0" font-family="Georgia,serif" font-size="37">TWELVE MINUTES. ONE PRACTICAL CHOICE.</text></svg>
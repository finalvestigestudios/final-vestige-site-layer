<title id="title">The Tape That Changed Its Name — original editorial poster</title>
<desc id="desc">Two schematic cassette cards with different labels, MEMORY and SELF-ESTEEM, separated by a thin gold line. Original illustrative graphic, not an experiment photograph.</desc>

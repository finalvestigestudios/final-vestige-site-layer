<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Two targets, one brief interruption</title><desc id="desc">Original abstract documentary poster: two circular targets on a gold line, separated by muted distracting marks. Visual educational concept, not a laboratory data plot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101721"/><stop offset="1" stop-color="#22323e"/></linearGradient><radialGradient id="glow"><stop stop-color="#e9cb8d" stop-opacity=".32"/><stop offset="1" stop-color="#e9cb8d" stop-opacity="0"/></radialGradient></defs><rect width="960" height="540" fill="url(#bg)"/><circle cx="740" cy="200" r="270" fill="url(#glow)"/><g stroke="#708394" opacity=".35"><path d="M70 90H890M70 440H890"/><path d="M120 80V470M840 80V470"/></g><text x="77" y="116" fill="#e9cb8d" font-family="sans-serif" font-size="21" letter-spacing="5">FINAL VESTIGE / MIND &amp; PERCEPTION</text><text x="74" y="195" fill="#f5eedf" font-family="sans-serif" font-size="48" font-weight="bold">The half-second</text><text x="74" y="255" fill="#f5eedf" font-family="sans-serif" font-size="48" font-weight="bold">between two targets.</text><path d="M94 361H850" stroke="#ddbf81" stroke-width="3"/><circle cx="240" cy="361" r="25" fill="#dec18b"/><circle cx="760" cy="361" r="25" fill="#dec18b"/><g fill="#7a8c9a"><rect x="392" y="343" width="8" height="36" rx="3"/><rect x="442" y="343" width="8" height="36" rx="3"/><rect x="492" y="343" width="8" height="36" rx="3"/><rect x="542" y="343" width="8" height="36" rx="3"/></g><text x="205" y="413" fill="#faf0d9" font-family="sans-serif" font-size="19">T1</text><text x="727" y="413" fill="#faf0d9" font-family="sans-serif" font-size="19">T2</text><text x="74" y="492" fill="#cbd4d6" font-family="sans-serif" font-size="18">An original 42-second source-first explanation. Not a test of you.</text></svg>
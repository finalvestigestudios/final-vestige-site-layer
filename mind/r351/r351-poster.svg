<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The missing glass</title><desc id="desc">An original documentary graphic contrasting two questions in the same traffic-film study</desc><rect width="1280" height="720" fill="#101517"/><path d="M640 130 V595" stroke="#b99d6a" stroke-width="2"/><text x="90" y="120" font-family="serif" font-size="32" letter-spacing="4" fill="#c6a56c">ONE FILM. TWO QUESTIONS.</text><text x="90" y="290" font-family="serif" font-size="60" fill="#f5efdf">When they</text><text x="90" y="362" font-family="serif" font-size="68" fill="#c6a56c">hit...</text><text x="705" y="290" font-family="serif" font-size="60" fill="#f5efdf">When they</text><text x="705" y="362" font-family="serif" font-size="68" fill="#c6a56c">smashed...</text><path d="M90 447 H580 M705 447 H1190" stroke="#8b8c83"/><text x="92" y="495" font-family="sans-serif" font-size="24" fill="#c1bdb2">What did the witness report?</text><text x="707" y="495" font-family="sans-serif" font-size="24" fill="#c1bdb2">What changed in the question?</text><text x="90" y="633" font-family="sans-serif" font-size="30" fill="#f5efdf">NO BROKEN GLASS APPEARED IN THE FILM</text><text x="90" y="674" font-family="sans-serif" font-size="18" fill="#c6a56c">FINAL VESTIGE · EVIDENCE BEFORE EXPLANATION</text></svg>
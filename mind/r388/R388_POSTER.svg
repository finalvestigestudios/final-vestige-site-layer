<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl desc"><title id="ttl">The first tick</title><desc id="desc">An original clock face and a two-point eye-movement path. The visual clue is that the clock does not stop.</desc><rect width="960" height="540" fill="#0b1518"/><circle cx="244" cy="265" r="150" fill="#17282e" stroke="#eac98d" stroke-width="8"/><circle cx="244" cy="265" r="9" fill="#eac98d"/><path d="M244 265 L244 157 M244 265 L300 299" fill="none" stroke="#f5f0e4" stroke-width="9" stroke-linecap="round"/><path d="M98 265 H121 M366 265 H390 M244 114 V137 M244 391 V416" stroke="#eac98d" stroke-width="5"/><path d="M440 356 Q550 220 620 235" stroke="#bed1d0" fill="none" stroke-width="6" stroke-dasharray="14 15"/><circle cx="444" cy="357" r="14" fill="#eac98d"/><circle cx="622" cy="236" r="14" fill="#eac98d"/><text x="445" y="124" font-family="Georgia,serif" font-size="47" fill="#f5f0e4">The first tick</text><text x="445" y="183" font-family="Georgia,serif" font-size="42" fill="#f5f0e4">may feel longer.</text><text x="444" y="420" font-family="Arial,sans-serif" font-size="26" fill="#eac98d">The clock never stopped.</text><text x="445" y="462" font-family="Arial,sans-serif" font-size="19" fill="#bed1d0">FINAL VESTIGE · ORIGINAL PERCEPTION EXPLAINER</text></svg>
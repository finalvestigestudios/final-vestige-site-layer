<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">The door between two strangers</title><desc id="desc">Original symbolic illustration: a doorway divides two abstract silhouettes in bronze and forest green; not a historical photograph.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c1610"/><stop offset="1" stop-color="#293a2a"/></linearGradient></defs><rect width="540" height="960" fill="url(#bg)"/><rect x="35" y="35" width="470" height="890" fill="none" stroke="#c6a36e" stroke-width="2"/><path d="M92 605V230h354v375" fill="none" stroke="#c6a36e" stroke-width="5"/><rect x="268" y="230" width="178" height="375" fill="#263c2c" stroke="#c6a36e" stroke-width="3"/><circle cx="173" cy="410" r="40" fill="#bfaf94"/><path d="M100 604q10-155 73-155t76 155" fill="#9c9b87"/><circle cx="353" cy="412" r="40" fill="#779477"/><path d="M280 604q12-155 73-155t80 155" fill="#6e836e"/><text x="64" y="102" font-family="sans-serif" font-size="17" letter-spacing="3" fill="#d0ab70">FINAL VESTIGE · MIND</text><text x="60" y="741" font-family="Georgia,serif" font-size="50" fill="#f4efe6">THE STRANGER</text><text x="60" y="797" font-family="Georgia,serif" font-size="47" fill="#f4efe6">CHANGED</text><text x="60" y="871" font-family="sans-serif" font-size="16" fill="#d3c3a7">ORIGINAL ARTWORK · NOT ARCHIVAL FOOTAGE</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc"><title id="title">The task you are given changes what you see</title><desc id="desc">Original abstract night-blue scanning frame with warm-gold outline, a small generic primate shape, and a twelve-minute clock. Not an anatomical scan.</desc><rect width="960" height="540" fill="#12191f"/><rect x="65" y="64" width="560" height="408" rx="24" fill="#1e3037" stroke="#bb9560" stroke-width="4"/><g opacity=".35" stroke="#d5e2e4" stroke-width="2" fill="none"><path d="M95 150h490M95 240h490M95 330h490M180 90v355M300 90v355M420 90v355M540 90v355"/><circle cx="340" cy="270" r="144"/><circle cx="340" cy="270" r="95"/></g><g fill="#d7b37e"><circle cx="340" cy="252" r="34"/><ellipse cx="340" cy="316" rx="52" ry="57"/><circle cx="307" cy="242" r="16"/><circle cx="373" cy="242" r="16"/><rect x="294" y="358" width="25" height="45" rx="12"/><rect x="361" y="358" width="25" height="45" rx="12"/></g><circle cx="783" cy="260" r="113" fill="#23343b" stroke="#d7b37e" stroke-width="9"/><path d="M783 260V181M783 260L837 290" stroke="#f0e2c3" stroke-width="13" stroke-linecap="round"/><text x="783" y="423" font-size="27" font-family="sans-serif" fill="#ede5d2" text-anchor="middle">12 MINUTES</text><text x="80" y="515" font-size="24" font-family="sans-serif" fill="#f3c88a">LOOKING IS NOT THE SAME AS NOTICING.</text></svg>
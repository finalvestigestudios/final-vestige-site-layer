<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">One voice, two sources of information</title><desc id="desc">Original simple illustration showing two parallel lines, hearing as a wave and seeing as mouth-shaped arcs, meeting in the center. No footage or identities represented.</desc><rect width="1280" height="720" fill="#111713"/><rect x="45" y="45" width="1190" height="630" rx="26" fill="#1e2921" stroke="#baa16d" stroke-width="3"/><text x="86" y="138" font-family="Georgia,serif" fill="#eddfb9" font-size="57">When a sound meets a mouth</text><text x="86" y="203" font-family="system-ui,sans-serif" fill="#ddd8c8" font-size="28">The McGurk effect • Source-led demonstration concept</text><path d="M135 392 Q175 240 215 392 T295 392 T375 392 T455 392" fill="none" stroke="#d4ae70" stroke-width="10" stroke-linecap="round"/><path d="M835 385 Q930 310 1025 385 Q930 470 835 385Z" fill="none" stroke="#c5d4bf" stroke-width="10"/><path d="M525 390 H750 M710 360 L750 390 L710 420" stroke="#f2e4be" stroke-width="9" fill="none"/><text x="145" y="530" fill="#f1dfb9" font-size="33" font-family="system-ui,sans-serif">HEARING</text><text x="882" y="530" fill="#f1dfb9" font-size="33" font-family="system-ui,sans-serif">SEEING</text><text x="87" y="632" fill="#d8d3c4" font-size="25" font-family="system-ui,sans-serif">A report of perception is not proof of a hidden mechanism.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" role="img" aria-labelledby="title desc"><title id="title">The answer was in the question</title><desc id="desc">Original charcoal and bronze poster with subtle hoofbeat dots and two columns of known versus unknown answer counts. It does not depict the historical horse.</desc><defs><linearGradient id="g" x2=".95" y2="1"><stop stop-color="#0B0D0D"/><stop offset="1" stop-color="#22201D"/></linearGradient><radialGradient id="glow"><stop stop-color="#B8955E" stop-opacity=".30"/><stop offset="1" stop-color="#B8955E" stop-opacity="0"/></radialGradient></defs><rect width="540" height="960" fill="url(#g)"/><circle cx="415" cy="255" r="220" fill="url(#glow)"/><rect x="24" y="24" width="492" height="912" fill="none" stroke="#6C5940" stroke-width="1"/><text x="56" y="104" fill="#C7A66C" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">FINAL VESTIGE / MIND</text><path d="M56 135 H484" stroke="#6C5940" stroke-width="2"/><text x="52" y="262" fill="#F4EFE6" font-family="Georgia,serif" font-size="71">The Answer</text><text x="52" y="335" fill="#F4EFE6" font-family="Georgia,serif" font-size="71">Was in the</text><text x="52" y="408" fill="#C7A66C" font-family="Georgia,serif" font-size="71">Question.</text><text x="56" y="470" fill="#D8D2C7" font-family="Arial,sans-serif" font-size="24">One horse. Two conditions.</text><g fill="#B8955E"><circle cx="80" cy="548" r="9"/><circle cx="121" cy="548" r="9"/><circle cx="162" cy="548" r="9"/><circle cx="203" cy="548" r="9"/><circle cx="244" cy="548" r="9"/><circle cx="285" cy="548" r="9"/><circle cx="326" cy="548" r="9"/><circle cx="367" cy="548" r="9"/><circle cx="408" cy="548" r="9"/></g><path d="M56 606 H484" stroke="#6C5940" stroke-width="1"/><text x="56" y="664" font-size="58" font-family="Georgia,serif" fill="#F4EFE6">29/31</text><text x="293" y="664" font-size="58" font-family="Georgia,serif" fill="#F4EFE6">3/31</text><text x="56" y="702" font-size="18" font-family="Arial,sans-serif" fill="#CFC6B6">Person knew</text><text x="293" y="702" font-size="18" font-family="Arial,sans-serif" fill="#CFC6B6">No one knew</text><path d="M56 760 H484" stroke="#6C5940"/><text x="56" y="822" fill="#F4EFE6" font-family="Georgia,serif" font-size="29">Evidence before explanation.</text><text x="56" y="869" fill="#B6AEA2" font-family="Arial,sans-serif" font-size="17">Source: Oskar Pfungst (1911)</text><text x="56" y="910" fill="#C7A66C" font-family="Arial,sans-serif" font-size="16" letter-spacing="1.6">UNPUBLISHED ORIGINAL ART</text></svg>
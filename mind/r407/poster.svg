<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Promise versus evidence</title><desc id="d">An abstract design showing a small white circle of evidence within a large circle of promises, on a dark green background.</desc><rect width="1280" height="720" fill="#131713"/><circle cx="770" cy="355" r="266" fill="none" stroke="#c8a36c" stroke-width="3"/><circle cx="770" cy="355" r="104" fill="none" stroke="#ece4d4" stroke-width="5"/><circle cx="770" cy="355" r="17" fill="#c8a36c"/><path d="M120 110h360 M120 610h360" stroke="#716952" stroke-width="2"/><text x="116" y="290" font-family="Georgia,serif" font-size="62" fill="#eee6d6">What is</text><text x="116" y="355" font-family="Georgia,serif" font-size="62" fill="#eee6d6">promised?</text><text x="116" y="423" font-family="sans-serif" font-size="23" fill="#c8a36c">What was actually tested?</text><text x="1120" y="652" text-anchor="end" font-family="sans-serif" font-size="18" fill="#eee6d6">FINAL VESTIGE · ORIGINAL</text></svg>
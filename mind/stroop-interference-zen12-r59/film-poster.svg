<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" role="img" aria-labelledby="pt pd"><title id="pt">The word is not the ink</title><desc id="pd">Typographic educational poster: RED printed in blue ink; Name the ink. No evidence of product efficacy is implied.</desc><rect width="540" height="960" fill="#090a0a"/><rect x="25" y="25" width="490" height="910" fill="#121414" stroke="#bd9863" stroke-width="2"/><text x="48" y="105" font-size="18" font-weight="bold" fill="#ddbc82" font-family="Arial" letter-spacing="3">FINAL VESTIGE / MIND</text><text x="48" y="350" font-size="125" font-weight="bold" fill="#73b8ef" font-family="Arial">RED</text><path d="M48 400H492" stroke="#bd9863"/><text x="48" y="478" font-size="43" fill="#f3ede1" font-family="Georgia">Name the ink.</text><text x="48" y="530" font-size="24" fill="#e0d8cb" font-family="Arial">The instruction is simple.</text><text x="48" y="566" font-size="24" fill="#e0d8cb" font-family="Arial">The competition is real.</text><text x="48" y="806" font-size="20" fill="#ddbc82" font-family="Arial">40-SECOND EDUCATIONAL CONCEPT</text><text x="48" y="862" font-size="17" fill="#e0d8cb" font-family="Arial">Format is not proof of benefit.</text></svg>
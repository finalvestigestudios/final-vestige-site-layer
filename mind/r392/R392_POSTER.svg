<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description"><title id="title">The space between experience and explanation</title><desc id="description">Original gold-on-charcoal illustration with a question mark separating the concepts experience and explanation.</desc><rect width="1280" height="720" fill="#152322"/><circle cx="640" cy="350" r="235" stroke="#a9915c" stroke-width="3" fill="none"/><circle cx="640" cy="350" r="286" stroke="#655b3d" stroke-width="1" fill="none"/><text x="640" y="130" text-anchor="middle" font-size="36" font-family="Georgia" fill="#dac58e">THE MIND &amp; PERCEPTION ARCHIVE</text><text x="640" y="470" text-anchor="middle" font-family="Georgia" font-size="290" fill="#ead8ac">?</text><text x="340" y="640" text-anchor="middle" font-family="Georgia" font-size="46" fill="#f3eee1">EXPERIENCE</text><text x="950" y="640" text-anchor="middle" font-family="Georgia" font-size="46" fill="#f3eee1">EXPLANATION</text></svg>
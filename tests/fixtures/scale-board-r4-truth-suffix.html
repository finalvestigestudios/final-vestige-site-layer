<script>
(()=>{const fail=m=>{document.body.dataset.fvTest='fail';document.body.dataset.fvReason=m};try{const launch=document.querySelector('[data-fvsb-band] .fvsb-button');if(!launch)return fail('launcher missing');launch.click();const d=document.querySelector('.fvsb-dialog');if(!d||!d.open)return fail('dialog missing');const group=k=>d.querySelector('.fvsb-group[data-group="'+k+'"]'),speed=group('mph'),feet=group('feet');if(!speed)return fail('speed group missing');if(group('miles'))return fail('unsupported fraction/range leaked into distance miles');if(!feet)return fail('feet group missing');const vals=g=>[...g.querySelectorAll('.fvsb-value')].map(x=>x.textContent.trim()),sv=vals(speed),fv=vals(feet);for(const v of ['6 mph','20 mph','30 mph','35 mph'])if(!sv.includes(v))return fail('speed missing '+v);if(sv.length!==4)return fail('unexpected speed values '+sv.join('|'));for(const v of ['500 ft','1000 ft'])if(!fv.includes(v))return fail('feet missing '+v);if(fv.length!==2)return fail('unsupported expression leaked into feet '+fv.join('|'));if(fv.some(v=>/^(?:0|2|4|34|000)\s/.test(v)))return fail('partial numeric expression emitted '+fv.join('|'));const marks=[...d.querySelectorAll('.fvsb-mention mark')].map(x=>x.textContent);if(!marks.includes('1,000 feet'))return fail('valid comma-grouped wording missing');if(!marks.includes('thirty-five miles per hour'))return fail('compound wording missing');for(const bad of ['4 miles','2 miles','2 feet','4 feet'])if(marks.includes(bad))return fail('unsupported suffix surfaced '+bad);document.body.dataset.fvTest='pass'}catch(e){fail(e&&e.message?e.message:String(e))}})();
</script></body></html>

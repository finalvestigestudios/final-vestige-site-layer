<script>
(()=>{const fail=m=>{document.body.dataset.fvTest='fail';document.body.dataset.fvReason=m};try{const launch=document.querySelector('[data-fvsb-band] .fvsb-button');if(!launch)return fail('launcher missing');const open=()=>{launch.click();const d=document.querySelector('.fvsb-dialog');if(!d||!d.open)throw new Error('dialog missing');return d};const clickMention=needle=>{const d=open(),card=[...d.querySelectorAll('.fvsb-mention')].find(x=>x.textContent.toLowerCase().includes(needle.toLowerCase()));if(!card)throw new Error('mention missing '+needle);const b=card.querySelector('.fvsb-jump');if(!b)throw new Error('jump missing '+needle);b.click()};const absent=document.querySelector('[data-state="absent"]'),zero=document.querySelector('[data-state="tab-zero"]'),negative=document.querySelector('[data-state="tab-negative"]'),ownedId=document.querySelector('[data-state="owned-id"]'),ownedFlash=document.querySelector('[data-state="owned-flash"]');if(absent.hasAttribute('tabindex')||absent.hasAttribute('id'))return fail('absent baseline polluted');if(zero.getAttribute('tabindex')!=='0')return fail('tab zero baseline wrong');if(negative.getAttribute('tabindex')!=='-7')return fail('negative baseline wrong');if(ownedId.id!=='publisher-owned-point')return fail('owned id baseline wrong');if(!ownedFlash.classList.contains('fvsb-flash'))return fail('owned flash baseline wrong');clickMention('six miles an hour');if(absent.hasAttribute('tabindex'))return fail('absent tabindex not restored');if(absent.hasAttribute('id'))return fail('random id persisted');clickMention('20 mph');if(zero.getAttribute('tabindex')!=='0')return fail('tabindex zero overwritten');if(zero.hasAttribute('id'))return fail('id added to tabindex zero target');clickMention('30 miles per hour');if(negative.getAttribute('tabindex')!=='-7')return fail('negative tabindex overwritten');clickMention('thirty-five miles per hour');if(ownedId.id!=='publisher-owned-point')return fail('pre-owned id overwritten');if(ownedId.hasAttribute('tabindex'))return fail('owned-id absent tabindex not restored');clickMention('1,000 feet');if(!ownedFlash.classList.contains('fvsb-flash')||!ownedFlash.classList.contains('published-copy'))return fail('pre-owned class state damaged');clickMention('six miles an hour');if(absent.hasAttribute('tabindex')||absent.hasAttribute('id'))return fail('repeat jump drifted absent state');for(const timer of window.__fvScaleBoardTestTimers.splice(0))timer();if(absent.hasAttribute('tabindex')||absent.hasAttribute('id'))return fail('post-timer absent state drift');if(absent.classList.contains('fvsb-flash'))return fail('temporary flash class not restored');if(zero.getAttribute('tabindex')!=='0')return fail('post-timer tabindex zero drift');if(negative.getAttribute('tabindex')!=='-7')return fail('post-timer negative tabindex drift');if(ownedId.id!=='publisher-owned-point')return fail('post-timer owned id drift');if(!ownedFlash.classList.contains('fvsb-flash')||!ownedFlash.classList.contains('published-copy'))return fail('pre-owned flash class removed');document.body.dataset.fvTest='pass'}catch(e){fail(e&&e.message?e.message:String(e))}})();
</script></body></html>
